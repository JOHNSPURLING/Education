tory on 29 June 2026 following Royal Assent to the Act on 29 April 2026. Applies to: state-funded schools in England have the 'have regard' duty. Not verified: whether and how the statutory duty extends to independent schools and to 16 to 19 academies; secondary summaries conflict. Check the guidance's scope section. Sixth forms: not verified. Earlier versions allowed schools discretion over sixth-form pupils' use while expecting them not to undermine the policy for younger pupils; confirm against the current text. Other points reported from the 2026 version: boarding and residential schools should prohibit phones during the teaching day; 'bring your own device' schemes should not rely on phones; staff should not use personal phones in front of pupils other than for work reasons. GOV.UK could not be opened directly when this entry was written; the dates are taken from the GOV.UK page text returned in search results and from law firm commentary. What schools must do Have regard to the guidance when setting and applying the behaviour policy. Set out the phone rules in the behaviour policy (or a linked policy), including sanctions and how confiscated phones are kept and returned, and publicise it to pupils, parents and staff. Make reasonable adjustments for disabled pupils, for example a pupil who uses a phone app to monitor glucose, and support pupils with medical conditions (Children and Families Act 2014, s.100). Confiscate lawfully. Confiscation is a permitted sanction if the policy says so; the law protects staff from liability for loss or damage where confiscation is lawful. Searches for phones must follow the searching guidance: a phone is only searchable without consent if the school rules list it as an item that may be searched for. Treat safeguarding content correctly. Do not view or delete suspected indecent images; pass to the DSL. In practice Four models, with trade-offs seen in secondary schools: Model Works when Watch for Not on premises Small sites, short journeys Parental worry about travel; little way to check Hand in on arrival Smaller rolls, staffed reception Queues, liability, storage Lockers or locked pouches Larger schools with budget Cost, damaged pouches, decoy phones 'Never used, seen or heard' (in bag, off) Strong existing culture Hardest to enforce; toilets and social times; may not meet the 2026 expectation if use persists Implementation steps: Explain why to pupils and parents before launch: focus in lessons, fewer online conflicts spilling into school, more talk at lunch. Give the office number for urgent messages. One script for all staff. \"Phone, please. You know the rule. It'll be at reception at 3.10.\" No debate, no first warnings that vary by teacher. Fixed consequence ladder, for example: first time, confiscated to end of day; second, parent collects; third, hand in daily for two weeks. Keep it short and publish it. Record each confiscation in the behaviour system so repeat patterns and hotspots show. Log exceptions individually, with a named member of staff, and brief teachers discreetly. Cover the gaps: toilets, the route out at the end of the day, smartwatches, earbuds, and second 'decoy' handsets. Replace what phones did: bus timetables, payment for lunch, homework apps, timetable access. Common pitfalls Staff applying the rule differently; pupils quickly learn which lessons are safe. Sanctions that keep a phone overnight without parental contact, raising safety concerns on the journey home. Refusing individual adjustments on 'consistency' grounds. Overclaiming the evidence. The University of Birmingham SMART Schools study (2025) of 30 English secondaries found restrictive policies cut in-school phone use but found no difference in wellbeing, attainment or behaviour measures between restrictive and permissive schools; it was cross-sectional, so cannot show cause. Other studies, including earlier LSE work on attainment, point the other way. Honest messaging: a phone-free day is a behaviour and attention policy, not a mental health cure. Forgetting staff modelling. Go deeper The GOV.UK page carries case studies and a parent-facing toolkit. The Children's Commissioner surveyed schools' phone policies in 2025 and found most secondaries already restricted use (figures not verified here). See the online safety entry for what happens to phone-based harms outside the school day."},{"slug":"online-safety-filtering-and-monitoring","title":"Online safety, filtering and monitoring","category":"safeguarding","type":"guidance","summary":"What KCSIE 2026 and the DfE filtering and monitoring standards expect of schools: roles, annual review, blocking without over-blocking, monitoring that someone acts on, and the 2026 additions on AI.","status":"Statutory guidance","evidence":"","tags":["online safety","filtering","monitoring","digital standards","kcsie","online safety act"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"The 2026 DfE filtering and monitoring standards: AI updates ITs and DSLs need to know","publisher":"Smoothwall","year":"2026","url":"https://smoothwall.com/resources/2026-dfe-filtering-and-monitoring-standards"},{"title":"Appropriate filtering and monitoring 2026: updated guidance and checklist for schools","publisher":"Fastvue","year":"2026","url":"https://www.fastvue.co/fastvue/blog/appropriate-filtering-and-monitoring-guidance-2026/"},{"title":"The DSL's guide to filtering and monitoring","publisher":"Data Protection Education","year":"2026","url":"https://dataprotection.education/best-practice-update/kcsie-filtering-monitoring-privacy"}],"related":["keeping-children-safe-in-education","mobile-phones-in-schools","designated-safeguarding-lead","prevent-duty"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>KCSIE frames online risk as the four Cs: \u003cstrong>content, contact, conduct and commerce\u003c/strong>.\u003c/li>\n\u003cli>Governing bodies and proprietors \u003cstrong>should\u003c/strong> ensure appropriate filtering and monitoring is in place and its effectiveness regularly reviewed. KCSIE points to the DfE&#39;s \u003cstrong>filtering and monitoring standards\u003c/strong> (part of &#39;Meeting digital and technology standards in schools and colleges&#39;) as the benchmark.\u003c/li>\n\u003cli>The DSL holds lead responsibility for online safety, including understanding the filtering and monitoring systems. IT staff or the provider run the system; they do not own the safeguarding decision.\u003c/li>\n\u003cli>2026 updates add generative AI: can your system deal with AI-generated and dynamic content, and have you risk-assessed AI tools before introducing them?\u003c/li>\n\u003cli>Filtering blocks; monitoring watches. You need both, and a named person who reviews and acts on monitoring alerts.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>KCSIE 2026\u003c/strong> (statutory, in force 1 September 2026). Online safety sits in Part two. 2026 changes reported: new paragraphs on generative AI, explicit mention of deepfakes and &#39;nudification&#39; tools, mobile phone policy added to the online safety content, and the review of filtering and monitoring to be at least annual and documented.\u003c/li>\n\u003cli>\u003cstrong>DfE filtering and monitoring standards\u003c/strong> (non-statutory standards that KCSIE tells schools to have regard to; first published March 2023). Updated in 2026 to add AI considerations. Not verified: the date of the latest update; secondary sources give both June and September 2026, so check the GOV.UK page.\u003c/li>\n\u003cli>\u003cstrong>UK Safer Internet Centre\u003c/strong> publishes definitions of &#39;appropriate&#39; filtering and monitoring and provider self-certification responses, revised in 2026.\u003c/li>\n\u003cli>\u003cstrong>Online Safety Act 2023.\u003c/strong> Duties fall on platforms and search services and are enforced by Ofcom; the illegal content duties and children&#39;s safety duties (including age assurance for pornography) took effect in stages during 2025. The Act places no direct duty on schools and does not replace school filtering. It matters to schools for reporting routes, the newer communications and intimate-image offences, and realistic messages to pupils and parents.\u003c/li>\n\u003c/ul>\n\u003cp>The Prevent duty separately requires protection from terrorist and extremist material online.\u003c/p>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>There is no statute that says &#39;install a filter&#39;, but schools \u003cstrong>must\u003c/strong> have regard to KCSIE and comply with the Prevent duty and data protection law. The DfE standards say schools \u003cstrong>should\u003c/strong>:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Identify and assign roles and responsibilities.\u003c/strong> A senior leader and a governor responsible; the DSL leading on safeguarding; IT staff or the provider on the technical side.\u003c/li>\n\u003cli>\u003cstrong>Review provision at least annually\u003c/strong>, and when a safeguarding risk is identified, working practice changes or new technology (including AI tools) is introduced.\u003c/li>\n\u003cli>\u003cstrong>Block harmful and inappropriate content without unreasonably affecting teaching and learning.\u003c/strong> The filter should be a member of the Internet Watch Foundation, use the counter-terrorism referral unit list, and block illegal child sexual abuse content.\u003c/li>\n\u003cli>\u003cstrong>Have effective monitoring strategies\u003c/strong> that meet the school&#39;s safeguarding needs, with alerts reviewed promptly by trained staff.\u003c/li>\n\u003c/ol>\n\u003cp>KCSIE also says schools should have an online safety approach reflected in the child protection policy, train staff (including on filtering and monitoring) at induction, teach online safety, and consider meeting the DfE cyber security standards.\u003c/p>\n\u003ch2>In practice\u003c/h2>\n\u003cp>\u003cstrong>Staff:\u003c/strong> know what the acceptable use policy says; report anything a pupil reaches that should have been blocked, and any site wrongly blocked; supervise screens in lessons; treat a monitoring alert like any other concern.\u003c/p>\n\u003cp>\u003cstrong>DSLs:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>hold a written annual review, done with IT and a governor, covering: who is filtered (pupils, staff, guests, by age group), on which devices (school devices off site, bring-your-own, mobile data), what is logged, who gets alerts and how fast;\u003c/li>\n\u003cli>run and log regular test checks from different user accounts and devices;\u003c/li>\n\u003cli>make sure alerts are triaged daily in term time and that there is an arrangement for holidays where devices go home;\u003c/li>\n\u003cli>update the data protection impact assessment and privacy notice when monitoring changes;\u003c/li>\n\u003cli>ask the provider how the system handles generative AI tools and encrypted or app-based traffic.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Governors and trustees:\u003c/strong> see the annual review; ask what the last three monitoring alerts were and what happened; check the roles are named; confirm online safety is covered in training and the curriculum.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Buying a product and assuming compliance: the standards are about roles, review and response.\u003c/li>\n\u003cli>Alerts going to an IT inbox that no safeguarding-trained person reads.\u003c/li>\n\u003cli>Over-blocking that stops legitimate teaching in RSHE, history or science.\u003c/li>\n\u003cli>No coverage for staff accounts, sixth-form own devices or school laptops at home.\u003c/li>\n\u003cli>Pupils on mobile data: the filter is irrelevant, so the phone policy and education matter.\u003c/li>\n\u003cli>Checks carried out but not recorded.\u003c/li>\n\u003cli>Monitoring introduced without telling pupils, parents and staff what is monitored and why.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>The DfE standards page and the UK Safer Internet Centre definitions are the working documents; the SWGfL 360 Safe self-review tool is widely used. This is general information, not legal advice; follow your local safeguarding partnership&#39;s procedures.\u003c/p>\n","text":"At a glance KCSIE frames online risk as the four Cs: content, contact, conduct and commerce . Governing bodies and proprietors should ensure appropriate filtering and monitoring is in place and its effectiveness regularly reviewed. KCSIE points to the DfE's filtering and monitoring standards (part of 'Meeting digital and technology standards in schools and colleges') as the benchmark. The DSL holds lead responsibility for online safety, including understanding the filtering and monitoring systems. IT staff or the provider run the system; they do not own the safeguarding decision. 2026 updates add generative AI: can your system deal with AI-generated and dynamic content, and have you risk-assessed AI tools before introducing them? Filtering blocks; monitoring watches. You need both, and a named person who reviews and acts on monitoring alerts. Status and current version KCSIE 2026 (statutory, in force 1 September 2026). Online safety sits in Part two. 2026 changes reported: new paragraphs on generative AI, explicit mention of deepfakes and 'nudification' tools, mobile phone policy added to the online safety content, and the review of filtering and monitoring to be at least annual and documented. DfE filtering and monitoring standards (non-statutory standards that KCSIE tells schools to have regard to; first published March 2023). Updated in 2026 to add AI considerations. Not verified: the date of the latest update; secondary sources give both June and September 2026, so check the GOV.UK page. UK Safer Internet Centre publishes definitions of 'appropriate' filtering and monitoring and provider self-certification responses, revised in 2026. Online Safety Act 2023. Duties fall on platforms and search services and are enforced by Ofcom; the illegal content duties and children's safety duties (including age assurance for pornography) took effect in stages during 2025. The Act places no direct duty on schools and does not replace school filtering. It matters to schools for reporting routes, the newer communications and intimate-image offences, and realistic messages to pupils and parents. The Prevent duty separately requires protection from terrorist and extremist material online. What schools must do There is no statute that says 'install a filter', but schools must have regard to KCSIE and comply with the Prevent duty and data protection law. The DfE standards say schools should : Identify and assign roles and responsibilities. A senior leader and a governor responsible; the DSL leading on safeguarding; IT staff or the provider on the technical side. Review provision at least annually , and when a safeguarding risk is identified, working practice changes or new technology (including AI tools) is introduced. Block harmful and inappropriate content without unreasonably affecting teaching and learning. The filter should be a member of the Internet Watch Foundation, use the counter-terrorism referral unit list, and block illegal child sexual abuse content. Have effective monitoring strategies that meet the school's safeguarding needs, with alerts reviewed promptly by trained staff. KCSIE also says schools should have an online safety approach reflected in the child protection policy, train staff (including on filtering and monitoring) at induction, teach online safety, and consider meeting the DfE cyber security standards. In practice Staff: know what the acceptable use policy says; report anything a pupil reaches that should have been blocked, and any site wrongly blocked; supervise screens in lessons; treat a monitoring alert like any other concern. DSLs: hold a written annual review, done with IT and a governor, covering: who is filtered (pupils, staff, guests, by age group), on which devices (school devices off site, bring-your-own, mobile data), what is logged, who gets alerts and how fast; run and log regular test checks from different user accounts and devices; make sure alerts are triaged daily in term time and that there is an arrangement for holidays where devices go home; update the data protection impact assessment and privacy notice when monitoring changes; ask the provider how the system handles generative AI tools and encrypted or app-based traffic. Governors and trustees: see the annual review; ask what the last three monitoring alerts were and what happened; check the roles are named; confirm online safety is covered in training and the curriculum. Common pitfalls Buying a product and assuming compliance: the standards are about roles, review and response. Alerts going to an IT inbox that no safeguarding-trained person reads. Over-blocking that stops legitimate teaching in RSHE, history or science. No coverage for staff accounts, sixth-form own devices or school laptops at home. Pupils on mobile data: the filter is irrelevant, so the phone policy and education matter. Checks carried out but not recorded. Monitoring introduced without telling pupils, parents and staff what is monitored and why. Go deeper The DfE standards page and the UK Safer Internet Centre definitions are the working documents; the SWGfL 360 Safe self-review tool is widely used. This is general information, not legal advice; follow your local safeguarding partnership's procedures."},{"slug":"paul-dix","title":"Paul Dix","category":"thinkers","type":"person","summary":"Behaviour trainer and author of 'When the Adults Change, Everything Changes'. Argues that consistent, calm adult behaviour, simple rules, scripted interventions and restorative follow-up change school culture more than escalating sanctions.","status":"Thinker profile","evidence":"","tags":["behaviour","relational practice","restorative practice","scripts","school culture","sanctions"],"checked":"2026-11-12","sources":[{"title":"When the Adults Change, Everything Changes: Seismic shifts in school behaviour (book review)","publisher":"Schools Week","year":"2017","url":"https://schoolsweek.co.uk/when-the-adults-change-everything-changes-seismic-shifts-in-school-behaviour-by-paul-dix"},{"title":"After The Adults Change: Achievable behaviour nirvana (publisher page)","publisher":"Crown House Publishing / Independent Thinking Press","year":"2021","url":"https://crownhouse.co.uk/after-the-adults-change"},{"title":"When the Parents Change, Everything Changes (publisher page)","publisher":"Penguin","year":"2023","url":"https://prod-2024.penguin.co.uk/books/453367/when-the-parents-change-everything-changes-by-dix-paul/9781529900132"},{"title":"Paul Dix: how to be an emotionally consistent teacher","publisher":"Teachwire","year":"Not verified","url":"https://teachwire.net/news/paul-dix-how-to-be-an-emotionally-consistent-teacher"},{"title":"Counter-Intuitive Behaviour Management","publisher":"Teacher Toolkit","year":"2019","url":"https://www.teachertoolkit.co.uk/2019/01/21/pivotal-2/"}],"related":["bill-rogers","mark-finnis","tom-bennett"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Dix&#39;s central claim: pupil behaviour changes when \u003cstrong>every adult behaves consistently\u003c/strong>, so start with staff habits, not a longer sanctions ladder.\u003c/li>\n\u003cli>His framework is \u003cstrong>five pillars\u003c/strong>: consistent, calm adult behaviour; first attention to best conduct; relentless routines; scripting difficult interventions; restorative follow-up.\u003c/li>\n\u003cli>Signature tools: \u003cstrong>three simple rules\u003c/strong> (commonly &#39;Ready, Respectful, Safe&#39;), \u003cstrong>meet and greet\u003c/strong>, \u003cstrong>recognition boards\u003c/strong>, the \u003cstrong>30-second scripted intervention\u003c/strong> and the \u003cstrong>restorative conversation\u003c/strong>.\u003c/li>\n\u003cli>He does not say &#39;no consequences&#39;. He argues consequences should be small, certain, proportionate and followed by repair, and that heavy punishment and public shaming do not change the pupils who receive them most.\u003c/li>\n\u003cli>Widely adopted in English schools, and widely argued over: critics say it under-weights sanctions and loads responsibility onto teachers. Read alongside Tom Bennett and the DfE&#39;s \u003cem>Behaviour in Schools\u003c/em> guidance.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Paul Dix is a former teacher who became a behaviour trainer and founded Pivotal Education, a UK training company. He has worked extensively with schools, alternative provision, pupil referral units and colleges, and his reputation rests on work in settings where behaviour is hardest. He led the &#39;Ban the Booths&#39; campaign against the routine use of isolation booths (launched around 2018; date not verified against a primary source). His 2017 book became one of the best-selling UK education titles, and many secondary behaviour policies borrow its vocabulary. Not verified: his current company arrangements as of 2026; Pivotal Education has changed ownership since he founded it.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>The five pillars\u003c/strong> (the order is given differently in different summaries; this is the list as reported in reviews of the 2017 book):\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Consistent, calm adult behaviour.\u003c/strong> Adults do not shout, show anger or take behaviour personally. Emotional restraint is treated as a professional skill, not a personality trait. Consistency means the whole staff doing a small number of agreed things, rather than each teacher running a private system.\u003c/li>\n\u003cli>\u003cstrong>First attention to best conduct.\u003c/strong> Notice and acknowledge pupils doing the right thing before dealing with those who are not. The pupils who get the teacher&#39;s attention first set the tone of the room.\u003c/li>\n\u003cli>\u003cstrong>Relentless routines.\u003c/strong> A few routines, taught and insisted on by everyone until automatic: entry, transitions, getting attention, exit.\u003c/li>\n\u003cli>\u003cstrong>Scripting difficult interventions.\u003c/strong> Staff use the same short, rehearsed form of words when behaviour goes wrong, so the adult stays calm and the pupil hears the same message from everyone.\u003c/li>\n\u003cli>\u003cstrong>Restorative follow-up.\u003c/strong> After an incident, the adult who was there has a structured conversation with the pupil to repair the relationship and plan for next time.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Three simple rules.\u003c/strong> Dix argues long rule lists are unlearnable. He recommends three, known by every pupil and adult; &#39;Ready, Respectful, Safe&#39; is the set most schools adopt. All conversations about behaviour refer back to them.\u003c/p>\n\u003cp>\u003cstrong>Deliberate botheredness.\u003c/strong> Small, persistent, daily acts that show pupils the adult cares: greeting by name, remembering details, following up, a note or call home for good conduct. He frames this as the engine of relationships, not an add-on.\u003c/p>\n\u003cp>\u003cstrong>Recognition over reward.\u003c/strong> He is sceptical of token economies and prizes. He prefers a \u003cstrong>recognition board\u003c/strong>: one target behaviour for the lesson written on the board (for example &#39;one voice&#39;), names added as pupils show it, aiming for the whole class. Names never come off. He also advocates positive notes and calls home, and leader recognition such as &#39;Hot Chocolate Friday&#39;.\u003c/p>\n\u003cp>\u003cstrong>Stepped responses.\u003c/strong> A typical Dix-style sequence is: reminder of the rule; caution delivered privately; last chance, using the 30-second script; time out (a short spell outside the room or in another class); repair. Each step is quiet and private where possible.\u003c/p>\n\u003cp>\u003cstrong>On sanctions.\u003c/strong> Dix argues that escalating punishment has diminishing returns, that the same pupils fill detentions and isolation week after week, and that certainty and follow-up matter more than severity. He is critical of &#39;behaviour points&#39; systems, names on the board for misbehaviour, and prolonged isolation. He accepts that consequences are needed, but wants them proportionate and paired with a restorative conversation. \u003cem>After the Adults Change\u003c/em> (2021) extends this to whole-school relational practice and reducing what the publisher describes as disproportionate punishment.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>When the Adults Change, Everything Changes: Seismic shifts in school behaviour\u003c/em> (Independent Thinking Press, 2017).\u003c/li>\n\u003cli>\u003cem>After the Adults Change: Achievable behaviour nirvana\u003c/em> (Independent Thinking Press, 2021).\u003c/li>\n\u003cli>\u003cem>When the Parents Change, Everything Changes\u003c/em> (Penguin, 2023), a book for parents.\u003c/li>\n\u003cli>Earlier titles including \u003cem>Taking Care of Behaviour\u003c/em> and \u003cem>The Essential Guide to Taking Care of Behaviour\u003c/em> (Pearson; years not verified).\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>\u003cstrong>Classroom teacher, Monday morning\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Stand at the door. Greet each pupil by name; set the first task before they sit.\u003c/li>\n\u003cli>Put one recognition target on the board. Add names as you see it. Finish the lesson by acknowledging the class total.\u003c/li>\n\u003cli>Rehearse a 30-second script and use it word for word. Dix&#39;s structure, paraphrased: say what you have noticed; name the rule it breaks; state the consequence the pupil has chosen; remind them of a recent time they got it right and say that is the pupil you expect to see; thank them and walk away. Do not wait for a reply or get drawn into argument: give take-up time.\u003c/li>\n\u003cli>Deal with secondary behaviours (muttering, eye-rolling) later, not in the moment.\u003c/li>\n\u003cli>Make one positive phone call or send one positive note home each day.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The restorative conversation.\u003c/strong> Held by the adult involved, briefly, usually the same day. Choose a few questions from a short list: What happened? What were you thinking at the time? Who has been affected, and how? What needs to happen to put things right? What will you do differently next time? Dix advises picking two or three, not working through all of them, and walking or sitting side by side rather than across a desk.\u003c/p>\n\u003cp>\u003cstrong>Leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Agree three rules and three or four &#39;visible consistencies&#39; (for example meet and greet, a single attention signal, calm corridors) and hold staff to them. Dix&#39;s advice is to do less, but ensure everyone does it.\u003c/li>\n\u003cli>Write shared scripts into the policy and practise them in staff training.\u003c/li>\n\u003cli>Be visible at transitions; leaders model the calm tone they ask for.\u003c/li>\n\u003cli>Audit who receives repeated sanctions; if the same pupils dominate, the sanction is not working for them.\u003c/li>\n\u003cli>Protect time for restorative conversations: they fail when staff have no slot to hold them.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Under-weighting consequences.\u003c/strong> Advocates of consequence-led systems, including Tom Bennett, argue that schools need clear, reliably applied sanctions alongside relationships, and that removing or softening them can leave teachers unsupported and classrooms disrupted. Some teachers and bloggers (for example Andrew Old) have reported that &#39;Dix-style&#39; policies, poorly implemented, became sanction-free in practice.\u003c/li>\n\u003cli>\u003cstrong>Blaming teachers.\u003c/strong> The book&#39;s title is read by some as implying poor behaviour is the adult&#39;s fault. Dix&#39;s reply is that adult behaviour is the variable schools control.\u003c/li>\n\u003cli>\u003cstrong>Evidence base.\u003c/strong> Dix&#39;s work draws on practitioner experience and case studies, not controlled trials. The EEF&#39;s \u003cem>Improving Behaviour in Schools\u003c/em> guidance supports several compatible ideas (knowing pupils, teaching routines, consistency) but describes the evidence for whole-school restorative approaches in England as limited.\u003c/li>\n\u003cli>\u003cstrong>Isolation.\u003c/strong> His opposition to booths is contested: DfE guidance treats removal from the classroom as a legitimate sanction when used properly, and many heads argue it protects other pupils&#39; learning.\u003c/li>\n\u003cli>\u003cstrong>Workload.\u003c/strong> Restorative conversations and daily positive contact take time. Without timetabled capacity they are the first things to slip.\u003c/li>\n\u003cli>\u003cstrong>Common ground.\u003c/strong> Dix, Rogers and Bennett agree on more than the debate suggests: taught routines, calm adults, certainty over severity, and whole-staff consistency.\u003c/li>\n\u003c/ul>\n","text":"At a glance Dix's central claim: pupil behaviour changes when every adult behaves consistently , so start with staff habits, not a longer sanctions ladder. His framework is five pillars : consistent, calm adult behaviour; first attention to best conduct; relentless routines; scripting difficult interventions; restorative follow-up. Signature tools: three simple rules (commonly 'Ready, Respectful, Safe'), meet and greet , recognition boards , the 30-second scripted intervention and the restorative conversation . He does not say 'no consequences'. He argues consequences should be small, certain, proportionate and followed by repair, and that heavy punishment and public shaming do not change the pupils who receive them most. Widely adopted in English schools, and widely argued over: critics say it under-weights sanctions and loads responsibility onto teachers. Read alongside Tom Bennett and the DfE's Behaviour in Schools guidance. Who they are Paul Dix is a former teacher who became a behaviour trainer and founded Pivotal Education, a UK training company. He has worked extensively with schools, alternative provision, pupil referral units and colleges, and his reputation rests on work in settings where behaviour is hardest. He led the 'Ban the Booths' campaign against the routine use of isolation booths (launched around 2018; date not verified against a primary source). His 2017 book became one of the best-selling UK education titles, and many secondary behaviour policies borrow its vocabulary. Not verified: his current company arrangements as of 2026; Pivotal Education has changed ownership since he founded it. Core ideas The five pillars (the order is given differently in different summaries; this is the list as reported in reviews of the 2017 book): Consistent, calm adult behaviour. Adults do not shout, show anger or take behaviour personally. Emotional restraint is treated as a professional skill, not a personality trait. Consistency means the whole staff doing a small number of agreed things, rather than each teacher running a private system. First attention to best conduct. Notice and acknowledge pupils doing the right thing before dealing with those who are not. The pupils who get the teacher's attention first set the tone of the room. Relentless routines. A few routines, taught and insisted on by everyone until automatic: entry, transitions, getting attention, exit. Scripting difficult interventions. Staff use the same short, rehearsed form of words when behaviour goes wrong, so the adult stays calm and the pupil hears the same message from everyone. Restorative follow-up. After an incident, the adult who was there has a structured conversation with the pupil to repair the relationship and plan for next time. Three simple rules. Dix argues long rule lists are unlearnable. He recommends three, known by every pupil and adult; 'Ready, Respectful, Safe' is the set most schools adopt. All conversations about behaviour refer back to them. Deliberate botheredness. Small, persistent, daily acts that show pupils the adult cares: greeting by name, remembering details, following up, a note or call home for good conduct. He frames this as the engine of relationships, not an add-on. Recognition over reward. He is sceptical of token economies and prizes. He prefers a recognition board : one target behaviour for the lesson written on the board (for example 'one voice'), names added as pupils show it, aiming for the whole class. Names never come off. He also advocates positive notes and calls home, and leader recognition such as 'Hot Chocolate Friday'. Stepped responses. A typical Dix-style sequence is: reminder of the rule; caution delivered privately; last chance, using the 30-second script; time out (a short spell outside the room or in another class); repair. Each step is quiet and private where possible. On sanctions. Dix argues that escalating punishment has diminishing returns, that the same pupils fill detentions and isolation week after week, and that certainty and follow-up matter more than severity. He is critical of 'behaviour points' systems, names on the board for misbehaviour, and prolonged isolation. He accepts that consequences are needed, but wants them proportionate and paired with a restorative conversation. After the Adults Change (2021) extends this to whole-school relational practice and reducing what the publisher describes as disproportionate punishment. Key works When the Adults Change, Everything Changes: Seismic shifts in school behaviour (Independent Thinking Press, 2017). After the Adults Change: Achievable behaviour nirvana (Independent Thinking Press, 2021). When the Parents Change, Everything Changes (Penguin, 2023), a book for parents. Earlier titles including Taking Care of Behaviour and The Essential Guide to Taking Care of Behaviour (Pearson; years not verified). Putting it into practice Classroom teacher, Monday morning Stand at the door. Greet each pupil by name; set the first task before they sit. Put one recognition target on the board. Add names as you see it. Finish the lesson by acknowledging the class total. Rehearse a 30-second script and use it word for word. Dix's structure, paraphrased: say what you have noticed; name the rule it breaks; state the consequence the pupil has chosen; remind them of a recent time they got it right and say that is the pupil you expect to see; thank them and walk away. Do not wait for a reply or get drawn into argument: give take-up time. Deal with secondary behaviours (muttering, eye-rolling) later, not in the moment. Make one positive phone call or send one positive note home each day. The restorative conversation. Held by the adult involved, briefly, usually the same day. Choose a few questions from a short list: What happened? What were you thinking at the time? Who has been affected, and how? What needs to happen to put things right? What will you do differently next time? Dix advises picking two or three, not working through all of them, and walking or sitting side by side rather than across a desk. Leaders Agree three rules and three or four 'visible consistencies' (for example meet and greet, a single attention signal, calm corridors) and hold staff to them. Dix's advice is to do less, but ensure everyone does it. Write shared scripts into the policy and practise them in staff training. Be visible at transitions; leaders model the calm tone they ask for. Audit who receives repeated sanctions; if the same pupils dominate, the sanction is not working for them. Protect time for restorative conversations: they fail when staff have no slot to hold them. Critiques and debate Under-weighting consequences. Advocates of consequence-led systems, including Tom Bennett, argue that schools need clear, reliably applied sanctions alongside relationships, and that removing or softening them can leave teachers unsupported and classrooms disrupted. Some teachers and bloggers (for example Andrew Old) have reported that 'Dix-style' policies, poorly implemented, became sanction-free in practice. Blaming teachers. The book's title is read by some as implying poor behaviour is the adult's fault. Dix's reply is that adult behaviour is the variable schools control. Evidence base. Dix's work draws on practitioner experience and case studies, not controlled trials. The EEF's Improving Behaviour in Schools guidance supports several compatible ideas (knowing pupils, teaching routines, consistency) but describes the evidence for whole-school restorative approaches in England as limited. Isolation. His opposition to booths is contested: DfE guidance treats removal from the classroom as a legitimate sanction when used properly, and many heads argue it protects other pupils' learning. Workload. Restorative conversations and daily positive contact take time. Without timetabled capacity they are the first things to slip. Common ground. Dix, Rogers and Bennett agree on more than the debate suggests: taught routines, calm adults, certainty over severity, and whole-staff consistency."},{"slug":"preventing-bullying","title":"Preventing and tackling bullying","category":"behaviour","type":"guidance","summary":"DfE advice on schools' duties and powers to prevent and respond to bullying between pupils. The July 2017 version remains the reference text; separate 2026 guidance covers bullying and harassment of staff.","status":"Non-statutory guidance","evidence":"","tags":["bullying","cyberbullying","equality","safeguarding","behaviour policy","prejudice"],"checked":"2026-11-12","sources":[{"title":"Preventing and tackling bullying: advice for headteachers, staff and governing bodies","publisher":"Department for Education","year":"2017","url":"https://www.gov.uk/government/publications/preventing-and-tackling-bullying"},{"title":"Preventing and tackling bullying advice (July 2017), archived copy","publisher":"Digital Education Resource Archive, UCL IOE","year":"2017","url":"https://dera.ioe.ac.uk/id/eprint/29544/"},{"title":"Preventing and tackling bullying and harassment of school staff","publisher":"Department for Education","year":"2026","url":"https://www.gov.uk/government/publications/preventing-and-tackling-bullying-and-harassment-of-school-staff"},{"title":"Treating bullying as everyone's problem reduces incidence in primary schools (UK KiVa trial)","publisher":"University of Oxford, Department of Education","year":"2024","url":"https://www.education.ox.ac.uk/news/treating-bullying-as-everyones-problem-reduces-incidence-in-primary-schools"},{"title":"National Behaviour Survey: findings from academic year 2024 to 2025","publisher":"Department for Education","year":"2025","url":"https://www.gov.uk/government/publications/national-behaviour-survey-report-2024-to-2025-academic-year"}],"related":["behaviour-in-schools-guidance","child-on-child-abuse-and-sexual-harassment","online-safety-filtering-and-monitoring"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Every school must have measures to prevent \u003cstrong>all forms of bullying\u003c/strong>. For maintained schools these sit in the behaviour policy by law; academies and independent schools must have an effective anti-bullying strategy.\u003c/li>\n\u003cli>The DfE&#39;s working definition: behaviour by an individual or group, \u003cstrong>repeated over time\u003c/strong>, that \u003cstrong>intentionally hurts\u003c/strong> another individual or group physically or emotionally, often involving an \u003cstrong>imbalance of power\u003c/strong>.\u003c/li>\n\u003cli>The DfE advice is short and non-prescriptive. The version dated \u003cstrong>July 2017\u003c/strong> is still the one schools cite in 2026 policies; no replacement for pupil bullying was found.\u003c/li>\n\u003cli>A bullying incident becomes a \u003cstrong>child protection\u003c/strong> concern where there is reasonable cause to suspect significant harm. Some bullying is also a crime.\u003c/li>\n\u003cli>Separate non-statutory DfE guidance on bullying and harassment of \u003cstrong>school staff\u003c/strong> was published in July 2026.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Title:\u003c/strong> Preventing and tackling bullying: advice for headteachers, staff and governing bodies. First published 2013, last updated July 2017. Non-statutory.\u003c/li>\n\u003cli>\u003cstrong>Applies to:\u003c/strong> all schools in England.\u003c/li>\n\u003cli>\u003cstrong>Companion material:\u003c/strong> advice for parents on cyberbullying, and a mental health and behaviour document, sit alongside. Search results suggest the cyberbullying advice for staff has been withdrawn as superseded; not verified on the live page.\u003c/li>\n\u003cli>\u003cstrong>What surrounds it now:\u003c/strong> Keeping Children Safe in Education (child-on-child abuse, updated annually); the statutory RSHE guidance; Behaviour in schools (2024); and the 2026 staff bullying and harassment guidance.\u003c/li>\n\u003cli>Not verified: the GOV.UK page could not be opened directly to confirm whether any edit was made after July 2017.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Maintained schools:\u003c/strong> the headteacher must determine measures to prevent all forms of bullying among pupils, as part of the behaviour policy, and communicate them to pupils, staff and parents (Education and Inspections Act 2006, s.89).\u003c/li>\n\u003cli>\u003cstrong>Academies and independent schools:\u003c/strong> the proprietor must ensure bullying is prevented in so far as reasonably practicable by drawing up and implementing an effective anti-bullying strategy (Independent School Standards).\u003c/li>\n\u003cli>\u003cstrong>Equality Act 2010:\u003c/strong> schools must not discriminate against, harass or victimise pupils, and the public sector equality duty requires due regard to eliminating harassment and fostering good relations across protected characteristics.\u003c/li>\n\u003cli>\u003cstrong>Children Act 1989:\u003c/strong> treat bullying as a safeguarding matter where a child is suffering, or likely to suffer, significant harm.\u003c/li>\n\u003cli>\u003cstrong>Outside school:\u003c/strong> headteachers have the power, not a duty, to discipline for conduct off the premises to a reasonable extent, which covers journeys and online behaviour.\u003c/li>\n\u003c/ul>\n\u003cp>There is no legal requirement for a separate anti-bullying policy, though many schools have one. There is no statutory duty to record bullying incidents, but the DfE advises schools to develop their own approach and Ofsted will ask to see records and analysis.\u003c/p>\n\u003ch2>In practice\u003c/h2>\n\u003cp>\u003cstrong>Prevention\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Teach what bullying is and is not (one-off fallings-out, mutual conflict) in tutor time and RSHE, using the three tests: repeated, intended, power imbalance.\u003c/li>\n\u003cli>Name prejudice-based bullying explicitly: racist, homophobic, biphobic, transphobic, sexist, disablist, faith-based, and about appearance or home circumstances.\u003c/li>\n\u003cli>Supervise the places it happens: toilets, changing rooms, buses, the dinner queue, group chats.\u003c/li>\n\u003cli>Staff challenge &#39;banter&#39; every time. Script: &quot;That&#39;s not a joke here. We don&#39;t use that word. See me at the end.&quot;\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Reporting\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Several routes: tutor, head of year, an online form or QR code, a trusted-adult list. Pupils often will not report face to face.\u003c/li>\n\u003cli>Tell pupils what will happen next and who will know.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Responding\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Listen to the targeted pupil first; ask what they want to happen and what they fear.\u003c/li>\n\u003cli>Take separate accounts from those involved and from bystanders. Keep screenshots; do not forward imagery.\u003c/li>\n\u003cli>Decide: is this bullying, and is there a safeguarding or criminal element? Involve the DSL where needed.\u003c/li>\n\u003cli>Apply the sanction in the behaviour policy and tell the targeted pupil&#39;s parents what was done in general terms.\u003c/li>\n\u003cli>Work with the pupil who bullied on why, and on what changes.\u003c/li>\n\u003cli>Check in with the targeted pupil at one, two and six weeks. Most failure is here: the behaviour resumes more quietly.\u003c/li>\n\u003c/ol>\n\u003cp>Restorative meetings can help in some cases, but only with the targeted pupil&#39;s free agreement; putting a victim opposite a more powerful peer can entrench the harm.\u003c/p>\n\u003cp>\u003cstrong>For leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Record incidents by type and by protected characteristic; report termly to governors.\u003c/li>\n\u003cli>Survey pupils annually; compare with the National Behaviour Survey, which tracks pupil-reported bullying nationally.\u003c/li>\n\u003cli>Train all staff, including lunchtime and transport staff.\u003c/li>\n\u003c/ul>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>A threshold so high that nothing is ever logged as bullying.\u003c/li>\n\u003cli>Asking the targeted pupil to change behaviour, seat or route while the perpetrator&#39;s routine stays the same.\u003c/li>\n\u003cli>Treating online bullying as &#39;happened outside school&#39;.\u003c/li>\n\u003cli>Recording the first incident but not the follow-up.\u003c/li>\n\u003cli>Assuming bought-in programmes work automatically. Whole-school anti-bullying programmes show modest average reductions; the 2024 UK trial of KiVa in 118 primary schools reported about a 13 per cent reduction, smaller than in Finland. Evidence in secondary schools is thinner.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The Anti-Bullying Alliance publishes free CPD and the model on which Anti-Bullying Week is based.\u003c/li>\n\u003cli>Gaffney, Ttofi and Farrington&#39;s meta-analyses of school anti-bullying programmes are the main evidence synthesis (headline effect sizes not verified here).\u003c/li>\n\u003cli>The Diana Award and Childnet offer peer-led and online safety resources.\u003c/li>\n\u003c/ul>\n","text":"At a glance Every school must have measures to prevent all forms of bullying . For maintained schools these sit in the behaviour policy by law; academies and independent schools must have an effective anti-bullying strategy. The DfE's working definition: behaviour by an individual or group, repeated over time , that intentionally hurts another individual or group physically or emotionally, often involving an imbalance of power . The DfE advice is short and non-prescriptive. The version dated July 2017 is still the one schools cite in 2026 policies; no replacement for pupil bullying was found. A bullying incident becomes a child protection concern where there is reasonable cause to suspect significant harm. Some bullying is also a crime. Separate non-statutory DfE guidance on bullying and harassment of school staff was published in July 2026. Status and current version Title: Preventing and tackling bullying: advice for headteachers, staff and governing bodies. First published 2013, last updated July 2017. Non-statutory. Applies to: all schools in England. Companion material: advice for parents on cyberbullying, and a mental health and behaviour document, sit alongside. Search results suggest the cyberbullying advice for staff has been withdrawn as superseded; not verified on the live page. What surrounds it now: Keeping Children Safe in Education (child-on-child abuse, updated annually); the statutory RSHE guidance; Behaviour in schools (2024); and the 2026 staff bullying and harassment guidance. Not verified: the GOV.UK page could not be opened directly to confirm whether any edit was made after July 2017. What schools must do Maintained schools: the headteacher must determine measures to prevent all forms of bullying among pupils, as part of the behaviour policy, and communicate them to pupils, staff and parents (Education and Inspections Act 2006, s.89). Academies and independent schools: the proprietor must ensure bullying is prevented in so far as reasonably practicable by drawing up and implementing an effective anti-bullying strategy (Independent School Standards). Equality Act 2010: schools must not discriminate against, harass or victimise pupils, and the public sector equality duty requires due regard to eliminating harassment and fostering good relations across protected characteristics. Children Act 1989: treat bullying as a safeguarding matter where a child is suffering, or likely to suffer, significant harm. Outside school: headteachers have the power, not a duty, to discipline for conduct off the premises to a reasonable extent, which covers journeys and online behaviour. There is no legal requirement for a separate anti-bullying policy, though many schools have one. There is no statutory duty to record bullying incidents, but the DfE advises schools to develop their own approach and Ofsted will ask to see records and analysis. In practice Prevention Teach what bullying is and is not (one-off fallings-out, mutual conflict) in tutor time and RSHE, using the three tests: repeated, intended, power imbalance. Name prejudice-based bullying explicitly: racist, homophobic, biphobic, transphobic, sexist, disablist, faith-based, and about appearance or home circumstances. Supervise the places it happens: toilets, changing rooms, buses, the dinner queue, group chats. Staff challenge 'banter' every time. Script: \"That's not a joke here. We don't use that word. See me at the end.\" Reporting Several routes: tutor, head of year, an online form or QR code, a trusted-adult list. Pupils often will not report face to face. Tell pupils what will happen next and who will know. Responding Listen to the targeted pupil first; ask what they want to happen and what they fear. Take separate accounts from those involved and from bystanders. Keep screenshots; do not forward imagery. Decide: is this bullying, and is there a safeguarding or criminal element? Involve the DSL where needed. Apply the sanction in the behaviour policy and tell the targeted pupil's parents what was done in general terms. Work with the pupil who bullied on why, and on what changes. Check in with the targeted pupil at one, two and six weeks. Most failure is here: the behaviour resumes more quietly. Restorative meetings can help in some cases, but only with the targeted pupil's free agreement; putting a victim opposite a more powerful peer can entrench the harm. For leaders Record incidents by type and by protected characteristic; report termly to governors. Survey pupils annually; compare with the National Behaviour Survey, which tracks pupil-reported bullying nationally. Train all staff, including lunchtime and transport staff. Common pitfalls A threshold so high that nothing is ever logged as bullying. Asking the targeted pupil to change behaviour, seat or route while the perpetrator's routine stays the same. Treating online bullying as 'happened outside school'. Recording the first incident but not the follow-up. Assuming bought-in programmes work automatically. Whole-school anti-bullying programmes show modest average reductions; the 2024 UK trial of KiVa in 118 primary schools reported about a 13 per cent reduction, smaller than in Finland. Evidence in secondary schools is thinner. Go deeper The Anti-Bullying Alliance publishes free CPD and the model on which Anti-Bullying Week is based. Gaffney, Ttofi and Farrington's meta-analyses of school anti-bullying programmes are the main evidence synthesis (headline effect sizes not verified here). The Diana Award and Childnet offer peer-led and online safety resources."},{"slug":"use-of-reasonable-force","title":"Reasonable force and restrictive interventions","category":"behaviour","type":"guidance","summary":"From 1 April 2026 new DfE guidance on restrictive interventions replaced the 2013 'Use of reasonable force' advice, with legal duties to record and report significant uses of force, restraint and seclusion to parents.","status":"Non-statutory guidance","evidence":"","tags":["reasonable force","restraint","seclusion","restrictive interventions","recording","send"],"checked":"2026-11-12","sources":[{"title":"Restrictive interventions, including use of reasonable force, in schools","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6943dad6501cdd438f4cf5aa/Restrictive_interventions_including_use_of_reasonable_force_in_schools.pdf"},{"title":"Restrictive interventions: use of reasonable force","publisher":"NASUWT","year":"2026","url":"https://www.nasuwt.org.uk/advice/in-the-classroom/children-and-young-people/restrictive-interventions-use-of-reasonable-force.html"},{"title":"Restrictive interventions in schools: key changes","publisher":"Harrison Clark Rickerbys","year":"2026","url":"https://www.hcrlaw.com/news-and-insights/restrictive-interventions-in-schools-key-changes/"},{"title":"FAQs on use of reasonable force and other restrictive interventions","publisher":"ASCL","year":"2026","url":"https://ascl.org.uk/Help-and-Advice/Leadership-and-governance/Health-safety-and-safeguarding/FAQs-on-use-of-reasonable-force-and-other-restrict"},{"title":"New seclusion and restraint rules: what schools need to know and practical tips","publisher":"Doyle Clayton","year":"2026","url":"https://doyleclayton.co.uk/new-seclusion-and-restraint-rules-what-schools-need-to-know-and-practical-tips/"},{"title":"CBF statement on DfE guidance on restrictive interventions","publisher":"Challenging Behaviour Foundation","year":"2026","url":"https://www.challengingbehaviour.org.uk/news/cbf-statement-on-dfore-guidance-on-restrictive-interventions/"}],"related":["behaviour-in-schools-guidance","searching-screening-and-confiscation","allegations-and-low-level-concerns","keeping-children-safe-in-education"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>The 2013 advice &#39;Use of reasonable force&#39; is no longer in force. Since \u003cstrong>1 April 2026\u003c/strong> schools follow &#39;Restrictive interventions, including use of reasonable force, in schools&#39;.\u003c/li>\n\u003cli>The legal power is unchanged: any member of school staff may use \u003cstrong>reasonable force\u003c/strong> to prevent a pupil committing an offence, injuring themselves or others, damaging property, or prejudicing good order and discipline (Education and Inspections Act 2006, s.93).\u003c/li>\n\u003cli>What is new is a \u003cstrong>legal duty to record and to report to parents\u003c/strong> each significant incident in which force is used, and each incident of non-force restraint or seclusion.\u003c/li>\n\u003cli>The guidance widens the frame from &#39;force&#39; to \u003cstrong>restrictive interventions\u003c/strong>: physical restraint, non-physical restraint and seclusion. These must not be used as punishment or as routine behaviour management.\u003c/li>\n\u003cli>Force must be proportionate, the minimum needed, and for the shortest time. Prevention and de-escalation come first.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Title:\u003c/strong> Restrictive interventions, including use of reasonable force, in schools (published December 2025, effective 1 April 2026).\u003c/li>\n\u003cli>\u003cstrong>Status:\u003c/strong> mostly non-statutory advice. One section is \u003cstrong>statutory guidance\u003c/strong> issued under section 93A of the Education and Inspections Act 2006, covering recording and reporting. The entry&#39;s status field reflects the bulk of the document.\u003c/li>\n\u003cli>\u003cstrong>Legal basis for the new duties:\u003c/strong> section 93A (significant incidents of force), commenced for April 2026, and the Schools (Recording and Reporting of Seclusion and Restraint) (No. 2) (England) Regulations 2025, which apply equivalent duties to seclusion and to restraint not involving force.\u003c/li>\n\u003cli>\u003cstrong>Applies to:\u003c/strong> schools in England. Not verified: the precise list of school types to which each duty applies; check the guidance&#39;s status section.\u003c/li>\n\u003cli>\u003cstrong>Background:\u003c/strong> a 2023 call for evidence and a 2025 consultation preceded the change. Disability organisations had campaigned for mandatory recording; the EHRC had recommended it in 2021.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Record\u003c/strong> every significant incident of force, and every incident of seclusion or non-force restraint, as soon as practicable. The guidance expects this the same day.\u003c/li>\n\u003cli>\u003cstrong>Report to parents\u003c/strong> in writing as soon as practicable; guidance expects the same day. Exceptions exist, including where the pupil is aged 20 or over and where reporting would risk significant harm to the pupil (in which case the local authority is told instead; not verified against the regulations&#39; exact wording).\u003c/li>\n\u003cli>\u003cstrong>Governing bodies and proprietors\u003c/strong> must take reasonable steps to ensure the procedure is followed.\u003c/li>\n\u003cli>\u003cstrong>Never use force as punishment.\u003c/strong> Corporal punishment is unlawful (Education Act 1996, s.548).\u003c/li>\n\u003cli>\u003cstrong>Meet Equality Act duties:\u003c/strong> anticipate and make reasonable adjustments for disabled pupils, and consider the public sector equality duty when monitoring.\u003c/li>\n\u003cli>\u003cstrong>Follow Keeping Children Safe in Education\u003c/strong> when an allegation is made about a member of staff&#39;s use of force.\u003c/li>\n\u003c/ul>\n\u003cp>&#39;Significant incident&#39; is not tightly defined. Commentators summarise it as force going beyond ordinary appropriate physical contact, and note that judgement is left to schools. When unsure, record.\u003c/p>\n\u003ch2>In practice\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Policy.\u003c/strong> Have a restrictive interventions policy or section of the behaviour policy: definitions, who is trained, when interventions may be used, recording, parental reporting, debrief, complaints and governor oversight. The old phrase &#39;positive handling&#39; on its own no longer covers the ground.\u003c/li>\n\u003cli>\u003cstrong>Prevention first.\u003c/strong> Know triggers; use the de-escalation steps in the linked entry; change adult, reduce audience, give space and time.\u003c/li>\n\u003cli>\u003cstrong>If force is needed,\u003c/strong> for example separating two Year 10 pupils fighting on a corridor: call for help, give a clear verbal warning (&quot;I&#39;m going to hold your arm and move you back&quot;), use the least intrusive hold, release as soon as the risk passes, then check both pupils for injury and distress.\u003c/li>\n\u003cli>\u003cstrong>Never\u003c/strong> use holds that restrict breathing, prone or seated holds that risk positional asphyxia, or pain-inducing techniques.\u003c/li>\n\u003cli>\u003cstrong>Afterwards:\u003c/strong> medical check; record (who, where, when, what led to it, what was tried first, what intervention, how long, injuries, witnesses); written report to parents; debrief with the pupil and with staff; DSL informed.\u003c/li>\n\u003cli>\u003cstrong>Seclusion\u003c/strong> means confining a pupil alone and preventing them leaving, as a safety measure. It is different from a supervised removal room or a pupil choosing a calm space. A locked or held door falls within the recording duty and risks unlawful deprivation of liberty.\u003c/li>\n\u003cli>\u003cstrong>Individual plans.\u003c/strong> For pupils where interventions are foreseeable, agree a support or risk-reduction plan with parents and, where relevant, the SENCO and health professionals. Review after every incident.\u003c/li>\n\u003cli>\u003cstrong>Training.\u003c/strong> The guidance expects training proportionate to need; mainstream secondaries usually train a core team (pastoral, SEND, PE, on-call) in an accredited approach and brief all staff on the law and on de-escalation.\u003c/li>\n\u003cli>\u003cstrong>Governors\u003c/strong> should receive termly anonymised data broken down by SEND, ethnicity, sex, year and location, and ask what is being done to reduce use.\u003c/li>\n\u003c/ul>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Still working from the 2013 document or a pre-2026 &#39;positive handling&#39; policy.\u003c/li>\n\u003cli>&#39;No touch&#39; policies. The DfE has long advised against them; they leave staff unable to protect pupils.\u003c/li>\n\u003cli>Recording only incidents with injuries, or reporting to parents by phone with nothing in writing.\u003c/li>\n\u003cli>Calling seclusion &#39;time out&#39;, &#39;reflection&#39; or &#39;withdrawal&#39; and not recording it. Unions (reported in Tes) have said the definitions do not separate these clearly enough; leaders should define terms locally.\u003c/li>\n\u003cli>Force used to enforce compliance with an instruction where there is no risk, for example to remove a seated, refusing pupil. Lawful power exists for good order, but proportionality is hard to show.\u003c/li>\n\u003cli>No analysis of repeat use with the same pupil.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The Challenging Behaviour Foundation and the Restraint Reduction Network publish critiques and training standards; both argue the guidance should go further in reducing use.\u003c/li>\n\u003cli>ASCL&#39;s FAQs set out the leadership view, including concerns about workload and ambiguity.\u003c/li>\n\u003cli>The EHRC inquiry into restraint in schools (2021) gives the background to mandatory recording.\u003c/li>\n\u003c/ul>\n","text":"At a glance The 2013 advice 'Use of reasonable force' is no longer in force. Since 1 April 2026 schools follow 'Restrictive interventions, including use of reasonable force, in schools'. The legal power is unchanged: any member of school staff may use reasonable force to prevent a pupil committing an offence, injuring themselves or others, damaging property, or prejudicing good order and discipline (Education and Inspections Act 2006, s.93). What is new is a legal duty to record and to report to parents each significant incident in which force is used, and each incident of non-force restraint or seclusion. The guidance widens the frame from 'force' to restrictive interventions : physical restraint, non-physical restraint and seclusion. These must not be used as punishment or as routine behaviour management. Force must be proportionate, the minimum needed, and for the shortest time. Prevention and de-escalation come first. Status and current version Title: Restrictive interventions, including use of reasonable force, in schools (published December 2025, effective 1 April 2026). Status: mostly non-statutory advice. One section is statutory guidance issued under section 93A of the Education and Inspections Act 2006, covering recording and reporting. The entry's status field reflects the bulk of the document. Legal basis for the new duties: section 93A (significant incidents of force), commenced for April 2026, and the Schools (Recording and Reporting of Seclusion and Restraint) (No. 2) (England) Regulations 2025, which apply equivalent duties to seclusion and to restraint not involving force. Applies to: schools in England. Not verified: the precise list of school types to which each duty applies; check the guidance's status section. Background: a 2023 call for evidence and a 2025 consultation preceded the change. Disability organisations had campaigned for mandatory recording; the EHRC had recommended it in 2021. What schools must do Record every significant incident of force, and every incident of seclusion or non-force restraint, as soon as practicable. The guidance expects this the same day. Report to parents in writing as soon as practicable; guidance expects the same day. Exceptions exist, including where the pupil is aged 20 or over and where reporting would risk significant harm to the pupil (in which case the local authority is told instead; not verified against the regulations' exact wording). Governing bodies and proprietors must take reasonable steps to ensure the procedure is followed. Never use force as punishment. Corporal punishment is unlawful (Education Act 1996, s.548). Meet Equality Act duties: anticipate and make reasonable adjustments for disabled pupils, and consider the public sector equality duty when monitoring. Follow Keeping Children Safe in Education when an allegation is made about a member of staff's use of force. 'Significant incident' is not tightly defined. Commentators summarise it as force going beyond ordinary appropriate physical contact, and note that judgement is left to schools. When unsure, record. In practice Policy. Have a restrictive interventions policy or section of the behaviour policy: definitions, who is trained, when interventions may be used, recording, parental reporting, debrief, complaints and governor oversight. The old phrase 'positive handling' on its own no longer covers the ground. Prevention first. Know triggers; use the de-escalation steps in the linked entry; change adult, reduce audience, give space and time. If force is needed, for example separating two Year 10 pupils fighting on a corridor: call for help, give a clear verbal warning (\"I'm going to hold your arm and move you back\"), use the least intrusive hold, release as soon as the risk passes, then check both pupils for injury and distress. Never use holds that restrict breathing, prone or seated holds that risk positional asphyxia, or pain-inducing techniques. Afterwards: medical check; record (who, where, when, what led to it, what was tried first, what intervention, how long, injuries, witnesses); written report to parents; debrief with the pupil and with staff; DSL informed. Seclusion means confining a pupil alone and preventing them leaving, as a safety measure. It is different from a supervised removal room or a pupil choosing a calm space. A locked or held door falls within the recording duty and risks unlawful deprivation of liberty. Individual plans. For pupils where interventions are foreseeable, agree a support or risk-reduction plan with parents and, where relevant, the SENCO and health professionals. Review after every incident. Training. The guidance expects training proportionate to need; mainstream secondaries usually train a core team (pastoral, SEND, PE, on-call) in an accredited approach and brief all staff on the law and on de-escalation. Governors should receive termly anonymised data broken down by SEND, ethnicity, sex, year and location, and ask what is being done to reduce use. Common pitfalls Still working from the 2013 document or a pre-2026 'positive handling' policy. 'No touch' policies. The DfE has long advised against them; they leave staff unable to protect pupils. Recording only incidents with injuries, or reporting to parents by phone with nothing in writing. Calling seclusion 'time out', 'reflection' or 'withdrawal' and not recording it. Unions (reported in Tes) have said the definitions do not separate these clearly enough; leaders should define terms locally. Force used to enforce compliance with an instruction where there is no risk, for example to remove a seated, refusing pupil. Lawful power exists for good order, but proportionality is hard to show. No analysis of repeat use with the same pupil. Go deeper The Challenging Behaviour Foundation and the Restraint Reduction Network publish critiques and training standards; both argue the guidance should go further in reducing use. ASCL's FAQs set out the leadership view, including concerns about workload and ambiguity. The EHRC inquiry into restraint in schools (2021) gives the background to mandatory recording."},{"slug":"retrieval-practice","title":"Retrieval practice","category":"teaching","type":"topic","summary":"Recalling knowledge from memory strengthens it more than re-reading. One of the best-evidenced findings in cognitive science, but easy to turn into a shallow starter-quiz ritual.","status":"Research and theory","evidence":"","tags":["memory","cognitive science","quizzing","testing effect","revision"],"checked":"2026-11-12","sources":[{"title":"Improving Students' Learning With Effective Learning Techniques (Dunlosky et al., Psychological Science in the Public Interest 14(1)) - press summary","publisher":"Association for Psychological Science","year":"2013","url":"https://www.psychologicalscience.org/news/releases/which-study-strategies-make-the-grade.html"},{"title":"Retrieval practice research in real classrooms (Agarwal, Nunes and Blunt review and database)","publisher":"RetrievalPractice.org","year":"2021","url":"https://www.retrievalpractice.org/review"},{"title":"Cognitive science approaches in the classroom: a review of the evidence (news release and report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/news/new-what-do-we-really-know-about-cognitive-science-in-the-classroom-eef-publishes-new-review-of-the-evidence/"},{"title":"Why retrieval practice is a safe bet for teachers","publisher":"Tes","year":"2021","url":"https://www.tes.com/magazine/teaching-learning/general/why-retrieval-practice-safe-bet-teachers"},{"title":"Cognitive science approaches in the classroom: what does the review say?","publisher":"Durrington Research School","year":"2021","url":"https://researchschool.org.uk/durrington/news/cognitive-science-approaches-in-the-classroom-what-does-the-review-say"}],"related":["spaced-and-interleaved-practice","desirable-difficulties","rosenshine-principles-of-instruction","robert-and-elizabeth-bjork"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Bringing information to mind from memory (the &#39;testing effect&#39;) makes it more retrievable later than re-reading or highlighting the same material.\u003c/li>\n\u003cli>It works best when it is effortful but mostly successful, low- or no-stakes, involves every pupil, and is followed by feedback.\u003c/li>\n\u003cli>Dunlosky and colleagues (2013) rated practice testing as one of only two &#39;high utility&#39; study techniques, with distributed practice.\u003c/li>\n\u003cli>A 2021 systematic review of classroom studies found benefits in the majority of experiments, though settings and methods varied widely.\u003c/li>\n\u003cli>Retrieval is for securing what has been taught. It is not a way of teaching new material, and factual recall quizzes alone will not build understanding or extended writing.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>Laboratory studies over more than a century, and most famously Roediger and Karpicke&#39;s 2006 experiments, show that learners who test themselves remember more a week later than those who re-study, even though re-study feels more effective and produces better scores on an immediate test.\u003c/p>\n\u003cp>\u003cstrong>Dunlosky et al. (2013)\u003c/strong> reviewed ten study techniques. Practice testing and distributed practice were rated high utility because they worked across ages, materials and outcome measures. Re-reading, highlighting and summarising, the techniques pupils most often choose, were rated low.\u003c/p>\n\u003cp>\u003cstrong>Agarwal, Nunes and Blunt (2021)\u003c/strong> reviewed 50 classroom experiments (49 effect sizes, about 5,400 pupils and students). Most showed medium or large benefits compared with business-as-usual activities such as re-study. The authors concluded that teachers should use retrieval and worry less about its precise format or timing.\u003c/p>\n\u003cp>\u003cstrong>The EEF&#39;s 2021 cognitive science review\u003c/strong> was more guarded. It judged the evidence for retrieval practice in classrooms as promising, but noted that many studies were short, researcher-delivered, used recall of facts as the outcome, and were concentrated in particular subjects and ages. It found less evidence about retrieval for complex material and about how quizzing works when designed and delivered by teachers over a whole course.\u003c/p>\n\u003cp>Other points with reasonable support: free recall and short-answer formats are generally at least as effective as multiple choice; feedback increases the benefit, especially when recall fails; and retrieval combined with spacing is stronger than either alone.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Starter quiz with a spread of content.\u003c/strong> Six questions: two from last lesson, two from last unit, two from last year. Pupils answer in silence from memory, then self-mark in a different colour. Keep it to about five to eight minutes including feedback.\u003c/li>\n\u003cli>\u003cstrong>Everyone retrieves.\u003c/strong> Mini-whiteboards or written answers, not hands up. One pupil answering aloud means one pupil retrieving.\u003c/li>\n\u003cli>\u003cstrong>Brain dumps.\u003c/strong> &#39;Write everything you remember about the causes of the First World War in four minutes&#39;, then compare with the knowledge organiser and add what was missed in another colour.\u003c/li>\n\u003cli>\u003cstrong>Vary the demand.\u003c/strong> Move beyond definitions: &#39;Give two differences between mitosis and meiosis&#39;, &#39;Which of these three quotations best shows Macbeth&#39;s guilt, and why?&#39;, a labelled diagram from memory, a five-step maths problem from last term.\u003c/li>\n\u003cli>\u003cstrong>Use the results.\u003c/strong> If half the class miss a question, reteach it and put it in next week&#39;s quiz. A quiz whose results change nothing is a ritual.\u003c/li>\n\u003cli>\u003cstrong>Aim for high, not perfect, success.\u003c/strong> If most pupils score under half, the gap since teaching was too long or the first teaching was not secure: reteach rather than re-quiz.\u003c/li>\n\u003cli>\u003cstrong>Teach pupils to do it themselves.\u003c/strong> Flashcards used properly (answer before turning, shuffle, separate known from unknown), &#39;look, cover, write, check&#39;, and past questions from memory. Model this explicitly from Year 7; do not assume it by Year 11.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Make retrieval a \u003cstrong>curriculum decision\u003c/strong>: departments should specify what knowledge must be retained and when it will be revisited. Otherwise quizzes default to last lesson&#39;s trivia.\u003c/li>\n\u003cli>Avoid mandating a format (&#39;five-a-day in every lesson&#39;). The 2021 review suggests format matters less than regular, well-targeted use; PE, art and drama need their own versions.\u003c/li>\n\u003cli>Do not collect quiz scores centrally. Recording turns a low-stakes learning activity into a high-stakes assessment and adds workload.\u003c/li>\n\u003cli>Shared, pre-written quiz banks per unit are the main workload saver.\u003c/li>\n\u003cli>Include study-skills teaching for pupils and information for parents on why self-testing beats re-reading.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Lab-to-classroom transfer.\u003c/strong> The EEF review&#39;s central caution: effects demonstrated with word lists or short texts over days do not guarantee the same gains from teacher-made quizzes across a GCSE course.\u003c/li>\n\u003cli>\u003cstrong>Shallow recall.\u003c/strong> Quizzing isolated facts can crowd out connected explanation. Evidence that retrieval of facts transfers to new, inferential questions is mixed.\u003c/li>\n\u003cli>\u003cstrong>Lethal mutation.\u003c/strong> A ten-minute starter, unrelated to the lesson, eating a sixth of curriculum time, with no feedback and no reteaching.\u003c/li>\n\u003cli>\u003cstrong>Low success demotivates.\u003c/strong> Pupils who repeatedly fail quizzes, including some with SEND or large knowledge gaps, may gain little without cues, scaffolds or reteaching.\u003c/li>\n\u003cli>\u003cstrong>Effect-size comparisons\u003c/strong> across such varied studies have been criticised, a limitation Tes&#39;s coverage of the 2021 review also notes.\u003c/li>\n\u003cli>\u003cstrong>Anxiety.\u003c/strong> Keep stakes genuinely low; evidence suggests routine low-stakes quizzing tends to reduce test anxiety over time, but public scoring can do the opposite.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Dunlosky&#39;s shorter article for teachers, &#39;Strengthening the Student Toolbox&#39; (\u003cem>American Educator\u003c/em>, 2013), is the best quick read.\u003c/li>\n\u003cli>RetrievalPractice.org hosts the 2021 review database and free guides.\u003c/li>\n\u003cli>Kate Jones&#39;s \u003cem>Retrieval Practice\u003c/em> books give many secondary classroom formats.\u003c/li>\n\u003cli>See the entries on low-stakes quizzing, spaced and interleaved practice and desirable difficulties.\u003c/li>\n\u003c/ul>\n","text":"At a glance Bringing information to mind from memory (the 'testing effect') makes it more retrievable later than re-reading or highlighting the same material. It works best when it is effortful but mostly successful, low- or no-stakes, involves every pupil, and is followed by feedback. Dunlosky and colleagues (2013) rated practice testing as one of only two 'high utility' study techniques, with distributed practice. A 2021 systematic review of classroom studies found benefits in the majority of experiments, though settings and methods varied widely. Retrieval is for securing what has been taught. It is not a way of teaching new material, and factual recall quizzes alone will not build understanding or extended writing. What the evidence says Laboratory studies over more than a century, and most famously Roediger and Karpicke's 2006 experiments, show that learners who test themselves remember more a week later than those who re-study, even though re-study feels more effective and produces better scores on an immediate test. Dunlosky et al. (2013) reviewed ten study techniques. Practice testing and distributed practice were rated high utility because they worked across ages, materials and outcome measures. Re-reading, highlighting and summarising, the techniques pupils most often choose, were rated low. Agarwal, Nunes and Blunt (2021) reviewed 50 classroom experiments (49 effect sizes, about 5,400 pupils and students). Most showed medium or large benefits compared with business-as-usual activities such as re-study. The authors concluded that teachers should use retrieval and worry less about its precise format or timing. The EEF's 2021 cognitive science review was more guarded. It judged the evidence for retrieval practice in classrooms as promising, but noted that many studies were short, researcher-delivered, used recall of facts as the outcome, and were concentrated in particular subjects and ages. It found less evidence about retrieval for complex material and about how quizzing works when designed and delivered by teachers over a whole course. Other points with reas
