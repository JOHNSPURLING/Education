ly with those who have not begun. Use the assertive register. Say what you want as a statement, not a question or plea. Calm voice, name, direction: 'Liam, I need you facing the front.' Do not argue. Repeat the direction once or twice (the broken record), then state the choice and move away. Apply the ladder mechanically, not emotionally. Same steps for every pupil, in order; warn privately where you can; never skip steps in anger or add extras. Keep the ratio positive. Canter's later guidance was that recognition should far outweigh consequences. Make positive contact home routine. Fresh start. Do not carry yesterday's tally into today. For leaders reviewing a consequence ladder Is it short enough to remember and used the same way in every room? Does it include teaching of routines and positive recognition, or only sanctions? What happens for pupils who reach the top repeatedly? A ladder alone will not change them; Canter's later work said these pupils need individual plans and relationships. Are warnings public (names on boards) or private? Remove public shaming devices. Are reasonable adjustments built in for pupils with SEND, as the Equality Act requires? Critiques and debate Weak evidence. Render, Padilla and Krank (Educational Leadership, 1989) reviewed the research and concluded that the effectiveness claims made for the programme were not supported by the small body of studies available. Canter disputed this, saying critics attended to only parts of the model. Obedience, not responsibility. Curwin and Mendler, and later Alfie Kohn, argued that the approach produces compliance through rewards and punishments without developing pupils' own judgement or addressing why they misbehave. Rethinking Schools published a similar critique from a classroom teacher's perspective. Public shaming. Names and ticks on the board were criticised (Education Week cites Linda Darling-Hammond) as potentially harmful; Canter dropped the practice. UK debate. British educational psychologists argued both sides in the 1990s: some described it as a dated, behaviourist import, others reported improved on-task behaviour in schools using it (journal exchange in Educational Psychology in Practice , mid-1990s; not opened for this entry). Rigidity and inclusion. A fixed hierarchy treats all pupils alike. Critics argue this penalises pupils with additional needs; the model's defenders say consistency is what makes it fair. Legacy. Later writers build on or react against it. Bill Rogers keeps the clarity but adds a less intrusive, more conversational repertoire; Paul Dix rejects escalating ladders in favour of scripts and restorative follow-up; Doug Lemov and Tom Bennett retain consequences but place far more weight on taught routines and culture."},{"slug":"live-marking-and-verbal-feedback","title":"Live marking and verbal feedback","category":"assessment","type":"topic","summary":"Feedback given during the lesson, at the pupil's desk or to the class under a visualiser, while work is in progress. Time-efficient and immediate, but it must be as purposeful as written comment.","status":"Professional practice","evidence":"EEF Toolkit (feedback): +6 months overall; search results for the strand cite +7 months for verbal feedback (not verified on the live page)","tags":["verbal feedback","live marking","visualiser","feedback","workload"],"checked":"2026-11-12","sources":[{"title":"Teacher Feedback to Improve Pupil Learning (guidance report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/feedback"},{"title":"Feedback (Teaching and Learning Toolkit strand)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback"},{"title":"Reducing teacher workload: Marking Policy Review Group report","publisher":"Department for Education","year":"2016","url":"https://www.gov.uk/government/publications/reducing-teacher-workload-marking-policy-review-group-report"},{"title":"Summary of the EEF's new guidance report: Teacher Feedback to Improve Pupil Learning","publisher":"Durrington Research School","year":"2021","url":"https://researchschool.org.uk/durrington/news/summary-of-the-eefs-new-guidance-report-teacher-feedback-to-improve-pupil-learning"}],"related":["eef-teacher-feedback-guidance","marking-policy-and-workload","whole-class-feedback"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Live marking means reading and responding to pupils&#39; work during the lesson: circulating with a pen, or putting a pupil&#39;s work under a visualiser for the whole class.\u003c/li>\n\u003cli>Verbal feedback is the oldest and cheapest form of feedback. The EEF&#39;s 2021 guidance says it should be used carefully and purposefully, not as an easy substitute for marking.\u003c/li>\n\u003cli>Its advantage is timing: pupils can act on it immediately, while still working on the task.\u003c/li>\n\u003cli>Its risks are that it is thin (&quot;good, keep going&quot;), unevenly distributed, and forgotten.\u003c/li>\n\u003cli>Do not require stamps or written logs of verbal feedback; the 2016 workload review criticised recording feedback for the benefit of observers.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>The EEF Toolkit&#39;s feedback strand reports +6 months on average. Search results for the live strand page indicate that studies of verbal feedback show slightly higher average impact (+7 months) than the overall figure; this was not verified directly, and the difference should not be over-read given how varied the studies are.\u003c/p>\n\u003cp>The EEF guidance report (recommendation 5) describes verbal feedback as including brief in-the-moment comments, structured individual conferences and whole-class verbal feedback such as work under a visualiser. It applies the same tests as for any feedback: grounded in good teaching, targeted at the task, the subject or self-regulation rather than the person, and followed by pupil action. The report is clear that method matters less than these principles.\u003c/p>\n\u003cp>There is little trial evidence on &quot;live marking&quot; as a named practice. The case for it rests on feedback principles and on workload: the 2016 Marking Policy Review Group encouraged schools to consider in-lesson feedback as a way to make marking manageable.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>\u003cstrong>Circulating with purpose\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Set a substantial independent task (10–20 minutes) so there is time to circulate.\u003c/li>\n\u003cli>Decide in advance what you are looking for, for example &quot;units on every answer&quot; in physics or &quot;topic sentence answers the question&quot; in history. Lemov calls this tracking, not watching.\u003c/li>\n\u003cli>Walk a planned route; start with pupils most likely to struggle, and make sure every pupil is seen across a week (a seating-plan tick sheet helps).\u003c/li>\n\u003cli>At each desk: read, name one thing, give an action, move on within 30 seconds. &quot;Your method&#39;s right to line 2. Check the expansion in line 3, then redo it.&quot; Mark a dot or underline at the place to fix; pupil corrects in a different colour if the school uses one.\u003c/li>\n\u003cli>Return to check the correction has been made.\u003c/li>\n\u003cli>Keep a tally of repeated errors. When the same issue appears four or five times, stop the class and reteach.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Visualiser feedback\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Mid-task, take one pupil&#39;s work (with a class culture that makes this normal) and show it: &quot;What has Amira done well in this evaluation? What one change would move it up?&quot; Then all pupils check their own for the same feature.\u003c/li>\n\u003cli>In art, DT, food and PE, the equivalent is a mid-lesson demonstration or peer performance with one coaching point.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Structured conferences\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>For A-level essays, NEA planning (within exam board rules) or EPQ, a five-minute one-to-one conversation with the pupil noting their own targets can replace a page of written comment.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Wording\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Prefer questions and prompts that make the pupil think: &quot;Which piece of evidence best supports that?&quot; over supplying the answer.\u003c/li>\n\u003cli>Avoid general praise as feedback. Be specific about what is right and why.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Accept that live feedback leaves little trace in books. Policies should say so explicitly, and quality assurance should rely on lesson visits, conversations with pupils and improvement in work over time.\u003c/li>\n\u003cli>Ban &quot;VF&quot; stamps and requirements for pupils to write down what the teacher said as proof.\u003c/li>\n\u003cli>Provide visualisers in every classroom and train staff to use them fluently; cost is modest.\u003c/li>\n\u003cli>Train the skills: task design that frees the teacher to circulate, what to look for, concise wording. Instructional coaching suits this well.\u003c/li>\n\u003cli>Timetabling and class size affect feasibility: 30 pupils in a 50-minute lesson allows well under a minute each.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Uneven attention.\u003c/strong> Without a plan, teachers gravitate to pupils who ask for help or who misbehave; quiet pupils with errors get missed.\u003c/li>\n\u003cli>\u003cstrong>Dependence.\u003c/strong> Constant in-task correction can stop pupils thinking for themselves and can mask whether they could do the task unaided. Some practice should be done, and assessed, without help.\u003c/li>\n\u003cli>\u003cstrong>Performance versus learning.\u003c/strong> Work corrected live looks good in the book; it does not show the pupil has retained the point. Check again later.\u003c/li>\n\u003cli>\u003cstrong>Quality control.\u003c/strong> Verbal feedback is invisible to colleagues, so weak practice is hard to spot and good practice hard to share.\u003c/li>\n\u003cli>\u003cstrong>Not a full replacement.\u003c/strong> Extended writing often needs reading in full, outside the lesson, to judge argument and structure.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>EEF guidance report, recommendations 4 and 5 (sources above).\u003c/li>\n\u003cli>Doug Lemov&#39;s &#39;Teach Like a Champion&#39; techniques on active observation and &quot;show call&quot;.\u003c/li>\n\u003cli>See whole-class feedback for the after-the-lesson equivalent.\u003c/li>\n\u003c/ul>\n","text":"At a glance Live marking means reading and responding to pupils' work during the lesson: circulating with a pen, or putting a pupil's work under a visualiser for the whole class. Verbal feedback is the oldest and cheapest form of feedback. The EEF's 2021 guidance says it should be used carefully and purposefully, not as an easy substitute for marking. Its advantage is timing: pupils can act on it immediately, while still working on the task. Its risks are that it is thin (\"good, keep going\"), unevenly distributed, and forgotten. Do not require stamps or written logs of verbal feedback; the 2016 workload review criticised recording feedback for the benefit of observers. What the evidence says The EEF Toolkit's feedback strand reports +6 months on average. Search results for the live strand page indicate that studies of verbal feedback show slightly higher average impact (+7 months) than the overall figure; this was not verified directly, and the difference should not be over-read given how varied the studies are. The EEF guidance report (recommendation 5) describes verbal feedback as including brief in-the-moment comments, structured individual conferences and whole-class verbal feedback such as work under a visualiser. It applies the same tests as for any feedback: grounded in good teaching, targeted at the task, the subject or self-regulation rather than the person, and followed by pupil action. The report is clear that method matters less than these principles. There is little trial evidence on \"live marking\" as a named practice. The case for it rests on feedback principles and on workload: the 2016 Marking Policy Review Group encouraged schools to consider in-lesson feedback as a way to make marking manageable. In the classroom Circulating with purpose Set a substantial independent task (10–20 minutes) so there is time to circulate. Decide in advance what you are looking for, for example \"units on every answer\" in physics or \"topic sentence answers the question\" in history. Lemov calls this tracking, not watching. Walk a planned route; start with pupils most likely to struggle, and make sure every pupil is seen across a week (a seating-plan tick sheet helps). At each desk: read, name one thing, give an action, move on within 30 seconds. \"Your method's right to line 2. Check the expansion in line 3, then redo it.\" Mark a dot or underline at the place to fix; pupil corrects in a different colour if the school uses one. Return to check the correction has been made. Keep a tally of repeated errors. When the same issue appears four or five times, stop the class and reteach. Visualiser feedback Mid-task, take one pupil's work (with a class culture that makes this normal) and show it: \"What has Amira done well in this evaluation? What one change would move it up?\" Then all pupils check their own for the same feature. In art, DT, food and PE, the equivalent is a mid-lesson demonstration or peer performance with one coaching point. Structured conferences For A-level essays, NEA planning (within exam board rules) or EPQ, a five-minute one-to-one conversation with the pupil noting their own targets can replace a page of written comment. Wording Prefer questions and prompts that make the pupil think: \"Which piece of evidence best supports that?\" over supplying the answer. Avoid general praise as feedback. Be specific about what is right and why. For leaders Accept that live feedback leaves little trace in books. Policies should say so explicitly, and quality assurance should rely on lesson visits, conversations with pupils and improvement in work over time. Ban \"VF\" stamps and requirements for pupils to write down what the teacher said as proof. Provide visualisers in every classroom and train staff to use them fluently; cost is modest. Train the skills: task design that frees the teacher to circulate, what to look for, concise wording. Instructional coaching suits this well. Timetabling and class size affect feasibility: 30 pupils in a 50-minute lesson allows well under a minute each. Cautions and critiques Uneven attention. Without a plan, teachers gravitate to pupils who ask for help or who misbehave; quiet pupils with errors get missed. Dependence. Constant in-task correction can stop pupils thinking for themselves and can mask whether they could do the task unaided. Some practice should be done, and assessed, without help. Performance versus learning. Work corrected live looks good in the book; it does not show the pupil has retained the point. Check again later. Quality control. Verbal feedback is invisible to colleagues, so weak practice is hard to spot and good practice hard to share. Not a full replacement. Extended writing often needs reading in full, outside the lesson, to judge argument and structure. Go deeper EEF guidance report, recommendations 4 and 5 (sources above). Doug Lemov's 'Teach Like a Champion' techniques on active observation and \"show call\". See whole-class feedback for the after-the-lesson equivalent."},{"slug":"mark-finnis","title":"Mark Finnis","category":"thinkers","type":"person","summary":"Director of L30 Relational Systems and author of 'Independent Thinking on Restorative Practice' (2021). A leading UK trainer in restorative and relational practice: high challenge with high support, working 'with' pupils not doing 'to' them.","status":"Thinker profile","evidence":"","tags":["restorative practice","relational practice","behaviour","school culture","circles","relationships"],"checked":"2026-11-12","sources":[{"title":"Mark Finnis (author page)","publisher":"Crown House Publishing","year":"Not verified","url":"https://www.crownhouse.co.uk/mark-finnis"},{"title":"Independent Thinking on Restorative Practice (look-inside extract)","publisher":"Crown House Publishing / Independent Thinking Press","year":"2021","url":"https://www.crownhouse.co.uk/assets/look-inside/9781781353387.pdf"},{"title":"Behaviour management in schools: ask the expert, what is restorative practice?","publisher":"Tes","year":"Not verified","url":"https://www.tes.com/magazine/teaching-learning/general/behaviour-management-schools-ask-expert-what-restorative-practice"},{"title":"Epilogue: Restorative Justice in Everyday Life (McCold and Wachtel, social discipline window)","publisher":"International Institute for Restorative Practices","year":"Not verified","url":"https://www.iirp.edu/images/pdf/Epilogue-RJC.pdf"},{"title":"Relational responsibility, social discipline and behaviour in school (research paper)","publisher":"University of Central Lancashire repository","year":"Not verified","url":"https://clok.uclan.ac.uk/49171/1/Relational%20responsibility%20%20social%20discipline%20and%20behaviour%20in%20school%20%20re-orienting%20discipline%20and%20authority%20through%20a%20distributed%20network%20of%20relationa.pdf"}],"related":["preventing-bullying","paul-dix","tom-bennett","bill-rogers"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Finnis presents restorative practice as a \u003cstrong>way of being\u003c/strong>, not a behaviour technique: most of it is proactive relationship-building, with repair after harm as the smaller part.\u003c/li>\n\u003cli>His organising model is the \u003cstrong>social discipline window\u003c/strong>: high challenge plus high support means working \u003cstrong>with\u003c/strong> people, as opposed to doing things \u003cstrong>to\u003c/strong> them, \u003cstrong>for\u003c/strong> them or \u003cstrong>not\u003c/strong> at all.\u003c/li>\n\u003cli>Core tools: affective statements, restorative questions, circles, and &#39;fair process&#39; when making decisions.\u003c/li>\n\u003cli>Restorative does not mean no consequences. It means consequences that involve the pupil in understanding and repairing the harm.\u003c/li>\n\u003cli>Evidence is promising but mixed, and implementation is demanding. Poorly resourced versions are the main reason restorative approaches fail in secondary schools.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Mark Finnis is a UK trainer and consultant and the director of \u003cstrong>L30 Relational Systems\u003c/strong>. His publisher describes him as an Independent Thinking Associate and one of the UK&#39;s leading exponents of restorative practice. He has worked for many years with schools, local authorities, children&#39;s social care and other public services, including work connected with Hull&#39;s programme to become a &#39;restorative city&#39; (details not verified against a primary source). His work draws on the restorative practices tradition developed by Ted Wachtel and colleagues at the International Institute for Restorative Practices (IIRP), and he is closely aligned with Paul Dix&#39;s relational approach.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Relationships first.\u003c/strong> Finnis argues that schools run on relationships and that these should be built by design, not left to chance. A recurring image is the relational &#39;bank account&#39;: every small positive interaction is a deposit, and you can only make a withdrawal (a challenge, a correction) from an account that is in credit. His slogan is to connect before you correct, and to put connection before content.\u003c/p>\n\u003cp>\u003cstrong>Mostly proactive.\u003c/strong> He suggests that around 80 per cent of restorative practice is proactive (building community, teaching social skills, creating belonging) and 20 per cent responsive (dealing with conflict and harm). Schools that adopt only the responsive part, the &#39;restorative conversation&#39; after an incident, have misunderstood the approach.\u003c/p>\n\u003cp>\u003cstrong>The social discipline window.\u003c/strong> Adapted from McCold and Wachtel. Two axes, challenge (limits, expectations, boundaries) and support (encouragement, nurture), give four ways of exercising authority:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Low support\u003c/th>\n\u003cth>High support\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>High challenge\u003c/strong>\u003c/td>\n\u003ctd>TO: punitive, authoritarian\u003c/td>\n\u003ctd>WITH: restorative, authoritative\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Low challenge\u003c/strong>\u003c/td>\n\u003ctd>NOT: neglectful\u003c/td>\n\u003ctd>FOR: permissive, rescuing\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Finnis&#39;s point is that restorative practice is the high-challenge, high-support quadrant. It is not the soft option; permissiveness is a different box.\u003c/p>\n\u003cp>\u003cstrong>A continuum of practice.\u003c/strong> From informal to formal: affective statements; affective or restorative questions; small impromptu conversations; circles; formal restorative conferences. The informal end is used many times a day by every adult; formal conferences are rare and need a trained facilitator.\u003c/p>\n\u003cp>\u003cstrong>Affective language.\u003c/strong> Adults say how behaviour affects them and others, separating the deed from the doer: &#39;I was frustrated when the talking carried on, because others couldn&#39;t hear.&#39; Praise is equally specific.\u003c/p>\n\u003cp>\u003cstrong>Restorative questions.\u003c/strong> A consistent sequence used with everyone involved: What happened? What were you thinking and feeling at the time? Who has been affected, and how? What is needed to put things right? What will we do differently next time? Finnis advises against &#39;why did you do it?&#39;, which invites defensiveness.\u003c/p>\n\u003cp>\u003cstrong>Circles.\u003c/strong> Pupils and adult sit in a circle; a talking piece passes round; everyone may speak or pass. Used for check-in and check-out in tutor time, for building community, for discussing learning and, when needed, for solving problems.\u003c/p>\n\u003cp>\u003cstrong>Fair process.\u003c/strong> Drawing on Kim and Mauborgne&#39;s work, people accept decisions, even unwelcome ones, when they have been \u003cstrong>engaged\u003c/strong>, given an \u003cstrong>explanation\u003c/strong> and are \u003cstrong>clear about expectations\u003c/strong>. Finnis applies this to staff as well as pupils: culture change imposed on staff is a &#39;to&#39;, not a &#39;with&#39;.\u003c/p>\n\u003cp>\u003cstrong>Culture by design.\u003c/strong> Every school has a culture; the question is whether it is deliberate. He stresses that the small daily habits (greetings, names, tone, how adults speak about pupils) are the culture.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>Independent Thinking on Restorative Practice: Building relationships, improving behaviour and creating stronger communities\u003c/em> (Independent Thinking Press, 2021).\u003c/li>\n\u003cli>Training materials and talks through L30 Relational Systems.\u003c/li>\n\u003cli>Not verified: other book-length publications.\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>\u003cstrong>Teachers and tutors\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Greet every pupil by name at the door. Finnis&#39;s test: are pupils noticed when they are there and missed when they are not?\u003c/li>\n\u003cli>Run a two-minute check-in circle in tutor time once or twice a week: one low-risk prompt (&#39;One thing you&#39;re looking forward to this week&#39;), talking piece, right to pass.\u003c/li>\n\u003cli>Use affective statements for both praise and correction in place of generic labels.\u003c/li>\n\u003cli>After an incident, once everyone is calm, use two or three restorative questions. Agree one concrete action. Check back a few days later.\u003c/li>\n\u003cli>Keep the challenge high: restate the expectation plainly and hold the pupil to the agreed action.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Decide what is non-negotiable (the challenge) and what support exists, and communicate both. Restorative practice sits alongside clear rules; DfE guidance still expects a behaviour policy with sanctions.\u003c/li>\n\u003cli>Train all staff, including support staff, in the language and questions; train a smaller group to facilitate formal conferences.\u003c/li>\n\u003cli>Timetable the capacity: who covers a class so a restorative conversation can happen the same day?\u003c/li>\n\u003cli>Use circles and fair process in staff meetings and line management. Staff who are done &#39;to&#39; will not work &#39;with&#39; pupils.\u003c/li>\n\u003cli>Give it time. Advocates describe whole-school implementation as a multi-year culture change, not a policy rewrite.\u003c/li>\n\u003cli>Monitor: suspensions, removals, repeat incidents, pupil and staff voice. Be honest if low-level disruption rises.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Evidence.\u003c/strong> The EEF&#39;s \u003cem>Improving Behaviour in Schools\u003c/em> guidance describes the evidence for restorative approaches as limited. The largest English trial of a whole-school programme including restorative practice (the &#39;Learning Together&#39; study, Bonell and colleagues, 2018) reported reduced bullying; a US randomised study in Pittsburgh (RAND, 2018) found fewer suspensions and better teacher-rated climate but no academic gain and worse attainment in middle-school grades. Neither study was opened for this entry; treat these summaries as indicative.\u003c/li>\n\u003cli>\u003cstrong>Consequence-led critics.\u003c/strong> Tom Bennett and others argue that restorative conversations, used in place of sanctions, can leave victims and teachers unsupported, be gamed by pupils, and consume staff time. They accept restorative conversations as a supplement to consequences, not a replacement.\u003c/li>\n\u003cli>\u003cstrong>Implementation risk.\u003c/strong> Researchers and practitioners agree that partial adoption is common: a script of questions bolted on to an unchanged system, or sanctions removed with nothing built in their place. Finnis makes the same criticism.\u003c/li>\n\u003cli>\u003cstrong>Pressure on those harmed.\u003c/strong> Critics caution that pupils (and staff) who have been harmed may feel obliged to take part in a meeting with the person responsible. Good practice makes participation voluntary and never uses conferences for bullying or abuse without specialist judgement and safeguarding advice.\u003c/li>\n\u003cli>\u003cstrong>Time and workload.\u003c/strong> Done properly it is labour-intensive. Schools need to weigh that against the time currently spent on repeat sanctions.\u003c/li>\n\u003cli>\u003cstrong>Common ground.\u003c/strong> Both sides endorse calm adults, explicit expectations and strong relationships; the dispute is about what should happen after rules are broken, and in what proportion.\u003c/li>\n\u003c/ul>\n","text":"At a glance Finnis presents restorative practice as a way of being , not a behaviour technique: most of it is proactive relationship-building, with repair after harm as the smaller part. His organising model is the social discipline window : high challenge plus high support means working with people, as opposed to doing things to them, for them or not at all. Core tools: affective statements, restorative questions, circles, and 'fair process' when making decisions. Restorative does not mean no consequences. It means consequences that involve the pupil in understanding and repairing the harm. Evidence is promising but mixed, and implementation is demanding. Poorly resourced versions are the main reason restorative approaches fail in secondary schools. Who they are Mark Finnis is a UK trainer and consultant and the director of L30 Relational Systems . His publisher describes him as an Independent Thinking Associate and one of the UK's leading exponents of restorative practice. He has worked for many years with schools, local authorities, children's social care and other public services, including work connected with Hull's programme to become a 'restorative city' (details not verified against a primary source). His work draws on the restorative practices tradition developed by Ted Wachtel and colleagues at the International Institute for Restorative Practices (IIRP), and he is closely aligned with Paul Dix's relational approach. Core ideas Relationships first. Finnis argues that schools run on relationships and that these should be built by design, not left to chance. A recurring image is the relational 'bank account': every small positive interaction is a deposit, and you can only make a withdrawal (a challenge, a correction) from an account that is in credit. His slogan is to connect before you correct, and to put connection before content. Mostly proactive. He suggests that around 80 per cent of restorative practice is proactive (building community, teaching social skills, creating belonging) and 20 per cent responsive (dealing with conflict and harm). Schools that adopt only the responsive part, the 'restorative conversation' after an incident, have misunderstood the approach. The social discipline window. Adapted from McCold and Wachtel. Two axes, challenge (limits, expectations, boundaries) and support (encouragement, nurture), give four ways of exercising authority: Low support High support High challenge TO: punitive, authoritarian WITH: restorative, authoritative Low challenge NOT: neglectful FOR: permissive, rescuing Finnis's point is that restorative practice is the high-challenge, high-support quadrant. It is not the soft option; permissiveness is a different box. A continuum of practice. From informal to formal: affective statements; affective or restorative questions; small impromptu conversations; circles; formal restorative conferences. The informal end is used many times a day by every adult; formal conferences are rare and need a trained facilitator. Affective language. Adults say how behaviour affects them and others, separating the deed from the doer: 'I was frustrated when the talking carried on, because others couldn't hear.' Praise is equally specific. Restorative questions. A consistent sequence used with everyone involved: What happened? What were you thinking and feeling at the time? Who has been affected, and how? What is needed to put things right? What will we do differently next time? Finnis advises against 'why did you do it?', which invites defensiveness. Circles. Pupils and adult sit in a circle; a talking piece passes round; everyone may speak or pass. Used for check-in and check-out in tutor time, for building community, for discussing learning and, when needed, for solving problems. Fair process. Drawing on Kim and Mauborgne's work, people accept decisions, even unwelcome ones, when they have been engaged , given an explanation and are clear about expectations . Finnis applies this to staff as well as pupils: culture change imposed on staff is a 'to', not a 'with'. Culture by design. Every school has a culture; the question is whether it is deliberate. He stresses that the small daily habits (greetings, names, tone, how adults speak about pupils) are the culture. Key works Independent Thinking on Restorative Practice: Building relationships, improving behaviour and creating stronger communities (Independent Thinking Press, 2021). Training materials and talks through L30 Relational Systems. Not verified: other book-length publications. Putting it into practice Teachers and tutors Greet every pupil by name at the door. Finnis's test: are pupils noticed when they are there and missed when they are not? Run a two-minute check-in circle in tutor time once or twice a week: one low-risk prompt ('One thing you're looking forward to this week'), talking piece, right to pass. Use affective statements for both praise and correction in place of generic labels. After an incident, once everyone is calm, use two or three restorative questions. Agree one concrete action. Check back a few days later. Keep the challenge high: restate the expectation plainly and hold the pupil to the agreed action. Leaders Decide what is non-negotiable (the challenge) and what support exists, and communicate both. Restorative practice sits alongside clear rules; DfE guidance still expects a behaviour policy with sanctions. Train all staff, including support staff, in the language and questions; train a smaller group to facilitate formal conferences. Timetable the capacity: who covers a class so a restorative conversation can happen the same day? Use circles and fair process in staff meetings and line management. Staff who are done 'to' will not work 'with' pupils. Give it time. Advocates describe whole-school implementation as a multi-year culture change, not a policy rewrite. Monitor: suspensions, removals, repeat incidents, pupil and staff voice. Be honest if low-level disruption rises. Critiques and debate Evidence. The EEF's Improving Behaviour in Schools guidance describes the evidence for restorative approaches as limited. The largest English trial of a whole-school programme including restorative practice (the 'Learning Together' study, Bonell and colleagues, 2018) reported reduced bullying; a US randomised study in Pittsburgh (RAND, 2018) found fewer suspensions and better teacher-rated climate but no academic gain and worse attainment in middle-school grades. Neither study was opened for this entry; treat these summaries as indicative. Consequence-led critics. Tom Bennett and others argue that restorative conversations, used in place of sanctions, can leave victims and teachers unsupported, be gamed by pupils, and consume staff time. They accept restorative conversations as a supplement to consequences, not a replacement. Implementation risk. Researchers and practitioners agree that partial adoption is common: a script of questions bolted on to an unchanged system, or sanctions removed with nothing built in their place. Finnis makes the same criticism. Pressure on those harmed. Critics caution that pupils (and staff) who have been harmed may feel obliged to take part in a meeting with the person responsible. Good practice makes participation voluntary and never uses conferences for bullying or abuse without specialist judgement and safeguarding advice. Time and workload. Done properly it is labour-intensive. Schools need to weigh that against the time currently spent on repeat sanctions. Common ground. Both sides endorse calm adults, explicit expectations and strong relationships; the dispute is about what should happen after rules are broken, and in what proportion."},{"slug":"marking-policy-and-workload","title":"Marking policy and workload","category":"assessment","type":"topic","summary":"Written marking is costly in teacher time and thinly evidenced. The 2016 workload review said marking should be meaningful, manageable and motivating; many schools have since moved to feedback policies.","status":"Professional practice","evidence":"","tags":["marking","workload","feedback policy","triple marking","ofsted myths"],"checked":"2026-11-12","sources":[{"title":"Reducing teacher workload: Marking Policy Review Group report (Eliminating unnecessary workload around marking)","publisher":"Department for Education / Independent Teacher Workload Review Group","year":"2016","url":"https://www.gov.uk/government/publications/reducing-teacher-workload-marking-policy-review-group-report"},{"title":"A marked improvement? A review of the evidence on written marking (news summary)","publisher":"Education Endowment Foundation / University of Oxford","year":"2016","url":"https://educationendowmentfoundation.org.uk/news/little-evidence-to-show-which-types-of-marking-improve-pupil-progress"},{"title":"Effective marking practices","publisher":"University of Oxford Department of Education","year":"2016","url":"https://www.education.ox.ac.uk/effective-marking-practices"},{"title":"Teacher Feedback to Improve Pupil Learning (guidance report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/feedback"},{"title":"Ofsted's commitment to supporting reduced teacher workload","publisher":"DfE Teaching blog","year":"2016","url":"https://teaching.blog.gov.uk/2016/05/05/ofsteds-commitment-to-supporting-reduced-teacher-workload/"}],"related":["eef-teacher-feedback-guidance","whole-class-feedback","live-marking-and-verbal-feedback","summative-assessment-and-data-collection","self-and-peer-assessment"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>There is no statutory requirement, and no Ofsted requirement, for any particular frequency, type or volume of marking. Marking policy is a school decision.\u003c/li>\n\u003cli>The DfE&#39;s Independent Teacher Workload Review Group (March 2016) said all marking should be &quot;meaningful, manageable and motivating&quot; and criticised &quot;deep&quot; marking done for accountability rather than for pupils.\u003c/li>\n\u003cli>The EEF/Oxford review &#39;A Marked Improvement?&#39; (April 2016) found a striking lack of robust evidence on written marking, and concluded schools should mark less but mark better.\u003c/li>\n\u003cli>Triple-impact marking, dialogic marking in multiple pen colours and &quot;verbal feedback given&quot; stamps have no good evidence behind them and a high time cost.\u003c/li>\n\u003cli>A sound policy describes principles of feedback and trusts departments on method; it does not set a marking timetable.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>The workload review (2016).\u003c/strong> The group, chaired by Dawn Copping, found that marking had become disproportionate in many schools, driven by a false belief that quantity of written comment equals quality, and by perceived inspection expectations. It defined the three tests: marking should be \u003cem>meaningful\u003c/em> (it advances pupil progress and varies by age, subject and task), \u003cem>manageable\u003c/em> (proportionate to the teacher&#39;s overall workload) and \u003cem>motivating\u003c/em> (it helps pupils progress without the teacher doing more work than the pupil). It rejected extensive written dialogue and the practice of writing detailed comments mainly as evidence for observers.\u003c/p>\n\u003cp>\u003cstrong>&#39;A Marked Improvement?&#39; (2016).\u003c/strong> Elliott and colleagues at Oxford, for the EEF, found few large, robust studies of written marking. Their tentative findings:\u003c/p>\n\u003cul>\n\u003cli>Careless slips are best simply flagged as wrong for the pupil to correct; errors from misunderstanding need a hint, question or reteaching.\u003c/li>\n\u003cli>Awarding a grade on every piece may reduce the impact of comments, because pupils attend to the grade.\u003c/li>\n\u003cli>&quot;Acknowledgement&quot; marking (ticks to show work was seen) is unlikely to improve progress.\u003c/li>\n\u003cli>Specific, actionable targets are more useful than general ones, and pupils need set-aside time to respond.\u003c/li>\n\u003cli>There was no evidence either way on triple-impact or dialogic marking; the review called for trials to test whether the time is justified.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>EEF guidance report (2021).\u003c/strong> Written feedback can work when it follows the principles of good feedback, but its time cost should be weighed against alternatives such as verbal and whole-class feedback.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Sort errors before responding.\u003c/strong> In a set of Year 8 French paragraphs, a dot in the margin signals a slip the pupil can fix (missing accent, agreement); a recurring misunderstanding (perfect tense with \u003cem>être\u003c/em>) gets five minutes of reteaching to everyone.\u003c/li>\n\u003cli>\u003cstrong>Use marking codes\u003c/strong> agreed in the department (for example Sp, P, &quot;?&quot; for unclear, &quot;Ev&quot; for missing evidence) rather than sentences. Pupils do the correcting.\u003c/li>\n\u003cli>\u003cstrong>Mark selectively.\u003c/strong> In English, give detailed written comment on one paragraph of an essay, or on the planned assessment piece each half-term, rather than light-touch comments on every page.\u003c/li>\n\u003cli>\u003cstrong>Comment-only on drafts; grade the final piece.\u003c/strong> Hold back the mark until pupils have responded.\u003c/li>\n\u003cli>\u003cstrong>Make the pupil work harder than you.\u003c/strong> A feedback task (redraft the conclusion, redo questions 4–6 with the corrected method) should take the pupil longer than the comment took to write.\u003c/li>\n\u003cli>\u003cstrong>Self-marking of practice work.\u003c/strong> Maths and science classwork with right/wrong answers can be marked by pupils against a visualiser model, with the teacher circulating to spot patterns.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Audit the hours. Ask staff how long marking takes per week per class; the opportunity cost is planning and curriculum work.\u003c/li>\n\u003cli>Replace a marking policy with a feedback policy built on principles; let each department write a one-page statement of how feedback works in its subject and at which points extended work receives individual comment.\u003c/li>\n\u003cli>Stop book scrutiny that checks compliance (frequency, pen colour, dated stamps). Look instead at whether pupils&#39; later work shows improvement and whether pupils can explain what they are working on.\u003c/li>\n\u003cli>Be explicit to staff, governors and parents that written comments are not being produced as evidence for inspection. Tell parents what feedback their child will receive instead, or less visible marking will be read as neglect.\u003c/li>\n\u003cli>Marking is contractual work only within directed and reasonable additional hours; unions including NASUWT publish guidance drawing on the 2016 report.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Triple-impact marking\u003c/strong> (teacher comments, pupil responds, teacher comments again) spread widely around 2012–2015, partly because written dialogue was visible to inspectors. The workload review treated it as an unhelpful fad; the EEF/Oxford review found no evidence base. The critique is about cost and compliance, not about pupils responding to feedback, which is sensible.\u003c/li>\n\u003cli>Cutting marking is not the same as improving feedback. A &quot;no written marking&quot; rule can be as dogmatic as the policy it replaces; essays, NEA drafts (within exam board rules) and A-level work may warrant individual written comment.\u003c/li>\n\u003cli>The evidence base is thin in both directions: there is little proof that heavy marking works, and little direct trial evidence on the alternatives.\u003c/li>\n\u003cli>Ofsted&#39;s published clarifications from 2016 onwards stated that it does not expect any specific frequency, type or volume of marking. Not verified: the exact wording on marking in the inspection toolkit and operating guides in force since November 2025 was not checked for this entry; nothing found suggests the position has changed.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The 2016 marking report is short and worth sharing with governors (sources above).\u003c/li>\n\u003cli>The DfE workload reduction toolkit includes policy-review materials for feedback and marking. Not verified: its current GOV.UK location.\u003c/li>\n\u003cli>See the whole-class feedback and live marking entries for the main alternatives.\u003c/li>\n\u003c/ul>\n","text":"At a glance There is no statutory requirement, and no Ofsted requirement, for any particular frequency, type or volume of marking. Marking policy is a school decision. The DfE's Independent Teacher Workload Review Group (March 2016) said all marking should be \"meaningful, manageable and motivating\" and criticised \"deep\" marking done for accountability rather than for pupils. The EEF/Oxford review 'A Marked Improvement?' (April 2016) found a striking lack of robust evidence on written marking, and concluded schools should mark less but mark better. Triple-impact marking, dialogic marking in multiple pen colours and \"verbal feedback given\" stamps have no good evidence behind them and a high time cost. A sound policy describes principles of feedback and trusts departments on method; it does not set a marking timetable. What the evidence says The workload review (2016). The group, chaired by Dawn Copping, found that marking had become disproportionate in many schools, driven by a false belief that quantity of written comment equals quality, and by perceived inspection expectations. It defined the three tests: marking should be meaningful (it advances pupil progress and varies by age, subject and task), manageable (proportionate to the teacher's overall workload) and motivating (it helps pupils progress without the teacher doing more work than the pupil). It rejected extensive written dialogue and the practice of writing detailed comments mainly as evidence for observers. 'A Marked Improvement?' (2016). Elliott and colleagues at Oxford, for the EEF, found few large, robust studies of written marking. Their tentative findings: Careless slips are best simply flagged as wrong for the pupil to correct; errors from misunderstanding need a hint, question or reteaching. Awarding a grade on every piece may reduce the impact of comments, because pupils attend to the grade. \"Acknowledgement\" marking (ticks to show work was seen) is unlikely to improve progress. Specific, actionable targets are more useful than general ones, and pupils need set-aside time to respond. There was no evidence either way on triple-impact or dialogic marking; the review called for trials to test whether the time is justified. EEF guidance report (2021). Written feedback can work when it follows the principles of good feedback, but its time cost should be weighed against alternatives such as verbal and whole-class feedback. In the classroom Sort errors before responding. In a set of Year 8 French paragraphs, a dot in the margin signals a slip the pupil can fix (missing accent, agreement); a recurring misunderstanding (perfect tense with être ) gets five minutes of reteaching to everyone. Use marking codes agreed in the department (for example Sp, P, \"?\" for unclear, \"Ev\" for missing evidence) rather than sentences. Pupils do the correcting. Mark selectively. In English, give detailed written comment on one paragraph of an essay, or on the planned assessment piece each half-term, rather than light-touch comments on every page. Comment-only on drafts; grade the final piece. Hold back the mark until pupils have responded. Make the pupil work harder than you. A feedback task (redraft the conclusion, redo questions 4–6 with the corrected method) should take the pupil longer than the comment took to write. Self-marking of practice work. Maths and science classwork with right/wrong answers can be marked by pupils against a visualiser model, with the teacher circulating to spot patterns. For leaders Audit the hours. Ask staff how long marking takes per week per class; the opportunity cost is planning and curriculum work. Replace a marking policy with a feedback policy built on principles; let each department write a one-page statement of how feedback works in its subject and at which points extended work receives individual comment. Stop book scrutiny that checks compliance (frequency, pen colour, dated stamps). Look instead at whether pupils' later work shows improvement and whether pupils can explain what they are working on. Be explicit to staff, governors and parents that written comments are not being produced as evidence for inspection. Tell parents what feedback their child will receive instead, or less visible marking will be read as neglect. Marking is contractual work only within directed and reasonable additional hours; unions including NASUWT publish guidance drawing on the 2016 report. Cautions and critiques Triple-impact marking (teacher comments, pupil responds, teacher comments again) spread widely around 2012–2015, partly because written dialogue was visible to inspectors. The workload review treated it as an unhelpful fad; the EEF/Oxford review found no evidence base. The critique is about cost and compliance, not about pupils responding to feedback, which is sensible. Cutting marking is not the same as improving feedback. A \"no written marking\" rule can be as dogmatic as the policy it replaces; essays, NEA drafts (within exam board rules) and A-level work may warrant individual written comment. The evidence base is thin in both directions: there is little proof that heavy marking works, and little direct trial evidence on the alternatives. Ofsted's published clarifications from 2016 onwards stated that it does not expect any specific frequency, type or volume of marking. Not verified: the exact wording on marking in the inspection toolkit and operating guides in force since November 2025 was not checked for this entry; nothing found suggests the position has changed. Go deeper The 2016 marking report is short and worth sharing with governors (sources above). The DfE workload reduction toolkit includes policy-review materials for feedback and marking. Not verified: its current GOV.UK location. See the whole-class feedback and live marking entries for the main alternatives."},{"slug":"mary-myatt","title":"Mary Myatt","category":"thinkers","type":"person","summary":"Education adviser, writer and founder of Myatt & Co. Known for 'high challenge, low threat', for arguing that curriculum should be coherent, concept-led and story-rich, and for the 'Huh' curriculum conversations with John Tomsett.","status":"Thinker profile","evidence":"","tags":["curriculum","coherence","challenge","leadership","subject leadership","concepts"],"checked":"2026-11-12","sources":[{"title":"Mary Myatt: Books","publisher":"Mary Myatt (author website)","year":"Not verified","url":"https://marymyatt.squarespace.com/books"},{"title":"Mary Myatt: About","publisher":"Mary Myatt (author website)","year":"Not verified","url":"https://marymyatt.squarespace.com/about"},{"title":"The Curriculum: Gallimaufry to Coherence (review by Melanie Hooson)","publisher":"Schools Week","year":"2018","url":"https://schoolsweek.co.uk/the-curriculum-gallimaufry-to-coherence"},{"title":"Why schools need a coherent curriculum","publisher":"Schools Week","year":"2018","url":"https://schoolsweek.co.uk/why-schools-need-a-coherent-curriculum"},{"title":"The Curriculum: Gallimaufry to coherence (publisher page)","publisher":"John Catt / Hachette Learning","year":"2018","url":"https://thefuturebookshelf.co.uk/titles/mary-myatt/the-curriculum-gallimaufry-to-coherence/9781911382836"}],"related":["christine-counsell","tom-sherrington"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Myatt&#39;s leadership maxim is \u003cstrong>high challenge, low threat\u003c/strong>: people do their best work when the demand is high and the fear is low.\u003c/li>\n\u003cli>On curriculum, her test is \u003cstrong>coherence\u003c/strong>: does this unit connect to what came before and after, and to the big ideas of the subject, or is it a &#39;gallimaufry&#39; (a jumble) of activities?\u003c/li>\n\u003cli>She argues for \u003cstrong>concepts\u003c/strong> as the organising structure, \u003cstrong>stories and rich texts\u003c/strong> as the vehicle, and \u003cstrong>fewer things in greater depth\u003c/strong>.\u003c/li>\n\u003cli>She is critical of busywork: worksheets, gap-fills and over-scaffolded tasks that produce completed pages without thinking.\u003c/li>\n\u003cli>The \u003cstrong>Huh\u003c/strong> books (with John Tomsett) model how senior leaders should talk with subject leaders about curriculum.\u003c/li>\n\u003cli>Her work is practical and humane in tone, synthesising research for busy teachers; it is not original research and should be read alongside subject-specific sources.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Mary Myatt is an education adviser, writer and speaker. She has taught in secondary schools (her background is in religious education), worked as a local authority adviser and inspected schools. She now writes, speaks and curates \u003cstrong>Myatt &amp; Co\u003c/strong>, an online platform of short professional development films and subject networks for primary and secondary teachers. She was closely involved in the curriculum conversation that surrounded Ofsted&#39;s 2019 framework, and her books are among the most widely read by curriculum and subject leaders in England.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>High challenge, low threat.\u003c/strong> In her 2016 leadership book Myatt argues that humans are a &#39;challenge-seeking species&#39; but only when the stakes for getting it wrong are low. Leaders should therefore set demanding work and have candid conversations, while removing unnecessary threat: no graded lesson observations, feedback as conversation not judgement, and an assumption of good intent. Her shorthand is that staff are humans first and professionals second. The same principle applies to pupils: hard material, safe classroom.\u003c/p>\n\u003cp>\u003cstrong>From gallimaufry to coherence.\u003c/strong> A curriculum is coherent when pupils can see how new material connects to what they already know and to the subject&#39;s big ideas. Myatt asks planners to check each unit for its place in the larger story of the subject, and to decide deliberately what to leave out. A Schools Week review summarised her position as planning being as much about what not to teach as what to include.\u003c/p>\n\u003cp>\u003cstrong>Concepts as &#39;holding baskets&#39;.\u003c/strong> Facts are easier to learn and retain when attached to concepts (for example &#39;empire&#39;, &#39;adaptation&#39;, &#39;tragedy&#39;, &#39;proportion&#39;). Concepts recur across units and years, so identifying and revisiting them is what turns a list of topics into a curriculum. Teaching the vocabulary and etymology of key terms is a routine she recommends for every subject.\u003c/p>\n\u003cp>\u003cstrong>Curriculum as narrative.\u003c/strong> Drawing on cognitive psychology (notably Daniel Willingham&#39;s argument that stories are easier to remember than other material), Myatt argues that units should have narrative shape and that pupils should meet \u003cstrong>high-quality texts and stories\u003c/strong> in every subject, including full texts, primary sources and demanding non-fiction, not only extracts and slides.\u003c/p>\n\u003cp>\u003cstrong>Challenge for all.\u003c/strong> She is sceptical of differentiating by giving some pupils easier tasks. The better route is the same ambitious content with scaffolding, talk and support for those who need it, and with the scaffolds removed over time. She warns against confusing task completion with learning: neat, finished worksheets are a poor proxy.\u003c/p>\n\u003cp>\u003cstrong>Fewer things, greater depth.\u003c/strong> \u003cem>Back on Track\u003c/em> (2020) argues for stripping out low-value activity (excessive marking, data drops, generic lesson requirements) so that time goes to curriculum thinking and subject knowledge.\u003c/p>\n\u003cp>\u003cstrong>Curriculum conversations.\u003c/strong> The \u003cstrong>Huh\u003c/strong> series (the title refers to an Egyptian deity associated with endlessness, signalling that curriculum work is never finished; this gloss comes from the authors and is not independently verified here) presents conversations between senior and subject leaders. The model: the line manager asks genuine questions about what is taught, why, in what order and how the subject leader knows it is working, and learns about the subject rather than checking compliance.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>Hopeful Schools\u003c/em> (2016).\u003c/li>\n\u003cli>\u003cem>High Challenge, Low Threat: How the Best Leaders Find the Balance\u003c/em> (John Catt, 2016).\u003c/li>\n\u003cli>\u003cem>The Curriculum: Gallimaufry to Coherence\u003c/em> (John Catt, 2018).\u003c/li>\n\u003cli>\u003cem>Back on Track: Fewer Things, Greater Depth\u003c/em> (John Catt, 2020).\u003c/li>\n\u003cli>\u003cem>Huh: Curriculum conversations between subject and senior leaders\u003c/em>, with John Tomsett (John Catt, 2021; year not verified against the publisher page).\u003c/li>\n\u003cli>\u003cem>Primary Huh\u003c/em>, \u003cem>SEND Huh\u003c/em> and \u003cem>AP Huh\u003c/em>, with John Tomsett (John Catt, 2022 onwards; individual years not verified).\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>\u003cstrong>Teachers and subject leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>For the next unit, write down the three or four concepts it is really about. Check where pupils met each before and where they will meet it again. If nowhere, the unit is an island.\u003c/li>\n\u003cli>Open with a story, a rich source or a demanding text. Read it aloud, with the class following, and teach the key vocabulary, including where the words come from.\u003c/li>\n\u003cli>Audit one week of tasks. Remove anything pupils can complete without thinking about the content (word searches, colouring, copying, gap-fills with a word bank that does the work).\u003c/li>\n\u003cli>Keep the destination the same for everyone. Plan scaffolds for pupils who need them and plan when you will take them away.\u003c/li>\n\u003cli>Ask pupils to produce fewer, better pieces of work, redrafted to a high standard.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Senior leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Run a Huh-style conversation with each subject lead. Useful questions, paraphrased from the approach: What are the big ideas in your subject? Why this content, in this order? Talk me through one unit: what should pupils know and be able to do by the end? What do pupils find hard? What are you reading, and which subject association are you in? What do you need from me?\u003c/li>\n\u003cli>Look at pupils&#39; work and talk to pupils with the subject lead, as shared enquiry, not inspection.\u003c/li>\n\u003cli>Protect time for subject teams to work on curriculum, and cut a low-value demand to pay for it.\u003c/li>\n\u003cli>Apply &#39;high challenge, low threat&#39; to feedback: say the difficult thing plainly, kindly and privately, and assume the colleague wants to improve.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Synthesis, not research.\u003c/strong> Myatt&#39;s books are short, accessible digests of other people&#39;s research and of her own experience. That is their value, but claims (for example about narrative and memory) should be traced to the underlying sources before being built into policy.\u003c/li>\n\u003cli>\u003cstrong>Breadth versus depth.\u003c/strong> The Schools Week reviewer of \u003cem>The Curriculum\u003c/em> praised it as timely and thought-provoking but doubted whether a few pages per subject would be enough for actual planning. Subject-specific guidance from subject associations and the Ofsted research reviews is needed alongside.\u003c/li>\n\u003cli>\u003cstrong>Generic principles and subject difference.\u003c/strong> Curriculum specialists such as Christine Counsell stress that &#39;coherence&#39;, &#39;concepts&#39; and &#39;narrative&#39; mean different things in different disciplines. Story works differently in history than in mathematics; treating it as a universal template risks distortion.\u003c/li>\n\u003cli>\u003cstrong>Low threat and accountability.\u003c/strong> Some leaders question whether removing graded observation and reducing monitoring is realistic in schools under pressure. Myatt&#39;s reply is that low threat is not low standards, and that fear produces compliance, not improvement.\u003c/li>\n\u003cli>\u003cstrong>Association with Ofsted&#39;s 2019 framework.\u003c/strong> Critics of the &#39;curriculum turn&#39;, including some unions and primary leaders, argued it generated workload and a new orthodoxy of curriculum paperwork. Myatt has herself warned against producing intent statements and documents for inspectors rather than for pupils.\u003c/li>\n\u003c/ul>\n","text":"At a glance Myatt's leadership maxim is high challenge, low threat : people do their best work when the demand is high and the fear is low. On curriculum, her test is coherence : does this unit connect to what came before and after, and to the big ideas of the subject, or is it a 'gallimaufry' (a jumble) of activities? She argues for concepts as the organising structure, stories and rich texts as the vehicle, and fewer things in greater depth . She is critical of busywork: worksheets, gap-fills and over-scaffolded tasks that produce completed pages without thinking. The Huh books (with John Tomsett) model how senior leaders should talk with subject leaders about curriculum. Her work is practical and humane in tone, synthesising research for busy teachers; it is not original research and should be read alongside subject-specific sources. Who they are Mary Myatt is an education adviser, writer and speaker. She has taught in secondary schools (her background is in religious education), worked as a local authority adviser and inspected schools. She now writes, speaks and curates Myatt & Co , an online platform of short professional development films and subject networks for primary and secondary teachers. She was closely involved in the curriculum conversation that surrounded Ofsted's 2019 framework, and her books are among the most widely read by curriculum and subject leaders in England. Core ideas High challenge, low threat. In her 2016 leadership book Myatt argues that humans are a 'challenge-seeking species' but only when the stakes for getting it wrong are low. Leaders should therefore set demanding work and have candid conversations, while removing unnecessary threat: no graded lesson observations, feedback as conversation not judgement, and an assumption of good intent. Her shorthand is that staff are humans first and professionals second. The same principle applies to pupils: hard material, safe classroom. From gallimaufry to coherence. A curriculum is coherent when pupils can see how new material connects to what they already know and to the subject's big ideas. Myatt asks planners to check each unit for its place in the larger story of the subject, and to decide deliberately what to leave out. A Schools Week review summarised her position as planning being as much about what not to teach as what to include. Concepts as 'holding baskets'. Facts are easier to learn and retain when attached to concepts (for example 'empire', 'adaptation', 'tragedy', 'proportion'). Concepts recur across units and years, so identifying and revisiting them is what turns a list of topics into a curriculum. Teaching the vocabulary and etymology of key terms is a routine she recommends for every subject. Curriculum as narrative. Drawing on cognitive psychology (notably Daniel Willingham's argument that stories are easier to remember than other material), Myatt argues that units should have narrative shape and that pupils should meet high-quality texts and stories in every subject, including full texts, primary sources and demanding non-fiction, not only extracts and slides. Challenge for all. She is sceptical of differentiating by giving some pupils easier tasks. The better route is the same ambitious content with scaffolding, talk and support for those who need it, and with the scaffolds removed over time. She warns against confusing task completion with learning: neat, finished worksheets are a poor proxy. Fewer things, greater depth. Back on Track (2020) argues for stripping out low-value activity (excessive marking, data drops, generic lesson requirements) so that time goes to curriculum thinking and subject knowledge. Curriculum conversations. The Huh series (the title refers to an Egyptian deity associated with endlessness, signalling that curriculum work is never finished; this gloss comes from the authors and is not independently verified here) presents conversations between senior and subject leaders. The model: the line manager asks genuine questions about what is taught, why, in what order and how the subject leader knows it is working, and learns about the subject rather than checking compliance. Key works Hopeful Schools (2016). High Challenge, Low Threat: How the Best Leaders Find the Balance (John Catt, 2016). The Curriculum: Gallimaufry to Coherence (John Catt, 2018). Back on Track: Fewer Things, Greater Depth (John Catt, 2020). Huh: Curriculum conversations between subject and senior leaders , with John Tomsett (John Catt, 2021; year not verified against the publisher page). Primary Huh , SEND Huh and AP Huh , with John Tomsett (John Catt, 2022 onwards; individual years not verified). Putting it into practice Teachers and subject leaders For the next unit, write down the three or four concepts it is really about. Check where pupils met each before and where they will meet it again. If nowhere, the unit is an island. Open with a story, a rich source or a demanding text. Read it aloud, with the class following, and teach the key vocabulary, including where the words come from. Audit one week of tasks. Remove anything pupils can complete without thinking about the content (word searches, colouring, copying, gap-fills with a word bank that does the work). Keep the destination the same for everyone. Plan scaffolds for pupils who need them and plan when you will take them away. Ask pupils to produce fewer, better pieces of work, redrafted to a high standard. Senior leaders Run a Huh-style conversation with each subject lead. Useful questions, paraphrased from the approach: What are the big ideas in your subject? Why this content, in this order? Talk me through one unit: what should pupils know and be able to do by the end? What do pupils find hard? What are you reading, and which subject association are you in? What do you need from me? Look at pupils' work and talk to pupils with the subject lead, as shared enquiry, not inspection. Protect time for subject teams to work on curriculum, and cut a low-value demand to pay for it. Apply 'high challenge, low threat' to feedback: say the difficult thing plainly, kindly and privately, and assume the colleague wants to improve. Critiques and debate Synthesis, not research. Myatt's books are short, accessible digests of other people's research and of her own experience. That is their value, but claims (for example about narrative and memory) should be traced to the underlying sources before being built into policy. Breadth versus depth. The Schools Week reviewer of The Curriculum praised it as timely and thought-provoking but doubted whether a few pages per subject would be enough for actual planning. Subject-specific guidance from subject associations and the Ofsted research reviews is needed alongside. Generic principles and subject difference. Curriculum specialists such as Christine Counsell stress that 'coherence', 'concepts' and 'narrative' mean different things in different disciplines. Story works differently in history than in mathematics; treating it as a universal template risks distortion. Low threat and accountability. Some leaders question whether removing graded observation and reducing monitoring is realistic in schools under pressure. Myatt's reply is that low threat is not low standards, and that fear produces compliance, not improvement. Association with Ofsted's 2019 framework. Critics of the 'curriculum turn', including some unions and primary leaders, argued it generated workload and a new orthodoxy of curriculum paperwork. Myatt has herself warned against producing intent statements and documents for inspectors rather than for pupils."},{"slug":"mobile-phones-in-schools","title":"Mobile phones in schools","category":"behaviour","type":"guidance","summary":"DfE guidance expecting a phone-free school day. First issued as advice in 2024, strengthened in January 2026 and statutory since 29 June 2026; schools are expected to follow it from 1 September 2026.","status":"Statutory guidance","evidence":"","tags":["mobile phones","statutory","behaviour policy","confiscation","online safety","reasonable adjustments"],"checked":"2026-11-12","sources":[{"title":"Mobile phones in schools","publisher":"Department for Education","year":"2026","url":"https://www.gov.uk/government/publications/mobile-phones-in-schools"},{"title":"Children's Wellbeing and Schools Act 2026, section 36","publisher":"legislation.gov.uk","year":"2026","url":"https://www.legislation.gov.uk/ukpga/2026/21/section/36/data.htm"},{"title":"Mobile phones in schools guidance to become statutory: what has changed?","publisher":"Wrigleys Solicitors","year":"2026","url":"https://www.wrigleys.co.uk/news/education/mobile-phones-in-schools-guidance-to-become-statutory--what-has-changed/"},{"title":"Mobile phones in schools (KCSIE 2026 series)","publisher":"Browne Jacobson","year":"2026","url":"https://www.brownejacobson.com/insights/kcsie-2026/mobile-phones-in-schools"},{"title":"School phone policies and their association with mental wellbeing, phone use, and social media use (SMART Schools)","publisher":"University of Birmingham / The Lancet Regional Health - Europe","year":"2025","url":"https://research.birmingham.ac.uk/en/publications/school-phone-policies-and-their-association-with-mental-wellbeing/"},{"title":"Schools phone guidance highlights reasonable adjustment duties","publisher":"Contact","year":"2026","url":"https://contact.org.uk/?p=42453"}],"related":["behaviour-in-schools-guidance","searching-screening-and-confiscation","online-safety-filtering-and-monitoring"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>The DfE expects every school to have a policy under which pupils \u003cstrong>do not have access to their phones during the school day\u003c/strong>: lessons, movement between lessons, break and lunch.\u003c/li>\n\u003cli>The guidance became \u003cstrong>statutory on 29 June 2026\u003c/strong> under the Children&#39;s Wellbeing and Schools Act 2026. Schools are expected to follow it from \u003cstrong>1 September 2026\u003c/strong>.\u003c/li>\n\u003cli>Statutory guidance means schools must \u003cstrong>have regard\u003c/strong> to it and need a good, recorded reason to depart from it. Ministers have described this as stopping short of an outright legislative ban, but &#39;phones out of sight in bags&#39; policies that tolerate use are no longer in line with the expectation.\u003c/li>\n\u003cli>Schools still choose \u003cstrong>how\u003c/strong>: no phones on site, hand-in on arrival, lockers, or locked pouches.\u003c/li>\n\u003cli>Exceptions for medical need, disability and certain individual circumstances (for example young carers) remain and are a legal matter under the Equality Act 2010.\u003c/li>\n\u003cli>Ofsted is reported to consider how well the policy is implemented and understood from the 2026 to 2027 year.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>History:\u003c/strong> non-statutory guidance first published 19 February 2024; substantially revised 19 January 2026, tightening the expectation to a fully phone-free day; made statutory on 29 June 2026 following Royal Assent to the Act on 29 April 2026.\u003c/li>\n\u003cli>\u003cstrong>Applies to:\u003c/strong> state-funded schools in England have the &#39;have regard&#39; duty. Not verified: whether and how the statutory duty extends to independent schools and to 16 to 19 academies; secondary summaries conflict. Check the guidance&#39;s scope section.\u003c/li>\n\u003cli>\u003cstrong>Sixth forms:\u003c/strong> not verified. Earlier versions allowed schools discretion over sixth-form pupils&#39; use while expecting them not to undermine the policy for younger pupils; confirm against the current text.\u003c/li>\n\u003cli>\u003cstrong>Other points reported from the 2026 version:\u003c/strong> boarding and residential schools should prohibit phones during the teaching day; &#39;bring your own device&#39; schemes should not rely on phones; staff should not use personal phones in front of pupils other than for work reasons.\u003c/li>\n\u003cli>GOV.UK could not be opened directly when this entry was written; the dates are taken from the GOV.UK page text returned in search results and from law firm commentary.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Have regard to the guidance\u003c/strong> when setting and applying the behaviour policy.\u003c/li>\n\u003cli>\u003cstrong>Set out the phone rules in the behaviour policy\u003c/strong> (or a linked policy), including sanctions and how confiscated phones are kept and returned, and publicise it to pupils, parents and staff.\u003c/li>\n\u003cli>\u003cstrong>Make reasonable adjustments\u003c/strong> for disabled pupils, for example a pupil who uses a phone app to monitor glucose, and support pupils with medical conditions (Children and Families Act 2014, s.100).\u003c/li>\n\u003cli>\u003cstrong>Confiscate lawfully.\u003c/strong> Confiscation is a permitted sanction if the policy says so; the law protects staff from liability for loss or damage where confiscation is lawful. Searches for phones must follow the searching guidance: a phone is only searchable without consent if the school rules list it as an item that may be searched for.\u003c/li>\n\u003cli>\u003cstrong>Treat safeguarding content correctly.\u003c/strong> Do not view or delete suspected indecent images; pass to the DSL.\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cp>Four models, with trade-offs seen in secondary schools:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Model\u003c/th>\n\u003cth>Works when\u003c/th>\n\u003cth>Watch for\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Not on premises\u003c/td>\n\u003ctd>Small sites, short journeys\u003c/td>\n\u003ctd>Parental worry about travel; little way to check\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hand in on arrival\u003c/td>\n\u003ctd>Smaller rolls, staffed reception\u003c/td>\n\u003ctd>Queues, liability, storage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lockers or locked pouches\u003c/td>\n\u003ctd>Larger schools with budget\u003c/td>\n\u003ctd>Cost, damaged pouches, decoy phones\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&#39;Never used, seen or heard&#39; (in bag, off)\u003c/td>\n\u003ctd>Strong existing culture\u003c/td>\n\u003ctd>Hardest to enforce; toilets and social times; may not meet the 2026 expectation if use persists\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Implementation steps:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Explain why\u003c/strong> to pupils and parents before launch: focus in lessons, fewer online conflicts spilling into school, more talk at lunch. Give the office number for urgent messages.\u003c/li>\n\u003cli>\u003cstrong>One script for all staff.\u003c/strong> &quot;Phone, please. You know the rule. It&#39;ll be at reception at 3.10.&quot; No debate, no first warnings that vary by teacher.\u003c/li>\n\u003cli>\u003cstrong>Fixed consequence ladder,\u003c/strong> for example: first time, confiscated to end of day; second, parent collects; third, hand in daily for two weeks. Keep it short and publish it.\u003c/li>\n\u003cli>\u003cstrong>Record\u003c/strong> each confiscation in the behaviour system so repeat patterns and hotspots show.\u003c/li>\n\u003cli>\u003cstrong>Log exceptions\u003c/strong> individually, with a named member of staff, and brief teachers discreetly.\u003c/li>\n\u003cli>\u003cstrong>Cover the gaps:\u003c/strong> toilets, the route out at the end of the day, smartwatches, earbuds, and second &#39;decoy&#39; handsets.\u003c/li>\n\u003cli>\u003cstrong>Replace what phones did:\u003c/strong> bus timetables, payment for lunch, homework apps, timetable access.\u003c/li>\n\u003c/ol>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Staff applying the rule differently; pupils quickly learn which lessons are safe.\u003c/li>\n\u003cli>Sanctions that keep a phone overnight without parental contact, raising safety concerns on the journey home.\u003c/li>\n\u003cli>Refusing individual adjustments on &#39;consistency&#39; grounds.\u003c/li>\n\u003cli>Overclaiming the evidence. The University of Birmingham SMART Schools study (2025) of 30 English secondaries found restrictive policies cut in-school phone use but found no difference in wellbeing, attainment or behaviour measures between restrictive and permissive schools; it was cross-sectional, so cannot show cause. Other studies, including earlier LSE work on attainment, point the other way. Honest messaging: a phone-free day is a behaviour and attention policy, not a mental health cure.\u003c/li>\n\u003cli>Forgetting staff modelling.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The GOV.UK page carries case studies and a parent-facing toolkit.\u003c/li>\n\u003cli>The Children&#39;s Commissioner surveyed schools&#39; phone policies in 2025 and found most secondaries already restricted use (figures not verified here).\u003c/li>\n\u003cli>See the online safety entry for what happens to phone-based harms outside the school day.\u003c/li>\n\u003c/ul>\n","text":"At a glance The DfE expects every school to have a policy under which pupils do not have access to their phones during the school day : lessons, movement between lessons, break and lunch. The guidance became statutory on 29 June 2026 under the Children's Wellbeing and Schools Act 2026. Schools are expected to follow it from 1 September 2026 . Statutory guidance means schools must have regard to it and need a good, recorded reason to depart from it. Ministers have described this as stopping short of an outright legislative ban, but 'phones out of sight in bags' policies that tolerate use are no longer in line with the expectation. Schools still choose how : no phones on site, hand-in on arrival, lockers, or locked pouches. Exceptions for medical need, disability and certain individual circumstances (for example young carers) remain and are a legal matter under the Equality Act 2010. Ofsted is reported to consider how well the policy is implemented and understood from the 2026 to 2027 year. Status and current version History: non-statutory guidance first published 19 February 2024; substantially revised 19 January 2026, tightening the expectation to a fully phone-free day; made statu
