 have less working memory to spare. Tension with desirable difficulties. The Bjorks' work shows that some difficulty during practice improves long-term retention. The usual reconciliation is: reduce load when first acquiring complex material, add difficulty when practising it. Productive failure. Kapur's studies suggest attempting problems before instruction can help conceptual understanding in some cases, which challenges a strict 'examples first' rule. Overreach. Didau argues teachers need the core idea (novices should not be left to problem-solve unfamiliar, complex content) rather than the full technical apparatus. Go deeper The CESE review and its companion practice guide are free and written for teachers. Sweller, van Merriënboer and Paas, 'Cognitive architecture and instructional design: 20 years later' (2019), gives the theory's current form. See the entries on John Sweller, modelling and worked examples, dual coding and desirable difficulties."},{"slug":"daniel-willingham","title":"Daniel Willingham","category":"thinkers","type":"person","summary":"Cognitive psychologist at the University of Virginia and author of 'Why Don't Students Like School?'. Best known for 'memory is the residue of thought' and for debunking learning styles.","status":"Thinker profile","evidence":"","tags":["cognitive science","memory","background knowledge","learning styles","critical thinking","reading"],"checked":"2026-11-12","sources":[{"title":"Why Don't Students Like School? (second edition) product page","publisher":"Blackwell's (Jossey-Bass/Wiley edition)","year":"2021","url":"https://blackwells.co.uk/bookshop/product/Why-Dont-Students-Like-School-by-Daniel-T-Willingham/9781119715801"},{"title":"All teachers should read 'Why Don't Students Like School?'","publisher":"Tes","year":"Not verified","url":"https://www.tes.com/news/all-teachers-should-read-why-students-dont-school"},{"title":"Why Don't Students Like School? (second edition) review","publisher":"Learning and the Brain","year":"2021","url":"https://www.learningandthebrain.com/blog/?p=6172"},{"title":"Why Don't Students Like School? Second edition (ERIC record ED612976)","publisher":"ERIC / Jossey-Bass","year":"2021","url":"https://searchworks.jioinstitute.edu.in/articles/eric__ED612976"}],"related":["retrieval-practice","cognitive-load-theory","john-sweller"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Willingham explains findings from cognitive psychology in terms teachers can use, and is careful about what the science does and does not justify.\u003c/li>\n\u003cli>&#39;Memory is the residue of thought&#39;: pupils remember what they think about, so plan lessons around what pupils will be thinking, not what they will be doing.\u003c/li>\n\u003cli>Thinking well depends on knowing things. Critical thinking and comprehension cannot be taught separately from subject knowledge.\u003c/li>\n\u003cli>Pupils are more alike than different in how they learn. There is no good evidence for teaching to learning styles.\u003c/li>\n\u003cli>Proficiency needs extended, spaced practice, and novices do not learn best by imitating what experts do.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Daniel T. Willingham is professor of psychology at the University of Virginia, where he has taught since 1992. He trained as a cognitive psychologist (PhD, Harvard) and researched the brain basis of learning and memory before turning, from around 2000, to the application of cognitive psychology to schooling. He has written the &#39;Ask the Cognitive Scientist&#39; column for the American Federation of Teachers&#39; magazine \u003cem>American Educator\u003c/em> since 2002; many of his best-known articles for teachers appeared there. His work was taken up in England in the 2010s by the knowledge-rich curriculum movement and was publicly cited by ministers including Nick Gibb.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cem>Why Don&#39;t Students Like School?\u003c/em> (2009; second edition 2021) is organised as a set of questions, each answered by a cognitive principle. In summary:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>People are curious but not naturally good at thinking.\u003c/strong> Thinking is slow and effortful, and the mind tries to avoid it by relying on memory. Pupils enjoy solving problems of the right difficulty: too easy or too hard and they disengage. This is his answer to the title question.\u003c/li>\n\u003cli>\u003cstrong>Factual knowledge precedes skill.\u003c/strong> Analysis, comprehension and problem-solving draw on knowledge in long-term memory. Background knowledge lets readers fill gaps in a text and lets thinkers &#39;chunk&#39; information, freeing working memory. The more you know, the easier it is to learn more.\u003c/li>\n\u003cli>\u003cstrong>Memory is the residue of thought.\u003c/strong> What is stored is what the learner attended to and thought about. If pupils make a poster about the water cycle and spend the lesson thinking about lettering, they will remember lettering. He recommends reviewing every lesson plan for what pupils will actually think about, and notes the power of story structure (causality, conflict, complications, character) to make material memorable.\u003c/li>\n\u003cli>\u003cstrong>We understand new things in terms of what we already know.\u003c/strong> Abstract ideas are grasped through concrete examples and analogies. Understanding stays shallow at first and transfers poorly, so pupils need many examples and explicit comparison of their deep structure.\u003c/li>\n\u003cli>\u003cstrong>Proficiency requires practice.\u003c/strong> Practice makes basic processes automatic, protects against forgetting and aids transfer. It should be spread out over time.\u003c/li>\n\u003cli>\u003cstrong>Novices do not think like experts.\u003c/strong> Experts see deep structure and have vast, organised knowledge. Asking pupils to &#39;think like a historian&#39; or &#39;be a scientist&#39; before they have that knowledge mistakes the goal for the method. Pupils can comprehend expert knowledge well before they can create it.\u003c/li>\n\u003cli>\u003cstrong>Children are more alike than different in how they learn.\u003c/strong> Learners differ in ability and interest, but the theory that matching teaching to visual, auditory or kinaesthetic styles improves learning has not been supported. Choose the modality that suits the \u003cem>content\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Intelligence can be changed through sustained hard work.\u003c/strong> He supports praising effort and process, treating failure as a normal part of learning, and being honest that catching up means working harder. The second edition is more cautious about the strength of growth mindset intervention evidence.\u003c/li>\n\u003cli>\u003cstrong>Technology.\u003c/strong> A chapter new to the second edition argues that technology changes less about cognition than is claimed, that effects of specific tools are hard to predict, and that schools should evaluate products against a clear purpose.\u003c/li>\n\u003cli>\u003cstrong>Teaching is a cognitive skill that improves with deliberate practice.\u003c/strong> Experience alone is not enough; teachers need feedback, including observation and video, and to work on one thing at a time.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Other themes.\u003c/strong> In &#39;Critical thinking: why is it so hard to teach?&#39; (2007) he argues that critical thinking is not a general skill but depends on domain knowledge and practice. \u003cem>The Reading Mind\u003c/em> (2017) sets out the cognitive processes in reading, from decoding to comprehension, and stresses knowledge and vocabulary. \u003cem>When Can You Trust the Experts?\u003c/em> (2012) gives educators a method for evaluating research claims. \u003cem>Outsmart Your Brain\u003c/em> (2023) is a study guide for students on learning from lessons, reading, note-taking and revising.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>Why Don&#39;t Students Like School?\u003c/em> (Jossey-Bass, 2009; second edition 2021)\u003c/li>\n\u003cli>\u003cem>When Can You Trust the Experts?\u003c/em> (2012)\u003c/li>\n\u003cli>\u003cem>Raising Kids Who Read\u003c/em> (2015)\u003c/li>\n\u003cli>\u003cem>The Reading Mind\u003c/em> (2017)\u003c/li>\n\u003cli>\u003cem>Outsmart Your Brain\u003c/em> (2023)\u003c/li>\n\u003cli>&#39;Ask the Cognitive Scientist&#39; column, \u003cem>American Educator\u003c/em> (2002 onwards)\u003c/li>\n\u003cli>&#39;The myth of learning styles&#39;, with Cedar Riener, \u003cem>Change\u003c/em> (2010)\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>For a classroom teacher:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Audit the thinking.\u003c/strong> For each task, write down what a pupil will be thinking about while doing it. If it is not the meaning of the content, change the task. Be wary of attention-grabbers and elaborate formats that become the thing remembered.\u003c/li>\n\u003cli>\u003cstrong>Pose the question before giving the answer.\u003c/strong> Frame a lesson or unit around a puzzle that the content resolves, so the explanation matters to pupils.\u003c/li>\n\u003cli>\u003cstrong>Build and use knowledge.\u003c/strong> Teach background knowledge before a demanding text, and make wide reading part of the curriculum.\u003c/li>\n\u003cli>\u003cstrong>Use several concrete examples\u003c/strong> of each abstract idea and ask pupils to say what they have in common.\u003c/li>\n\u003cli>\u003cstrong>Space practice\u003c/strong> of core procedures and facts across the year through starters, homework and cumulative quizzes.\u003c/li>\n\u003cli>\u003cstrong>Talk about effort and strategy\u003c/strong>, not ability, when giving feedback.\u003c/li>\n\u003c/ul>\n\u003cp>For leaders:\u003c/p>\n\u003cul>\n\u003cli>Remove learning styles questionnaires and VAK planning from documentation and training.\u003c/li>\n\u003cli>Be sceptical of generic &#39;thinking skills&#39; programmes that sit outside subjects.\u003c/li>\n\u003cli>Give teachers structured opportunities for deliberate practice with feedback, such as video and coaching.\u003c/li>\n\u003cli>Use his &#39;strip it, trace it, analyse it, should I do it?&#39; approach when weighing a new product or initiative.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Lab to classroom.\u003c/strong> Willingham himself says that basic science describes the mind but cannot prescribe teaching; values and context also matter. Critics argue that popular use of his work in England has ignored that caution and treated cognitive principles as a complete pedagogy.\u003c/li>\n\u003cli>\u003cstrong>Knowledge versus skills.\u003c/strong> Progressive educators argue that his account underplays enquiry, creativity and pupils&#39; agency, and that &#39;knowledge first&#39; can delay authentic disciplinary work. Supporters reply that he argues for the order of teaching, not against the goal.\u003c/li>\n\u003cli>\u003cstrong>Learning styles.\u003c/strong> A minority of researchers hold that individual differences in preferred modes of learning deserve more study. The mainstream reviews (for example Pashler and colleagues, 2008) agree with Willingham that matching instruction to styles lacks evidence.\u003c/li>\n\u003cli>\u003cstrong>Motivation.\u003c/strong> The book&#39;s account of why pupils dislike school is cognitive. Critics note that it says relatively little about relationships, belonging, relevance or the social causes of disengagement.\u003c/li>\n\u003cli>\u003cstrong>Breadth of evidence.\u003c/strong> Much of the underlying research involves university students and short timescales, and the evidence base in some areas (for example mindset) has shifted since 2009, which the second edition partly reflects.\u003c/li>\n\u003c/ul>\n","text":"At a glance Willingham explains findings from cognitive psychology in terms teachers can use, and is careful about what the science does and does not justify. 'Memory is the residue of thought': pupils remember what they think about, so plan lessons around what pupils will be thinking, not what they will be doing. Thinking well depends on knowing things. Critical thinking and comprehension cannot be taught separately from subject knowledge. Pupils are more alike than different in how they learn. There is no good evidence for teaching to learning styles. Proficiency needs extended, spaced practice, and novices do not learn best by imitating what experts do. Who they are Daniel T. Willingham is professor of psychology at the University of Virginia, where he has taught since 1992. He trained as a cognitive psychologist (PhD, Harvard) and researched the brain basis of learning and memory before turning, from around 2000, to the application of cognitive psychology to schooling. He has written the 'Ask the Cognitive Scientist' column for the American Federation of Teachers' magazine American Educator since 2002; many of his best-known articles for teachers appeared there. His work was taken up in England in the 2010s by the knowledge-rich curriculum movement and was publicly cited by ministers including Nick Gibb. Core ideas Why Don't Students Like School? (2009; second edition 2021) is organised as a set of questions, each answered by a cognitive principle. In summary: People are curious but not naturally good at thinking. Thinking is slow and effortful, and the mind tries to avoid it by relying on memory. Pupils enjoy solving problems of the right difficulty: too easy or too hard and they disengage. This is his answer to the title question. Factual knowledge precedes skill. Analysis, comprehension and problem-solving draw on knowledge in long-term memory. Background knowledge lets readers fill gaps in a text and lets thinkers 'chunk' information, freeing working memory. The more you know, the easier it is to learn more. Memory is the residue of thought. What is stored is what the learner attended to and thought about. If pupils make a poster about the water cycle and spend the lesson thinking about lettering, they will remember lettering. He recommends reviewing every lesson plan for what pupils will actually think about, and notes the power of story structure (causality, conflict, complications, character) to make material memorable. We understand new things in terms of what we already know. Abstract ideas are grasped through concrete examples and analogies. Understanding stays shallow at first and transfers poorly, so pupils need many examples and explicit comparison of their deep structure. Proficiency requires practice. Practice makes basic processes automatic, protects against forgetting and aids transfer. It should be spread out over time. Novices do not think like experts. Experts see deep structure and have vast, organised knowledge. Asking pupils to 'think like a historian' or 'be a scientist' before they have that knowledge mistakes the goal for the method. Pupils can comprehend expert knowledge well before they can create it. Children are more alike than different in how they learn. Learners differ in ability and interest, but the theory that matching teaching to visual, auditory or kinaesthetic styles improves learning has not been supported. Choose the modality that suits the content . Intelligence can be changed through sustained hard work. He supports praising effort and process, treating failure as a normal part of learning, and being honest that catching up means working harder. The second edition is more cautious about the strength of growth mindset intervention evidence. Technology. A chapter new to the second edition argues that technology changes less about cognition than is claimed, that effects of specific tools are hard to predict, and that schools should evaluate products against a clear purpose. Teaching is a cognitive skill that improves with deliberate practice. Experience alone is not enough; teachers need feedback, including observation and video, and to work on one thing at a time. Other themes. In 'Critical thinking: why is it so hard to teach?' (2007) he argues that critical thinking is not a general skill but depends on domain knowledge and practice. The Reading Mind (2017) sets out the cognitive processes in reading, from decoding to comprehension, and stresses knowledge and vocabulary. When Can You Trust the Experts? (2012) gives educators a method for evaluating research claims. Outsmart Your Brain (2023) is a study guide for students on learning from lessons, reading, note-taking and revising. Key works Why Don't Students Like School? (Jossey-Bass, 2009; second edition 2021) When Can You Trust the Experts? (2012) Raising Kids Who Read (2015) The Reading Mind (2017) Outsmart Your Brain (2023) 'Ask the Cognitive Scientist' column, American Educator (2002 onwards) 'The myth of learning styles', with Cedar Riener, Change (2010) Putting it into practice For a classroom teacher: Audit the thinking. For each task, write down what a pupil will be thinking about while doing it. If it is not the meaning of the content, change the task. Be wary of attention-grabbers and elaborate formats that become the thing remembered. Pose the question before giving the answer. Frame a lesson or unit around a puzzle that the content resolves, so the explanation matters to pupils. Build and use knowledge. Teach background knowledge before a demanding text, and make wide reading part of the curriculum. Use several concrete examples of each abstract idea and ask pupils to say what they have in common. Space practice of core procedures and facts across the year through starters, homework and cumulative quizzes. Talk about effort and strategy , not ability, when giving feedback. For leaders: Remove learning styles questionnaires and VAK planning from documentation and training. Be sceptical of generic 'thinking skills' programmes that sit outside subjects. Give teachers structured opportunities for deliberate practice with feedback, such as video and coaching. Use his 'strip it, trace it, analyse it, should I do it?' approach when weighing a new product or initiative. Critiques and debate Lab to classroom. Willingham himself says that basic science describes the mind but cannot prescribe teaching; values and context also matter. Critics argue that popular use of his work in England has ignored that caution and treated cognitive principles as a complete pedagogy. Knowledge versus skills. Progressive educators argue that his account underplays enquiry, creativity and pupils' agency, and that 'knowledge first' can delay authentic disciplinary work. Supporters reply that he argues for the order of teaching, not against the goal. Learning styles. A minority of researchers hold that individual differences in preferred modes of learning deserve more study. The mainstream reviews (for example Pashler and colleagues, 2008) agree with Willingham that matching instruction to styles lacks evidence. Motivation. The book's account of why pupils dislike school is cognitive. Critics note that it says relatively little about relationships, belonging, relevance or the social causes of disengagement. Breadth of evidence. Much of the underlying research involves university students and short timescales, and the evidence base in some areas (for example mindset) has shifted since 2009, which the second edition partly reflects."},{"slug":"designated-safeguarding-lead","title":"Designated safeguarding lead (DSL)","category":"safeguarding","type":"topic","summary":"The senior leader who takes lead responsibility for safeguarding and child protection. What KCSIE 2026 expects of the role, deputies, cover and capacity, and how leaders and governors support it.","status":"Professional practice","evidence":"","tags":["dsl","safeguarding","kcsie","child protection","leadership","supervision"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"KCSIE 2026: key safeguarding updates","publisher":"Harrison Clark Rickerbys","year":"2026","url":"https://www.hcrlaw.com/news-and-insights/kcsie-2026-key-safeguarding-updates/"},{"title":"KCSIE 2026: aligning deputy DSL training with DSL standards","publisher":"SSS Learning","year":"2026","url":"https://ssslearning.co.uk/safeguarding-articles/ddsl"},{"title":"Keeping children safe in education (KCSIE) 2026: summary of changes (CASPAR briefing)","publisher":"NSPCC Learning","year":"2026","url":"https://learning.nspcc.org.uk/research-resources/schools/keeping-children-safe-in-education-caspar-briefing"}],"related":["keeping-children-safe-in-education","child-protection-policy-and-procedures","safeguarding-records-and-information-sharing","online-safety-filtering-and-monitoring"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>KCSIE says every school \u003cstrong>should\u003c/strong> appoint an appropriate \u003cstrong>senior member of staff from the leadership team\u003c/strong> as DSL, with the role written into their job description.\u003c/li>\n\u003cli>The DSL holds \u003cstrong>lead responsibility\u003c/strong> for safeguarding and child protection, including online safety and understanding filtering and monitoring. Tasks can be delegated to trained deputies; the lead responsibility cannot.\u003c/li>\n\u003cli>KCSIE 2026 strengthens expectations about the DSL&#39;s skills and experience, deputy training, and \u003cstrong>cover arrangements\u003c/strong> when the DSL is unavailable.\u003c/li>\n\u003cli>The DSL and deputies should have training that is updated at least every two years, with knowledge refreshed at least annually.\u003c/li>\n\u003cli>The role needs time, funding, training, supervision and the authority to challenge. Under-resourcing the role is a governance failure, not a personal one.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>The role is defined by statutory guidance rather than research. KCSIE 2026 has an annex setting out the role (the annex letter changed in 2026; check the current text). Its main headings are stable:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Availability:\u003c/strong> the DSL or a deputy should always be available during school hours for staff to discuss concerns, in person where possible; adequate cover is needed for out-of-hours and out-of-term activities.\u003c/li>\n\u003cli>\u003cstrong>Managing referrals:\u003c/strong> to children&#39;s social care, to the Channel programme for radicalisation concerns, to the Disclosure and Barring Service after a dismissal or resignation over risk to children, and to the police where a crime may have been committed.\u003c/li>\n\u003cli>\u003cstrong>Working with others:\u003c/strong> point of contact for the safeguarding partners; liaison with the headteacher, the case manager and local authority designated officer for allegations, the SENCO, mental health lead, and IT and network staff.\u003c/li>\n\u003cli>\u003cstrong>Information and records:\u003c/strong> keeping detailed, secure, separate child protection files and transferring them when a child moves (within five days for an in-year transfer or within the first five days of a new term).\u003c/li>\n\u003cli>\u003cstrong>Raising awareness:\u003c/strong> the policy is known, reviewed at least annually and publicly available.\u003c/li>\n\u003cli>\u003cstrong>Training, knowledge and skills\u003c/strong> and \u003cstrong>understanding the views of children\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Holding and sharing information\u003c/strong> and helping promote the educational outcomes of children with a social worker.\u003c/li>\n\u003c/ul>\n\u003cp>Serious case and local child safeguarding practice reviews repeatedly identify the same weaknesses: information held but not joined up, concerns not escalated, and limited professional curiosity. Not verified: a specific national review citing school DSL capacity.\u003c/p>\n\u003cp>2026 changes reported by legal and training briefings: cover arrangements should be robust (trained deputies, shared safeguarding mailboxes, clear escalation); deputy DSL training expectations are aligned more closely with those for the DSL. Confirm wording in the published text.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>For teachers and support staff, the DSL system works only if they do their part:\u003c/p>\n\u003cul>\n\u003cli>Know the DSL and deputies by name and photo, and how to reach them during lessons, trips and after-school activities.\u003c/li>\n\u003cli>Report the same day, in the school&#39;s recording system, using the child&#39;s own words. Do not investigate, and do not wait to be sure.\u003c/li>\n\u003cli>If you have reported and heard nothing, ask. If you still think a child is at risk, press the concern; KCSIE is explicit that any member of staff can make a referral.\u003c/li>\n\u003cli>Concerns about an adult go to the headteacher (or chair of governors if about the head), not to the DSL in the first instance unless the policy says so.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cp>\u003cstrong>Capacity.\u003c/strong> In a secondary school the role is rarely compatible with a heavy teaching load. Decide explicitly how many hours it needs, and resource a team: deputies by year group or key stage, an administrator for records and meeting logistics, and named leads for attendance, online safety and children in care who work with the DSL.\u003c/p>\n\u003cp>\u003cstrong>Routines that work:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>A daily triage of new concerns with decisions and rationale recorded.\u003c/li>\n\u003cli>A weekly safeguarding team meeting reviewing open cases, attendance, behaviour and alternative provision data together.\u003c/li>\n\u003cli>Half-termly case sampling by the head or a trust safeguarding lead.\u003c/li>\n\u003cli>Reflective supervision for the DSL and deputies. KCSIE says they should be given support; formal supervision is good practice rather than a stated requirement.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Governors and trustees should check:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>the DSL is on the leadership team and the role is in the job description;\u003c/li>\n\u003cli>cover is real: who is available on a residential, at a Saturday fixture, in August results week?\u003c/li>\n\u003cli>training dates for the DSL and all deputies;\u003c/li>\n\u003cli>the DSL&#39;s termly report covers trends, referral outcomes, escalations and the DSL&#39;s own capacity;\u003c/li>\n\u003cli>the link safeguarding governor meets the DSL and tests systems, without seeing identifiable casework.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>&#39;Lead responsibility&#39; is sometimes read as sole responsibility. Safeguarding is everyone&#39;s job; the head and governing body remain accountable.\u003c/li>\n\u003cli>A DSL who is also behaviour lead, attendance lead and SENCO is a single point of failure.\u003c/li>\n\u003cli>Common audit findings: no trained deputy on site during clubs or trips; child protection files not transferred or receipt not confirmed; decisions not to refer left unrecorded; DSL unaware of how the filtering and monitoring system works or who reviews alerts.\u003c/li>\n\u003cli>The emotional load of the role is real; lack of supervision is a recognised risk for retention and decision quality.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Read the DSL annex in KCSIE 2026 alongside your local safeguarding partnership&#39;s procedures, which set the referral routes and thresholds you must use. This is general information, not legal advice.\u003c/p>\n","text":"At a glance KCSIE says every school should appoint an appropriate senior member of staff from the leadership team as DSL, with the role written into their job description. The DSL holds lead responsibility for safeguarding and child protection, including online safety and understanding filtering and monitoring. Tasks can be delegated to trained deputies; the lead responsibility cannot. KCSIE 2026 strengthens expectations about the DSL's skills and experience, deputy training, and cover arrangements when the DSL is unavailable. The DSL and deputies should have training that is updated at least every two years, with knowledge refreshed at least annually. The role needs time, funding, training, supervision and the authority to challenge. Under-resourcing the role is a governance failure, not a personal one. What the evidence says The role is defined by statutory guidance rather than research. KCSIE 2026 has an annex setting out the role (the annex letter changed in 2026; check the current text). Its main headings are stable: Availability: the DSL or a deputy should always be available during school hours for staff to discuss concerns, in person where possible; adequate cover is needed for out-of-hours and out-of-term activities. Managing referrals: to children's social care, to the Channel programme for radicalisation concerns, to the Disclosure and Barring Service after a dismissal or resignation over risk to children, and to the police where a crime may have been committed. Working with others: point of contact for the safeguarding partners; liaison with the headteacher, the case manager and local authority designated officer for allegations, the SENCO, mental health lead, and IT and network staff. Information and records: keeping detailed, secure, separate child protection files and transferring them when a child moves (within five days for an in-year transfer or within the first five days of a new term). Raising awareness: the policy is known, reviewed at least annually and publicly available. Training, knowledge and skills and understanding the views of children . Holding and sharing information and helping promote the educational outcomes of children with a social worker. Serious case and local child safeguarding practice reviews repeatedly identify the same weaknesses: information held but not joined up, concerns not escalated, and limited professional curiosity. Not verified: a specific national review citing school DSL capacity. 2026 changes reported by legal and training briefings: cover arrangements should be robust (trained deputies, shared safeguarding mailboxes, clear escalation); deputy DSL training expectations are aligned more closely with those for the DSL. Confirm wording in the published text. In the classroom For teachers and support staff, the DSL system works only if they do their part: Know the DSL and deputies by name and photo, and how to reach them during lessons, trips and after-school activities. Report the same day, in the school's recording system, using the child's own words. Do not investigate, and do not wait to be sure. If you have reported and heard nothing, ask. If you still think a child is at risk, press the concern; KCSIE is explicit that any member of staff can make a referral. Concerns about an adult go to the headteacher (or chair of governors if about the head), not to the DSL in the first instance unless the policy says so. For leaders Capacity. In a secondary school the role is rarely compatible with a heavy teaching load. Decide explicitly how many hours it needs, and resource a team: deputies by year group or key stage, an administrator for records and meeting logistics, and named leads for attendance, online safety and children in care who work with the DSL. Routines that work: A daily triage of new concerns with decisions and rationale recorded. A weekly safeguarding team meeting reviewing open cases, attendance, behaviour and alternative provision data together. Half-termly case sampling by the head or a trust safeguarding lead. Reflective supervision for the DSL and deputies. KCSIE says they should be given support; formal supervision is good practice rather than a stated requirement. Governors and trustees should check: the DSL is on the leadership team and the role is in the job description; cover is real: who is available on a residential, at a Saturday fixture, in August results week? training dates for the DSL and all deputies; the DSL's termly report covers trends, referral outcomes, escalations and the DSL's own capacity; the link safeguarding governor meets the DSL and tests systems, without seeing identifiable casework. Cautions and critiques 'Lead responsibility' is sometimes read as sole responsibility. Safeguarding is everyone's job; the head and governing body remain accountable. A DSL who is also behaviour lead, attendance lead and SENCO is a single point of failure. Common audit findings: no trained deputy on site during clubs or trips; child protection files not transferred or receipt not confirmed; decisions not to refer left unrecorded; DSL unaware of how the filtering and monitoring system works or who reviews alerts. The emotional load of the role is real; lack of supervision is a recognised risk for retention and decision quality. Go deeper Read the DSL annex in KCSIE 2026 alongside your local safeguarding partnership's procedures, which set the referral routes and thresholds you must use. This is general information, not legal advice."},{"slug":"desirable-difficulties","title":"Desirable difficulties","category":"teaching","type":"topic","summary":"Robert and Elizabeth Bjork's idea that conditions which slow apparent progress, such as spacing, interleaving, testing and generation, can improve long-term retention and transfer.","status":"Research and theory","evidence":"","tags":["memory","cognitive science","bjork","learning versus performance","practice"],"checked":"2026-11-12","sources":[{"title":"Desirable Difficulties (Observer article)","publisher":"Association for Psychological Science","year":"2011","url":"https://www.psychologicalscience.org/?p=128850"},{"title":"Boosting learning by making it desirably difficult (summary of Bjork and Bjork)","publisher":"RE:ONLINE","year":"2020","url":"https://www.reonline.org.uk/research/boosting-learning-by-making-it-desirably-difficult"},{"title":"Bjork and Bjork's Desirable Difficulties in Action (Isaac Moore)","publisher":"Hachette / John Catt","year":"2024","url":"https://www.hachette.co.uk/titles/isaac-moore/bjork-bjork%e2%80%99s-desirable-difficulties-in-action/9781036001636/"},{"title":"Deliberately difficult - why it's better to make learning harder","publisher":"David Didau, The Learning Spy","year":"2013","url":"https://learningspy.co.uk/featured/deliberately-difficult-focussing-on-learning-rather-than-progress-2/"},{"title":"Cognitive science approaches in the classroom: a review of the evidence (news release and report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/news/new-what-do-we-really-know-about-cognitive-science-in-the-classroom-eef-publishes-new-review-of-the-evidence/"}],"related":["robert-and-elizabeth-bjork","retrieval-practice","spaced-and-interleaved-practice","cognitive-load-theory"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Performance\u003c/strong> (what pupils can do during or just after a lesson) is an unreliable guide to \u003cstrong>learning\u003c/strong> (durable change in what they know and can do later).\u003c/li>\n\u003cli>Some conditions depress performance now but strengthen learning: spacing, interleaving, retrieval instead of re-reading, generating an answer before being told, and varying the conditions of practice.\u003c/li>\n\u003cli>A difficulty is &#39;desirable&#39; only if pupils have the knowledge to overcome it. Otherwise it is just difficult.\u003c/li>\n\u003cli>The idea explains why cramming, re-reading and blocked practice feel effective and are not, and why a lesson that looks fluent may leave little behind.\u003c/li>\n\u003cli>It is a principle for designing practice and review, not for first explanations of complex new material.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>Robert Bjork introduced the term in 1994; he and Elizabeth Bjork have developed it since at UCLA. Their underlying &#39;new theory of disuse&#39; distinguishes \u003cstrong>storage strength\u003c/strong> (how well embedded a memory is) from \u003cstrong>retrieval strength\u003c/strong> (how accessible it is now). Retrieving something when retrieval strength has fallen, that is when it is partly forgotten, produces a bigger gain in storage strength than retrieving it when it is fresh. Easy, immediate repetition therefore adds little.\u003c/p>\n\u003cp>The main desirable difficulties are:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Spacing\u003c/strong> study or practice over time.\u003c/li>\n\u003cli>\u003cstrong>Interleaving\u003c/strong> different problem types or topics, not blocking them.\u003c/li>\n\u003cli>\u003cstrong>Testing\u003c/strong> (retrieval practice) in place of re-presentation.\u003c/li>\n\u003cli>\u003cstrong>Generation\u003c/strong>: producing an answer, prediction or solution, even with errors, before receiving it.\u003c/li>\n\u003cli>\u003cstrong>Variation\u003c/strong>: practising in varied contexts, formats or conditions.\u003c/li>\n\u003cli>\u003cstrong>Reducing or delaying feedback\u003c/strong> in some skill-learning contexts, so learners do not become dependent on it.\u003c/li>\n\u003c/ul>\n\u003cp>Evidence for the first three is extensive in laboratory research, and reasonably supportive in classrooms for retrieval and spacing (see those entries). Evidence for generation and variation in school classrooms is thinner. A related proposal, that hard-to-read fonts improve retention (&#39;disfluency&#39;), has largely failed to replicate and should not be used.\u003c/p>\n\u003cp>The Bjorks also document a metacognitive problem: learners judge their learning by how fluent it feels, so they prefer massed practice and re-reading and rate them as more effective even after experiencing better results from the alternatives.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Judge learning later, not at the end of the lesson.\u003c/strong> A correct plenary answer shows performance. Check again next week, without cues.\u003c/li>\n\u003cli>\u003cstrong>Let forgetting begin before reviewing.\u003c/strong> Quiz Year 8 on rivers three weeks after the unit, not the next day only.\u003c/li>\n\u003cli>\u003cstrong>Ask before telling.\u003c/strong> &#39;Predict what happens to the current when I add a second bulb in parallel, and write why.&#39; A wrong prediction followed by feedback is productive, provided feedback does follow.\u003c/li>\n\u003cli>\u003cstrong>Mix and vary practice.\u003c/strong> After a block on simultaneous equations, set questions in different forms (worded, graphical, algebraic) among other topics. In MFL, practise the same tense across speaking, translation and free writing.\u003c/li>\n\u003cli>\u003cstrong>Remove cues gradually.\u003c/strong> First quiz with the knowledge organiser open, then closed; first with sentence starters, then without.\u003c/li>\n\u003cli>\u003cstrong>Explain it to pupils.\u003c/strong> Year 10 and 11 pupils who know why self-testing feels worse than highlighting are more likely to persist. Show them their own scores from a re-read versus self-test comparison if you can.\u003c/li>\n\u003cli>\u003cstrong>Protect success.\u003c/strong> If most of the class cannot do the task even with effort, the difficulty is undesirable: go back to modelling and guided practice.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>The learning–performance distinction should shape \u003cstrong>how lessons are evaluated\u003c/strong>. Rapid visible &#39;progress in 20 minutes&#39; is not evidence of learning; Ofsted dropped the expectation of demonstrating progress within a lesson years ago, and observation proformas should not reintroduce it.\u003c/li>\n\u003cli>Build delayed, cumulative assessment into the calendar so that departments get information about retention.\u003c/li>\n\u003cli>Expect some teacher and pupil resistance: the approaches feel worse. Share the reasoning with staff, pupils and parents.\u003c/li>\n\u003cli>Low cost; the work is redesigning practice, homework and assessment.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Which difficulties, for whom?\u003c/strong> The concept is defined partly by its outcome: a difficulty is desirable if it helps. That makes it hard to predict in advance and open to circular use.\u003c/li>\n\u003cli>\u003cstrong>Tension with cognitive load theory.\u003c/strong> For novices meeting complex material, added difficulty can overload working memory. A common reconciliation is that load should be reduced during initial instruction and difficulty introduced during practice of material that is already partly learned.\u003c/li>\n\u003cli>\u003cstrong>Lab-to-classroom transfer.\u003c/strong> The EEF&#39;s 2021 review found that classroom evidence for several of these strategies is limited by subject and age, especially for interleaving outside maths.\u003c/li>\n\u003cli>\u003cstrong>Motivation.\u003c/strong> Repeated struggle and lower in-lesson scores can reduce confidence, particularly for pupils with low prior attainment, unless success is engineered and the purpose explained.\u003c/li>\n\u003cli>\u003cstrong>Misuse as justification.\u003c/strong> &#39;Desirable difficulty&#39; has been used to defend unclear explanations and under-scaffolded tasks. The Bjorks&#39; work does not support making first teaching confusing.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Bjork and Bjork, &#39;Making things hard on yourself, but in a good way&#39; (2011), is the short standard chapter. Not verified: a stable URL for it was not found during research for this entry.\u003c/li>\n\u003cli>Isaac Moore&#39;s \u003cem>Bjork and Bjork&#39;s Desirable Difficulties in Action\u003c/em> gives classroom applications.\u003c/li>\n\u003cli>See the entries on Robert and Elizabeth Bjork, retrieval practice and spaced and interleaved practice.\u003c/li>\n\u003c/ul>\n","text":"At a glance Performance (what pupils can do during or just after a lesson) is an unreliable guide to learning (durable change in what they know and can do later). Some conditions depress performance now but strengthen learning: spacing, interleaving, retrieval instead of re-reading, generating an answer before being told, and varying the conditions of practice. A difficulty is 'desirable' only if pupils have the knowledge to overcome it. Otherwise it is just difficult. The idea explains why cramming, re-reading and blocked practice feel effective and are not, and why a lesson that looks fluent may leave little behind. It is a principle for designing practice and review, not for first explanations of complex new material. What the evidence says Robert Bjork introduced the term in 1994; he and Elizabeth Bjork have developed it since at UCLA. Their underlying 'new theory of disuse' distinguishes storage strength (how well embedded a memory is) from retrieval strength (how accessible it is now). Retrieving something when retrieval strength has fallen, that is when it is partly forgotten, produces a bigger gain in storage strength than retrieving it when it is fresh. Easy, immediate repetition therefore adds little. The main desirable difficulties are: Spacing study or practice over time. Interleaving different problem types or topics, not blocking them. Testing (retrieval practice) in place of re-presentation. Generation : producing an answer, prediction or solution, even with errors, before receiving it. Variation : practising in varied contexts, formats or conditions. Reducing or delaying feedback in some skill-learning contexts, so learners do not become dependent on it. Evidence for the first three is extensive in laboratory research, and reasonably supportive in classrooms for retrieval and spacing (see those entries). Evidence for generation and variation in school classrooms is thinner. A related proposal, that hard-to-read fonts improve retention ('disfluency'), has largely failed to replicate and should not be used. The Bjorks also document a metacognitive problem: learners judge their learning by how fluent it feels, so they prefer massed practice and re-reading and rate them as more effective even after experiencing better results from the alternatives. In the classroom Judge learning later, not at the end of the lesson. A correct plenary answer shows performance. Check again next week, without cues. Let forgetting begin before reviewing. Quiz Year 8 on rivers three weeks after the unit, not the next day only. Ask before telling. 'Predict what happens to the current when I add a second bulb in parallel, and write why.' A wrong prediction followed by feedback is productive, provided feedback does follow. Mix and vary practice. After a block on simultaneous equations, set questions in different forms (worded, graphical, algebraic) among other topics. In MFL, practise the same tense across speaking, translation and free writing. Remove cues gradually. First quiz with the knowledge organiser open, then closed; first with sentence starters, then without. Explain it to pupils. Year 10 and 11 pupils who know why self-testing feels worse than highlighting are more likely to persist. Show them their own scores from a re-read versus self-test comparison if you can. Protect success. If most of the class cannot do the task even with effort, the difficulty is undesirable: go back to modelling and guided practice. For leaders The learning–performance distinction should shape how lessons are evaluated . Rapid visible 'progress in 20 minutes' is not evidence of learning; Ofsted dropped the expectation of demonstrating progress within a lesson years ago, and observation proformas should not reintroduce it. Build delayed, cumulative assessment into the calendar so that departments get information about retention. Expect some teacher and pupil resistance: the approaches feel worse. Share the reasoning with staff, pupils and parents. Low cost; the work is redesigning practice, homework and assessment. Cautions and critiques Which difficulties, for whom? The concept is defined partly by its outcome: a difficulty is desirable if it helps. That makes it hard to predict in advance and open to circular use. Tension with cognitive load theory. For novices meeting complex material, added difficulty can overload working memory. A common reconciliation is that load should be reduced during initial instruction and difficulty introduced during practice of material that is already partly learned. Lab-to-classroom transfer. The EEF's 2021 review found that classroom evidence for several of these strategies is limited by subject and age, especially for interleaving outside maths. Motivation. Repeated struggle and lower in-lesson scores can reduce confidence, particularly for pupils with low prior attainment, unless success is engineered and the purpose explained. Misuse as justification. 'Desirable difficulty' has been used to defend unclear explanations and under-scaffolded tasks. The Bjorks' work does not support making first teaching confusing. Go deeper Bjork and Bjork, 'Making things hard on yourself, but in a good way' (2011), is the short standard chapter. Not verified: a stable URL for it was not found during research for this entry. Isaac Moore's Bjork and Bjork's Desirable Difficulties in Action gives classroom applications. See the entries on Robert and Elizabeth Bjork, retrieval practice and spaced and interleaved practice."},{"slug":"dylan-wiliam","title":"Dylan Wiliam","category":"thinkers","type":"person","summary":"Emeritus professor at UCL Institute of Education and co-author of 'Inside the Black Box'. His five strategies of formative assessment underpin most assessment-for-learning practice in English schools.","status":"Thinker profile","evidence":"EEF trial of Embedding Formative Assessment (2018): +2 months' additional progress at GCSE (verify current figure on the EEF project page)","tags":["formative assessment","assessment for learning","feedback","hinge questions","teacher development","teacher learning communities"],"checked":"2026-11-12","sources":[{"title":"Dylan Wiliam (biography and bibliography)","publisher":"Wikipedia","year":"2026","url":"https://en.wikipedia.org/wiki/Dylan_Wiliam"},{"title":"Formative assessment: Five classroom strategies","publisher":"SecEd","year":"Not verified","url":"https://www.sec-ed.co.uk/knowledge-bank/formative-assessment-five-classroom-strategies-dylan-wiliam-pedagogy-feedback-marking/"},{"title":"Dylan Wiliam (profile)","publisher":"Schools Week","year":"Not verified","url":"https://schoolsweek.co.uk/dylan-wiliam/"},{"title":"Paul Black: how his work improved learning worldwide","publisher":"Tes","year":"2026","url":"https://www.tes.com/magazine/analysis/general/paul-black-how-his-work-improved-learning-worldwide"},{"title":"Dylan Wiliam (author page)","publisher":"Sage","year":"2026","url":"https://www.sagepub.com/explore-our-content/authors/dylan-wiliam-667950"},{"title":"Revisiting Dylan Wiliam's Five Brilliant Formative Assessment Strategies","publisher":"teacherhead.com (Tom Sherrington)","year":"2019","url":"https://teacherhead.com/2019/01/10/revisiting-dylan-wiliams-five-brilliant-formative-assessment-strategies/"}],"related":["formative-assessment-five-strategies","hinge-and-diagnostic-questions","eef-teacher-feedback-guidance","self-and-peer-assessment","tom-sherrington","ks3-assessment-after-levels"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Wiliam&#39;s central claim: teaching is unpredictable, so teachers must keep finding out what pupils have actually learned and adjust. He calls assessment the bridge between teaching and learning.\u003c/li>\n\u003cli>Formative assessment is a process defined by what you do with evidence, not a type of test.\u003c/li>\n\u003cli>Five strategies organise the practice: clarify intentions, elicit evidence, give feedback that moves learning on, activate peers, activate pupils as owners of their learning.\u003c/li>\n\u003cli>Feedback should cause thinking and be more work for the pupil than for the teacher.\u003c/li>\n\u003cli>Improving the teachers a school already has, through sustained, collaborative habit change, matters more than structures or recruitment.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Dylan Wiliam taught mathematics and science in London secondary schools before moving into teacher education and research at what became King&#39;s College London. With Paul Black he wrote the 1998 research review &#39;Assessment and classroom learning&#39; and its short summary for teachers, &#39;Inside the Black Box&#39;. He later worked as a senior research director at the Educational Testing Service in the United States and was deputy director of the Institute of Education, University of London, from 2006 to 2010. He is emeritus professor of educational assessment at UCL Institute of Education and works internationally with teachers and school systems. Paul Black died in 2026; Wiliam wrote publicly about his legacy.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Inside the Black Box (1998).\u003c/strong> Black and Wiliam reviewed around 250 studies and argued that strengthening formative assessment produces substantial learning gains, particularly for lower attainers. The classroom was the &#39;black box&#39;: policy focused on inputs and outputs and ignored what happens inside. Follow-up work with teachers (the King&#39;s-Medway-Oxfordshire project) produced &#39;Working Inside the Black Box&#39; and \u003cem>Assessment for Learning: Putting it into Practice\u003c/em>.\u003c/p>\n\u003cp>\u003cstrong>The five key strategies.\u003c/strong> First set out with Leahy, Lyon and Thompson in 2005, and built from three questions (where is the learner going, where are they now, how do they get there) and three agents (teacher, peer, learner):\u003c/p>\n\u003col>\n\u003cli>Clarifying, sharing and understanding learning intentions and success criteria.\u003c/li>\n\u003cli>Engineering effective discussions, tasks and activities that elicit evidence of learning.\u003c/li>\n\u003cli>Providing feedback that moves learners forward.\u003c/li>\n\u003cli>Activating students as learning resources for one another.\u003c/li>\n\u003cli>Activating students as owners of their own learning.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Hinge questions.\u003c/strong> A question asked at a point in the lesson where the teacher must decide whether to move on. Wiliam&#39;s design rules: every pupil responds at once (mini-whiteboards, ABCD cards); pupils can answer in about a minute and the teacher can read the answers in seconds; and it should be very hard to get the right answer for the wrong reason, with each wrong option revealing a specific misconception.\u003c/p>\n\u003cp>\u003cstrong>Short-cycle assessment.\u003c/strong> The benefits come from minute-by-minute and day-by-day adjustment, not from termly tests labelled &#39;formative&#39;. He also promotes &#39;no hands up, except to ask a question&#39; with random selection so that participation is not voluntary.\u003c/p>\n\u003cp>\u003cstrong>Feedback.\u003c/strong> Drawing on Kluger and DeNisi&#39;s finding that a sizeable minority of feedback interventions lowered performance, he argues that feedback works only if pupils use it. Comment-only marking can beat grades because grades trigger ego-involvement. He suggests making feedback a task: for example, &#39;five of these are wrong; find them and fix them&#39;.\u003c/p>\n\u003cp>\u003cstrong>Teacher quality and teacher learning communities.\u003c/strong> In \u003cem>Creating the Schools Our Children Need\u003c/em> (2018) and \u003cem>Leadership for Teacher Learning\u003c/em> (2016) he argues that many popular reforms (structural change, class-size cuts, replacing weak teachers, performance pay) are slow, costly or weakly evidenced. He summarises the alternative as &#39;love the one you&#39;re with&#39;: invest in existing teachers, alongside a knowledge-rich curriculum. Because the problem is changing habits, not gaining knowledge, he recommends teacher learning communities (TLCs): groups of 8–12 teachers meeting monthly for about 75 minutes over two years, each choosing one or two techniques, reporting back, observing peers and committing to next steps.\u003c/p>\n\u003cp>\u003cstrong>Assessment more widely.\u003c/strong> He has written on validity and reliability, argued that national curriculum levels were misused, and has been a prominent sceptic of fine-grained tracking data.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>&#39;Assessment and classroom learning&#39;, with Paul Black, \u003cem>Assessment in Education\u003c/em> (1998)\u003c/li>\n\u003cli>&#39;Inside the Black Box&#39;, with Paul Black (1998)\u003c/li>\n\u003cli>\u003cem>Assessment for Learning: Putting it into Practice\u003c/em>, with Black, Harrison, Lee and Marshall (2003)\u003c/li>\n\u003cli>\u003cem>Embedded Formative Assessment\u003c/em> (Solution Tree, 2011; second edition 2018)\u003c/li>\n\u003cli>\u003cem>Embedding Formative Assessment: Practical Techniques for K-12 Classrooms\u003c/em>, with Siobhán Leahy (2015)\u003c/li>\n\u003cli>\u003cem>Leadership for Teacher Learning\u003c/em> (2016)\u003c/li>\n\u003cli>\u003cem>Creating the Schools Our Children Need\u003c/em> (2018)\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>For a classroom teacher:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Plan one hinge question per lesson.\u003c/strong> Write it before the lesson, with distractors based on known misconceptions. Decide in advance what you will do if a third of the class gets it wrong.\u003c/li>\n\u003cli>\u003cstrong>Get a response from everyone.\u003c/strong> Use mini-whiteboards or finger voting, and random selection for oral questions.\u003c/li>\n\u003cli>\u003cstrong>Turn feedback into detective work.\u003c/strong> Instead of correcting each error, mark a dot in the margin of any line containing a mistake, or return work with comments on separate strips for pupils to match to the right piece.\u003c/li>\n\u003cli>\u003cstrong>Use exit tickets\u003c/strong> to decide the opening of the next lesson, not to generate a grade.\u003c/li>\n\u003cli>\u003cstrong>Train peer assessment\u003c/strong> with simple structures such as &#39;two stars and a wish&#39; against shared criteria, and use pre-flight checklists before work is handed in.\u003c/li>\n\u003c/ul>\n\u003cp>For leaders:\u003c/p>\n\u003cul>\n\u003cli>Run TLCs or an equivalent: voluntary choice of technique within the five strategies, small steps, peer accountability, protected time for at least two years. Stop doing something else to make room.\u003c/li>\n\u003cli>Judge a feedback policy by what pupils do with feedback, not by the volume of written comments.\u003c/li>\n\u003cli>Do not relabel frequent summative testing as assessment for learning.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Size of the effect.\u003c/strong> Black and Wiliam&#39;s early headline effect sizes (often quoted as 0.4–0.7) have been challenged. Randy Bennett (2011) argued that formative assessment was too loosely defined for a single effect size to mean much, and Kingston and Nash&#39;s 2011 meta-analysis reported a much smaller average effect (around 0.2). Wiliam has since said that he regrets how the effect sizes were used.\u003c/li>\n\u003cli>\u003cstrong>Implementation in England.\u003c/strong> The national Assessment for Learning strategy of the 2000s is widely judged to have failed. Wiliam&#39;s own account is that it was implemented as levels-tracking and target-setting rather than responsive teaching. Others argue that the looseness of the original idea made such distortion likely.\u003c/li>\n\u003cli>\u003cstrong>Generic versus subject-specific.\u003c/strong> Daisy Christodoulou, in \u003cem>Making Good Progress?\u003c/em> (2017), supports formative assessment but argues that AfL in practice leaned on generic skills and exam-style tasks, and should instead rest on specific, well-sequenced knowledge and precise questions. Wiliam wrote the foreword and broadly accepts the point.\u003c/li>\n\u003cli>\u003cstrong>Learning intentions and peer assessment.\u003c/strong> Some teachers find routinely shared objectives and success criteria formulaic, and peer assessment is hard to do well with novices who lack the knowledge to judge quality.\u003c/li>\n\u003cli>\u003cstrong>The EEF trial.\u003c/strong> The independent evaluation of the Embedding Formative Assessment programme found a positive effect on GCSE attainment equivalent to about two months&#39; progress. This is supportive but modest compared with early claims.\u003c/li>\n\u003c/ul>\n","text":"At a glance Wiliam's central claim: teaching is unpredictable, so teachers must keep finding out what pupils have actually learned and adjust. He calls assessment the bridge between teaching and learning. Formative assessment is a process defined by what you do with evidence, not a type of test. Five strategies organise the practice: clarify intentions, elicit evidence, give feedback that moves learning on, activate peers, activate pupils as owners of their learning. Feedback should cause thinking and be more work for the pupil than for the teacher. Improving the teachers a school already has, through sustained, collaborative habit change, matters more than structures or recruitment. Who they are Dylan Wiliam taught mathematics and science in London secondary schools before moving into teacher education and research at what became King's College London. With Paul Black he wrote the 1998 research review 'Assessment and classroom learning' and its short summary for teachers, 'Inside the Black Box'. He later worked as a senior research director at the Educational Testing Service in the United States and was deputy director of the Institute of Education, University of London, from 2006 to 2010. He is emeritus professor of educational assessment at UCL Institute of Education and works internationally with teachers and school systems. Paul Black died in 2026; Wiliam wrote publicly about his legacy. Core ideas Inside the Black Box (1998). Black and Wiliam reviewed around 250 studies and argued that strengthening formative assessment produces substantial learning gains, particularly for lower attainers. The classroom was the 'black box': policy focused on inputs and outputs and ignored what happens inside. Follow-up work with teachers (the King's-Medway-Oxfordshire project) produced 'Working Inside the Black Box' and Assessment for Learning: Putting it into Practice . The five key strategies. First set out with Leahy, Lyon and Thompson in 2005, and built from three questions (where is the learner going, where are they now, how do they get there) and three agents (teacher, peer, learner): Clarifying, sharing and understanding learning intentions and success criteria. Engineering effective discussions, tasks and activities that elicit evidence of learning. Providing feedback that moves learners forward. Activating students as learning resources for one another. Activating students as owners of their own learning. Hinge questions. A question asked at a point in the lesson where the teacher must decide whether to move on. Wiliam's design rules: every pupil responds at once (mini-whiteboards, ABCD cards); pupils can answer in about a minute and the teacher can read the answers in seconds; and it should be very hard to get the right answer for the wrong reason, with each wrong option revealing a specific misconception. Short-cycle assessment. The benefits come from minute-by-minute and day-by-day adjustment, not from termly tests labelled 'formative'. He also promotes 'no hands up, except to ask a question' with random selection so that participation is not voluntary. Feedback. Drawing on Kluger and DeNisi's finding that a sizeable minority of feedback interventions lowered performance, he argues that feedback works only if pupils use it. Comment-only marking can beat grades because grades trigger ego-involvement. He suggests making feedback a task: for example, 'five of these are wrong; find them and fix them'. Teacher quality and teacher learning communities. In Creating the Schools Our Children Need (2018) and Leadership for Teacher Learning (2016) he argues that many popular reforms (structural change, class-size cuts, replacing weak teachers, performance pay) are slow, costly or weakly evidenced. He summarises the alternative as 'love the one you're with': invest in existing teachers, alongside a knowledge-rich curriculum. Because the problem is changing habits, not gaining knowledge, he recommends teacher learning communities (TLCs): groups of 8–12 teachers meeting monthly for about 75 minutes over two years, each choosing one or two techniques, reporting back, observing peers and committing to next steps. Assessment more widely. He has written on validity and reliability, argued that national curriculum levels were misused, and has been a prominent sceptic of fine-grained tracking data. Key works 'Assessment and classroom learning', with Paul Black, Assessment in Education (1998) 'Inside the Black Box', with Paul Black (1998) Assessment for Learning: Putting it into Practice , with Black, Harrison, Lee and Marshall (2003) Embedded Formative Assessment (Solution Tree, 2011; second edition 2018) Embedding Formative Assessment: Practical Techniques for K-12 Classrooms , with Siobhán Leahy (2015) Leadership for Teacher Learning (2016) Creating the Schools Our Children Need (2018) Putting it into practice For a classroom teacher: Plan one hinge question per lesson. Write it before the lesson, with distractors based on known misconceptions. Decide in advance what you will do if a third of the class gets it wrong. Get a response from everyone. Use mini-whiteboards or finger voting, and random selection for oral questions. Turn feedback into detective work. Instead of correcting each error, mark a dot in the margin of any line containing a mistake, or return work with comments on separate strips for pupils to match to the right piece. Use exit tickets to decide the opening of the next lesson, not to generate a grade. Train peer assessment with simple structures such as 'two stars and a wish' against shared criteria, and use pre-flight checklists before work is handed in. For leaders: Run TLCs or an equivalent: voluntary choice of technique within the five strategies, small steps, peer accountability, protected time for at least two years. Stop doing something else to make room. Judge a feedback policy by what pupils do with feedback, not by the volume of written comments. Do not relabel frequent summative testing as assessment for learning. Critiques and debate Size of the effect. Black and Wiliam's early headline effect sizes (often quoted as 0.4–0.7) have been challenged. Randy Bennett (2011) argued that formative assessment was too loosely defined for a single effect size to mean much, and Kingston and Nash's 2011 meta-analysis reported a much smaller average effect (around 0.2). Wiliam has since said that he regrets how the effect sizes were used. Implementation in England. The national Assessment for Learning strategy of the 2000s is widely judged to have failed. Wiliam's own account is that it was implemented as levels-tracking and target-setting rather than responsive teaching. Others argue that the looseness of the original idea made such distortion likely. Generic versus subject-specific. Daisy Christodoulou, in Making Good Progress? (2017), supports formative assessment but argues that AfL in practice leaned on generic skills and exam-style tasks, and should instead rest on specific, well-sequenced knowledge and precise questions. Wiliam wrote the foreword and broadly accepts the point. Learning intentions and peer assessment. Some teachers find routinely shared objectives and success criteria formulaic, and peer assessment is hard to do well with novices who lack the knowledge to judge quality. The EEF trial. The independent evaluation of the Embedding Formative Assessment programme found a positive effect on GCSE attainment equivalent to about two months' progress. This is supportive but modest compared with early claims."},{"slug":"eef-teacher-feedback-guidance","title":"EEF guidance: Teacher Feedback to Improve Pupil Learning","category":"assessment","type":"topic","summary":"The EEF's 2021 guidance report sets out six recommendations on feedback. Its core message: the principles of good feedback matter more than whether it is written or spoken.","status":"Evidence summary","evidence":"EEF Toolkit (feedback): +6 months, very low cost; evidence-strength rating not verified on the live page","tags":["feedback","eef","marking","feedback policy","formative assessment"],"checked":"2026-11-12","sources":[{"title":"Teacher Feedback to Improve Pupil Learning (guidance report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/feedback"},{"title":"Feedback (Teaching and Learning Toolkit strand)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback"},{"title":"EEF publishes new guidance report – 'Teacher Feedback to Improve Pupil Learning'","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/news/eef-publishes-new-guidance-report-teacher-feedback-to-improve-pupil-learning"},{"title":"Summary of the EEF's new guidance report: Teacher Feedback to Improve Pupil Learning","publisher":"Durrington Research School","year":"2021","url":"https://researchschool.org.uk/durrington/news/summary-of-the-eefs-new-guidance-report-teacher-feedback-to-improve-pupil-learning"}],"related":["marking-policy-and-workload","whole-class-feedback","live-marking-and-verbal-feedback","formative-assessment-five-strategies","dylan-wiliam"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Published by the Education Endowment Foundation in June 2021; it is non-statutory advice, not a DfE or Ofsted requirement.\u003c/li>\n\u003cli>Six recommendations: three on the principles of effective feedback, two on methods (written and verbal), one on school policy.\u003c/li>\n\u003cli>The report&#39;s central claim is that method (written or verbal) is likely to matter less than following the principles in recommendations 1–3.\u003c/li>\n\u003cli>The EEF Toolkit rates feedback at +6 months&#39; additional progress on average for very low cost, but effects vary widely and some studies find negative effects.\u003c/li>\n\u003cli>The practical test for any feedback: do pupils get time to use it, and does their work or understanding change as a result?\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>The report draws on a systematic review of feedback studies plus consultation with teachers. Its recommendations, in summary:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Lay the foundations.\u003c/strong> Feedback only works on top of good initial teaching and formative assessment that shows where pupils actually are. Feedback cannot repair poor instruction.\u003c/li>\n\u003cli>\u003cstrong>Deliver appropriately timed feedback that moves learning forward.\u003c/strong> There is no single best timing (immediate or delayed); the teacher judges this against the task, the pupil and the class. Feedback should focus on the task, the subject or the pupil&#39;s self-regulation strategies, not on the person (&quot;you&#39;re a natural at this&quot;) and not on vague general remarks.\u003c/li>\n\u003cli>\u003cstrong>Plan for how pupils will receive and use feedback.\u003c/strong> Motivation, self-confidence and trust in the teacher affect whether feedback lands. Pupils need an opportunity to act on it.\u003c/li>\n\u003cli>\u003cstrong>Use written feedback carefully.\u003c/strong> Written comments can work if they follow the principles, but they are costly in teacher time; the opportunity cost should be weighed.\u003c/li>\n\u003cli>\u003cstrong>Use verbal feedback carefully.\u003c/strong> It is time-efficient but must be just as purposeful as written feedback, not a stream of general praise.\u003c/li>\n\u003cli>\u003cstrong>Design a school feedback policy\u003c/strong> that prioritises and exemplifies the principles rather than specifying frequency or method.\u003c/li>\n\u003c/ol>\n\u003cp>Not verified: the exact wording of recommendations 3 and 5 could not be checked against the EEF page on the day of writing (the site was not reachable); the summaries above are in our own words and consistent with Research School summaries.\u003c/p>\n\u003cp>The Toolkit feedback strand reports an average of +6 months for very low cost. Search results for the live page describe the evidence as &quot;extensive&quot;, and suggest verbal feedback studies show slightly higher average effects (+7 months); older EEF materials describe the evidence as moderate. Check the live page before quoting the padlock rating.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Before feedback, check the teaching.\u003c/strong> If most of a Year 9 class has misread a graph question in science, the response is reteaching, not thirty individual comments.\u003c/li>\n\u003cli>\u003cstrong>Aim feedback at the task, subject or self-regulation.\u003c/strong> History: &quot;Your second paragraph describes the Treaty; add a sentence that explains \u003cem>why\u003c/em> it caused resentment.&quot; Maths: &quot;Check line 3: what happens to the sign when you multiply both sides by a negative?&quot; Self-regulation: &quot;Which of your success criteria did you check before handing this in?&quot;\u003c/li>\n\u003cli>\u003cstrong>Build in response time.\u003c/strong> Ten minutes at the start of the next lesson for redrafting one paragraph, re-attempting three questions or correcting a labelled diagram. Feedback with no response task is usually wasted.\u003c/li>\n\u003cli>\u003cstrong>Choose timing deliberately.\u003c/strong> Immediate correction suits a new procedure (balancing equations, verb endings in MFL); delayed feedback can suit extended writing where pupils benefit from attempting the whole task first.\u003c/li>\n\u003cli>\u003cstrong>Keep it manageable.\u003c/strong> Codes, whole-class feedback and live marking can all meet the principles at lower cost than extended written comments.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Rewrite feedback policies around principles, and let departments define what those look like in their subject. PE, art, maths and English should not be held to one format.\u003c/li>\n\u003cli>Remove frequency rules (&quot;every two weeks&quot;), colour-coding rules and requirements for written evidence of verbal feedback; none is supported by the report.\u003c/li>\n\u003cli>Monitor by looking at whether pupils&#39; work improves after feedback and by talking to pupils, not by counting comments in books.\u003c/li>\n\u003cli>Treat teacher time as the main cost. The Toolkit&#39;s &quot;very low cost&quot; refers to financial cost, mostly training; it does not price the hours spent marking.\u003c/li>\n\u003cli>Follow the EEF implementation guidance: introduce changes gradually, with exemplification and training, rather than by issuing a new policy document.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>The +6 months average hides large variation, including negative effects. An average across many different interventions does not guarantee that a given school&#39;s marking practice works.\u003c/li>\n\u003cli>Much of the underlying research is short-term, in particular subjects, or from outside English secondary schools. The EEF&#39;s earlier review of written marking, &#39;A Marked Improvement?&#39; (2016), found very little robust evidence on specific marking practices.\u003c/li>\n\u003cli>Some commentators argue the recommendations are sensible but general, leaving most of the real decisions to teacher judgement. That is arguably a faithful reflection of the evidence rather than a flaw.\u003c/li>\n\u003cli>&quot;Feedback&quot; in the research includes much more than marking; schools should not read the Toolkit figure as an endorsement of heavy written marking.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Read the full report and its recommendations poster on the EEF site (sources above).\u003c/li>\n\u003cli>Pair it with the EEF&#39;s implementation guidance when redesigning policy.\u003c/li>\n\u003cli>See the entries on marking policy and workload, whole-class feedback and live marking for the methods that follow from the principles.\u003c/li>\n\u003c/ul>\n","text":"At a glance Published by the Education Endowment Foundation in June 2021; it is non-statutory advice, not a DfE or Ofsted requirement. Six recommendations: three on the principles of effective feedback, two on methods (written and verbal), one on school policy. The report's central claim is that method (written or verbal) is likely to matter less than following the principles in recommendations 1–3. The EEF Toolkit rates feedback at +6 months' additional progress on average for very low cost, but effects vary widely and some studies find negative effects. The practical test for any feedback: do pupils get time to use it, and does their work or understanding change as a result? What the evidence says The report draws on a systematic review of feedback studies plus consultation with teachers. Its recommendations, in summary: Lay the foundations. Feedback only works on top of good initial teaching and formative assessment that shows where pupils actually are. Feedback cannot repair poor instruction. Deliver appropriately timed feedback that moves learning forward. There is no single best timing (immediate or delayed); the teacher judges this against the task, the pupil and the class. Feedback should focus on the task, the subject or the pupil's self-regulation strategies, not on the person (\"you're a natural at this\") and not on vague general remarks. Plan for how pupils will receive and use feedback. Motivation, self-confidence and trust in the teacher affect whether feedback lands. Pupils need an opportunity to act on it. Use written feedback carefully. Written comments can work if they follow the principles, but they are costly in teacher time; the opportunity cost should be weighed. Use verbal feedback carefully. It is time-efficient but must be just as purposeful as written feedback, not a stream of general praise. Design a school feedback policy that prioritises and exemplifies the principles rather than specifying frequency or method. Not verified: the exact wording of recommendations 3 and 5 could not be checked against the EEF page on the day of writing (the site was not reachable); the summaries above are in our own words and consistent with Research School summaries. The Toolkit feedback strand reports an average of +6 months for very low cost. Search results for the live page describe the evidence as \"extensive\", and suggest verbal feedback studies show slightly higher average effects (+7 months); older EEF materials describe the evidence as moderate. Check the live page before quoting the padlock rating. In the classroom Before feedback, check the teaching. If most of a Year 9 class has misread a graph question in science, the response is reteaching, not thirty individual comments. Aim feedback at the task, subject or self-regulation. History: \"Your second paragraph describes the Treaty; add a sentence that explains why it caused resentment.\" Maths: \"Check line 3: what happens to the sign when you multiply both sides by a negative?\" Self-regulation: \"Which of your success criteria did you check before handing this in?\" Build in response time. Ten minutes at the start of the next lesson for redrafting one paragraph, re-attempting three questions or correcting a labelled diagram. Feedback with no response task is usually wasted. Choose timing deliberately. Immediate correction suits a new procedure (balancing equations, verb endings in MFL); delayed feedback can suit extended writing where pupils benefit from attempting the whole task first. Keep it manageable. Codes, whole-class feedback and live marking can all meet the principles at lower cost than extended written comments. For leaders Rewrite feedback policies around principles, and let departments define what those look like in their subject. PE, art, maths and English should not be held to one format. Remove frequency rules (\"every two weeks\"), colour-coding rules and requirements for written evidence of verbal feedback; none is supported by the report. Monitor by looking at whether pupils' work improves after feedback and by talking to pupils, not by counting comments in books. Treat teacher time as the main cost. The Toolkit's \"very low cost\" refers to financial cost, mostly training; it does not price the hours spent marking. Follow the EEF implementation guidance: introduce changes gradually, with exemplification and training, rather than by issuing a new policy docu
