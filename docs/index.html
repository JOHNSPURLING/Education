ment. Cautions and critiques The +6 months average hides large variation, including negative effects. An average across many different interventions does not guarantee that a given school's marking practice works. Much of the underlying research is short-term, in particular subjects, or from outside English secondary schools. The EEF's earlier review of written marking, 'A Marked Improvement?' (2016), found very little robust evidence on specific marking practices. Some commentators argue the recommendations are sensible but general, leaving most of the real decisions to teacher judgement. That is arguably a faithful reflection of the evidence rather than a flaw. \"Feedback\" in the research includes much more than marking; schools should not read the Toolkit figure as an endorsement of heavy written marking. Go deeper Read the full report and its recommendations poster on the EEF site (sources above). Pair it with the EEF's implementation guidance when redesigning policy. See the entries on marking policy and workload, whole-class feedback and live marking for the methods that follow from the principles."},{"slug":"eef-teaching-and-learning-toolkit","title":"EEF Teaching and Learning Toolkit","category":"teaching","type":"topic","summary":"How to read and use the EEF's summary of around 30 approaches to raising attainment: what months of progress, padlocks and pound signs mean, and where the averages mislead.","status":"Evidence summary","evidence":"","tags":["eef","evidence","meta-analysis","pupil premium","school improvement"],"checked":"2026-11-12","sources":[{"title":"Teaching and Learning Toolkit","publisher":"Education Endowment Foundation","year":"2025","url":"https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit"},{"title":"Teaching and Learning / Early Years Toolkit guide (v3.0.0)","publisher":"Education Endowment Foundation","year":"2025","url":"https://d2tic4wvo1iusb.cloudfront.net/production/documents/toolkit/toolkit_guide_2025_v3.0.0.pdf"},{"title":"EEF launches comprehensive updates to ten strands of the Teaching and Learning Toolkit","publisher":"Education Endowment Foundation","year":"2025","url":"https://educationendowmentfoundation.org.uk/news/updates-ten-strands-toolkit"},{"title":"Our Teaching and Learning Toolkit - what are the risks and how do we address them?","publisher":"Education Endowment Foundation","year":"2018","url":"https://educationendowmentfoundation.org.uk/news/the-teaching-and-learning-toolkit-what-are-the-risks-and-how-do-we-address/"},{"title":"Exploring the Toolkit: impact, evidence strength and cost","publisher":"Bradford Research School","year":"2021","url":"https://researchschool.org.uk/bradford/news/exploring-the-toolkit-impact-evidence-strength-and-cost"},{"title":"EEF toolkit 'more akin to pig farming than science'","publisher":"Tes","year":"2018","url":"https://www.tes.com/magazine/archived/eef-toolkit-more-akin-pig-farming-science"}],"related":["great-teaching-toolkit"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>The Toolkit summarises international research on about 30 approaches (&#39;strands&#39;), from feedback and homework to setting, repeating a year and school uniform.\u003c/li>\n\u003cli>Each strand carries three ratings: \u003cstrong>impact\u003c/strong> (additional months of progress), \u003cstrong>cost\u003c/strong> (pound signs) and \u003cstrong>evidence strength\u003c/strong> (padlocks).\u003c/li>\n\u003cli>The months figure is an \u003cem>average across many studies\u003c/em> of different programmes, ages and countries. It is a starting point for a decision, not a prediction for your school.\u003c/li>\n\u003cli>Read the text under each headline: it gives the breakdown by phase and subject, what the effective versions had in common, and what implementation costs.\u003c/li>\n\u003cli>Since 2025 the EEF has described the Toolkit as a &#39;living&#39; review, with strands re-searched and updated on a rolling basis, so figures change. Check the live page before quoting a number.\u003c/li>\n\u003cli>It was designed for decisions about spending, particularly the pupil premium. It tells you &#39;what has worked on average&#39;, not &#39;what to do on Monday&#39;.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>What it is.\u003c/strong> The Toolkit began in 2011 as a Sutton Trust commission written by Steve Higgins and colleagues at Durham University, and became the EEF&#39;s flagship resource. Each strand pools the results of studies that meet set inclusion criteria and reports an average effect.\u003c/p>\n\u003cp>\u003cstrong>Months of progress.\u003c/strong> Studies report effect sizes (standardised mean differences). The EEF converts the pooled effect size into &#39;additional months of progress&#39;: how much further, on average, pupils receiving the approach moved in a year than similar pupils who did not. The conversion uses the progress a typical pupil makes in a year as the yardstick. It is a communication device rather than a literal measurement: nobody timed pupils&#39; progress in months.\u003c/p>\n\u003cp>\u003cstrong>Padlocks.\u003c/strong> The padlock rating (0–5) reflects how much trust to place in the average. It is driven first by the number of studies meeting the criteria, and padlocks are then removed for weaknesses such as few recent studies, few randomised trials, a high share of researcher-designed tests, or large unexplained variation between studies. Strands with too few eligible studies get no months figure at all. Not verified: the exact study-count thresholds for each padlock level; secondary summaries seen for this entry gave slightly different numbers, so use the EEF&#39;s own toolkit guide.\u003c/p>\n\u003cp>\u003cstrong>Cost.\u003c/strong> Pound signs estimate the \u003cem>additional\u003c/em> cost of delivering the approach for a class of pupils over a year (training, materials, staffing), in bands from very low to very high. Staff time already paid for is mostly not counted, which makes approaches that consume teacher time look cheaper than they feel.\u003c/p>\n\u003cp>\u003cstrong>Illustrative headline figures\u003c/strong> (seen in EEF pages and summaries during research for this entry; confirm on the live site):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Strand\u003c/th>\n\u003cth>Impact\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Metacognition and self-regulation\u003c/td>\n\u003ctd>+8 months (raised from +7 in the 2025 update)\u003c/td>\n\u003ctd>Very low/low cost\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Feedback\u003c/td>\n\u003ctd>+6 months\u003c/td>\n\u003ctd>Wide variation, including negative effects\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Homework\u003c/td>\n\u003ctd>+5 months\u003c/td>\n\u003ctd>Stronger in secondary than primary\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Collaborative learning approaches\u003c/td>\n\u003ctd>+5 months\u003c/td>\n\u003ctd>+6 in secondary\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Mastery learning\u003c/td>\n\u003ctd>+5 months\u003c/td>\n\u003ctd>Higher in maths and science than reading\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>The Toolkit is not a teaching manual, but teachers and heads of department can use it well:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Start with a problem, not a strand.\u003c/strong> &#39;Year 9 cannot plan extended writing&#39; leads you to metacognition and to the linked guidance report; browsing for the biggest number does not.\u003c/li>\n\u003cli>\u003cstrong>Read the &#39;How could you implement in your setting?&#39; and &#39;Behind the average&#39; sections.\u003c/strong> For homework, for example, the detail (linked to classwork, feedback given, not excessive) matters more than the +5.\u003c/li>\n\u003cli>\u003cstrong>Move from strand to guidance report.\u003c/strong> The EEF&#39;s guidance reports (metacognition, feedback, literacy, maths, science) turn the broad strand into specific recommendations. See the entries on metacognition and self-regulation and on the EEF teacher feedback guidance.\u003c/li>\n\u003cli>\u003cstrong>Treat labels with suspicion.\u003c/strong> &#39;Feedback&#39; in the research included computer-generated hints and laboratory tasks; it is not evidence for any particular marking policy.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Use the Toolkit to \u003cstrong>rule out weak bets and shortlist promising ones\u003c/strong>, then look for a specific, well-evaluated programme or a well-specified practice. The DfE&#39;s pupil premium guidance expects spending to be informed by evidence and points schools to the EEF.\u003c/li>\n\u003cli>Weigh \u003cstrong>all three ratings\u003c/strong>. A +4 with four padlocks at very low cost can be a better decision than a +6 with one padlock.\u003c/li>\n\u003cli>Low or negative averages are informative too: repeating a year and setting or streaming show little or no average benefit, with costs for some groups.\u003c/li>\n\u003cli>Budget for \u003cstrong>implementation\u003c/strong>: most disappointing results in EEF trials reflect poor take-up or fidelity rather than a bad idea. Pair the Toolkit with the EEF implementation guidance.\u003c/li>\n\u003cli>\u003cstrong>Evaluate locally.\u003c/strong> An average from other schools does not show that the approach worked in yours.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Averages hide variation.\u003c/strong> The EEF itself warns that each headline conceals a wide spread, and that the same approach can harm in some conditions.\u003c/li>\n\u003cli>\u003cstrong>Combining unlike studies.\u003c/strong> Critics including Adrian Simpson (Durham) argue that effect sizes depend on the test used, the sample and the comparison group, so averaging and ranking them across approaches is not valid. Terry Wrigley made a related criticism reported in Tes, noting that summing the months across strands gives an implausible total; the EEF&#39;s reply is that the figures are not additive and were never meant to be.\u003c/li>\n\u003cli>\u003cstrong>Strands are broad categories\u003c/strong>, not interventions. &#39;Digital technology&#39; or &#39;collaborative learning&#39; cover very different practices.\u003c/li>\n\u003cli>\u003cstrong>Much of the evidence is not from English secondary schools\u003c/strong>, and a good deal is older or from short studies with researcher-made tests.\u003c/li>\n\u003cli>\u003cstrong>League-table reading.\u003c/strong> Sorting by months and adopting the top three is exactly the misuse the EEF&#39;s own blog on Toolkit risks warns against.\u003c/li>\n\u003cli>\u003cstrong>Attainment only.\u003c/strong> Wellbeing, attendance, behaviour and enjoyment are largely outside its scope.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Read the EEF&#39;s toolkit guide (2025) for the current method, inclusion criteria and padlock rules.\u003c/li>\n\u003cli>The Bradford Research School explainer is a clear short introduction for staff CPD.\u003c/li>\n\u003cli>For the methodological argument, read Simpson&#39;s critique of comparing standardised effect sizes alongside the EEF&#39;s response on Toolkit risks.\u003c/li>\n\u003cli>See the entries on the Education Endowment Foundation and on the Great Teaching Toolkit, a complementary teacher-focused summary.\u003c/li>\n\u003c/ul>\n","text":"At a glance The Toolkit summarises international research on about 30 approaches ('strands'), from feedback and homework to setting, repeating a year and school uniform. Each strand carries three ratings: impact (additional months of progress), cost (pound signs) and evidence strength (padlocks). The months figure is an average across many studies of different programmes, ages and countries. It is a starting point for a decision, not a prediction for your school. Read the text under each headline: it gives the breakdown by phase and subject, what the effective versions had in common, and what implementation costs. Since 2025 the EEF has described the Toolkit as a 'living' review, with strands re-searched and updated on a rolling basis, so figures change. Check the live page before quoting a number. It was designed for decisions about spending, particularly the pupil premium. It tells you 'what has worked on average', not 'what to do on Monday'. What the evidence says What it is. The Toolkit began in 2011 as a Sutton Trust commission written by Steve Higgins and colleagues at Durham University, and became the EEF's flagship resource. Each strand pools the results of studies that meet set inclusion criteria and reports an average effect. Months of progress. Studies report effect sizes (standardised mean differences). The EEF converts the pooled effect size into 'additional months of progress': how much further, on average, pupils receiving the approach moved in a year than similar pupils who did not. The conversion uses the progress a typical pupil makes in a year as the yardstick. It is a communication device rather than a literal measurement: nobody timed pupils' progress in months. Padlocks. The padlock rating (0–5) reflects how much trust to place in the average. It is driven first by the number of studies meeting the criteria, and padlocks are then removed for weaknesses such as few recent studies, few randomised trials, a high share of researcher-designed tests, or large unexplained variation between studies. Strands with too few eligible studies get no months figure at all. Not verified: the exact study-count thresholds for each padlock level; secondary summaries seen for this entry gave slightly different numbers, so use the EEF's own toolkit guide. Cost. Pound signs estimate the additional cost of delivering the approach for a class of pupils over a year (training, materials, staffing), in bands from very low to very high. Staff time already paid for is mostly not counted, which makes approaches that consume teacher time look cheaper than they feel. Illustrative headline figures (seen in EEF pages and summaries during research for this entry; confirm on the live site): Strand Impact Notes Metacognition and self-regulation +8 months (raised from +7 in the 2025 update) Very low/low cost Feedback +6 months Wide variation, including negative effects Homework +5 months Stronger in secondary than primary Collaborative learning approaches +5 months +6 in secondary Mastery learning +5 months Higher in maths and science than reading In the classroom The Toolkit is not a teaching manual, but teachers and heads of department can use it well: Start with a problem, not a strand. 'Year 9 cannot plan extended writing' leads you to metacognition and to the linked guidance report; browsing for the biggest number does not. Read the 'How could you implement in your setting?' and 'Behind the average' sections. For homework, for example, the detail (linked to classwork, feedback given, not excessive) matters more than the +5. Move from strand to guidance report. The EEF's guidance reports (metacognition, feedback, literacy, maths, science) turn the broad strand into specific recommendations. See the entries on metacognition and self-regulation and on the EEF teacher feedback guidance. Treat labels with suspicion. 'Feedback' in the research included computer-generated hints and laboratory tasks; it is not evidence for any particular marking policy. For leaders Use the Toolkit to rule out weak bets and shortlist promising ones , then look for a specific, well-evaluated programme or a well-specified practice. The DfE's pupil premium guidance expects spending to be informed by evidence and points schools to the EEF. Weigh all three ratings . A +4 with four padlocks at very low cost can be a better decision than a +6 with one padlock. Low or negative averages are informative too: repeating a year and setting or streaming show little or no average benefit, with costs for some groups. Budget for implementation : most disappointing results in EEF trials reflect poor take-up or fidelity rather than a bad idea. Pair the Toolkit with the EEF implementation guidance. Evaluate locally. An average from other schools does not show that the approach worked in yours. Cautions and critiques Averages hide variation. The EEF itself warns that each headline conceals a wide spread, and that the same approach can harm in some conditions. Combining unlike studies. Critics including Adrian Simpson (Durham) argue that effect sizes depend on the test used, the sample and the comparison group, so averaging and ranking them across approaches is not valid. Terry Wrigley made a related criticism reported in Tes, noting that summing the months across strands gives an implausible total; the EEF's reply is that the figures are not additive and were never meant to be. Strands are broad categories , not interventions. 'Digital technology' or 'collaborative learning' cover very different practices. Much of the evidence is not from English secondary schools , and a good deal is older or from short studies with researcher-made tests. League-table reading. Sorting by months and adopting the top three is exactly the misuse the EEF's own blog on Toolkit risks warns against. Attainment only. Wellbeing, attendance, behaviour and enjoyment are largely outside its scope. Go deeper Read the EEF's toolkit guide (2025) for the current method, inclusion criteria and padlock rules. The Bradford Research School explainer is a clear short introduction for staff CPD. For the methodological argument, read Simpson's critique of comparing standardised effect sizes alongside the EEF's response on Toolkit risks. See the entries on the Education Endowment Foundation and on the Great Teaching Toolkit, a complementary teacher-focused summary."},{"slug":"explicit-instruction","title":"Explicit instruction","category":"teaching","type":"topic","summary":"Teacher-led teaching of new content through clear explanation, modelling, guided practice and checks before independent work. Strong evidence for novices; debate about how far it extends.","status":"Research and theory","evidence":"","tags":["explicit instruction","direct instruction","guided practice","novices","inquiry debate"],"checked":"2026-11-12","sources":[{"title":"Why Minimal Guidance During Instruction Does Not Work (Kirschner, Sweller and Clark, Educational Psychologist 41(2))","publisher":"Open Universiteit research portal","year":"2006","url":"https://research.ou.nl/en/publications/why-minimal-guidance-during-instruction-does-not-work-an-analysis/"},{"title":"American Educator, Spring 2012 (includes Clark, Kirschner and Sweller, 'Putting Students on the Path to Learning', and Rosenshine, 'Principles of Instruction')","publisher":"American Federation of Teachers","year":"2012","url":"https://www.aft.org/ae/spring2012"},{"title":"EEF blog: What exactly is explicit instruction?","publisher":"Education Endowment Foundation","year":"2022","url":"https://educationendowmentfoundation.org.uk/news/eef-blog-what-exactly-is-explicit-instruction"},{"title":"Initial teacher training and early career framework","publisher":"Department for Education","year":"2024","url":"https://www.gov.uk/government/publications/initial-teacher-training-and-early-career-framework"},{"title":"Cognitive load theory: Research that teachers really need to understand","publisher":"NSW Centre for Education Statistics and Evaluation","year":"2017","url":"https://education.nsw.gov.au/about-us/education-data-and-research/cese/publications/literature-reviews/cognitive-load-theory.html"}],"related":["rosenshine-principles-of-instruction","cognitive-load-theory","john-sweller"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Explicit instruction means the teacher tells and shows pupils what they need to know and do, then moves them through guided practice to independent practice, checking understanding throughout. &#39;I do, we do, you do&#39; is the common shorthand.\u003c/li>\n\u003cli>It is not lecturing. It is highly interactive: frequent questions, whole-class responses and practice.\u003c/li>\n\u003cli>The evidence that novices learn new, complex material better with full guidance than by discovering it is strong and comes from several research traditions.\u003c/li>\n\u003cli>As pupils gain expertise, guidance should be faded; fully guided teaching of experts can be redundant.\u003c/li>\n\u003cli>It is one of the EEF&#39;s &#39;five-a-day&#39; strategies for pupils with SEND and is embedded in the DfE&#39;s initial teacher training and early career framework (in force from September 2025).\u003c/li>\n\u003cli>Lower-case &#39;explicit&#39; or &#39;direct&#39; instruction is a broad approach; capitalised Direct Instruction is Engelmann&#39;s scripted programmes (see the separate entry).\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>Three strands of evidence point the same way:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Classroom observation research\u003c/strong> (summarised by Rosenshine): teachers whose classes gained most presented in small steps, modelled, questioned heavily and guided practice before independent work.\u003c/li>\n\u003cli>\u003cstrong>Cognitive load research.\u003c/strong> Kirschner, Sweller and Clark (2006) argued that minimally guided approaches (pure discovery, unstructured problem-based or inquiry learning) overload novices&#39; working memory, and that decades of controlled studies favour strong guidance. Their 2012 \u003cem>American Educator\u003c/em> article restates the case for teachers.\u003c/li>\n\u003cli>\u003cstrong>Programme evaluations and reviews\u003c/strong>, including the Direct Instruction literature and reviews of interventions for pupils with learning difficulties, where explicit teaching repeatedly features in effective programmes. The EEF&#39;s guidance on SEND in mainstream schools draws on this.\u003c/li>\n\u003c/ul>\n\u003cp>The EEF describes explicit instruction as teacher-led: clear explanation, modelling and frequent checks, then guided practice, then independent practice. The DfE framework for new teachers includes the same sequence under &#39;classroom practice&#39; and &#39;how pupils learn&#39;.\u003c/p>\n\u003cp>There is no single EEF Toolkit &#39;explicit instruction&#39; strand with a months-of-progress figure; do not quote one.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>A Year 9 English lesson on writing an analytical paragraph:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>State the goal and activate prior knowledge.\u003c/strong> &#39;Today you will write a paragraph that embeds a quotation and explains a writer&#39;s choice.&#39; Quick retrieval of what &#39;connotation&#39; means.\u003c/li>\n\u003cli>\u003cstrong>Explain in small steps.\u003c/strong> Teach embedding a quotation before teaching analysis of a single word.\u003c/li>\n\u003cli>\u003cstrong>I do.\u003c/strong> Write a paragraph live under the visualiser, thinking aloud: &#39;I&#39;m choosing &quot;prowled&quot; because the verb does the work; I won&#39;t copy the whole sentence.&#39;\u003c/li>\n\u003cli>\u003cstrong>Show a non-example.\u003c/strong> A weak paragraph with a dropped-in quotation; pupils say what is wrong.\u003c/li>\n\u003cli>\u003cstrong>We do.\u003c/strong> Co-construct a second paragraph on a new quotation by cold call; pupils write each sentence on mini-whiteboards before you take one.\u003c/li>\n\u003cli>\u003cstrong>Check.\u003c/strong> Every pupil writes one embedded quotation and holds it up. If many are wrong, re-model. If a few are, pull a small group while others start.\u003c/li>\n\u003cli>\u003cstrong>You do.\u003c/strong> Independent paragraph, in silence, with a sentence-starter scaffold available and then withdrawn next lesson.\u003c/li>\n\u003cli>\u003cstrong>Review\u003c/strong> next lesson and again later in the term.\u003c/li>\n\u003c/ol>\n\u003cp>Common slips: explanations that run for 20 minutes without pupils doing anything; skipping &#39;we do&#39;; and releasing to independent work on the strength of two confident volunteers.\u003c/p>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Explicit instruction is a sensible \u003cstrong>default for new content\u003c/strong>, particularly at Key Stage 3 and for pupils with gaps in prior knowledge. Policy should say &#39;default&#39;, not &#39;only&#39;.\u003c/li>\n\u003cli>It depends on \u003cstrong>curriculum sequencing and subject knowledge\u003c/strong>: teachers cannot break content into steps they have not analysed. Give departments planning time for shared explanations, models and practice sets.\u003c/li>\n\u003cli>Develop it through coaching on specific moves (clear explanation, modelling, checking) and avoid prescribing timings for each phase.\u003c/li>\n\u003cli>Cost is low. Mini-whiteboards and visualisers are the main kit.\u003c/li>\n\u003cli>Watch for over-scaffolding: monitor whether pupils in Years 10–13 are writing and solving independently at length.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>The 2006 paper was contested.\u003c/strong> Hmelo-Silver, Duncan and Chinn (2007) replied that well-designed problem-based and inquiry learning is heavily scaffolded, not &#39;minimally guided&#39;, so the paper attacked a straw man. A more recent exchange (Zhang, Kirschner, Cobern and Sweller 2022; de Jong and colleagues 2023) ended with the latter arguing for combining inquiry and direct instruction.\u003c/li>\n\u003cli>\u003cstrong>Sequencing may be open.\u003c/strong> Work on &#39;productive failure&#39; (Manu Kapur) finds that, for some conceptual content, attempting problems before instruction can aid later understanding. Explicit instruction still follows; the dispute is about order.\u003c/li>\n\u003cli>\u003cstrong>Expertise reversal.\u003c/strong> Heavy guidance helps novices and can hinder more advanced learners, which matters for sixth-form teaching.\u003c/li>\n\u003cli>\u003cstrong>Aims beyond acquisition.\u003c/strong> Critics argue that disciplinary practices such as designing an investigation, sustained argument or making in the arts need extended, less-structured practice, and that these can be squeezed out.\u003c/li>\n\u003cli>\u003cstrong>Poor versions.\u003c/strong> Teacher talk without checking, or scripted slides delivered identically to every class, is not what the research tested.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Clark, Kirschner and Sweller&#39;s 2012 article is the most readable statement of the case; read Hmelo-Silver et al. (2007) for the reply.\u003c/li>\n\u003cli>Archer and Hughes, \u003cem>Explicit Instruction: Effective and Efficient Teaching\u003c/em> (2011), is the standard practical handbook.\u003c/li>\n\u003cli>See the entries on Rosenshine&#39;s principles, cognitive load theory, modelling and worked examples, and Direct Instruction (Engelmann).\u003c/li>\n\u003c/ul>\n","text":"At a glance Explicit instruction means the teacher tells and shows pupils what they need to know and do, then moves them through guided practice to independent practice, checking understanding throughout. 'I do, we do, you do' is the common shorthand. It is not lecturing. It is highly interactive: frequent questions, whole-class responses and practice. The evidence that novices learn new, complex material better with full guidance than by discovering it is strong and comes from several research traditions. As pupils gain expertise, guidance should be faded; fully guided teaching of experts can be redundant. It is one of the EEF's 'five-a-day' strategies for pupils with SEND and is embedded in the DfE's initial teacher training and early career framework (in force from September 2025). Lower-case 'explicit' or 'direct' instruction is a broad approach; capitalised Direct Instruction is Engelmann's scripted programmes (see the separate entry). What the evidence says Three strands of evidence point the same way: Classroom observation research (summarised by Rosenshine): teachers whose classes gained most presented in small steps, modelled, questioned heavily and guided practice before independent work. Cognitive load research. Kirschner, Sweller and Clark (2006) argued that minimally guided approaches (pure discovery, unstructured problem-based or inquiry learning) overload novices' working memory, and that decades of controlled studies favour strong guidance. Their 2012 American Educator article restates the case for teachers. Programme evaluations and reviews , including the Direct Instruction literature and reviews of interventions for pupils with learning difficulties, where explicit teaching repeatedly features in effective programmes. The EEF's guidance on SEND in mainstream schools draws on this. The EEF describes explicit instruction as teacher-led: clear explanation, modelling and frequent checks, then guided practice, then independent practice. The DfE framework for new teachers includes the same sequence under 'classroom practice' and 'how pupils learn'. There is no single EEF Toolkit 'explicit instruction' strand with a months-of-progress figure; do not quote one. In the classroom A Year 9 English lesson on writing an analytical paragraph: State the goal and activate prior knowledge. 'Today you will write a paragraph that embeds a quotation and explains a writer's choice.' Quick retrieval of what 'connotation' means. Explain in small steps. Teach embedding a quotation before teaching analysis of a single word. I do. Write a paragraph live under the visualiser, thinking aloud: 'I'm choosing \"prowled\" because the verb does the work; I won't copy the whole sentence.' Show a non-example. A weak paragraph with a dropped-in quotation; pupils say what is wrong. We do. Co-construct a second paragraph on a new quotation by cold call; pupils write each sentence on mini-whiteboards before you take one. Check. Every pupil writes one embedded quotation and holds it up. If many are wrong, re-model. If a few are, pull a small group while others start. You do. Independent paragraph, in silence, with a sentence-starter scaffold available and then withdrawn next lesson. Review next lesson and again later in the term. Common slips: explanations that run for 20 minutes without pupils doing anything; skipping 'we do'; and releasing to independent work on the strength of two confident volunteers. For leaders Explicit instruction is a sensible default for new content , particularly at Key Stage 3 and for pupils with gaps in prior knowledge. Policy should say 'default', not 'only'. It depends on curriculum sequencing and subject knowledge : teachers cannot break content into steps they have not analysed. Give departments planning time for shared explanations, models and practice sets. Develop it through coaching on specific moves (clear explanation, modelling, checking) and avoid prescribing timings for each phase. Cost is low. Mini-whiteboards and visualisers are the main kit. Watch for over-scaffolding: monitor whether pupils in Years 10–13 are writing and solving independently at length. Cautions and critiques The 2006 paper was contested. Hmelo-Silver, Duncan and Chinn (2007) replied that well-designed problem-based and inquiry learning is heavily scaffolded, not 'minimally guided', so the paper attacked a straw man. A more recent exchange (Zhang, Kirschner, Cobern and Sweller 2022; de Jong and colleagues 2023) ended with the latter arguing for combining inquiry and direct instruction. Sequencing may be open. Work on 'productive failure' (Manu Kapur) finds that, for some conceptual content, attempting problems before instruction can aid later understanding. Explicit instruction still follows; the dispute is about order. Expertise reversal. Heavy guidance helps novices and can hinder more advanced learners, which matters for sixth-form teaching. Aims beyond acquisition. Critics argue that disciplinary practices such as designing an investigation, sustained argument or making in the arts need extended, less-structured practice, and that these can be squeezed out. Poor versions. Teacher talk without checking, or scripted slides delivered identically to every class, is not what the research tested. Go deeper Clark, Kirschner and Sweller's 2012 article is the most readable statement of the case; read Hmelo-Silver et al. (2007) for the reply. Archer and Hughes, Explicit Instruction: Effective and Efficient Teaching (2011), is the standard practical handbook. See the entries on Rosenshine's principles, cognitive load theory, modelling and worked examples, and Direct Instruction (Engelmann)."},{"slug":"formative-assessment-five-strategies","title":"Formative assessment: the five strategies","category":"assessment","type":"topic","summary":"Wiliam and colleagues' five key strategies turn 'assessment for learning' into classroom practice. The EEF trial of Embedding Formative Assessment found a small positive effect on GCSE results.","status":"Research and theory","evidence":"EEF trial of Embedding Formative Assessment (2018): +2 months on Attainment 8, effect size 0.10, very high security rating","tags":["formative assessment","assessment for learning","dylan wiliam","responsive teaching","feedback"],"checked":"2026-11-12","sources":[{"title":"Embedding Formative Assessment (project page and evaluation)","publisher":"Education Endowment Foundation","year":"2018","url":"https://educationendowmentfoundation.org.uk/projects-and-evaluation/projects/embedding-formative-assessment/"},{"title":"Embedding Formative Assessment: Evaluation report and executive summary","publisher":"NIESR for the Education Endowment Foundation (archived on DERA)","year":"2018","url":"https://dera.ioe.ac.uk//32012/1/EFA_evaluation_report.pdf"},{"title":"Classroom Assessment: Minute by Minute, Day by Day","publisher":"ASCD, Educational Leadership 63(3)","year":"2005","url":"https://ascd.org/el/articles/classroom-assessment-minute-by-minute-day-by-day"},{"title":"Embedding Formative Assessment (promising programme page)","publisher":"Education Endowment Foundation","year":"2023","url":"https://educationendowmentfoundation.org.uk/projects-and-evaluation/promising-programmes/embedding-formative-assessment"}],"related":["dylan-wiliam","hinge-and-diagnostic-questions","self-and-peer-assessment","eef-teacher-feedback-guidance"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Formative assessment means using evidence of what pupils know to change what happens next in teaching, within the lesson or the next one. It is a process, not a type of test.\u003c/li>\n\u003cli>Black and Wiliam&#39;s &#39;Inside the Black Box&#39; (1998) made the case that it raises attainment; Leahy, Lyon, Thompson and Wiliam (2005) organised it into five key strategies.\u003c/li>\n\u003cli>The EEF-funded trial of the Embedding Formative Assessment (EFA) programme in 140 English secondary schools found about two months&#39; additional progress on Attainment 8.\u003c/li>\n\u003cli>In England, &quot;AfL&quot; was widely distorted in the 2000s into sharing levels and objectives on the board. The five strategies are the corrective.\u003c/li>\n\u003cli>The single most useful habit: plan the question or task that will tell you whether to move on, and decide in advance what you will do with each likely answer.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>The five strategies\u003c/strong> (paraphrased from Leahy et al., 2005, and Wiliam&#39;s &#39;Embedded Formative Assessment&#39;, 2011; second edition 2018):\u003c/p>\n\u003col>\n\u003cli>Clarify, share and understand learning intentions and success criteria.\u003c/li>\n\u003cli>Engineer discussions, tasks and activities that elicit evidence of learning.\u003c/li>\n\u003cli>Provide feedback that moves learners forward.\u003c/li>\n\u003cli>Activate pupils as learning resources for one another.\u003c/li>\n\u003cli>Activate pupils as owners of their own learning.\u003c/li>\n\u003c/ol>\n\u003cp>They come from crossing three questions (where the learner is going, where they are now, how to get there) with three agents (teacher, peer, learner).\u003c/p>\n\u003cp>\u003cstrong>&#39;Inside the Black Box&#39; (1998)\u003c/strong> summarised Black and Wiliam&#39;s research review and reported typical effect sizes of roughly 0.4 to 0.7 for formative assessment interventions. That is a range across heterogeneous studies, not a pooled estimate, and later work has been more cautious (see critiques).\u003c/p>\n\u003cp>\u003cstrong>The EFA trial.\u003c/strong> The programme, written by Dylan Wiliam and Siobhan Leahy and delivered by SSAT, is a two-year professional development model: monthly 75-minute Teacher Learning Community workshops for groups of 8–14 staff, with peer observation in between. The independent evaluation by NIESR (140 schools, about 25,000 pupils who began in Year 10 in 2015) found an effect size of 0.10 on Attainment 8, which the EEF converts to two months&#39; progress and rates as very high security. The result was statistically significant only at the 10% level, and there was no evidence of improvement in English or maths GCSE specifically. The EEF lists EFA as a promising programme and has funded scale-up.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Strategy 1.\u003c/strong> Show pupils what quality looks like rather than reading out an objective. In Year 8 history, compare two anonymised paragraphs explaining causes of the Civil War and have pupils say which is better and why, before they write their own.\u003c/li>\n\u003cli>\u003cstrong>Strategy 2.\u003c/strong> Use all-pupil response: mini-whiteboards for a balancing-equations question in chemistry; a multiple-choice hinge question answered with fingers in maths; cold call rather than hands up, with thinking time. Plan the question before the lesson.\u003c/li>\n\u003cli>\u003cstrong>Strategy 3.\u003c/strong> Give feedback as a task: &quot;Find and fix the two sentences where the tense slips&quot; (MFL), rather than a grade and &quot;check tenses&quot;.\u003c/li>\n\u003cli>\u003cstrong>Strategy 4.\u003c/strong> Structured peer work: pupils swap PE performance checklists or use &quot;two stars and a wish&quot; only once they have been trained on a model; use &quot;C3B4ME&quot; (see three peers before the teacher) during independent practice.\u003c/li>\n\u003cli>\u003cstrong>Strategy 5.\u003c/strong> Pupils flag confidence after a quiz, keep an error log in maths, or select which exam question type to practise from their own mock analysis.\u003c/li>\n\u003c/ul>\n\u003cp>Then respond: if a third of the class picks the same wrong option, reteach now; if three pupils do, pull them together while the rest practise.\u003c/p>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>The trial tested a sustained, two-year, teacher-led programme. A single INSET day on &quot;AfL strategies&quot; is not the same intervention.\u003c/li>\n\u003cli>Teacher Learning Communities need protected time (monthly meetings in directed time) and voluntary choice of techniques within the five strategies.\u003c/li>\n\u003cli>Costs in the trial were low per pupil; the main cost is staff time.\u003c/li>\n\u003cli>Do not monitor by checklist (&quot;lolly sticks seen&quot;, &quot;objectives on the board&quot;). Look for whether teachers adjust teaching in response to evidence.\u003c/li>\n\u003cli>Align with the feedback and marking policy so formative work in lessons replaces, not adds to, written marking.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Definition problems.\u003c/strong> Randy Bennett&#39;s 2011 critical review argued that &quot;formative assessment&quot; is too loosely defined to have a single effect size and that the 0.4–0.7 claim is not well founded. Kingston and Nash&#39;s 2011 meta-analysis reported a much smaller average effect (around 0.2).\u003c/li>\n\u003cli>\u003cstrong>The letter without the spirit.\u003c/strong> Research on England&#39;s national AfL rollout found many teachers adopted surface procedures (traffic lights, written objectives) without changing teaching. Wiliam has called the government&#39;s AfL strategy a missed opportunity.\u003c/li>\n\u003cli>\u003cstrong>Generic versus subject-specific.\u003c/strong> Critics including Christodoulou argue formative assessment depends on a well-specified curriculum and good questions in each subject; generic techniques are not enough.\u003c/li>\n\u003cli>\u003cstrong>Modest trial effect.\u003c/strong> 0.10 is small, though meaningful at whole-school scale and cheap. Schools should not expect dramatic gains.\u003c/li>\n\u003cli>Self-reports of confidence (strategy 5) are unreliable guides to actual learning; pair them with a check.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Black and Wiliam, &#39;Inside the Black Box&#39; (1998); Wiliam, &#39;Embedded Formative Assessment&#39; (2nd ed., 2018); Wiliam and Leahy, &#39;Embedding Formative Assessment&#39; (2015).\u003c/li>\n\u003cli>EEF project page and NIESR evaluation report (sources above).\u003c/li>\n\u003cli>Harry Fletcher-Wood&#39;s &#39;Responsive Teaching&#39; (2018) reworks the strategies around curriculum planning.\u003c/li>\n\u003c/ul>\n","text":"At a glance Formative assessment means using evidence of what pupils know to change what happens next in teaching, within the lesson or the next one. It is a process, not a type of test. Black and Wiliam's 'Inside the Black Box' (1998) made the case that it raises attainment; Leahy, Lyon, Thompson and Wiliam (2005) organised it into five key strategies. The EEF-funded trial of the Embedding Formative Assessment (EFA) programme in 140 English secondary schools found about two months' additional progress on Attainment 8. In England, \"AfL\" was widely distorted in the 2000s into sharing levels and objectives on the board. The five strategies are the corrective. The single most useful habit: plan the question or task that will tell you whether to move on, and decide in advance what you will do with each likely answer. What the evidence says The five strategies (paraphrased from Leahy et al., 2005, and Wiliam's 'Embedded Formative Assessment', 2011; second edition 2018): Clarify, share and understand learning intentions and success criteria. Engineer discussions, tasks and activities that elicit evidence of learning. Provide feedback that moves learners forward. Activate pupils as learning resources for one another. Activate pupils as owners of their own learning. They come from crossing three questions (where the learner is going, where they are now, how to get there) with three agents (teacher, peer, learner). 'Inside the Black Box' (1998) summarised Black and Wiliam's research review and reported typical effect sizes of roughly 0.4 to 0.7 for formative assessment interventions. That is a range across heterogeneous studies, not a pooled estimate, and later work has been more cautious (see critiques). The EFA trial. The programme, written by Dylan Wiliam and Siobhan Leahy and delivered by SSAT, is a two-year professional development model: monthly 75-minute Teacher Learning Community workshops for groups of 8–14 staff, with peer observation in between. The independent evaluation by NIESR (140 schools, about 25,000 pupils who began in Year 10 in 2015) found an effect size of 0.10 on Attainment 8, which the EEF converts to two months' progress and rates as very high security. The result was statistically significant only at the 10% level, and there was no evidence of improvement in English or maths GCSE specifically. The EEF lists EFA as a promising programme and has funded scale-up. In the classroom Strategy 1. Show pupils what quality looks like rather than reading out an objective. In Year 8 history, compare two anonymised paragraphs explaining causes of the Civil War and have pupils say which is better and why, before they write their own. Strategy 2. Use all-pupil response: mini-whiteboards for a balancing-equations question in chemistry; a multiple-choice hinge question answered with fingers in maths; cold call rather than hands up, with thinking time. Plan the question before the lesson. Strategy 3. Give feedback as a task: \"Find and fix the two sentences where the tense slips\" (MFL), rather than a grade and \"check tenses\". Strategy 4. Structured peer work: pupils swap PE performance checklists or use \"two stars and a wish\" only once they have been trained on a model; use \"C3B4ME\" (see three peers before the teacher) during independent practice. Strategy 5. Pupils flag confidence after a quiz, keep an error log in maths, or select which exam question type to practise from their own mock analysis. Then respond: if a third of the class picks the same wrong option, reteach now; if three pupils do, pull them together while the rest practise. For leaders The trial tested a sustained, two-year, teacher-led programme. A single INSET day on \"AfL strategies\" is not the same intervention. Teacher Learning Communities need protected time (monthly meetings in directed time) and voluntary choice of techniques within the five strategies. Costs in the trial were low per pupil; the main cost is staff time. Do not monitor by checklist (\"lolly sticks seen\", \"objectives on the board\"). Look for whether teachers adjust teaching in response to evidence. Align with the feedback and marking policy so formative work in lessons replaces, not adds to, written marking. Cautions and critiques Definition problems. Randy Bennett's 2011 critical review argued that \"formative assessment\" is too loosely defined to have a single effect size and that the 0.4–0.7 claim is not well founded. Kingston and Nash's 2011 meta-analysis reported a much smaller average effect (around 0.2). The letter without the spirit. Research on England's national AfL rollout found many teachers adopted surface procedures (traffic lights, written objectives) without changing teaching. Wiliam has called the government's AfL strategy a missed opportunity. Generic versus subject-specific. Critics including Christodoulou argue formative assessment depends on a well-specified curriculum and good questions in each subject; generic techniques are not enough. Modest trial effect. 0.10 is small, though meaningful at whole-school scale and cheap. Schools should not expect dramatic gains. Self-reports of confidence (strategy 5) are unreliable guides to actual learning; pair them with a check. Go deeper Black and Wiliam, 'Inside the Black Box' (1998); Wiliam, 'Embedded Formative Assessment' (2nd ed., 2018); Wiliam and Leahy, 'Embedding Formative Assessment' (2015). EEF project page and NIESR evaluation report (sources above). Harry Fletcher-Wood's 'Responsive Teaching' (2018) reworks the strategies around curriculum planning."},{"slug":"great-teaching-toolkit","title":"Great Teaching Toolkit","category":"teaching","type":"topic","summary":"Evidence Based Education's 2020 evidence review and model of great teaching: four dimensions and 17 elements that teachers can work on, plus a linked professional development platform.","status":"Evidence summary","evidence":"","tags":["teacher development","evidence review","rob coe","professional development","teaching quality"],"checked":"2026-11-12","sources":[{"title":"The Great Teaching Toolkit: Evidence Review","publisher":"Evidence Based Education","year":"2020","url":"https://evidencebased.education/resource/the-great-teaching-toolkit-evidence-review/"},{"title":"Great Teaching Toolkit: Evidence Review (introduction, PDF)","publisher":"Evidence Based Education / Cambridge Assessment International Education","year":"2020","url":"https://www.cambridgeinternational.org/Images/584544-great-teaching-toolkit-evidence-review-introduction.pdf"},{"title":"Great Teaching Toolkit (partner page)","publisher":"Cambridge International","year":"2020","url":"https://www.cambridgeinternational.org/support-and-training-for-schools/teaching-cambridge-at-your-school/great-teaching-toolkit"}],"related":["eef-teaching-and-learning-toolkit","rosenshine-principles-of-instruction"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>A free evidence review (June 2020) by Rob Coe, C.J. Rauch, Stuart Kime and Dan Singleton, published by Evidence Based Education (EBE) with Cambridge Assessment International Education.\u003c/li>\n\u003cli>It answers one question: what are the best bets for teachers to work on to improve pupil learning?\u003c/li>\n\u003cli>The answer is a \u003cstrong>Model for Great Teaching\u003c/strong>: four dimensions, broken into 17 elements.\u003c/li>\n\u003cli>The model is a curriculum for teacher learning, not a rubric for grading lessons.\u003c/li>\n\u003cli>&#39;Great Teaching Toolkit&#39; also names EBE&#39;s paid online platform (courses, pupil surveys and feedback tools) built on the review. The review can be used on its own.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>The authors reviewed existing research and teaching frameworks (EBE describes it as distilling over 100 frameworks and studies) and looked for teacher knowledge and behaviours with the strongest links to pupil outcomes. The review was commented on by an international group of advisers before publication. It builds on the 2014 Sutton Trust report \u003cem>What Makes Great Teaching?\u003c/em>, which Coe also led.\u003c/p>\n\u003cp>The four dimensions and their elements are:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dimension\u003c/th>\n\u003cth>Elements\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1. Understanding the content\u003c/strong>\u003c/td>\n\u003ctd>Deep subject knowledge; knowledge of curriculum sequencing; knowledge of tasks, assessments and explanations; knowledge of common misconceptions and sticking points\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2. Creating a supportive environment\u003c/strong>\u003c/td>\n\u003ctd>Respectful teacher–pupil relationships; a positive climate among pupils; promoting motivation; high expectations with challenge and trust\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3. Maximising opportunity to learn\u003c/strong>\u003c/td>\n\u003ctd>Managing time and resources efficiently; clear, consistently applied rules and expectations; preventing and responding to disruption\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>4. Activating hard thinking\u003c/strong>\u003c/td>\n\u003ctd>Structuring; explaining; questioning; interacting (feedback); embedding (practice and retrieval); activating (metacognition and independence)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Two features distinguish it from lists such as Rosenshine&#39;s. First, it gives equal standing to subject knowledge, climate and behaviour, not only instruction. Second, it is explicit that the evidence varies: the authors describe the elements as &#39;best bets&#39; and acknowledge that much underlying research is correlational, that the links between teacher behaviours and outcomes are modest, and that the model will need revising.\u003c/p>\n\u003cp>\u003cstrong>How it differs from the EEF Toolkit.\u003c/strong> The EEF Toolkit ranks school-level approaches by average impact, cost and evidence strength, for spending decisions. The Great Teaching Toolkit gives no months-of-progress figures; it maps the components of individual classroom practice for professional development.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>For an individual secondary teacher, the model works as a self-audit followed by narrow, deliberate improvement:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Pick one element.\u003c/strong> For example 4.3 Questioning, or 3.1 managing time (starts and transitions).\u003c/li>\n\u003cli>\u003cstrong>Get a baseline.\u003c/strong> Film ten minutes of a lesson, ask a colleague to tally who answers questions, or use a short pupil survey. In a Year 10 history lesson, a tally might show that eight pupils answered every question.\u003c/li>\n\u003cli>\u003cstrong>Choose one specific technique\u003c/strong> linked to the element, such as cold calling with wait time, or a hinge question before independent work.\u003c/li>\n\u003cli>\u003cstrong>Practise it for several weeks\u003c/strong> with the same class, with feedback from a coach or peer.\u003c/li>\n\u003cli>\u003cstrong>Re-measure\u003c/strong>, then move on.\u003c/li>\n\u003c/ol>\n\u003cp>The &#39;understanding the content&#39; dimension is a prompt for departments: time spent in department meetings collecting the common misconceptions for the next unit (for example &#39;heavier objects fall faster&#39;, or &#39;the Treaty of Versailles caused the Second World War&#39;) directly builds element 1.4.\u003c/p>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Use the model to \u003cstrong>structure a professional development curriculum\u003c/strong> and to check its balance. Many school programmes sit almost entirely in dimension 4 and neglect subject knowledge.\u003c/li>\n\u003cli>It supports \u003cstrong>teacher choice\u003c/strong>: staff select an element relevant to their classes, within a common framework. This fits instructional coaching well.\u003c/li>\n\u003cli>\u003cstrong>Do not turn the 17 elements into an observation grid.\u003c/strong> The authors argue the model is for development; the research on grading lessons by observation (which Coe has long criticised) shows poor reliability.\u003c/li>\n\u003cli>The EBE platform is a subscription product. Not verified: current pricing, course list and the detail of its feedback tools; check EBE&#39;s site. No independent trial of the platform&#39;s impact on pupil attainment was found while researching this entry.\u003c/li>\n\u003cli>The review itself is free, so the cost of using the model is staff time.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Best bets, not proven recipes.\u003c/strong> Evidence that a behaviour is associated with better outcomes is not evidence that training teachers in it will raise attainment.\u003c/li>\n\u003cli>\u003cstrong>Generic by design.\u003c/strong> The elements are subject-neutral; how &#39;explaining&#39; or &#39;embedding&#39; look in music, mathematics or English differs sharply, and the review leaves that translation to teachers.\u003c/li>\n\u003cli>\u003cstrong>Commercial interest.\u003c/strong> EBE both wrote the review and sells the platform built on it. The review is transparent about its method, but leaders should weigh that when buying.\u003c/li>\n\u003cli>\u003cstrong>Measurement.\u003c/strong> Pupil surveys and classroom observation tools give noisy data on individual teachers; they are suitable for formative feedback and unsuitable for appraisal.\u003c/li>\n\u003cli>\u003cstrong>Breadth.\u003c/strong> Seventeen elements is a lot. Without prioritisation the model becomes another list.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Read the evidence review in full; the section on each dimension lists the underlying studies.\u003c/li>\n\u003cli>Compare with \u003cem>What Makes Great Teaching?\u003c/em> (Sutton Trust, 2014) and with the DfE initial teacher training and early career framework, which covers similar ground as statements of what new teachers should learn.\u003c/li>\n\u003cli>See the entries on Evidence Based Education, Rob Coe and instructional coaching.\u003c/li>\n\u003c/ul>\n","text":"At a glance A free evidence review (June 2020) by Rob Coe, C.J. Rauch, Stuart Kime and Dan Singleton, published by Evidence Based Education (EBE) with Cambridge Assessment International Education. It answers one question: what are the best bets for teachers to work on to improve pupil learning? The answer is a Model for Great Teaching : four dimensions, broken into 17 elements. The model is a curriculum for teacher learning, not a rubric for grading lessons. 'Great Teaching Toolkit' also names EBE's paid online platform (courses, pupil surveys and feedback tools) built on the review. The review can be used on its own. What the evidence says The authors reviewed existing research and teaching frameworks (EBE describes it as distilling over 100 frameworks and studies) and looked for teacher knowledge and behaviours with the strongest links to pupil outcomes. The review was commented on by an international group of advisers before publication. It builds on the 2014 Sutton Trust report What Makes Great Teaching? , which Coe also led. The four dimensions and their elements are: Dimension Elements 1. Understanding the content Deep subject knowledge; knowledge of curriculum sequencing; knowledge of tasks, assessments and explanations; knowledge of common misconceptions and sticking points 2. Creating a supportive environment Respectful teacher–pupil relationships; a positive climate among pupils; promoting motivation; high expectations with challenge and trust 3. Maximising opportunity to learn Managing time and resources efficiently; clear, consistently applied rules and expectations; preventing and responding to disruption 4. Activating hard thinking Structuring; explaining; questioning; interacting (feedback); embedding (practice and retrieval); activating (metacognition and independence) Two features distinguish it from lists such as Rosenshine's. First, it gives equal standing to subject knowledge, climate and behaviour, not only instruction. Second, it is explicit that the evidence varies: the authors describe the elements as 'best bets' and acknowledge that much underlying research is correlational, that the links between teacher behaviours and outcomes are modest, and that the model will need revising. How it differs from the EEF Toolkit. The EEF Toolkit ranks school-level approaches by average impact, cost and evidence strength, for spending decisions. The Great Teaching Toolkit gives no months-of-progress figures; it maps the components of individual classroom practice for professional development. In the classroom For an individual secondary teacher, the model works as a self-audit followed by narrow, deliberate improvement: Pick one element. For example 4.3 Questioning, or 3.1 managing time (starts and transitions). Get a baseline. Film ten minutes of a lesson, ask a colleague to tally who answers questions, or use a short pupil survey. In a Year 10 history lesson, a tally might show that eight pupils answered every question. Choose one specific technique linked to the element, such as cold calling with wait time, or a hinge question before independent work. Practise it for several weeks with the same class, with feedback from a coach or peer. Re-measure , then move on. The 'understanding the content' dimension is a prompt for departments: time spent in department meetings collecting the common misconceptions for the next unit (for example 'heavier objects fall faster', or 'the Treaty of Versailles caused the Second World War') directly builds element 1.4. For leaders Use the model to structure a professional development curriculum and to check its balance. Many school programmes sit almost entirely in dimension 4 and neglect subject knowledge. It supports teacher choice : staff select an element relevant to their classes, within a common framework. This fits instructional coaching well. Do not turn the 17 elements into an observation grid. The authors argue the model is for development; the research on grading lessons by observation (which Coe has long criticised) shows poor reliability. The EBE platform is a subscription product. Not verified: current pricing, course list and the detail of its feedback tools; check EBE's site. No independent trial of the platform's impact on pupil attainment was found while researching this entry. The review itself is free, so the cost of using the model is staff time. Cautions and critiques Best bets, not proven recipes. Evidence that a behaviour is associated with better outcomes is not evidence that training teachers in it will raise attainment. Generic by design. The elements are subject-neutral; how 'explaining' or 'embedding' look in music, mathematics or English differs sharply, and the review leaves that translation to teachers. Commercial interest. EBE both wrote the review and sells the platform built on it. The review is transparent about its method, but leaders should weigh that when buying. Measurement. Pupil surveys and classroom observation tools give noisy data on individual teachers; they are suitable for formative feedback and unsuitable for appraisal. Breadth. Seventeen elements is a lot. Without prioritisation the model becomes another list. Go deeper Read the evidence review in full; the section on each dimension lists the underlying studies. Compare with What Makes Great Teaching? (Sutton Trust, 2014) and with the DfE initial teacher training and early career framework, which covers similar ground as statements of what new teachers should learn. See the entries on Evidence Based Education, Rob Coe and instructional coaching."},{"slug":"hinge-and-diagnostic-questions","title":"Hinge and diagnostic questions","category":"assessment","type":"topic","summary":"Short, usually multiple-choice questions whose wrong answers each reveal a specific misconception, asked of every pupil at the point where the teacher must decide whether to move on or reteach.","status":"Professional practice","evidence":"","tags":["hinge questions","diagnostic questions","misconceptions","multiple choice","formative assessment"],"checked":"2026-11-12","sources":[{"title":"What makes a good Diagnostic Question?","publisher":"Eedi (Craig Barton)","year":"2018","url":"https://medium.com/eedi/what-makes-a-good-diagnostic-question-b760a65e0320"},{"title":"Assessment and feedback in an online context: hinge questions ('What's the idea?')","publisher":"Chartered College of Teaching","year":"2020","url":"https://my.chartered.college/research-hub/assessment-and-feedback-in-an-online-context-hinge-questions/"},{"title":"Using diagnostic questions","publisher":"Durrington Research School","year":"2019","url":"https://researchschool.org.uk/durrington/news/using-diagnostic-questions"},{"title":"Designing and using multiple choice questions in computing","publisher":"Teach Computing (National Centre for Computing Education)","year":"2020","url":"https://blog.teachcomputing.org/designing-and-using-multiple-choice-questions-in-computing"}],"related":["formative-assessment-five-strategies","dylan-wiliam"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>A hinge question is asked at a planned &quot;hinge point&quot; in a lesson; the answers decide what the teacher does next.\u003c/li>\n\u003cli>A diagnostic question is any question designed so that each wrong answer points to a particular misconception. A good hinge question is a diagnostic question used at the right moment.\u003c/li>\n\u003cli>Every pupil must answer (mini-whiteboards, fingers, cards, devices), quickly, and the teacher must be able to read the responses at a glance.\u003c/li>\n\u003cli>Writing good ones is hard and subject-specific: it is best done collaboratively in departments and banked.\u003c/li>\n\u003cli>The technique is well reasoned and widely used, but there is no separate body of trial evidence for hinge questions as such.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>The idea comes from Dylan Wiliam&#39;s work on formative assessment (strategy two: engineering tasks that elicit evidence). His design tests, as usually summarised: pupils should be able to answer in about a minute or less; the teacher should be able to interpret the class&#39;s responses in seconds; and it should be very difficult to get the right answer for the wrong reason. Wiliam&#39;s 2015 article &#39;Designing Great Hinge Questions&#39; in Educational Leadership is the main primary statement (not opened for this entry).\u003c/p>\n\u003cp>Craig Barton developed the approach for mathematics and, with Eedi, built a large free bank at diagnosticquestions.com. His &quot;golden rules&quot; add that the question should be clear and unambiguous, test a single skill or concept, be answerable in under ten seconds or so, and have wrong answers from which you learn something specific without needing the pupil to explain. He prefers not to call wrong options &quot;distractors&quot;, since they are not there to trick.\u003c/p>\n\u003cp>The evidence base is indirect: research on formative assessment generally, on the value of surfacing misconceptions (particularly in science and maths), and on multiple-choice questions as retrieval practice. One question is a small sample of a pupil&#39;s understanding and can mislead; the Chartered College guide makes this point.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>\u003cstrong>Routine\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Plan the hinge point: the moment after the core explanation and before independent practice.\u003c/li>\n\u003cli>Display the question. Silent thinking time; no conferring.\u003c/li>\n\u003cli>&quot;Three, two, one, show me.&quot; All pupils answer simultaneously.\u003c/li>\n\u003cli>Scan, then act: nearly all correct, move on; a significant minority wrong, ask a pupil who chose each option to explain and reteach briefly; most wrong, reteach differently.\u003c/li>\n\u003cli>Follow with a second, similar question to check the reteach worked.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Examples\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Maths (Year 8):\u003c/em> Which is the largest: A 0.5, B 0.45, C 0.405, D 0.09? Choosing B or C suggests &quot;longer decimals are bigger&quot;.\u003c/li>\n\u003cli>\u003cem>Science (Year 9):\u003c/em> A ball is thrown upwards. At the top of its flight the forces acting on it are: A none; B an upward force and gravity, balanced; C gravity only; D an upward force only. A and B reveal the &quot;force needed for motion&quot; and &quot;stationary means balanced&quot; misconceptions.\u003c/li>\n\u003cli>\u003cem>English (Year 10):\u003c/em> Which sentence analyses rather than describes the writer&#39;s choice? Four candidate sentences about the same quotation.\u003c/li>\n\u003cli>\u003cem>History (Year 9):\u003c/em> Which statement is a consequence, not a cause, of the 1832 Reform Act?\u003c/li>\n\u003cli>\u003cem>MFL:\u003c/em> Choose the correct translation of &quot;I went&quot;: options isolating auxiliary choice and past-participle agreement.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Writing them\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Start from pupils&#39; actual wrong answers in books, mocks and exam board examiner reports.\u003c/li>\n\u003cli>One concept per question; plausible wrong answers of similar length; avoid &quot;all of the above&quot;.\u003c/li>\n\u003cli>Trial with one class, then refine in the department meeting.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Give departments meeting time to write and bank questions against each unit in the scheme of work. This is curriculum work with lasting value and low cost.\u003c/li>\n\u003cli>Supply mini-whiteboards and pens as standard classroom kit, and expect routines for using them.\u003c/li>\n\u003cli>Online platforms (Eedi, quiz tools in the school&#39;s learning platform) can collect responses and show misconception patterns; check data protection and avoid turning them into a data drop.\u003c/li>\n\u003cli>In lesson visits, look for the response to the answers, not merely the presence of a question.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Guessing.\u003c/strong> With four options a quarter of pupils with no idea will be right. Barton suggests asking for a reason or using follow-up questions; pairs of questions help.\u003c/li>\n\u003cli>\u003cstrong>Single-item inference is weak.\u003c/strong> A correct answer does not show secure, durable learning; performance in the lesson is not the same as learning over time.\u003c/li>\n\u003cli>\u003cstrong>Not everything is multiple-choice.\u003c/strong> Extended reasoning, practical skill and creative work need other checks.\u003c/li>\n\u003cli>\u003cstrong>Poor options waste the technique.\u003c/strong> Implausible wrong answers tell the teacher nothing.\u003c/li>\n\u003cli>\u003cstrong>Time cost of writing.\u003c/strong> Without shared banks, teachers revert to ad hoc questioning.\u003c/li>\n\u003cli>Some commentators note hinge questions are largely a convention of British CPD rather than an intervention with its own research literature; treat claims of proven impact with caution.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Wiliam, &#39;Embedded Formative Assessment&#39; (2nd ed., 2018), chapter on eliciting evidence.\u003c/li>\n\u003cli>Barton, &#39;How I Wish I&#39;d Taught Maths&#39; (2018), chapter on formative assessment and diagnostic questions.\u003c/li>\n\u003cli>Best Evidence Science Teaching (University of York) publishes diagnostic questions for science. Not verified: current URL.\u003c/li>\n\u003c/ul>\n","text":"At a glance A hinge question is asked at a planned \"hinge point\" in a lesson; the answers decide what the teacher does next. A diagnostic question is any question designed so that each wrong answer points to a particular misconception. A good hinge question is a diagnostic question used at the right moment. Every pupil must answer (mini-whiteboards, fingers, cards, devices), quickly, and the teacher must be able to read the responses at a glance. Writing good ones is hard and subject-specific: it is best done collaboratively in departments and banked. The technique is well reasoned and widely used, but there is no separate body of trial evidence for hinge questions as such. What the evidence says The idea comes from Dylan Wiliam's work on formative assessment (strategy two: engineering tasks that elicit evidence). His design tests, as usually summarised: pupils should be able to answer in about a minute or less; the teacher should be able to interpret the class's responses in seconds; and it should be very difficult to get the right answer for the wrong reason. Wiliam's 2015 article 'Designing Great Hinge Questions' in Educational Leadership is the main primary statement (not opened for this entry). Craig Barton developed the approach for mathematics and, with Eedi, built a large free bank at diagnosticquestions.com. His \"golden rules\" add that the question should be clear and unambiguous, test a single skill or concept, be answerable in under ten seconds or so, and have wrong answers from which you learn something specific without needing the pupil to explain. He prefers not to call wrong options \"distractors\", since they are not there to trick. The evidence base is indirect: research on formative assessment generally, on the value of surfacing misconceptions (particularly in science and maths), and on multiple-choice questions as retrieval practice. One question is a small sample of a pupil's understanding and can mislead; the Chartered College guide makes this point. In the classroom Routine Plan the hinge point: the moment after the core explanation and before independent practice. Display the question. Silent thinking time; no conferring. \"Three, two, one, show me.\" All pupils answer simultaneously. Scan, then act: nearly all correct, move on; a significant minority wrong, ask a pupil who chose each option to explain and reteach briefly; most wrong, reteach differently. Follow with a second, similar question to check the reteach worked. Examples Maths (Year 8): Which is the largest: A 0.5, B 0.45, C 0.405, D 0.09? Choosing B or C suggests \"longer decimals are bigger\". Science (Year 9): A ball is thrown upwards. At the top of its flight the forces acting on it are: A none; B an upward force and gravity, balanced; C gravity only; D an upward force only. A and B reveal the \"force needed for motion\" and \"stationary means balanced\" misconceptions. English (Year 10): Which sentence analyses rather than describes the writer's choice? Four candidate sentences about the same quotation. History (Year 9): Which statement is a consequence, not a cause, of the 1832 Reform Act? MFL: Choose the correct translation of \"I went\": options isolating auxiliary choice and past-participle agreement. Writing them Start from pupils' actual wrong answers in books, mocks and exam board examiner reports. One concept per question; plausible wrong answers of similar length; avoid \"all of the above\". Trial with one class, then refine in the department meeting. For leaders Give departments meeting time to write and bank questions against each unit in the scheme of work. This is curriculum work with lasting value and low cost. Supply mini-whiteboards and pens as standard classroom kit, and expect routines for using them. Online platforms (Eedi, quiz tools in the school's learning platform) can collect responses and show misconception patterns; check data protection and avoid turning them into a data drop. In lesson visits, look for the response to the answers, not merely the presence of a question. Cautions and critiques Guessing. With four options a quarter of pupils with no idea will be right. Barton suggests asking for a reason or using follow-up questions; pairs of questions help. Single-item inference is weak. A correct answer does not show secure, durable learning; performance in the lesson is not the same as learning over time. Not everything is multiple-choice. Extended reasoning, practical skill and creative work need other checks. Poor options waste the technique. Implausible wrong answers tell the teacher nothing. Time cost of writing. Without shared banks, teachers revert to ad hoc questioning. Some commentators note hinge questions are largely a convention of British CPD rather than an intervention with its own research literature; treat claims of proven impact with caution. Go deeper Wiliam, 'Embedded Formative Assessment' (2nd ed., 2018), chapter on eliciting evidence. Barton, 'How I Wish I'd Taught Maths' (2018), chapter on formative assessment and diagnostic questions. Best Evidence Science Teaching (University of York) publishes diagnostic questions for science. Not verified: current URL."},{"slug":"john-sweller","title":"John Sweller","category":"thinkers","type":"person","summary":"Australian educational psychologist who originated cognitive load theory: the account of how limited working memory constrains learning, and why novices learn best from explicit guidance and worked examples.","status":"Thinker profile","evidence":"","tags":["cognitive load theory","working memory","worked examples","explicit instruction","cognitive science","expertise reversal"],"checked":"2026-11-12","sources":[{"title":"In defence of Cognitive Load Theory","publisher":"David Didau (Substack)","year":"Not verified","url":"https://daviddidau.substack.com/p/in-defence-of-cognitive-load-theory"},{"title":"When Failure Feeds the Flame","publisher":"Paul Kirschner (Substack)","year":"Not verified","url":"https://paulkirschner173727.substack.com/p/when-failure-feeds-the-flame"},{"title":"Cognitive Load Theory: 5 underpinning principles and the compound effects","publisher":"LeadingLearner (Stephen Tierney)","year":"2020","url":"https://leadinglearner.me/2020/01/19/cognitive-load-theory-5-underpinning-principles-the-compound-effects/"},{"title":"Cognitive load theory, element interactivity, and the testing and reverse testing effects (Hanham, Leahy and Sweller, 2017)","publisher":"Macquarie University research portal","year":"2017","url":"https://researchers.mq.edu.au/en/publications/cognitive-load-theory-element-interactivity-and-the-testing-and-r/"}],"related":["cognitive-load-theory","explicit-instruction","desirable-difficulties","robert-and-elizabeth-bjork","daniel-willingham"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Sweller&#39;s claim: working memory is small and short-lived when handling new information; long-term memory is vast. Instruction should be designed around that bottleneck.\u003c/li>\n\u003cli>Novices learn more from studying worked examples than from solving equivalent problems unaided.\u003c/li>\n\u003cli>Reduce load that comes from poor presentation (split attention, redundancy); manage load that comes from the content itself by sequencing and pre-teaching.\u003c/li>\n\u003cli>What helps novices can hinder experts (the expertise reversal effect), so guidance must be faded.\u003c/li>\n\u003cli>The theory is influential and well supported in laboratory-style experiments, but load is hard to measure directly and critics question its falsifiability.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>John Sweller is emeritus professor of educational psychology at the University of New South Wales, Sydney, where he spent most of his career. Cognitive load theory (CLT) grew out of his problem-solving experiments in the late 1970s and 1980s, in which students who solved many problems using means-ends analysis often failed to learn the underlying rule. His 1988 paper in \u003cem>Cognitive Science\u003c/em> set out the explanation. He has since published several hundred papers and developed the theory with collaborators including Paul Chandler, Slava Kalyuga, Paul Ayres, Fred Paas, Jeroen van Merriënboer and Paul Kirschner. In England, CLT gained prominence in the late 2010s; Dylan Wiliam described it in 2017 as the most important thing for teachers to know, and it is referenced in Ofsted&#39;s research commentary for the 2019 inspection framework.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Human cognitive architecture.\u003c/strong> Learning is a change in long-term memory. Long-term memory stores knowledge as schemas, which can be large yet are handled as single elements in working memory. Experts differ from novices mainly in the schemas they hold, not in general problem-solving skill. Working memory can hold only a few new elements at once, for seconds, but those limits largely disappear for information retrieved from long-term memory.\u003c/p>\n\u003cp>\u003cstrong>Biologically primary and secondary knowledge.\u003c/strong> Borrowing from David Geary, Sweller argues that humans acquire some things without instruction (speaking a first language, recognising faces, general problem-solving strategies) but that school subjects are &#39;biologically secondary&#39; and need explicit teaching. He uses this to argue that generic thinking skills cannot usefully be taught.\u003c/p>\n\u003cp>\u003cstrong>Types of load.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Intrinsic load\u003c/em> comes from the material itself and the learner&#39;s prior knowledge.\u003c/li>\n\u003cli>\u003cem>Extraneous load\u003c/em> comes from the way the material is presented and does not contribute to learning.\u003c/li>\n\u003cli>\u003cem>Germane load\u003c/em> was added in 1998 to describe effort devoted to schema building. In later formulations Sweller treats it not as a separate source of load but as the working memory resources devoted to intrinsic load.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Element interactivity.\u003c/strong> The driver of intrinsic load is how many elements must be processed simultaneously. Learning a list of chemical symb
