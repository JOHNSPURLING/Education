 an emergency annual review, before exclusion becomes likely. Reintegration. Hold a short planned meeting on return: what happened, what support is in place, what the pupil will do differently, who checks in and when. Return to school should not be made conditional on parents attending. Governors need at least three members with no prior involvement, trained, with papers circulated in advance (five school days is the usual expectation). Data. Report suspensions and exclusions to governors termly by year group, SEND, free school meal eligibility, ethnicity and sex, alongside removals, off-site directions and managed moves, so that patterns of pupil movement are visible. Common pitfalls Suspensions without an end date, or extended rather than a fresh decision being taken. Vague reasons ('persistent disruptive behaviour') with no chronology of incidents and support. Part-time timetables, long removal or 'safeguarding separation' used to avoid the exclusion process. Decision letters that omit representation rights or deadlines. Treating a managed move as a trial, or presenting it as the only alternative to exclusion. Governing boards rubber-stamping; panels expect to see genuine scrutiny of proportionality and of SEND. Go deeper The guidance includes model letters and parent guides on its GOV.UK page. DfE publishes termly suspension and exclusion statistics; persistent disruptive behaviour is consistently the most common recorded reason. See the entries on managed moves and off-site direction and on alternative provision for the 2026 pupil movement rules."},{"slug":"target-setting-and-flight-paths","title":"Target-setting and flight paths","category":"assessment","type":"topic","summary":"Individual target grades and 'flight paths' from Key Stage 2 to GCSE are widespread but poorly supported: progress is not linear, estimates are probabilistic, and targets can cap or demotivate pupils.","status":"Professional practice","evidence":"","tags":["target grades","flight paths","tracking","expectations","data"],"checked":"2026-11-12","sources":[{"title":"Teacher workload advisory group report and government response ('Making data work')","publisher":"Department for Education","year":"2018","url":"https://www.gov.uk/government/publications/teacher-workload-advisory-group-report-and-government-response"},{"title":"Making data work: report of the Teacher Workload Advisory Group (archived PDF)","publisher":"Department for Education (DERA archive)","year":"2018","url":"https://dera.ioe.ac.uk/id/eprint/32443/1/Workload_Advisory_Group-report.pdf"},{"title":"Commission on Assessment Without Levels: final report","publisher":"Department for Education","year":"2015","url":"https://www.gov.uk/government/publications/commission-on-assessment-without-levels-final-report"},{"title":"Reducing teacher workload: letter to school leaders","publisher":"Department for Education","year":"2018","url":"https://assets.publishing.service.gov.uk/media/5bdc914fed915d1520f0ad72/Reducing_Teacher_Workload_-_Letter_to_School_Leaders.pdf"}],"related":["summative-assessment-and-data-collection","ks3-assessment-after-levels"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>A flight path plots an expected route, usually in GCSE grades or sub-grades, from a pupil&#39;s Key Stage 2 result to a Year 11 target, and labels the pupil above, on or below track at each data point.\u003c/li>\n\u003cli>There is no statutory or Ofsted requirement to set individual target grades or to use flight paths.\u003c/li>\n\u003cli>&#39;Making data work&#39; (2018) advised against them: they assume linear progress, imply precision the data does not have, and generate workload.\u003c/li>\n\u003cli>Estimates from FFT or similar are probability distributions for groups of similar pupils. Turning the most likely grade into a personal target misuses them.\u003c/li>\n\u003cli>Better: high expectations for all, expressed through the curriculum; honest reporting of current performance on real assessments; cohort-level estimates for leaders.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>Progress is not linear.\u003c/strong> Analysis by Education Datalab (2015) of national data found that only a small minority of pupils (around one in ten) follow the &quot;expected&quot; trajectory at every key stage between Key Stage 1 and Key Stage 4; most have uneven paths. Not verified: the figure is cited from memory of the Datalab report and should be checked before quoting.\u003c/p>\n\u003cp>\u003cstrong>Estimates are distributions.\u003c/strong> Models such as FFT Aspire estimate, for pupils with similar prior attainment and context, the percentage chance of each grade. A pupil whose most likely grade is 5 may have a substantial chance of a 4 or a 6 and a real chance of a 3 or 7. Key Stage 2 tests in reading and maths are weak predictors of outcomes in art, music, PE or languages five years later.\u003c/p>\n\u003cp>\u003cstrong>Cohort gaps.\u003c/strong> Pupils who should have sat Key Stage 2 tests in 2020 and 2021 have no SATs results, which is why Progress 8 could not be calculated for 2025 and 2026 GCSE cohorts. Schools relying on SATs-based flight paths had no baseline for those year groups; see the performance measures entry for the current position.\u003c/p>\n\u003cp>\u003cstrong>Official advice.\u003c/strong> The Commission on Assessment Without Levels (2015) warned schools against rebuilding levels under another name. The Teacher Workload Advisory Group (2018) criticised flight paths specifically and said targets should not be generated mechanically from prior attainment or used alone to judge teachers. DfE and Ofsted accepted its recommendations.\u003c/p>\n\u003cp>\u003cstrong>Expectations and motivation.\u003c/strong> Research on goal-setting suggests specific, challenging goals can help when people have the means to reach them; research on teacher expectations and on labelling suggests low targets can become self-fulfilling. Neither literature tests school target-grade systems directly. Evidence that giving pupils a target grade improves attainment is lacking.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Talk about the work, not the number.\u003c/strong> &quot;To write a stronger evaluation you need a justified conclusion; here is one&quot; is usable. &quot;You are a 4b and need to be a 5c&quot; is not.\u003c/li>\n\u003cli>\u003cstrong>Do not differentiate the curriculum by target grade.\u003c/strong> Seating plans annotated with targets, &quot;grade 4 task / grade 7 task&quot; worksheets and tiered objectives lower the ceiling for pupils with low prior attainment.\u003c/li>\n\u003cli>\u003cstrong>Share real performance.\u003c/strong> After a common assessment, give the score, the year-group average and the two topics to revisit.\u003c/li>\n\u003cli>\u003cstrong>In exam years,\u003c/strong> it is reasonable to discuss a pupil&#39;s aspirations and what sixth-form or college courses require, alongside mock results. That is a conversation, not a tracked target.\u003c/li>\n\u003cli>\u003cstrong>Tiering and options decisions\u003c/strong> (maths, science, MFL tiers) should rest on recent assessment evidence, not on a Year 7 flight path.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>If targets are kept, set them as aspirational ranges or minimum expectations for the cohort, be transparent that they are estimates, and never show pupils a target below a standard pass.\u003c/li>\n\u003cli>Use FFT or trust benchmarks at cohort and subject level to ask &quot;are our results in line with similar pupils nationally?&quot; That is what the data is good for.\u003c/li>\n\u003cli>Remove &quot;progress towards target&quot; RAG columns at Key Stage 3. Replace with attainment on common assessments and standardised reading and maths scores.\u003c/li>\n\u003cli>Decouple pupil target grades from teacher appraisal. The 2018 report and subsequent DfE appraisal guidance discourage targets based on pupil outcome data alone.\u003c/li>\n\u003cli>Explain the change to parents, who often value a single target grade. Reports can show current attainment, attitude and specific next steps instead.\u003c/li>\n\u003cli>For sixth form, published transition matrices and value-added tools give minimum expected grades from GCSE; the same cautions apply, though prior attainment is more closely related to the subject.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>False precision.\u003c/strong> Sub-grades (5+, 5, 5−) and termly &quot;expected progress&quot; increments have no measurement basis.\u003c/li>\n\u003cli>\u003cstrong>Capping.\u003c/strong> Critics including Tom Sherrington and Becky Allen argue that low targets tell pupils what the school thinks they are worth; disadvantaged pupils with low Key Stage 2 scores are most affected.\u003c/li>\n\u003cli>\u003cstrong>Demotivation at both ends.\u003c/strong> Pupils far below an inflated target give up; pupils who have &quot;met&quot; a target coast.\u003c/li>\n\u003cli>\u003cstrong>Gaming.\u003c/strong> Teachers under pressure enter &quot;on track&quot; data; leaders see a reassuring picture until results day.\u003c/li>\n\u003cli>\u003cstrong>Workload.\u003c/strong> Maintaining flight paths across ten subjects and five year groups consumes hours of data entry for little decision value.\u003c/li>\n\u003cli>\u003cstrong>The counter-view.\u003c/strong> Some leaders argue that without targets, low expectations go unchallenged, and that pupils and parents want a clear goal. A reasonable response is to hold high expectations through curriculum and assessment standards rather than through individual numerical forecasts.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>&#39;Making data work&#39; (sources above).\u003c/li>\n\u003cli>FFT Education Datalab&#39;s work on pupil trajectories, and FFT&#39;s own guidance on using estimates as ranges rather than predictions.\u003c/li>\n\u003cli>Becky Allen&#39;s blog series on grading and tracking; Tom Sherrington&#39;s writing on target grades.\u003c/li>\n\u003c/ul>\n","text":"At a glance A flight path plots an expected route, usually in GCSE grades or sub-grades, from a pupil's Key Stage 2 result to a Year 11 target, and labels the pupil above, on or below track at each data point. There is no statutory or Ofsted requirement to set individual target grades or to use flight paths. 'Making data work' (2018) advised against them: they assume linear progress, imply precision the data does not have, and generate workload. Estimates from FFT or similar are probability distributions for groups of similar pupils. Turning the most likely grade into a personal target misuses them. Better: high expectations for all, expressed through the curriculum; honest reporting of current performance on real assessments; cohort-level estimates for leaders. What the evidence says Progress is not linear. Analysis by Education Datalab (2015) of national data found that only a small minority of pupils (around one in ten) follow the \"expected\" trajectory at every key stage between Key Stage 1 and Key Stage 4; most have uneven paths. Not verified: the figure is cited from memory of the Datalab report and should be checked before quoting. Estimates are distributions. Models such as FFT Aspire estimate, for pupils with similar prior attainment and context, the percentage chance of each grade. A pupil whose most likely grade is 5 may have a substantial chance of a 4 or a 6 and a real chance of a 3 or 7. Key Stage 2 tests in reading and maths are weak predictors of outcomes in art, music, PE or languages five years later. Cohort gaps. Pupils who should have sat Key Stage 2 tests in 2020 and 2021 have no SATs results, which is why Progress 8 could not be calculated for 2025 and 2026 GCSE cohorts. Schools relying on SATs-based flight paths had no baseline for those year groups; see the performance measures entry for the current position. Official advice. The Commission on Assessment Without Levels (2015) warned schools against rebuilding levels under another name. The Teacher Workload Advisory Group (2018) criticised flight paths specifically and said targets should not be generated mechanically from prior attainment or used alone to judge teachers. DfE and Ofsted accepted its recommendations. Expectations and motivation. Research on goal-setting suggests specific, challenging goals can help when people have the means to reach them; research on teacher expectations and on labelling suggests low targets can become self-fulfilling. Neither literature tests school target-grade systems directly. Evidence that giving pupils a target grade improves attainment is lacking. In the classroom Talk about the work, not the number. \"To write a stronger evaluation you need a justified conclusion; here is one\" is usable. \"You are a 4b and need to be a 5c\" is not. Do not differentiate the curriculum by target grade. Seating plans annotated with targets, \"grade 4 task / grade 7 task\" worksheets and tiered objectives lower the ceiling for pupils with low prior attainment. Share real performance. After a common assessment, give the score, the year-group average and the two topics to revisit. In exam years, it is reasonable to discuss a pupil's aspirations and what sixth-form or college courses require, alongside mock results. That is a conversation, not a tracked target. Tiering and options decisions (maths, science, MFL tiers) should rest on recent assessment evidence, not on a Year 7 flight path. For leaders If targets are kept, set them as aspirational ranges or minimum expectations for the cohort, be transparent that they are estimates, and never show pupils a target below a standard pass. Use FFT or trust benchmarks at cohort and subject level to ask \"are our results in line with similar pupils nationally?\" That is what the data is good for. Remove \"progress towards target\" RAG columns at Key Stage 3. Replace with attainment on common assessments and standardised reading and maths scores. Decouple pupil target grades from teacher appraisal. The 2018 report and subsequent DfE appraisal guidance discourage targets based on pupil outcome data alone. Explain the change to parents, who often value a single target grade. Reports can show current attainment, attitude and specific next steps instead. For sixth form, published transition matrices and value-added tools give minimum expected grades from GCSE; the same cautions apply, though prior attainment is more closely related to the subject. Cautions and critiques False precision. Sub-grades (5+, 5, 5−) and termly \"expected progress\" increments have no measurement basis. Capping. Critics including Tom Sherrington and Becky Allen argue that low targets tell pupils what the school thinks they are worth; disadvantaged pupils with low Key Stage 2 scores are most affected. Demotivation at both ends. Pupils far below an inflated target give up; pupils who have \"met\" a target coast. Gaming. Teachers under pressure enter \"on track\" data; leaders see a reassuring picture until results day. Workload. Maintaining flight paths across ten subjects and five year groups consumes hours of data entry for little decision value. The counter-view. Some leaders argue that without targets, low expectations go unchallenged, and that pupils and parents want a clear goal. A reasonable response is to hold high expectations through curriculum and assessment standards rather than through individual numerical forecasts. Go deeper 'Making data work' (sources above). FFT Education Datalab's work on pupil trajectories, and FFT's own guidance on using estimates as ranges rather than predictions. Becky Allen's blog series on grading and tracking; Tom Sherrington's writing on target grades."},{"slug":"prevent-duty","title":"The Prevent duty","category":"safeguarding","type":"guidance","summary":"Schools' legal duty to have due regard to the need to prevent people becoming terrorists or supporting terrorism: the current statutory guidance, risk assessment, training, Channel referrals and teaching.","status":"Statutory guidance","evidence":"","tags":["prevent","radicalisation","extremism","channel","counter-terrorism","british values"],"checked":"2026-11-12","sources":[{"title":"Prevent duty guidance: guidance for specified authorities in England and Wales","publisher":"Home Office","year":"2023","url":"https://assets.publishing.service.gov.uk/media/65e5a5bd3f69457ff1035fe2/14.258_HO_Prevent+Duty+Guidance_v5d_Final_Web_1_.pdf"},{"title":"Keeping children safe in education 2026: Part one","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6a9088e19a177a1decf97b01/Keeping_children_safe_in_education_2026_Part_one.pdf"},{"title":"The Prevent duty guidance (England and Wales)","publisher":"NASUWT","year":"2024","url":"https://www.nasuwt.org.uk/advice/in-the-classroom/children-and-young-people/the-prevent-duty-guidance-england-and-wales.html"}],"related":["keeping-children-safe-in-education","online-safety-filtering-and-monitoring","designated-safeguarding-lead"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Section 26 of the Counter-Terrorism and Security Act 2015 places a duty on schools to have \u003cstrong>due regard to the need to prevent people from becoming terrorists or supporting terrorism\u003c/strong>.\u003c/li>\n\u003cli>The current statutory guidance is the Home Office&#39;s &#39;Prevent duty guidance: for England and Wales&#39;, published in September 2023 and in force from \u003cstrong>31 December 2023\u003c/strong>. No newer edition was found in November 2026.\u003c/li>\n\u003cli>Prevent is treated as part of safeguarding: concerns go to the DSL and are handled like any other safeguarding concern, with the Channel programme as the specialist multi-agency route.\u003c/li>\n\u003cli>The guidance uses &#39;susceptible to radicalisation&#39; rather than &#39;vulnerable&#39;, and names the main threats as Islamist and extreme right-wing terrorism, while covering all ideologies and unclear or mixed motivations.\u003c/li>\n\u003cli>Schools need a risk assessment, trained staff, IT policies that restrict access to terrorist material, and a curriculum that builds resilience without shutting down debate.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cp>\u003cstrong>Who it applies to.\u003c/strong> &#39;Specified authorities&#39;, which include maintained schools, academies, independent schools, alternative provision, sixth-form and FE colleges and registered childcare.\u003c/p>\n\u003cp>\u003cstrong>Version.\u003c/strong> The 2023 guidance replaced the 2015 guidance and brought all education settings into one document. Unions and the DfE were clear that it created no new legal requirements for schools. Changes included: the three themes for education (leadership and partnership; capabilities; reducing permissive environments); &#39;susceptibility&#39; language; emphasis on ideology as a driver; and Prevent&#39;s first objective reworded to tackling the ideological causes of terrorism. Not verified: one school policy refers to a March 2025 amendment to the guidance; check the GOV.UK page for the update history.\u003c/p>\n\u003cp>KCSIE 2026 continues to direct schools to the Prevent duty guidance and summarises Prevent and Channel in its further-information annex.\u003c/p>\n\u003cp>Definitions: the guidance relies on the statutory definition of terrorism (Terrorism Act 2000) and on the government&#39;s definition of extremism, which was revised in March 2024 for use by government; that definition is not statutory.\u003c/p>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>\u003cstrong>Must:\u003c/strong> have due regard to the duty in exercising their functions, and have regard to the statutory guidance in doing so.\u003c/p>\n\u003cp>The guidance says schools \u003cstrong>should\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Leadership and partnership:\u003c/strong> leaders understand the local risk; a named lead (usually the DSL) oversees Prevent; the school works with the local authority Prevent lead, police and the safeguarding partnership; Prevent is built into existing safeguarding policies rather than a stand-alone bureaucracy.\u003c/li>\n\u003cli>\u003cstrong>Risk assessment:\u003c/strong> assess the risk of pupils being radicalised, informed by local risk information; review at least annually; turn it into actions.\u003c/li>\n\u003cli>\u003cstrong>Capabilities:\u003c/strong> train staff to recognise signs and know what to do; the DSL and safeguarding leads receive more in-depth training, refreshed at least every two years in line with the guidance.\u003c/li>\n\u003cli>\u003cstrong>Reducing permissive environments:\u003c/strong> filtering to restrict access to terrorist and extremist material; policies on visiting speakers and lettings so the school is not used as a platform for radicalisers; build resilience through the curriculum, including fundamental British values.\u003c/li>\n\u003cli>\u003cstrong>Information sharing\u003c/strong> in line with data protection law when making referrals.\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cp>\u003cstrong>Staff:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>notice changes: fixation on an ideology or grievance, us-and-them language, new online contacts, justification of violence, symbols or content shared;\u003c/li>\n\u003cli>&#39;notice, check, share&#39;: talk to the pupil if appropriate, check with colleagues who know them, share with the DSL the same day;\u003c/li>\n\u003cli>keep classrooms open to discussion of controversial issues. Prevent does not require staff to report opinions or stop debate; schools remain under duties of political impartiality.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>DSLs:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>consider the concern like any other: what is the need, what is the risk? Options include support in school, early help, or a \u003cstrong>Prevent referral\u003c/strong> using the national referral form via the local route (police or local authority, as local procedures specify);\u003c/li>\n\u003cli>Channel is voluntary and requires consent (from parents for children); it is support, not a criminal sanction;\u003c/li>\n\u003cli>keep the risk assessment live: local profile, online risk, pupils with unsupervised internet use, site lettings, visiting speakers;\u003c/li>\n\u003cli>use the government&#39;s free Prevent duty training (awareness, referrals and Channel courses on GOV.UK) and the DfE regional Prevent co-ordinators.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Governors and trustees:\u003c/strong> check there is a current risk assessment and action plan, a visiting speaker and lettings procedure, staff training records, and that filtering tests include extremist content.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>A generic downloaded risk assessment with no local content.\u003c/li>\n\u003cli>Training done once, years ago, with no record for newer staff.\u003c/li>\n\u003cli>Treating Prevent as separate from safeguarding, so wider needs (isolation, SEND, mental health, exploitation) are missed.\u003c/li>\n\u003cli>Over-referral based on a pupil&#39;s faith or politics rather than behaviour and susceptibility; this damages trust and has been a long-standing criticism of Prevent from some community groups, unions and academics. The 2023 independent review argued the opposite risk, that the programme had drifted from tackling ideology. Schools should be aware both critiques exist.\u003c/li>\n\u003cli>No vetting of external speakers or hirers.\u003c/li>\n\u003cli>Ignoring online spaces, gaming platforms and mixed or unclear ideologies, including fascination with mass violence.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Read the education section of the statutory guidance and the DfE&#39;s &#39;The Prevent duty: safeguarding learners vulnerable to radicalisation&#39; support pages on GOV.UK (Not verified: current title). Follow your local safeguarding partnership&#39;s referral procedures. This is general information, not legal advice.\u003c/p>\n","text":"At a glance Section 26 of the Counter-Terrorism and Security Act 2015 places a duty on schools to have due regard to the need to prevent people from becoming terrorists or supporting terrorism . The current statutory guidance is the Home Office's 'Prevent duty guidance: for England and Wales', published in September 2023 and in force from 31 December 2023 . No newer edition was found in November 2026. Prevent is treated as part of safeguarding: concerns go to the DSL and are handled like any other safeguarding concern, with the Channel programme as the specialist multi-agency route. The guidance uses 'susceptible to radicalisation' rather than 'vulnerable', and names the main threats as Islamist and extreme right-wing terrorism, while covering all ideologies and unclear or mixed motivations. Schools need a risk assessment, trained staff, IT policies that restrict access to terrorist material, and a curriculum that builds resilience without shutting down debate. Status and current version Who it applies to. 'Specified authorities', which include maintained schools, academies, independent schools, alternative provision, sixth-form and FE colleges and registered childcare. Version. The 2023 guidance replaced the 2015 guidance and brought all education settings into one document. Unions and the DfE were clear that it created no new legal requirements for schools. Changes included: the three themes for education (leadership and partnership; capabilities; reducing permissive environments); 'susceptibility' language; emphasis on ideology as a driver; and Prevent's first objective reworded to tackling the ideological causes of terrorism. Not verified: one school policy refers to a March 2025 amendment to the guidance; check the GOV.UK page for the update history. KCSIE 2026 continues to direct schools to the Prevent duty guidance and summarises Prevent and Channel in its further-information annex. Definitions: the guidance relies on the statutory definition of terrorism (Terrorism Act 2000) and on the government's definition of extremism, which was revised in March 2024 for use by government; that definition is not statutory. What schools must do Must: have due regard to the duty in exercising their functions, and have regard to the statutory guidance in doing so. The guidance says schools should : Leadership and partnership: leaders understand the local risk; a named lead (usually the DSL) oversees Prevent; the school works with the local authority Prevent lead, police and the safeguarding partnership; Prevent is built into existing safeguarding policies rather than a stand-alone bureaucracy. Risk assessment: assess the risk of pupils being radicalised, informed by local risk information; review at least annually; turn it into actions. Capabilities: train staff to recognise signs and know what to do; the DSL and safeguarding leads receive more in-depth training, refreshed at least every two years in line with the guidance. Reducing permissive environments: filtering to restrict access to terrorist and extremist material; policies on visiting speakers and lettings so the school is not used as a platform for radicalisers; build resilience through the curriculum, including fundamental British values. Information sharing in line with data protection law when making referrals. In practice Staff: notice changes: fixation on an ideology or grievance, us-and-them language, new online contacts, justification of violence, symbols or content shared; 'notice, check, share': talk to the pupil if appropriate, check with colleagues who know them, share with the DSL the same day; keep classrooms open to discussion of controversial issues. Prevent does not require staff to report opinions or stop debate; schools remain under duties of political impartiality. DSLs: consider the concern like any other: what is the need, what is the risk? Options include support in school, early help, or a Prevent referral using the national referral form via the local route (police or local authority, as local procedures specify); Channel is voluntary and requires consent (from parents for children); it is support, not a criminal sanction; keep the risk assessment live: local profile, online risk, pupils with unsupervised internet use, site lettings, visiting speakers; use the government's free Prevent duty training (awareness, referrals and Channel courses on GOV.UK) and the DfE regional Prevent co-ordinators. Governors and trustees: check there is a current risk assessment and action plan, a visiting speaker and lettings procedure, staff training records, and that filtering tests include extremist content. Common pitfalls A generic downloaded risk assessment with no local content. Training done once, years ago, with no record for newer staff. Treating Prevent as separate from safeguarding, so wider needs (isolation, SEND, mental health, exploitation) are missed. Over-referral based on a pupil's faith or politics rather than behaviour and susceptibility; this damages trust and has been a long-standing criticism of Prevent from some community groups, unions and academics. The 2023 independent review argued the opposite risk, that the programme had drifted from tackling ideology. Schools should be aware both critiques exist. No vetting of external speakers or hirers. Ignoring online spaces, gaming platforms and mixed or unclear ideologies, including fascination with mass violence. Go deeper Read the education section of the statutory guidance and the DfE's 'The Prevent duty: safeguarding learners vulnerable to radicalisation' support pages on GOV.UK (Not verified: current title). Follow your local safeguarding partnership's referral procedures. This is general information, not legal advice."},{"slug":"tom-bennett","title":"Tom Bennett","category":"thinkers","type":"person","summary":"Founder of researchED and long-standing behaviour adviser to the Department for Education. Author of 'Running the Room' and the 2017 'Creating a Culture' review. Argues behaviour must be taught as a curriculum of norms and routines.","status":"Thinker profile","evidence":"","tags":["behaviour","behaviour curriculum","routines","school culture","researched","dfe"],"checked":"2026-11-12","sources":[{"title":"Creating a culture: how school leaders can optimise behaviour (independent review)","publisher":"Department for Education / GOV.UK","year":"2017","url":"https://www.gov.uk/government/publications/behaviour-in-schools"},{"title":"New report with practical advice for teachers on pupil behaviour (press release)","publisher":"Department for Education / GOV.UK","year":"2017","url":"https://www.gov.uk/government/news/new-report-with-practical-advice-for-teachers-on-pupil-behaviour"},{"title":"Running the Room: The Teacher's Guide to Behaviour (publisher page)","publisher":"John Catt / Hachette Learning","year":"2020","url":"https://www.hachette.co.uk/titles/tom-bennett/running-the-room-the-teacher%E2%80%99s-guide-to-behaviour/9781913622145/"},{"title":"Review: Running the Room by Tom Bennett (Bennie Kara)","publisher":"Schools Week","year":"2020","url":"https://schoolsweek.co.uk/review-running-the-room-by-tom-bennett"},{"title":"About Tom Bennett","publisher":"Tom Bennett Training","year":"Not verified","url":"https://tombennetttraining.co.uk/about-tom-bennett/"},{"title":"About researchED","publisher":"researchED","year":"Not verified","url":"https://researched.org.uk/about/"},{"title":"Tom Bennett (EB50 profile 2025-2026)","publisher":"Education Business","year":"2025","url":"https://educationbusinessuk.net/eb50/2025-2026/tom-bennett"}],"related":["behaviour-in-schools-guidance","mobile-phones-in-schools","paul-dix","bill-rogers","sam-strickland"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Bennett&#39;s core claim: good behaviour is not a natural default. It has to be \u003cstrong>taught, practised and maintained\u003c/strong>, like any other curriculum.\u003c/li>\n\u003cli>Teachers &#39;run the room&#39; through \u003cstrong>norms, routines and consequences\u003c/strong>; leaders create the culture that makes this possible in every room.\u003c/li>\n\u003cli>His 2017 DfE review, \u003cem>Creating a Culture\u003c/em>, found that \u003cstrong>how a school is led\u003c/strong> shapes behaviour more than the skill of individual teachers working alone.\u003c/li>\n\u003cli>He is proactive first: most of the work is prevention, teaching and relationship-building, with sanctions as a necessary backstop, not the main tool.\u003c/li>\n\u003cli>He has shaped national policy: the 2016 ITT behaviour review, the Behaviour Hubs programme and the direction of DfE behaviour guidance.\u003c/li>\n\u003cli>Contested points: removal rooms, suspensions, mobile phone bans and how far &#39;high expectations&#39; can flex for pupils with additional needs.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Tom Bennett taught in London secondary schools for over a decade (one profile says 14 years), mainly religious studies and philosophy, and wrote a long-running behaviour advice column for Tes. In 2013 he founded \u003cstrong>researchED\u003c/strong>, a teacher-led conference movement promoting research-informed practice, now running events internationally. In 2015 he was appointed to advise the Department for Education on behaviour. He chaired the group that produced the 2016 report on behaviour content in initial teacher training, wrote the 2017 independent review \u003cem>Creating a Culture\u003c/em>, and led the DfE-funded \u003cstrong>Behaviour Hubs\u003c/strong> programme, which one 2025 profile says supported over 650 schools before closing. That profile describes him as the DfE&#39;s independent behaviour adviser; his own Substack describes him as a professor of school behaviour at Academica University, Amsterdam. Not verified: his exact DfE title and status as of November 2026.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Behaviour is a curriculum.\u003c/strong> Pupils arrive with very different experience of what school behaviour looks like. Assuming they know how to behave advantages those who have already been taught at home. So schools should define the behaviour they want in concrete terms, teach it explicitly, model it, practise it, check it and re-teach it. This is the origin of the &#39;behaviour curriculum&#39; language now found in DfE guidance.\u003c/p>\n\u003cp>\u003cstrong>Norms.\u003c/strong> People do what they think everyone else is doing. The teacher&#39;s job is to make the desired behaviour the visible, expected norm of the room: state it, notice it, narrate it, and act when it is breached so that pupils see the norm is real.\u003c/p>\n\u003cp>\u003cstrong>Routines.\u003c/strong> Routines are the building blocks of classroom culture: entering, starting work, distributing materials, asking questions, transitions, leaving. Each is designed in detail, taught step by step and practised until automatic. Good routines save time, cut decisions and make the room feel safe and predictable.\u003c/p>\n\u003cp>\u003cstrong>Consequences.\u003c/strong> Bennett treats consequences as broader than sanctions: they include praise, recognition and reward as well as penalties. Sanctions should be certain, proportionate and predictable; severity matters less than reliability. They are a signal that boundaries are real, not a cure in themselves.\u003c/p>\n\u003cp>\u003cstrong>Proactive before reactive.\u003c/strong> \u003cem>Running the Room\u003c/em> uses a firefighting analogy: fire prevention does more than firefighting. Most effort should go into designing the environment, teaching expectations and building relationships; the remainder is responding well when things still go wrong, including scripted responses and, where needed, removal from the lesson.\u003c/p>\n\u003cp>\u003cstrong>Relationships, properly understood.\u003c/strong> He argues relationships are built on structure, competence, high expectations and reliability, not on being liked, and that they are an outcome of a well-run room as much as a precondition.\u003c/p>\n\u003cp>\u003cstrong>Creating a Culture (2017).\u003c/strong> The review visited schools with strong behaviour and found common features:\u003c/p>\n\u003cul>\n\u003cli>highly visible leaders with ambitious, detailed visions of conduct;\u003c/li>\n\u003cli>a clear, shared understanding of &#39;how we do things here&#39;;\u003c/li>\n\u003cli>expectations set as high as possible for everyone, with support to meet them;\u003c/li>\n\u003cli>attention to detail and to routines in corridors, canteens and public spaces, not only classrooms;\u003c/li>\n\u003cli>consistent practice by all staff, sustained by induction and training;\u003c/li>\n\u003cli>commitment from staff and parents to the school&#39;s approach.\u003c/li>\n\u003c/ul>\n\u003cp>Its summary for leaders was to \u003cstrong>design the culture deliberately, build it in detail, and maintain it constantly\u003c/strong>. It found no single fix, and it recommended better leadership training in behaviour and funding for internal inclusion units.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>The Behaviour Guru\u003c/em> (Continuum, 2010).\u003c/li>\n\u003cli>\u003cem>Not Quite a Teacher\u003c/em> (Continuum, 2011); \u003cem>Teacher\u003c/em> (Continuum, 2012); \u003cem>Teacher Proof\u003c/em> (Routledge, 2013). Years not verified against publisher pages.\u003c/li>\n\u003cli>\u003cem>Developing behaviour management content for initial teacher training\u003c/em> (DfE, 2016), as chair of the working group.\u003c/li>\n\u003cli>\u003cem>Creating a Culture: How school leaders can optimise behaviour\u003c/em> (DfE independent review, March 2017).\u003c/li>\n\u003cli>\u003cem>Running the Room: The Teacher&#39;s Guide to Behaviour\u003c/em> (John Catt, 2020).\u003c/li>\n\u003cli>\u003cem>The Running the Room Companion\u003c/em> (John Catt, 2021; year not verified).\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>\u003cstrong>Teachers\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>List the routines your lessons depend on. For each, write the steps, teach them explicitly (&#39;This is how we enter: line up here, silent from the door, equipment out, start the task on the board&#39;), practise, and give feedback as you would on written work.\u003c/li>\n\u003cli>Re-teach after every holiday and whenever standards drift. Bennett&#39;s point is that drift is normal and maintenance is the job.\u003c/li>\n\u003cli>Make norms visible: &#39;Almost everyone has started. Thank you, back row.&#39; Correct small breaches early and calmly.\u003c/li>\n\u003cli>Decide your responses in advance. Know the first, second and third thing you will say and do, so that you are not improvising under pressure.\u003c/li>\n\u003cli>Follow up every consequence you set. If you cannot follow it up, do not set it.\u003c/li>\n\u003cli>Do not wait for behaviour to go wrong before teaching it; invest heavily in the first lessons with any class.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Write down, concretely, what good conduct looks like in each part of the school day: arrival, corridors, lunch, lessons, departure.\u003c/li>\n\u003cli>Teach it to pupils in a planned induction at the start of the year and for mid-year arrivals; train every adult, including support and supply staff.\u003c/li>\n\u003cli>Be visible. Leaders at the gate, in corridors and dropping into lessons is a recurring feature of the review&#39;s case-study schools.\u003c/li>\n\u003cli>Remove the burden of consequences from individual teachers where possible: centralised detentions, clear on-call and removal systems.\u003c/li>\n\u003cli>Audit consistency: do pupils experience the same expectations in every room?\u003c/li>\n\u003cli>Plan support for pupils who struggle to meet expectations. The review argues for well-resourced internal units with a route back to class.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Relational and restorative critics.\u003c/strong> Practitioners such as Paul Dix and advocates of trauma-informed practice argue that consequence-backed systems rely too heavily on sanctions and removal, and can damage relationships with the pupils who most need them. Bennett&#39;s reply is that structure and relationships are complementary, and that disruption harms the most disadvantaged pupils most.\u003c/li>\n\u003cli>\u003cstrong>Inclusion and SEND.\u003c/strong> Some SEND organisations and campaigners argue that uniform high expectations and removal rooms fall hardest on pupils with additional needs and contribute to rising suspensions. Bennett argues for reasonable adjustments within consistent expectations, not lower expectations.\u003c/li>\n\u003cli>\u003cstrong>Evidence.\u003c/strong> \u003cem>Creating a Culture\u003c/em> was based on school visits and interviews, not experimental evidence, and the report acknowledges this. The &#39;behaviour curriculum&#39; idea is plausible and consistent with EEF guidance on teaching routines, but has not been tested in large trials.\u003c/li>\n\u003cli>\u003cstrong>Depth and tone.\u003c/strong> A Schools Week review of \u003cem>Running the Room\u003c/em> found it directly usable in classrooms but felt it did not fully explore the thornier questions; another review noted occasional partisan commentary.\u003c/li>\n\u003cli>\u003cstrong>Policy influence.\u003c/strong> Commentators including Education Uncovered have questioned the closeness of researchED and its founder to government. Supporters point to researchED&#39;s role in giving teachers direct access to research.\u003c/li>\n\u003c/ul>\n","text":"At a glance Bennett's core claim: good behaviour is not a natural default. It has to be taught, practised and maintained , like any other curriculum. Teachers 'run the room' through norms, routines and consequences ; leaders create the culture that makes this possible in every room. His 2017 DfE review, Creating a Culture , found that how a school is led shapes behaviour more than the skill of individual teachers working alone. He is proactive first: most of the work is prevention, teaching and relationship-building, with sanctions as a necessary backstop, not the main tool. He has shaped national policy: the 2016 ITT behaviour review, the Behaviour Hubs programme and the direction of DfE behaviour guidance. Contested points: removal rooms, suspensions, mobile phone bans and how far 'high expectations' can flex for pupils with additional needs. Who they are Tom Bennett taught in London secondary schools for over a decade (one profile says 14 years), mainly religious studies and philosophy, and wrote a long-running behaviour advice column for Tes. In 2013 he founded researchED , a teacher-led conference movement promoting research-informed practice, now running events internationally. In 2015 he was appointed to advise the Department for Education on behaviour. He chaired the group that produced the 2016 report on behaviour content in initial teacher training, wrote the 2017 independent review Creating a Culture , and led the DfE-funded Behaviour Hubs programme, which one 2025 profile says supported over 650 schools before closing. That profile describes him as the DfE's independent behaviour adviser; his own Substack describes him as a professor of school behaviour at Academica University, Amsterdam. Not verified: his exact DfE title and status as of November 2026. Core ideas Behaviour is a curriculum. Pupils arrive with very different experience of what school behaviour looks like. Assuming they know how to behave advantages those who have already been taught at home. So schools should define the behaviour they want in concrete terms, teach it explicitly, model it, practise it, check it and re-teach it. This is the origin of the 'behaviour curriculum' language now found in DfE guidance. Norms. People do what they think everyone else is doing. The teacher's job is to make the desired behaviour the visible, expected norm of the room: state it, notice it, narrate it, and act when it is breached so that pupils see the norm is real. Routines. Routines are the building blocks of classroom culture: entering, starting work, distributing materials, asking questions, transitions, leaving. Each is designed in detail, taught step by step and practised until automatic. Good routines save time, cut decisions and make the room feel safe and predictable. Consequences. Bennett treats consequences as broader than sanctions: they include praise, recognition and reward as well as penalties. Sanctions should be certain, proportionate and predictable; severity matters less than reliability. They are a signal that boundaries are real, not a cure in themselves. Proactive before reactive. Running the Room uses a firefighting analogy: fire prevention does more than firefighting. Most effort should go into designing the environment, teaching expectations and building relationships; the remainder is responding well when things still go wrong, including scripted responses and, where needed, removal from the lesson. Relationships, properly understood. He argues relationships are built on structure, competence, high expectations and reliability, not on being liked, and that they are an outcome of a well-run room as much as a precondition. Creating a Culture (2017). The review visited schools with strong behaviour and found common features: highly visible leaders with ambitious, detailed visions of conduct; a clear, shared understanding of 'how we do things here'; expectations set as high as possible for everyone, with support to meet them; attention to detail and to routines in corridors, canteens and public spaces, not only classrooms; consistent practice by all staff, sustained by induction and training; commitment from staff and parents to the school's approach. Its summary for leaders was to design the culture deliberately, build it in detail, and maintain it constantly . It found no single fix, and it recommended better leadership training in behaviour and funding for internal inclusion units. Key works The Behaviour Guru (Continuum, 2010). Not Quite a Teacher (Continuum, 2011); Teacher (Continuum, 2012); Teacher Proof (Routledge, 2013). Years not verified against publisher pages. Developing behaviour management content for initial teacher training (DfE, 2016), as chair of the working group. Creating a Culture: How school leaders can optimise behaviour (DfE independent review, March 2017). Running the Room: The Teacher's Guide to Behaviour (John Catt, 2020). The Running the Room Companion (John Catt, 2021; year not verified). Putting it into practice Teachers List the routines your lessons depend on. For each, write the steps, teach them explicitly ('This is how we enter: line up here, silent from the door, equipment out, start the task on the board'), practise, and give feedback as you would on written work. Re-teach after every holiday and whenever standards drift. Bennett's point is that drift is normal and maintenance is the job. Make norms visible: 'Almost everyone has started. Thank you, back row.' Correct small breaches early and calmly. Decide your responses in advance. Know the first, second and third thing you will say and do, so that you are not improvising under pressure. Follow up every consequence you set. If you cannot follow it up, do not set it. Do not wait for behaviour to go wrong before teaching it; invest heavily in the first lessons with any class. Leaders Write down, concretely, what good conduct looks like in each part of the school day: arrival, corridors, lunch, lessons, departure. Teach it to pupils in a planned induction at the start of the year and for mid-year arrivals; train every adult, including support and supply staff. Be visible. Leaders at the gate, in corridors and dropping into lessons is a recurring feature of the review's case-study schools. Remove the burden of consequences from individual teachers where possible: centralised detentions, clear on-call and removal systems. Audit consistency: do pupils experience the same expectations in every room? Plan support for pupils who struggle to meet expectations. The review argues for well-resourced internal units with a route back to class. Critiques and debate Relational and restorative critics. Practitioners such as Paul Dix and advocates of trauma-informed practice argue that consequence-backed systems rely too heavily on sanctions and removal, and can damage relationships with the pupils who most need them. Bennett's reply is that structure and relationships are complementary, and that disruption harms the most disadvantaged pupils most. Inclusion and SEND. Some SEND organisations and campaigners argue that uniform high expectations and removal rooms fall hardest on pupils with additional needs and contribute to rising suspensions. Bennett argues for reasonable adjustments within consistent expectations, not lower expectations. Evidence. Creating a Culture was based on school visits and interviews, not experimental evidence, and the report acknowledges this. The 'behaviour curriculum' idea is plausible and consistent with EEF guidance on teaching routines, but has not been tested in large trials. Depth and tone. A Schools Week review of Running the Room found it directly usable in classrooms but felt it did not fully explore the thornier questions; another review noted occasional partisan commentary. Policy influence. Commentators including Education Uncovered have questioned the closeness of researchED and its founder to government. Supporters point to researchED's role in giving teachers direct access to research."},{"slug":"tom-sherrington","title":"Tom Sherrington","category":"thinkers","type":"person","summary":"Former headteacher, author of The Learning Rainforest and Rosenshine's Principles in Action, and co-creator of Teaching WalkThrus. A leading translator of instructional research into everyday secondary practice.","status":"Thinker profile","evidence":"","tags":["rosenshine","walkthrus","instructional coaching","questioning","curriculum","teacherhead"],"checked":"2026-11-12","sources":[{"title":"Mode A + Mode B = Effective teaching and a rich enacted curriculum","publisher":"teacherhead.com (Tom Sherrington)","year":"2018","url":"https://teacherhead.com/2018/04/22/mode-a-mode-b-effective-teaching-and-a-rich-enacted-curriculum/"},{"title":"Revisiting Dylan Wiliam's Five Brilliant Formative Assessment Strategies","publisher":"teacherhead.com (Tom Sherrington)","year":"2019","url":"https://teacherhead.com/2019/01/10/revisiting-dylan-wiliams-five-brilliant-formative-assessment-strategies/"},{"title":"Tom Sherrington: contributor page (books published under the John Catt imprint)","publisher":"Hachette UK","year":"2026","url":"https://hachette.co.uk/contributor/tom-sherrington"},{"title":"Rosenshine's Principles: Sequencing concepts and Modelling, with Tom Sherrington","publisher":"Chartered College of Teaching","year":"Not verified","url":"https://my.chartered.college/?p=21287"},{"title":"'Comprehensive and Manageable': WalkThrus Has It All (book review)","publisher":"Learning and the Brain","year":"Not verified","url":"https://www.learningandthebrain.com/blog/comprehensive-and-manageable-walkthrus-has-it-all/"}],"related":["barak-rosenshine","rosenshine-principles-of-instruction","dylan-wiliam"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Tom Sherrington is a former physics teacher and headteacher who now works as a consultant and writes the teacherhead.com blog.\u003c/li>\n\u003cli>His main contribution is translation: turning research (Rosenshine, Wiliam, cognitive science) into classroom routines that ordinary teachers can use.\u003c/li>\n\u003cli>\u003cem>Rosenshine&#39;s Principles in Action\u003c/em> regroups the ten principles into four strands: sequencing concepts and modelling, questioning, reviewing material, and stages of practice.\u003c/li>\n\u003cli>\u003cem>Teaching WalkThrus\u003c/em> (with Oliver Caviglioli) breaks techniques into five illustrated steps and pairs them with the ADAPT cycle for coaching.\u003c/li>\n\u003cli>Recurring themes: &#39;teach to the top&#39;, a knowledge-rich curriculum, checking the understanding of every pupil, and a balance of &#39;Mode A&#39; and &#39;Mode B&#39; teaching.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Sherrington taught physics and maths and held leadership posts in several English secondary schools. He was headteacher of King Edward VI Grammar School, Chelmsford, and then of Highbury Grove School in Islington, leaving headship in 2017 (dates from the author&#39;s own published biographies; exact years not re-verified for this entry). Since then he has worked as an education consultant (Teacherhead Consulting) with schools and trusts in the UK and internationally, and is a regular speaker at researchED and similar events. His blog, teacherhead.com, has run since 2012 and is one of the most widely read teaching blogs in England.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>The Learning Rainforest.\u003c/strong> The 2017 book uses a tree metaphor for great teaching in three parts:\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Establishing the conditions\u003c/em> (the roots): attitudes and habits, relationships and behaviour, high expectations, and planning the curriculum.\u003c/li>\n\u003cli>\u003cem>Building the knowledge structure\u003c/em> (the trunk): explaining, modelling, questioning, feedback and practice, so that pupils secure knowledge.\u003c/li>\n\u003cli>\u003cem>Exploring the possibilities\u003c/em> (the canopy): more open-ended work such as projects, extended enquiry, oracy and independent study.\u003c/li>\n\u003c/ul>\n\u003cp>The contrast he draws is between a &#39;plantation&#39; (uniform, compliance-driven schooling) and a &#39;managed rainforest&#39; (strong structures with room for diversity).\u003c/p>\n\u003cp>\u003cstrong>Mode A and Mode B.\u003c/strong> Introduced in \u003cem>The Learning Rainforest\u003c/em> and developed on the blog, this is a way of describing balance. Mode A is the mainstay: teacher-led instruction (explain, model, question, practise, give feedback), which he suggests should make up roughly 80% of lessons. Mode B is the remaining slice: enquiry, extended projects, debate, hands-on and creative tasks. His argument is that Mode B enriches the enacted curriculum but has to be planned deliberately and rests on knowledge built in Mode A.\u003c/p>\n\u003cp>\u003cstrong>Rosenshine&#39;s four strands.\u003c/strong> In \u003cem>Rosenshine&#39;s Principles in Action\u003c/em> (2019) he argues that the ten principles are easier to use when grouped:\u003c/p>\n\u003col>\n\u003cli>\u003cem>Sequencing concepts and modelling\u003c/em>: small steps, models, scaffolds.\u003c/li>\n\u003cli>\u003cem>Questioning\u003c/em>: asking many questions and checking the understanding of all pupils.\u003c/li>\n\u003cli>\u003cem>Reviewing material\u003c/em>: daily, weekly and monthly review.\u003c/li>\n\u003cli>\u003cem>Stages of practice\u003c/em>: guided practice, a high success rate, then independent practice.\u003c/li>\n\u003c/ol>\n\u003cp>He stresses that the principles are not a lesson plan or checklist, and that they apply differently across subjects.\u003c/p>\n\u003cp>\u003cstrong>Teach to the top.\u003c/strong> Pitch lessons at the highest attainers in the room and scaffold others up to that level, rather than aiming at the middle and bolting on extension tasks.\u003c/p>\n\u003cp>\u003cstrong>Questioning and checking for understanding.\u003c/strong> A staple of his blog and training is a small repertoire of techniques: cold calling, think-pair-share, mini-whiteboards (&#39;show-me boards&#39;), &#39;say it again better&#39;, probing questions and process questions. The underlying point is that a teacher should know what \u003cem>all\u003c/em> pupils think, not just volunteers.\u003c/p>\n\u003cp>\u003cstrong>Teaching WalkThrus and ADAPT.\u003c/strong> With Oliver Caviglioli he produced three volumes of five-step visual guides covering behaviour and relationships, curriculum planning, explaining and modelling, questioning and feedback, practice and retrieval, and Mode B teaching. The guides are designed for instructional coaching. Teachers work through the ADAPT cycle: Attempt the technique, Develop it, Adapt it to the subject and class, Practise, then Test whether it is working. The intent is that WalkThrus are a shared reference point, not a script.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>The Learning Rainforest: Great Teaching in Real Classrooms\u003c/em> (John Catt, 2017)\u003c/li>\n\u003cli>\u003cem>The Learning Rainforest Fieldbook\u003c/em> (John Catt, 2019)\u003c/li>\n\u003cli>\u003cem>Rosenshine&#39;s Principles in Action\u003c/em> (John Catt, 2019)\u003c/li>\n\u003cli>\u003cem>Teaching WalkThrus\u003c/em> volumes 1–3, with Oliver Caviglioli (John Catt, 2020, 2021, 2022)\u003c/li>\n\u003cli>teacherhead.com blog (2012 onwards)\u003c/li>\n\u003c/ul>\n\u003cp>Not verified: full details of later WalkThrus spin-off titles (for example the coaching and student-facing volumes); check the publisher&#39;s page before ordering.\u003c/p>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>For a classroom teacher:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Pick one questioning routine and make it the default.\u003c/strong> For example, pose the question, give thinking time, then cold call three pupils before commenting. Or ask every pupil to write an answer on a mini-whiteboard and scan the room before moving on.\u003c/li>\n\u003cli>\u003cstrong>Use &#39;say it again better&#39;.\u003c/strong> Accept a first, partial answer, then ask the same pupil to restate it in a full sentence with the technical vocabulary.\u003c/li>\n\u003cli>\u003cstrong>Plan lessons through the four strands.\u003c/strong> Ask: what are the small steps and what will I model? Which questions will tell me whether everyone has it? What am I reviewing from last week or last term? How will guided practice hand over to independent practice?\u003c/li>\n\u003cli>\u003cstrong>Pitch high.\u003c/strong> Plan the most demanding version of the task first, then decide the scaffolds.\u003c/li>\n\u003c/ul>\n\u003cp>For leaders:\u003c/p>\n\u003cul>\n\u003cli>Agree a small number of WalkThrus (or equivalent step-by-step descriptions) as shared language for a department or school, and use the ADAPT cycle in coaching so teachers adapt them to their subject.\u003c/li>\n\u003cli>Avoid turning Rosenshine or WalkThrus into an observation tick-list. Sherrington has written repeatedly against this.\u003c/li>\n\u003cli>Protect time for subject teams to plan some Mode B experiences across a key stage (a project, a debate, an extended practical) so they are not left to chance.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Checklist risk.\u003c/strong> The popularity of \u003cem>Rosenshine&#39;s Principles in Action\u003c/em> contributed to schools using the principles as a generic lesson template or monitoring form. Sherrington himself criticises this, but critics argue that simplified, branded summaries invite it.\u003c/li>\n\u003cli>\u003cstrong>Genericism.\u003c/strong> Subject specialists, including those in the curriculum community associated with Christine Counsell, have argued that generic pedagogical frameworks can obscure the way questioning, modelling and practice differ between, say, history and mathematics.\u003c/li>\n\u003cli>\u003cstrong>Evidence status of the synthesis.\u003c/strong> His frameworks (the rainforest, Mode A/B, the 80/20 balance) are professional judgement informed by research, not research findings in themselves. The 80/20 split is a rule of thumb.\u003c/li>\n\u003cli>\u003cstrong>Mode B.\u003c/strong> Some advocates of explicit instruction regard Mode B as a concession to less effective methods; others, such as Kristy Forrest writing in 2020s commentary, argue that Mode B has been under-specified compared with Mode A and needs equally careful codification.\u003c/li>\n\u003cli>\u003cstrong>Commercial playbooks.\u003c/strong> WalkThrus is a paid product and platform; schools should weigh it against building their own shared descriptions of practice.\u003c/li>\n\u003c/ul>\n","text":"At a glance Tom Sherrington is a former physics teacher and headteacher who now works as a consultant and writes the teacherhead.com blog. His main contribution is translation: turning research (Rosenshine, Wiliam, cognitive science) into classroom routines that ordinary teachers can use. Rosenshine's Principles in Action regroups the ten principles into four strands: sequencing concepts and modelling, questioning, reviewing material, and stages of practice. Teaching WalkThrus (with Oliver Caviglioli) breaks techniques into five illustrated steps and pairs them with the ADAPT cycle for coaching. Recurring themes: 'teach to the top', a knowledge-rich curriculum, checking the understanding of every pupil, and a balance of 'Mode A' and 'Mode B' teaching. Who they are Sherrington taught physics and maths and held leadership posts in several English secondary schools. He was headteacher of King Edward VI Grammar School, Chelmsford, and then of Highbury Grove School in Islington, leaving headship in 2017 (dates from the author's own published biographies; exact years not re-verified for this entry). Since then he has worked as an education consultant (Teacherhead Consulting) with schools and trusts in the UK and internationally, and is a regular speaker at researchED and similar events. His blog, teacherhead.com, has run since 2012 and is one of the most widely read teaching blogs in England. Core ideas The Learning Rainforest. The 2017 book uses a tree metaphor for great teaching in three parts: Establishing the conditions (the roots): attitudes and habits, relationships and behaviour, high expectations, and planning the curriculum. Building the knowledge structure (the trunk): explaining, modelling, questioning, feedback and practice, so that pupils secure knowledge. Exploring the possibilities (the canopy): more open-ended work such as projects, extended enquiry, oracy and independent study. The contrast he draws is between a 'plantation' (uniform, compliance-driven schooling) and a 'managed rainforest' (strong structures with room for diversity). Mode A and Mode B. Introduced in The Learning Rainforest and developed on the blog, this is a way of describing balance. Mode A is the mainstay: teacher-led instruction (explain, model, question, practise, give feedback), which he suggests should make up roughly 80% of lessons. Mode B is the remaining slice: enquiry, extended projects, debate, hands-on and creative tasks. His argument is that Mode B enriches the enacted curriculum but has to be planned deliberately and rests on knowledge built in Mode A. Rosenshine's four strands. In Rosenshine's Principles in Action (2019) he argues that the ten principles are easier to use when grouped: Sequencing concepts and modelling : small steps, models, scaffolds. Questioning : asking many questions and checking the understanding of all pupils. Reviewing material : daily, weekly and monthly review. Stages of practice : guided practice, a high success rate, then independent practice. He stresses that the principles are not a lesson plan or checklist, and that they apply differently across subjects. Teach to the top. Pitch lessons at the highest attainers in the room and scaffold others up to that level, rather than aiming at the middle and bolting on extension tasks. Questioning and checking for understanding. A staple of his blog and training is a small repertoire of techniques: cold calling, think-pair-share, mini-whiteboards ('show-me boards'), 'say it again better', probing questions and process questions. The underlying point is that a teacher should know what all pupils think, not just volunteers. Teaching WalkThrus and ADAPT. With Oliver Caviglioli he produced three volumes of five-step visual guides covering behaviour and relationships, curriculum planning, explaining and modelling, questioning and feedback, practice and retrieval, and Mode B teaching. The guides are designed for instructional coaching. Teachers work through the ADAPT cycle: Attempt the technique, Develop it, Adapt it to the subject and class, Practise, then Test whether it is working. The intent is that WalkThrus are a shared reference point, not a script. Key works The Learning Rainforest: Great Teaching in Real Classrooms (John Catt, 2017) The Learning Rainforest Fieldbook (John Catt, 2019) Rosenshine's Principles in Action (John Catt, 2019) Teaching WalkThrus volumes 1–3, with Oliver Caviglioli (John Catt, 2020, 2021, 2022) teacherhead.com blog (2012 onwards) Not verified: full details of later WalkThrus spin-off titles (for example the coaching and student-facing volumes); check the publisher's page before ordering. Putting it into practice For a classroom teacher: Pick one questioning routine and make it the default. For example, pose the question, give thinking time, then cold call three pupils before commenting. Or ask every pupil to write an answer on a mini-whiteboard and scan the room before moving on. Use 'say it again better'. Accept a first, partial answer, then ask the same pupil to restate it in a full sentence with the technical vocabulary. Plan lessons through the four strands. Ask: what are the small steps and what will I model? Which questions will tell me whether everyone has it? What am I reviewing from last week or last term? How will guided practice hand over to independent practice? Pitch high. Plan the most demanding version of the task first, then decide the scaffolds. For leaders: Agree a small number of WalkThrus (or equivalent step-by-step descriptions) as shared language for a department or school, and use the ADAPT cycle in coaching so teachers adapt them to their subject. Avoid turning Rosenshine or WalkThrus into an observation tick-list. Sherrington has written repeatedly against this. Protect time for subject teams to plan some Mode B experiences across a key stage (a project, a debate, an extended practical) so they are not left to chance. Critiques and debate Checklist risk. The popularity of Rosenshine's Principles in Action contributed to schools using the principles as a generic lesson template or monitoring form. Sherrington himself criticises this, but critics argue that simplified, branded summaries invite it. Genericism. Subject specialists, including those in the curriculum community associated with Christine Counsell, have argued that generic pedagogical frameworks can obscure the way questioning, modelling and practice differ between, say, history and mathematics. Evidence status of the synthesis. His frameworks (the rainforest, Mode A/B, the 80/20 balance) are professional judgement informed by research, not research findings in themselves. The 80/20 split is a rule of thumb. Mode B. Some advocates of explicit instruction regard Mode B as a concession to less effective methods; others, such as Kristy Forrest writing in 2020s commentary, argue that Mode B has been under-specified compared with Mode A and needs equally careful codification. Commercial playbooks. WalkThrus is a paid product and platform; schools should weigh it against building their own shared descriptions of practice."},{"slug":"whole-class-feedback","title":"Whole-class feedback","category":"assessment","type":"topic","summary":"The teacher reads a set of work without writing on it, notes common errors and strengths, then teaches a feedback lesson. It cuts marking time sharply; evidence on attainment is limited.","status":"Professional practice","evidence":"","tags":["feedback","marking","workload","whole-class feedback","misconceptions"],"checked":"2026-11-12","sources":[{"title":"How can we reduce teacher workload without affecting the quality of marking? Whole-class feedback","publisher":"Chartered College of Teaching","year":"2018","url":"https://my.chartered.college/research-hub/q-how-can-we-reduce-teacher-workload-without-affecting-the-quality-of-marking-a-whole-class-feedback"},{"title":"Effective feedback: Workload vs impact","publisher":"Chartered College of Teaching","year":"2018","url":"https://my.chartered.college/?p=3587"},{"title":"Teacher Feedback to Improve Pupil Learning (guidance report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/feedback"},{"title":"A marked improvement? A review of the evidence on written marking (news summary)","publisher":"Education Endowment Foundation / University of Oxford","year":"2016","url":"https://educationendowmentfoundation.org.uk/news/little-evidence-to-show-which-types-of-marking-improve-pupil-progress"}],"related":["marking-policy-and-workload","eef-teacher-feedback-guidance","live-marking-and-verbal-feedback"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Whole-class feedback (WCF) replaces individual written comments with a short teacher record of common errors, misconceptions and good examples, followed by reteaching and a pupil improvement task.\u003c/li>\n\u003cli>Its main proven benefit is time: small school-based studies report marking time per book falling to a fraction of what individual comments take.\u003c/li>\n\u003cli>There is no large trial showing it raises attainment more than written marking; equally, there is little robust evidence that written marking beats it.\u003c/li>\n\u003cli>It works when the feedback lesson changes what pupils do. A slide of generic targets read aloud is not feedback.\u003c/li>\n\u003cli>Some pupils, especially those with unusual errors or working well above or below the class, still need an individual word.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>WCF grew out of English schools&#39; response to the 2016 workload review and the EEF/Oxford finding that written marking is poorly evidenced. It is consistent with the EEF&#39;s 2021 guidance report, which says method matters less than whether feedback is built on good teaching, targets the task or subject, and is acted on by pupils.\u003c/p>\n\u003cp>Direct evidence is thin and mostly small-scale. Practitioner studies published by the Chartered College of Teaching report large reductions in marking time (one school reported roughly five minutes per book falling to about one and a half) with no apparent fall in homework completion or attainment in that context. A small Oxford study cited in the same literature found pupils \u003cem>perceived\u003c/em> individual feedback as more useful and could not establish a causal effect on attainment. These are not randomised trials and should be treated as indicative only.\u003c/p>\n\u003cp>Daisy Christodoulou and others have argued that WCF&#39;s real advantage is not only workload: generic written comments (&quot;add more analysis&quot;) are often less useful than a concrete reteach using real examples from the class, which is what a good WCF lesson provides. That is a reasoned argument rather than a trial finding.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>A workable routine for a set of Year 10 geography six-mark answers:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Read, don&#39;t write.\u003c/strong> Skim every answer (30 books in 20–30 minutes). Sort into three rough piles: secure, nearly there, not there.\u003c/li>\n\u003cli>\u003cstrong>Record on one sheet.\u003c/strong> Common misconceptions (for example, confusing weathering with erosion); missing elements (no named example); spelling of key terms; two or three strong sentences worth showing; names of pupils who need a conversation.\u003c/li>\n\u003cli>\u003cstrong>Plan the response, not just the report.\u003c/strong> Decide what to reteach, which model to show, and what task pupils will do.\u003c/li>\n\u003cli>\u003cstrong>Feedback lesson (15–25 minutes).\u003c/strong>\u003cul>\n\u003cli>Show a strong anonymised answer under the visualiser and unpick why it works.\u003c/li>\n\u003cli>Reteach the main misconception with a fresh example and check understanding with a quick question.\u003c/li>\n\u003cli>Pupils correct listed spellings and then complete an improvement task: rewrite the weakest paragraph, or answer a parallel question.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Circulate\u003c/strong> to the pupils flagged for an individual check.\u003c/li>\n\u003cli>\u003cstrong>Follow up.\u003c/strong> Set a similar question two weeks later to see whether the error has gone.\u003c/li>\n\u003c/ol>\n\u003cp>Subject variations:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Maths:\u003c/strong> WCF after a homework or quiz usually means identifying the two or three questions most pupils got wrong, modelling them again, and setting near-identical questions.\u003c/li>\n\u003cli>\u003cstrong>English:\u003c/strong> show two contrasting paragraphs from the class, co-edit one live, then pupils redraft their own.\u003c/li>\n\u003cli>\u003cstrong>MFL:\u003c/strong> list the five most frequent grammatical errors as sentences for pupils to correct before fixing their own work.\u003c/li>\n\u003cli>\u003cstrong>Art, DT, PE:\u003c/strong> group critique of work or performance against criteria, with one specific refinement for the next attempt.\u003c/li>\n\u003c/ul>\n\u003cp>Avoid giving each pupil a code that simply maps to a generic target; pupils need to locate the issue in their own work, with help if necessary.\u003c/p>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Allow departments to adopt WCF where it suits the task, rather than mandating a whole-school proforma. A compulsory WCF sheet that must be completed, filed and stuck in books recreates the compliance culture it was meant to remove.\u003c/li>\n\u003cli>Train staff in the feedback lesson, which is the hard part: selecting examples, reteaching, designing improvement tasks.\u003c/li>\n\u003cli>Tell parents and pupils why books have fewer written comments and what happens instead.\u003c/li>\n\u003cli>Quality-assure by watching feedback lessons and comparing before-and-after work, not by collecting sheets.\u003c/li>\n\u003cli>Keep individual written feedback where it has clear value: extended essays, A-level work, and coursework within exam board rules on permitted feedback.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Not individualised.\u003c/strong> Critics argue pupils with atypical errors, high attainers and pupils with SEND can be missed. Mitigation: the &quot;names&quot; box, live circulation and adapting the improvement task.\u003c/li>\n\u003cli>\u003cstrong>Pupils may not recognise the feedback as theirs.\u003c/strong> Novices often cannot tell which of the listed errors apply to them; they need the teacher to point, or a checklist to self-audit against.\u003c/li>\n\u003cli>\u003cstrong>Can become a fad.\u003c/strong> Christodoulou has asked whether WCF is &quot;saviour or fad&quot;; the risk is the format spreading while the reteaching disappears.\u003c/li>\n\u003cli>\u003cstrong>Evidence gap.\u003c/strong> Claims that WCF is &quot;more effective&quot; than marking are not supported by trial evidence; the defensible claim is that it is far cheaper in time and plausibly no worse.\u003c/li>\n\u003cli>\u003cstrong>It is still reactive.\u003c/strong> Frequent WCF on the same error suggests the original teaching or task design needs changing.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Chartered College Research Hub pieces on WCF and on workload versus impact (sources above).\u003c/li>\n\u003cli>EEF guidance report on teacher feedback, recommendations 1–3.\u003c/li>\n\u003cli>Not verified: the published results of the FLASH Marking trial (a UK trial of code-based feedback in English) were not checked for this entry.\u003c/li>\n\u003c/ul>\n","text":"At a glance Whole-class feedback (WCF) replaces individual written comments with a short teacher record of common errors, misconceptions and good examples, followed by reteaching and a pupil improvement task. Its main proven benefit is time: small school-based studies report marking time per book falling to a fraction of what individual comments take. There is no large trial showing it raises attainment more than written marking; equally, there is little robust evidence that written marking beats it. It works when the feedback lesson changes what pupils do. A slide of generic targets read aloud is not feedback. Some pupils, especially those with unusual errors or working well above or below the class, still need an individual word. What the evidence says WCF grew out of English schools' response to the 2016 workload review and the EEF/Oxford finding that written marking is poorly evidenced. It is consistent with the EEF's 2021 guidance report, which says method matters less than whether feedback is built on good teaching, targets the task or subject, and is acted on by pupils. Direct evidence is thin and mostly small-scale. Practitioner studies published by the Chartered College of Teaching report large reductions in marking time (one school reported roughly five minutes per book falling to about one and a half) with no apparent fall in homework completion or attainment in that context. A small Oxford study cited in the same literature found pupils perceived individual feedback as more useful and could not establish a causal effect on attainment. These are not randomised trials and should be treated as indicative only. Daisy Christodoulou and others have argued that WCF's real advantage is not only workload: generic written comments (\"add more analysis\") are often less useful than a concrete reteach using real examples from the class, which is what a good WCF lesson provides. That is a reasoned argument rather than a trial finding. In the classroom A workable routine for a set of Year 10 geography six-mark answers: Read, don't write. Skim every answer (30 books in 20–30 minutes). Sort into three rough piles: secure, nearly there, not there. Record on one sheet. Common misconceptions (for example, confusing weathering with erosion); missing elements (no named example); spelling of key terms; two or three strong sentences worth showing; names of pupils who need a conversation. Plan the response, not just the report. Decide what to reteach, which model to show, and what task pupils will do. Feedback lesson (15–25 minutes). Show a strong anonymised answer under the visualiser and unpick why it works. Reteach the main misconception with a fresh example and check understanding with a quick question. Pupils correct listed spellings and then complete an improvement task: rewrite the weakest paragraph, or answer a parallel question. Circulate to the pupils flagged for an individual check. Follow up. Set a similar question two weeks later to see whether the error has gone. Subject variations: Maths: WCF after a homework or quiz usually means identifying the two or three questions most pupils got wrong, modelling them again, and setting near-identical questions. English: sh
