4","url":"https://oide.ie/wp-content/uploads/2024/02/Droichead-Positive-Behaviour-Management-Post-primary.pdf"},{"title":"Bill Rogers (author archive)","publisher":"Tes","year":"Not verified","url":"https://www.tes.com/magazine/author/bill-rogers"}],"related":["paul-dix","tom-bennett","lee-canter"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Rogers gives teachers a \u003cstrong>language of discipline\u003c/strong>: short, respectful, rehearsed phrases that correct behaviour without escalating it.\u003c/li>\n\u003cli>Core principle: respond with the \u003cstrong>least intrusive\u003c/strong> intervention that will work, and move up only as needed.\u003c/li>\n\u003cli>Key techniques: tactical ignoring, description of reality, rule reminders, take-up time, partial agreement, directed choices, and separating \u003cstrong>primary\u003c/strong> from \u003cstrong>secondary\u003c/strong> behaviours.\u003c/li>\n\u003cli>The first weeks with a class (the \u003cstrong>establishment phase\u003c/strong>) are when rights, rules and routines are taught and practised.\u003c/li>\n\u003cli>Consequences matter, but it is the \u003cstrong>certainty\u003c/strong> of follow-up, not its severity, that changes behaviour.\u003c/li>\n\u003cli>Best used as a classroom-level skill set inside a clear whole-school system; it is not itself a school policy.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Dr Bill Rogers is an Australian education consultant and former teacher who has taught in primary and secondary schools. According to his publisher&#39;s biography, in 1985 he took up a consultancy post with the Victorian education ministry to promote whole-school approaches to discipline and student welfare. His website describes him as an Honorary Fellow of the Melbourne Graduate School of Education and an Honorary Life Fellow of Leeds Trinity University, and he was an adjunct professor of education at Griffith University for eight years from 2000. He has lectured in UK schools and universities for decades, and his website advertised a UK and Europe lecture tour for autumn 2026. His filmed classroom demonstrations and books are staples of initial teacher training in England.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Rights, responsibilities, rules and routines (the 4Rs).\u003c/strong> Classroom discipline rests on shared rights: to learn, to teach, to feel safe and to be treated with respect. Rules protect those rights; responsibilities go with them; routines make them habitual. Rogers advises a small number of positively worded rules, ideally discussed with the class.\u003c/p>\n\u003cp>\u003cstrong>The establishment phase.\u003c/strong> In the first lessons the teacher explicitly teaches entry, seating, how to get attention, noise levels, how to ask for help and how to leave. Rogers treats this as the highest-leverage period: habits set here are far harder to change later.\u003c/p>\n\u003cp>\u003cstrong>Least-to-most intrusive.\u003c/strong> Start with the lightest touch and step up:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Tactical ignoring\u003c/strong> of minor attention-seeking or secondary behaviour while attending to on-task pupils. It is a deliberate choice, not avoidance, and is never used for unsafe, hostile or persistently disruptive behaviour.\u003c/li>\n\u003cli>\u003cstrong>Non-verbal cues\u003c/strong>: a look, a gesture, moving nearer.\u003c/li>\n\u003cli>\u003cstrong>Description of reality\u003c/strong>: say what you see and let the pupil work out the rest. &#39;A number of people are talking.&#39;\u003c/li>\n\u003cli>\u003cstrong>Rule reminder\u003c/strong>: &#39;What&#39;s our rule for asking questions?&#39;\u003c/li>\n\u003cli>\u003cstrong>Direct instruction, ending in thanks\u003c/strong>: &#39;Jake, facing this way, thanks.&#39; &#39;Thanks&#39; signals expectation of compliance more than &#39;please&#39;.\u003c/li>\n\u003cli>\u003cstrong>Directed choice\u003c/strong>: &#39;Phone in your bag or on my desk. Your choice.&#39;\u003c/li>\n\u003cli>\u003cstrong>Clarifying a consequence\u003c/strong>, immediate or deferred, and then following through.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Take-up time.\u003c/strong> After a direction, turn away and carry on teaching. The pupil can comply without losing face, and the teacher avoids a stand-off.\u003c/p>\n\u003cp>\u003cstrong>Primary and secondary behaviours.\u003c/strong> The primary behaviour is the thing that needs to change (talking, phone out). Secondary behaviours are the sighs, eye-rolls, muttering and last words that follow correction. Rogers&#39;s advice is to keep the focus on the primary behaviour and deal with the rest later, if at all.\u003c/p>\n\u003cp>\u003cstrong>Partial agreement.\u003c/strong> Acknowledge the pupil&#39;s point and redirect, rather than argue it. &#39;Maybe you were only asking about the work, and I need you facing the front, thanks.&#39; He also uses &#39;when... then&#39; in place of &#39;no, because&#39;: &#39;When you&#39;ve finished the paragraph, then you can go.&#39;\u003c/p>\n\u003cp>\u003cstrong>Certainty not severity.\u003c/strong> Consequences should be known in advance, related to the behaviour, reasonable and respectful. A brief after-class conversation that always happens is worth more than a harsh sanction that sometimes does.\u003c/p>\n\u003cp>\u003cstrong>Repair and rebuild.\u003c/strong> After a consequence, the teacher re-establishes the working relationship. Rogers describes the &#39;decisive&#39; teacher as neither authoritarian nor indecisive: calm, clear, respectful and firm. He also stresses \u003cstrong>colleague support\u003c/strong>: no teacher should be left alone with a hard class.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>Classroom Behaviour: A Practical Guide to Effective Teaching, Behaviour Management and Colleague Support\u003c/em> (SAGE; 4th edition 2015; first published 2002).\u003c/li>\n\u003cli>\u003cem>You Know the Fair Rule\u003c/em> (first published 1990; later editions, years not verified).\u003c/li>\n\u003cli>\u003cem>Cracking the Hard Class\u003c/em> (SAGE; first published late 1990s, 2nd edition year not verified).\u003c/li>\n\u003cli>\u003cem>Behaviour Management: A Whole-School Approach\u003c/em> (years not verified).\u003c/li>\n\u003cli>\u003cem>Behaviour Recovery\u003c/em> (years not verified), on individual plans for pupils with persistent difficulties.\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>\u003cstrong>Teachers\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Script your five most common corrections and practise them aloud: a description of reality, a rule reminder, a direction ending in &#39;thanks&#39;, a directed choice, a partial agreement.\u003c/li>\n\u003cli>Use the pupil&#39;s name, pause, give the direction, then look away and keep teaching. Count take-up time in seconds, not minutes; return and acknowledge compliance quietly.\u003c/li>\n\u003cli>Correct privately where possible: move to the desk, lower your voice.\u003c/li>\n\u003cli>Replace &#39;why&#39; questions (&#39;Why are you talking?&#39;) with &#39;what&#39; questions (&#39;What should you be doing now?&#39;).\u003c/li>\n\u003cli>With a new class, plan the establishment phase as carefully as the content: teach each routine, practise it, and re-teach after holidays.\u003c/li>\n\u003cli>For deferred consequences, say calmly &#39;I&#39;ll need to see you for a minute after the lesson&#39; and then always do it.\u003c/li>\n\u003cli>After a difficult lesson, start the next one fresh; greet the pupil normally.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Leaders and mentors\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Use Rogers&#39;s vocabulary as shared language in coaching early career teachers: observe and feed back on tone, take-up time and focus on primary behaviour.\u003c/li>\n\u003cli>Rehearse scripts in training sessions; classroom language improves with practice, not reading.\u003c/li>\n\u003cli>Make it normal to ask for help with a hard class, including planned colleague support such as a time-out arrangement with a neighbouring room.\u003c/li>\n\u003cli>Check that the whole-school system supplies the certainty Rogers relies on: if deferred consequences are not backed up, the classroom techniques lose force.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Practitioner craft, not trial evidence.\u003c/strong> Rogers&#39;s approach draws on long classroom experience and psychological theory (he acknowledges Adlerian influences such as Rudolf Dreikurs). There are no large controlled trials of &#39;the Rogers method&#39;. Its elements are, however, consistent with what the EEF&#39;s \u003cem>Improving Behaviour in Schools\u003c/em> guidance says about classroom management.\u003c/li>\n\u003cli>\u003cstrong>Classroom, not system.\u003c/strong> Advocates of whole-school behaviour systems, such as Tom Bennett, argue that individual teacher technique cannot compensate for weak school culture. Rogers does write about whole-school approaches, but schools mostly use his classroom material.\u003c/li>\n\u003cli>\u003cstrong>Tactical ignoring is easily misapplied.\u003c/strong> Critics note that novices can slide into ignoring disruption that needs addressing, lowering expectations. Rogers himself limits the technique to low-level, non-disruptive behaviour.\u003c/li>\n\u003cli>\u003cstrong>Negotiation and firmness.\u003c/strong> Some proponents of very high-expectation approaches see partial agreement and choices as conceding too much; relational practitioners see Rogers as close to their own position. In practice he sits between consequence-led and restorative camps and is cited approvingly by both.\u003c/li>\n\u003cli>\u003cstrong>Context.\u003c/strong> The demonstrations are largely from Australian classrooms some years ago; tone and examples may need adapting, though the principles transfer well.\u003c/li>\n\u003c/ul>\n","text":"At a glance Rogers gives teachers a language of discipline : short, respectful, rehearsed phrases that correct behaviour without escalating it. Core principle: respond with the least intrusive intervention that will work, and move up only as needed. Key techniques: tactical ignoring, description of reality, rule reminders, take-up time, partial agreement, directed choices, and separating primary from secondary behaviours. The first weeks with a class (the establishment phase ) are when rights, rules and routines are taught and practised. Consequences matter, but it is the certainty of follow-up, not its severity, that changes behaviour. Best used as a classroom-level skill set inside a clear whole-school system; it is not itself a school policy. Who they are Dr Bill Rogers is an Australian education consultant and former teacher who has taught in primary and secondary schools. According to his publisher's biography, in 1985 he took up a consultancy post with the Victorian education ministry to promote whole-school approaches to discipline and student welfare. His website describes him as an Honorary Fellow of the Melbourne Graduate School of Education and an Honorary Life Fellow of Leeds Trinity University, and he was an adjunct professor of education at Griffith University for eight years from 2000. He has lectured in UK schools and universities for decades, and his website advertised a UK and Europe lecture tour for autumn 2026. His filmed classroom demonstrations and books are staples of initial teacher training in England. Core ideas Rights, responsibilities, rules and routines (the 4Rs). Classroom discipline rests on shared rights: to learn, to teach, to feel safe and to be treated with respect. Rules protect those rights; responsibilities go with them; routines make them habitual. Rogers advises a small number of positively worded rules, ideally discussed with the class. The establishment phase. In the first lessons the teacher explicitly teaches entry, seating, how to get attention, noise levels, how to ask for help and how to leave. Rogers treats this as the highest-leverage period: habits set here are far harder to change later. Least-to-most intrusive. Start with the lightest touch and step up: Tactical ignoring of minor attention-seeking or secondary behaviour while attending to on-task pupils. It is a deliberate choice, not avoidance, and is never used for unsafe, hostile or persistently disruptive behaviour. Non-verbal cues : a look, a gesture, moving nearer. Description of reality : say what you see and let the pupil work out the rest. 'A number of people are talking.' Rule reminder : 'What's our rule for asking questions?' Direct instruction, ending in thanks : 'Jake, facing this way, thanks.' 'Thanks' signals expectation of compliance more than 'please'. Directed choice : 'Phone in your bag or on my desk. Your choice.' Clarifying a consequence , immediate or deferred, and then following through. Take-up time. After a direction, turn away and carry on teaching. The pupil can comply without losing face, and the teacher avoids a stand-off. Primary and secondary behaviours. The primary behaviour is the thing that needs to change (talking, phone out). Secondary behaviours are the sighs, eye-rolls, muttering and last words that follow correction. Rogers's advice is to keep the focus on the primary behaviour and deal with the rest later, if at all. Partial agreement. Acknowledge the pupil's point and redirect, rather than argue it. 'Maybe you were only asking about the work, and I need you facing the front, thanks.' He also uses 'when... then' in place of 'no, because': 'When you've finished the paragraph, then you can go.' Certainty not severity. Consequences should be known in advance, related to the behaviour, reasonable and respectful. A brief after-class conversation that always happens is worth more than a harsh sanction that sometimes does. Repair and rebuild. After a consequence, the teacher re-establishes the working relationship. Rogers describes the 'decisive' teacher as neither authoritarian nor indecisive: calm, clear, respectful and firm. He also stresses colleague support : no teacher should be left alone with a hard class. Key works Classroom Behaviour: A Practical Guide to Effective Teaching, Behaviour Management and Colleague Support (SAGE; 4th edition 2015; first published 2002). You Know the Fair Rule (first published 1990; later editions, years not verified). Cracking the Hard Class (SAGE; first published late 1990s, 2nd edition year not verified). Behaviour Management: A Whole-School Approach (years not verified). Behaviour Recovery (years not verified), on individual plans for pupils with persistent difficulties. Putting it into practice Teachers Script your five most common corrections and practise them aloud: a description of reality, a rule reminder, a direction ending in 'thanks', a directed choice, a partial agreement. Use the pupil's name, pause, give the direction, then look away and keep teaching. Count take-up time in seconds, not minutes; return and acknowledge compliance quietly. Correct privately where possible: move to the desk, lower your voice. Replace 'why' questions ('Why are you talking?') with 'what' questions ('What should you be doing now?'). With a new class, plan the establishment phase as carefully as the content: teach each routine, practise it, and re-teach after holidays. For deferred consequences, say calmly 'I'll need to see you for a minute after the lesson' and then always do it. After a difficult lesson, start the next one fresh; greet the pupil normally. Leaders and mentors Use Rogers's vocabulary as shared language in coaching early career teachers: observe and feed back on tone, take-up time and focus on primary behaviour. Rehearse scripts in training sessions; classroom language improves with practice, not reading. Make it normal to ask for help with a hard class, including planned colleague support such as a time-out arrangement with a neighbouring room. Check that the whole-school system supplies the certainty Rogers relies on: if deferred consequences are not backed up, the classroom techniques lose force. Critiques and debate Practitioner craft, not trial evidence. Rogers's approach draws on long classroom experience and psychological theory (he acknowledges Adlerian influences such as Rudolf Dreikurs). There are no large controlled trials of 'the Rogers method'. Its elements are, however, consistent with what the EEF's Improving Behaviour in Schools guidance says about classroom management. Classroom, not system. Advocates of whole-school behaviour systems, such as Tom Bennett, argue that individual teacher technique cannot compensate for weak school culture. Rogers does write about whole-school approaches, but schools mostly use his classroom material. Tactical ignoring is easily misapplied. Critics note that novices can slide into ignoring disruption that needs addressing, lowering expectations. Rogers himself limits the technique to low-level, non-disruptive behaviour. Negotiation and firmness. Some proponents of very high-expectation approaches see partial agreement and choices as conceding too much; relational practitioners see Rogers as close to their own position. In practice he sits between consequence-led and restorative camps and is cited approvingly by both. Context. The demonstrations are largely from Australian classrooms some years ago; tone and examples may need adapting, though the principles transfer well."},{"slug":"child-protection-policy-and-procedures","title":"Child protection policy and procedures","category":"safeguarding","type":"topic","summary":"What a school's child protection and safeguarding policy should contain under KCSIE 2026, how to make it a working procedure rather than a document, and what governors should check.","status":"Professional practice","evidence":"","tags":["child protection policy","procedures","kcsie","governance","statutory policies","safeguarding culture"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"Keeping children safe in education (KCSIE) 2026: summary of changes (CASPAR briefing)","publisher":"NSPCC Learning","year":"2026","url":"https://learning.nspcc.org.uk/research-resources/schools/keeping-children-safe-in-education-caspar-briefing"},{"title":"KCSIE 2026 published: key changes schools and colleges need to be aware of","publisher":"Stone King","year":"2026","url":"https://www.stoneking.co.uk/literature/e-bulletins/kcsie-2026-published-key-changes-schools-and-colleges-need-be-aware"}],"related":["keeping-children-safe-in-education","designated-safeguarding-lead","safeguarding-records-and-information-sharing","allegations-and-low-level-concerns"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>KCSIE says governing bodies and proprietors \u003cstrong>should\u003c/strong> ensure there is an effective child protection policy that reflects local safeguarding partnership procedures, is \u003cstrong>reviewed at least annually\u003c/strong> and is \u003cstrong>publicly available\u003c/strong>, normally on the website. For independent schools and academies the policy is a requirement of the independent school standards.\u003c/li>\n\u003cli>It sits with a set of linked documents: staff behaviour policy (code of conduct), behaviour policy, safeguarding response to children absent from education, online safety, and the role of the DSL.\u003c/li>\n\u003cli>The policy should describe what actually happens in \u003cstrong>your\u003c/strong> school: names, routes, systems, local contacts.\u003c/li>\n\u003cli>For September 2026 the policy needed updating for KCSIE 2026, &#39;Working together&#39; 2026 and the new information sharing duty.\u003c/li>\n\u003cli>A policy is tested by whether a supply teacher, a lunchtime supervisor and a Year 8 pupil know what to do.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>The requirement comes from statutory guidance, underpinned by section 175 of the Education Act 2002 (maintained schools and colleges) and section 157 with the independent school standards (academies and independent schools). In a multi-academy trust there may be a trust-wide policy, but each school needs its own local procedures and contacts.\u003c/p>\n\u003cp>\u003cstrong>Content KCSIE expects the policy or linked policies to cover:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>the school&#39;s commitment and the definition of safeguarding;\u003c/li>\n\u003cli>roles: all staff, DSL and deputies, headteacher, governing body or trust;\u003c/li>\n\u003cli>recognising abuse, neglect and exploitation, and specific issues such as child-on-child abuse, online safety, child sexual and criminal exploitation, FGM, mental health, Prevent;\u003c/li>\n\u003cli>what to do when a child discloses or a concern arises; recording; when and how to refer; the right of any member of staff to refer directly;\u003c/li>\n\u003cli>early help and Family Help;\u003c/li>\n\u003cli>children with additional vulnerability: SEND, children with a social worker, looked-after and previously looked-after children, children absent from education, children in alternative provision;\u003c/li>\n\u003cli>procedures for child-on-child abuse, including sharing of nudes;\u003c/li>\n\u003cli>allegations and low-level concerns about adults; whistleblowing;\u003c/li>\n\u003cli>safer recruitment (often a separate policy);\u003c/li>\n\u003cli>filtering and monitoring, and use of mobile and smart technology;\u003c/li>\n\u003cli>information sharing and record transfer;\u003c/li>\n\u003cli>training and induction;\u003c/li>\n\u003cli>use of school premises by other organisations: KCSIE says schools should seek assurance that hirers have safeguarding policies and that this is a condition of the hire.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>2026 points to reflect\u003c/strong> (see the KCSIE entry; confirm against the text): Part one for all staff; Family Help terminology; gender questioning children; generative AI, deepfakes and annual filtering and monitoring review; DSL cover; alternative provision quality assurance; revised regulated activity; the information sharing duty.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>What the policy should mean for staff day to day:\u003c/p>\n\u003cul>\n\u003cli>At induction every member of staff, including supply staff, trainees and volunteers, is given the policy, the code of conduct, the behaviour policy, the response to children absent from education, Part one of KCSIE and the names of the DSL team.\u003c/li>\n\u003cli>A one-page flowchart in the staffroom, on lanyards or on the staff intranet: notice, reassure, record, report to DSL, same day.\u003c/li>\n\u003cli>Staff know the scripts: &#39;I&#39;m glad you told me. I can&#39;t keep this secret; I need to tell [DSL] so we can help.&#39;\u003c/li>\n\u003cli>Staff know the alternatives: head for concerns about adults; chair of governors for concerns about the head; children&#39;s social care or police directly if a child is in immediate danger.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cp>\u003cstrong>Writing it:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Start from your local authority or partnership model policy where one exists; it will carry the correct local thresholds and contacts. Then cut and localise.\u003c/li>\n\u003cli>Keep the core procedure short and put reference material (definitions, indicators of specific harms) in appendices.\u003c/li>\n\u003cli>Name roles, with contact details, and say who covers.\u003c/li>\n\u003cli>Cross-check for contradictions with the behaviour, attendance, online safety, RSHE and staff conduct policies.\u003c/li>\n\u003cli>Publish it; produce a pupil-friendly and parent-friendly summary.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Making it work:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Brief all staff every September on what has changed; test with scenario questions through the year.\u003c/li>\n\u003cli>Ask pupils whether they know who to talk to and whether they would.\u003c/li>\n\u003cli>Include the policy in contracts with alternative provision, sports coaches, agencies and site hirers.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Governors and trustees check:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>approval and annual review date, and that it cites current guidance and local procedures;\u003c/li>\n\u003cli>a named safeguarding governor or trustee;\u003c/li>\n\u003cli>evidence of implementation: training records, case file audit, single central record check, pupil and staff voice, the local authority&#39;s annual safeguarding audit (section 175/157);\u003c/li>\n\u003cli>that the board itself has had safeguarding training, which KCSIE says all governors and trustees should receive at induction and regularly thereafter.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cp>Common audit and inspection failings:\u003c/p>\n\u003cul>\n\u003cli>policy cites an out-of-date KCSIE edition, former staff or a previous local authority&#39;s contacts;\u003c/li>\n\u003cli>a generic purchased template nobody on site has edited;\u003c/li>\n\u003cli>trust policy with no school-level procedures;\u003c/li>\n\u003cli>policy says one thing, staff describe another;\u003c/li>\n\u003cli>no reference to site hirers, alternative provision or online learning;\u003c/li>\n\u003cli>reviewed annually on paper but not after an incident or a change in law.\u003c/li>\n\u003c/ul>\n\u003cp>Length is a real problem: many policies exceed 40 pages and go unread. A short procedure plus appendices is defensible.\u003c/p>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Use your local safeguarding partnership&#39;s model policy and procedures first; they are the procedures you must follow. This is general information, not legal advice.\u003c/p>\n","text":"At a glance KCSIE says governing bodies and proprietors should ensure there is an effective child protection policy that reflects local safeguarding partnership procedures, is reviewed at least annually and is publicly available , normally on the website. For independent schools and academies the policy is a requirement of the independent school standards. It sits with a set of linked documents: staff behaviour policy (code of conduct), behaviour policy, safeguarding response to children absent from education, online safety, and the role of the DSL. The policy should describe what actually happens in your school: names, routes, systems, local contacts. For September 2026 the policy needed updating for KCSIE 2026, 'Working together' 2026 and the new information sharing duty. A policy is tested by whether a supply teacher, a lunchtime supervisor and a Year 8 pupil know what to do. What the evidence says The requirement comes from statutory guidance, underpinned by section 175 of the Education Act 2002 (maintained schools and colleges) and section 157 with the independent school standards (academies and independent schools). In a multi-academy trust there may be a trust-wide policy, but each school needs its own local procedures and contacts. Content KCSIE expects the policy or linked policies to cover: the school's commitment and the definition of safeguarding; roles: all staff, DSL and deputies, headteacher, governing body or trust; recognising abuse, neglect and exploitation, and specific issues such as child-on-child abuse, online safety, child sexual and criminal exploitation, FGM, mental health, Prevent; what to do when a child discloses or a concern arises; recording; when and how to refer; the right of any member of staff to refer directly; early help and Family Help; children with additional vulnerability: SEND, children with a social worker, looked-after and previously looked-after children, children absent from education, children in alternative provision; procedures for child-on-child abuse, including sharing of nudes; allegations and low-level concerns about adults; whistleblowing; safer recruitment (often a separate policy); filtering and monitoring, and use of mobile and smart technology; information sharing and record transfer; training and induction; use of school premises by other organisations: KCSIE says schools should seek assurance that hirers have safeguarding policies and that this is a condition of the hire. 2026 points to reflect (see the KCSIE entry; confirm against the text): Part one for all staff; Family Help terminology; gender questioning children; generative AI, deepfakes and annual filtering and monitoring review; DSL cover; alternative provision quality assurance; revised regulated activity; the information sharing duty. In the classroom What the policy should mean for staff day to day: At induction every member of staff, including supply staff, trainees and volunteers, is given the policy, the code of conduct, the behaviour policy, the response to children absent from education, Part one of KCSIE and the names of the DSL team. A one-page flowchart in the staffroom, on lanyards or on the staff intranet: notice, reassure, record, report to DSL, same day. Staff know the scripts: 'I'm glad you told me. I can't keep this secret; I need to tell [DSL] so we can help.' Staff know the alternatives: head for concerns about adults; chair of governors for concerns about the head; children's social care or police directly if a child is in immediate danger. For leaders Writing it: Start from your local authority or partnership model policy where one exists; it will carry the correct local thresholds and contacts. Then cut and localise. Keep the core procedure short and put reference material (definitions, indicators of specific harms) in appendices. Name roles, with contact details, and say who covers. Cross-check for contradictions with the behaviour, attendance, online safety, RSHE and staff conduct policies. Publish it; produce a pupil-friendly and parent-friendly summary. Making it work: Brief all staff every September on what has changed; test with scenario questions through the year. Ask pupils whether they know who to talk to and whether they would. Include the policy in contracts with alternative provision, sports coaches, agencies and site hirers. Governors and trustees check: approval and annual review date, and that it cites current guidance and local procedures; a named safeguarding governor or trustee; evidence of implementation: training records, case file audit, single central record check, pupil and staff voice, the local authority's annual safeguarding audit (section 175/157); that the board itself has had safeguarding training, which KCSIE says all governors and trustees should receive at induction and regularly thereafter. Cautions and critiques Common audit and inspection failings: policy cites an out-of-date KCSIE edition, former staff or a previous local authority's contacts; a generic purchased template nobody on site has edited; trust policy with no school-level procedures; policy says one thing, staff describe another; no reference to site hirers, alternative provision or online learning; reviewed annually on paper but not after an incident or a change in law. Length is a real problem: many policies exceed 40 pages and go unread. A short procedure plus appendices is defensible. Go deeper Use your local safeguarding partnership's model policy and procedures first; they are the procedures you must follow. This is general information, not legal advice."},{"slug":"child-on-child-abuse-and-sexual-harassment","title":"Child-on-child abuse and sexual harassment","category":"safeguarding","type":"guidance","summary":"What KCSIE 2026 (Part five and Part two) expects when children harm other children, including sexual harassment and sexual violence: culture, reporting, risk assessment and the response options.","status":"Statutory guidance","evidence":"","tags":["child-on-child abuse","sexual harassment","sexual violence","harmful sexual behaviour","kcsie","misogyny"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"KCSIE 2026: serious violence and child-on-child sexual harassment and sexual violence","publisher":"Winckworth Sherwood","year":"2026","url":"https://wslaw.co.uk/insight/kcsie-2026-serious-violence-and-child-on-child-sexual-harassment-and-sexual-violence/"},{"title":"KCSiE 2026: new guidance relating to child-on-child abuse","publisher":"Lexology","year":"2026","url":"https://www.lexology.com/library/detail.aspx?g=0efe9578-b4a8-4c76-8155-c0dd03787b80"},{"title":"Sexual violence and sexual harassment between children in schools and colleges (CASPAR briefing)","publisher":"NSPCC Learning","year":"2026","url":"https://learning.nspcc.org.uk/research-resources/schools/sexual-violence-harassment-schools-colleges-guidance-caspar-briefing"}],"related":["keeping-children-safe-in-education","preventing-bullying","behaviour-in-schools-guidance","designated-safeguarding-lead"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Child-on-child abuse includes bullying (including online and prejudice-based), abuse in teenage relationships, physical abuse, sexual violence, sexual harassment, upskirting, sharing of nudes, and initiation or hazing rituals.\u003c/li>\n\u003cli>KCSIE&#39;s starting point: assume it \u003cstrong>is happening\u003c/strong> in your school even if nothing is reported, and never dismiss it as banter or part of growing up.\u003c/li>\n\u003cli>Part five of KCSIE 2026 gives the detailed process for sexual harassment and sexual violence. It was restructured in 2026 around a continuum of harmful sexual behaviour, with harassment addressed first.\u003c/li>\n\u003cli>Every report needs: reassurance for the child who reports, a recorded risk and needs assessment where appropriate, a decision on the response route, and support for all children involved.\u003c/li>\n\u003cli>Upskirting and sexual offences are crimes; rape, assault by penetration and sexual assault reports should be passed to the police, normally alongside a social care referral.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cp>Statutory guidance: KCSIE 2026, Part five and the child-on-child abuse content in Parts one and two, in force 1 September 2026. The separate DfE advice &#39;Sexual violence and sexual harassment between children in schools and colleges&#39; was withdrawn and merged into KCSIE in 2022.\u003c/p>\n\u003cp>\u003cstrong>What changed in 2026\u003c/strong> (from legal and NSPCC briefings; confirm against the text):\u003c/p>\n\u003cul>\n\u003cli>Part five reorganised to reflect a continuum from harmful sexual behaviour through harassment to sexual violence, rather than leading with sexual violence.\u003c/li>\n\u003cli>\u003cstrong>Misogyny\u003c/strong> named more explicitly and more often as a safeguarding concern.\u003c/li>\n\u003cli>A new point that \u003cstrong>all\u003c/strong> incidents of sharing nudes or semi-nudes need a safeguarding response, whether or not the sharing was consensual.\u003c/li>\n\u003cli>Referral language updated to Family Help, in line with &#39;Working together&#39; 2026.\u003c/li>\n\u003cli>Terminology aligned with &#39;Behaviour in schools&#39; (for example &#39;sanction&#39;).\u003c/li>\n\u003cli>Not verified: the exact wording of the revised Part five heading and paragraph numbers.\u003c/li>\n\u003c/ul>\n\u003cp>Context remains Ofsted&#39;s 2021 review of sexual abuse in schools, which found harassment and online sexual abuse so common that many pupils saw no point in reporting.\u003c/p>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>Schools \u003cstrong>must\u003c/strong> have regard to KCSIE and comply with the Equality Act 2010, including the public sector equality duty, and the Human Rights Act 1998. KCSIE says the child protection policy \u003cstrong>should\u003c/strong> include:\u003c/p>\n\u003cul>\n\u003cli>procedures to minimise the risk of child-on-child abuse;\u003c/li>\n\u003cli>how allegations are recorded, investigated and dealt with;\u003c/li>\n\u003cli>clear processes for supporting victims, alleged perpetrators and other children affected;\u003c/li>\n\u003cli>a statement that abuse is never tolerated or passed off as banter;\u003c/li>\n\u003cli>recognition that it may be happening without reports, and of the gendered nature of much sexual harassment while taking all reports seriously.\u003c/li>\n\u003c/ul>\n\u003cp>The DSL \u003cstrong>should\u003c/strong> consider a risk and needs assessment for every report of sexual violence, and case by case for harassment, covering the victim, the alleged perpetrator and other pupils, including time and location and transport. For rape or assault by penetration, the alleged perpetrator should be removed from shared classes while arrangements are considered.\u003c/p>\n\u003ch2>In practice\u003c/h2>\n\u003cp>\u003cstrong>Response options\u003c/strong> in Part five: manage internally; early help or Family Help; referral to children&#39;s social care; report to the police. Record the decision and the reasons each time. A police decision to take no further action, or a not-guilty verdict, does not end the school&#39;s duty to support both children and manage risk.\u003c/p>\n\u003cp>\u003cstrong>Staff:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>challenge sexualised language, comments on appearance, and unwanted touching every time; record it so patterns are visible;\u003c/li>\n\u003cli>take a report without leading questions, with a second adult where possible, and do not view or forward images;\u003c/li>\n\u003cli>tell the child what happens next and pass to the DSL the same day.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>DSLs:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>hold a written risk assessment and review it as circumstances change;\u003c/li>\n\u003cli>keep the victim&#39;s wishes central, including about how any separation works, while being clear when a referral must be made regardless;\u003c/li>\n\u003cli>treat the child alleged to have caused harm as a child with possible unmet needs or own experience of abuse;\u003c/li>\n\u003cli>log incidents by type, year group, place and time; use pupil voice surveys to find the unreported.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Governors and trustees:\u003c/strong> ask for anonymised trend data, pupil survey results, how RSHE is addressing consent, pornography and misogyny, and how the behaviour policy and child protection policy fit together.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Low incident numbers taken as assurance rather than as a reporting-culture question.\u003c/li>\n\u003cli>Waiting for the police outcome before acting on risk or support.\u003c/li>\n\u003cli>A sanction issued but no risk assessment or safeguarding analysis; or the reverse.\u003c/li>\n\u003cli>Victim moved or timetabled away as the default, which punishes the reporter.\u003c/li>\n\u003cli>Online harm between pupils out of school hours treated as outside the school&#39;s remit.\u003c/li>\n\u003cli>Disability, SEND and LGBT-related vulnerability overlooked in risk assessment.\u003c/li>\n\u003cli>Treating a young person&#39;s malicious or unsubstantiated report without considering whether they need help.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Read Part five in full; it is long but procedural. For harmful sexual behaviour, local partnerships often use a screening tool; follow your local safeguarding partnership&#39;s procedures. This is general information, not legal advice.\u003c/p>\n","text":"At a glance Child-on-child abuse includes bullying (including online and prejudice-based), abuse in teenage relationships, physical abuse, sexual violence, sexual harassment, upskirting, sharing of nudes, and initiation or hazing rituals. KCSIE's starting point: assume it is happening in your school even if nothing is reported, and never dismiss it as banter or part of growing up. Part five of KCSIE 2026 gives the detailed process for sexual harassment and sexual violence. It was restructured in 2026 around a continuum of harmful sexual behaviour, with harassment addressed first. Every report needs: reassurance for the child who reports, a recorded risk and needs assessment where appropriate, a decision on the response route, and support for all children involved. Upskirting and sexual offences are crimes; rape, assault by penetration and sexual assault reports should be passed to the police, normally alongside a social care referral. Status and current version Statutory guidance: KCSIE 2026, Part five and the child-on-child abuse content in Parts one and two, in force 1 September 2026. The separate DfE advice 'Sexual violence and sexual harassment between children in schools and colleges' was withdrawn and merged into KCSIE in 2022. What changed in 2026 (from legal and NSPCC briefings; confirm against the text): Part five reorganised to reflect a continuum from harmful sexual behaviour through harassment to sexual violence, rather than leading with sexual violence. Misogyny named more explicitly and more often as a safeguarding concern. A new point that all incidents of sharing nudes or semi-nudes need a safeguarding response, whether or not the sharing was consensual. Referral language updated to Family Help, in line with 'Working together' 2026. Terminology aligned with 'Behaviour in schools' (for example 'sanction'). Not verified: the exact wording of the revised Part five heading and paragraph numbers. Context remains Ofsted's 2021 review of sexual abuse in schools, which found harassment and online sexual abuse so common that many pupils saw no point in reporting. What schools must do Schools must have regard to KCSIE and comply with the Equality Act 2010, including the public sector equality duty, and the Human Rights Act 1998. KCSIE says the child protection policy should include: procedures to minimise the risk of child-on-child abuse; how allegations are recorded, investigated and dealt with; clear processes for supporting victims, alleged perpetrators and other children affected; a statement that abuse is never tolerated or passed off as banter; recognition that it may be happening without reports, and of the gendered nature of much sexual harassment while taking all reports seriously. The DSL should consider a risk and needs assessment for every report of sexual violence, and case by case for harassment, covering the victim, the alleged perpetrator and other pupils, including time and location and transport. For rape or assault by penetration, the alleged perpetrator should be removed from shared classes while arrangements are considered. In practice Response options in Part five: manage internally; early help or Family Help; referral to children's social care; report to the police. Record the decision and the reasons each time. A police decision to take no further action, or a not-guilty verdict, does not end the school's duty to support both children and manage risk. Staff: challenge sexualised language, comments on appearance, and unwanted touching every time; record it so patterns are visible; take a report without leading questions, with a second adult where possible, and do not view or forward images; tell the child what happens next and pass to the DSL the same day. DSLs: hold a written risk assessment and review it as circumstances change; keep the victim's wishes central, including about how any separation works, while being clear when a referral must be made regardless; treat the child alleged to have caused harm as a child with possible unmet needs or own experience of abuse; log incidents by type, year group, place and time; use pupil voice surveys to find the unreported. Governors and trustees: ask for anonymised trend data, pupil survey results, how RSHE is addressing consent, pornography and misogyny, and how the behaviour policy and child protection policy fit together. Common pitfalls Low incident numbers taken as assurance rather than as a reporting-culture question. Waiting for the police outcome before acting on risk or support. A sanction issued but no risk assessment or safeguarding analysis; or the reverse. Victim moved or timetabled away as the default, which punishes the reporter. Online harm between pupils out of school hours treated as outside the school's remit. Disability, SEND and LGBT-related vulnerability overlooked in risk assessment. Treating a young person's malicious or unsubstantiated report without considering whether they need help. Go deeper Read Part five in full; it is long but procedural. For harmful sexual behaviour, local partnerships often use a screening tool; follow your local safeguarding partnership's procedures. This is general information, not legal advice."},{"slug":"christine-counsell","title":"Christine Counsell","category":"thinkers","type":"person","summary":"History educator and curriculum thinker. Gave English schools the working vocabulary of substantive and disciplinary knowledge, 'core and hinterland', and curriculum as narrative; argues senior leaders must lead curriculum through subjects.","status":"Thinker profile","evidence":"","tags":["curriculum","substantive knowledge","disciplinary knowledge","subject leadership","history","knowledge-rich"],"checked":"2026-11-12","sources":[{"title":"Taking curriculum seriously","publisher":"Chartered College of Teaching, Impact (Issue 4)","year":"2018","url":"https://my.chartered.college/?p=6423"},{"title":"CPD pack: Taking curriculum seriously","publisher":"Chartered College of Teaching","year":"Not verified","url":"https://my.chartered.college/impact_article/taking-curriculum-seriously-cpd-pack"},{"title":"Christine Counsell: The support our middle leaders need if curricula are to flourish","publisher":"researchED","year":"2020","url":"https://researched.org.uk/2020/06/23/christine-counsell-the-support-our-middle-leaders-need-if-curricula-are-to-flourish/"},{"title":"Curriculum development: ask the expert, how to build a strong curriculum","publisher":"Tes","year":"Not verified","url":"https://www.tes.com/magazine/teaching-learning/general/curriculum-development-ask-expert-how-build-strong-curriculum"},{"title":"Taking (geography) curriculum seriously","publisher":"Royal Geographical Society","year":"Not verified","url":"https://rgs.org/schools/curriculum-and-professional-support/ideas-for-teachers/taking-geography-curriculum-seriously"}],"related":["ks3-assessment-after-levels","mary-myatt"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Counsell&#39;s central distinction: \u003cstrong>substantive knowledge\u003c/strong> (the established facts, concepts and accounts of a subject) and \u003cstrong>disciplinary knowledge\u003c/strong> (how the subject establishes, tests and revises that knowledge). Pupils need both.\u003c/li>\n\u003cli>\u003cstrong>Curriculum is content structured as narrative over time\u003c/strong>: what pupils learn now only makes sense in light of what came before and prepares for what comes later.\u003c/li>\n\u003cli>\u003cstrong>Core and hinterland\u003c/strong>: the residue you want pupils to retain depends on the rich surrounding material through which it is taught. Cut the hinterland and the core becomes brittle.\u003c/li>\n\u003cli>The \u003cstrong>curriculum is the progression model\u003c/strong>: getting better at a subject means knowing more of its curriculum, not climbing generic skill ladders.\u003c/li>\n\u003cli>Senior leaders cannot lead curriculum generically. They need enough understanding of each subject&#39;s structure to ask good questions of subject leaders.\u003c/li>\n\u003cli>Her work is the intellectual backbone of much of the post-2019 &#39;curriculum turn&#39; in England, including Ofsted&#39;s language.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Christine Counsell was a secondary history teacher, head of department and deputy headteacher before leading the history PGCE at the University of Cambridge for 19 years. She was for many years an editor of the Historical Association&#39;s journal \u003cem>Teaching History\u003c/em>, where she fostered a tradition of history teachers publishing their own curriculum research. From 2016 she was director of education at the Inspiration Trust, and she served on Ofsted&#39;s curriculum advisory group during development of the 2019 framework (dates and titles not verified against primary sources). She now works independently as a curriculum consultant and is co-founder, with Steve Mastin, of \u003cstrong>Opening Worlds\u003c/strong>, a knowledge-rich humanities programme for key stage 2. Her blog, \u003cem>The Dignity of the Thing\u003c/em>, carried her influential 2018 posts on senior curriculum leadership.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Substantive and disciplinary knowledge.\u003c/strong> Substantive knowledge is what the subject claims: that the Reformation happened and how, what photosynthesis is, what a sonnet does. Disciplinary knowledge is what pupils learn about how such claims come to be made: how historians use evidence and argue about causation, how scientists test hypotheses, how critics construct interpretations. Counsell insists this is \u003cstrong>knowledge about the discipline\u003c/strong>, taught explicitly, not a set of generic &#39;skills&#39;. A curriculum with only substantive content presents knowledge as fixed; one that chases disciplinary &#39;skills&#39; without content has nothing to think with.\u003c/p>\n\u003cp>\u003cstrong>Curriculum as narrative.\u003c/strong> A curriculum works like a story: early content establishes characters, settings and ideas that later content relies on. Sequence therefore matters in its own right. Asking &#39;why this, why now?&#39; of any unit is asking what it does for the narrative: what earlier knowledge makes it accessible, and what later learning it makes possible.\u003c/p>\n\u003cp>\u003cstrong>Core and hinterland.\u003c/strong> The core is what pupils should remember long-term. The hinterland is the supporting material (stories, examples, context, texts) that makes the core meaningful and memorable. In her account, reducing a novel or a historical period to a list of key points for retrieval strips out exactly what gives those points meaning. The distinction is a warning against thin knowledge organisers as much as against content-free skills.\u003c/p>\n\u003cp>\u003cstrong>The curriculum as the progression model.\u003c/strong> With her colleague Michael Fordham, Counsell argues that progress means having learned the curriculum. Assessment should check whether pupils have secured the specific content taught, cumulatively, rather than assign generic levels or GCSE-style grades in key stage 3.\u003c/p>\n\u003cp>\u003cstrong>Final performance as &#39;deceiver and guide&#39;.\u003c/strong> The end product (an essay, an exam answer) is a poor guide to what should be taught on the way. Fluent reading and writing at 16 are the indirect result of broad knowledge accumulated over years. Rehearsing the final performance early, such as GCSE question types in Year 7, mistakes the outcome for the route.\u003c/p>\n\u003cp>\u003cstrong>Critique of genericism.\u003c/strong> She argues that English school leadership became dominated by generic tools (lesson grades, skills ladders, data tracking, uniform teaching policies) that ignore how subjects differ. What counts as good questioning, practice or feedback depends on the subject.\u003c/p>\n\u003cp>\u003cstrong>Subject communities and middle leaders.\u003c/strong> Curriculum quality depends on subject leaders who are scholars of their subject&#39;s curriculum, connected to subject associations and to published teacher research. Senior leaders&#39; job is to create the conditions: time, subject-specific professional development and intelligent line management.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>&#39;Taking curriculum seriously&#39;, \u003cem>Impact\u003c/em> (Chartered College of Teaching), Issue 4, 2018.\u003c/li>\n\u003cli>&#39;Senior Curriculum Leadership&#39; blog series, \u003cem>The Dignity of the Thing\u003c/em>, 2018, including posts on curriculum as narrative and on final performance.\u003c/li>\n\u003cli>&#39;Disciplinary knowledge for all, the secondary history curriculum and history teachers&#39; achievement&#39;, \u003cem>The Curriculum Journal\u003c/em>, 2011 (not opened for this entry).\u003c/li>\n\u003cli>&#39;Historical knowledge and historical skills: a distracting dichotomy&#39;, in \u003cem>Issues in History Teaching\u003c/em> (Routledge, 2000; not opened for this entry).\u003c/li>\n\u003cli>Opening Worlds key stage 2 humanities curriculum (with Steve Mastin).\u003c/li>\n\u003cli>Not verified: key stage 3 history textbook series published since 2023.\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>\u003cstrong>Subject leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>For each unit, list the substantive content pupils must retain and the disciplinary question the unit serves (for example, in history, a causation or interpretation enquiry). Check both are present.\u003c/li>\n\u003cli>Trace one concept (&#39;parliament&#39;, &#39;energy&#39;, &#39;metaphor&#39;) across five years. Where is it first met, where deepened, where relied on?\u003c/li>\n\u003cli>Mark your core and your hinterland. Protect the hinterland when time is short; do not reduce the unit to the knowledge organiser.\u003c/li>\n\u003cli>Rewrite key stage 3 assessment to test what was taught, cumulatively. Remove GCSE grade descriptors from Years 7 to 9.\u003c/li>\n\u003cli>Join your subject association; read and discuss its journal in department time.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Senior leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Learn the basic shape of each subject you line-manage. Useful questions, in the spirit of her leadership posts: What is cumulative in your subject and what is hierarchical? What does this unit depend on, and what depends on it? What disciplinary thinking are pupils being introduced to? What would you lose if you cut this text or topic?\u003c/li>\n\u003cli>Stop imposing generic lesson structures or feedback rules that do not fit particular subjects; let departments specify what good practice looks like for them, and hold them to it.\u003c/li>\n\u003cli>Give subject teams regular, protected time for curriculum development and subject-specific CPD.\u003c/li>\n\u003cli>Use quality assurance to look at the curriculum as enacted (plans, pupils&#39; work, conversations with pupils about what they remember), not at isolated lessons against a generic checklist.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Subject range.\u003c/strong> Counsell&#39;s examples come mostly from history and the humanities. The substantive/disciplinary distinction maps less neatly on to mathematics, modern languages, PE or the arts, and subject specialists have had to adapt or contest it. Ofsted&#39;s subject research reviews use varying terminology for this reason.\u003c/li>\n\u003cli>\u003cstrong>Knowledge-rich critiques.\u003c/strong> Critics of the knowledge turn, including some academics in curriculum studies and voices associated with the 2024-25 Curriculum and Assessment Review debates, argue that it can overload content, privilege a traditional canon and under-value creativity, oracy and applied learning. Counsell&#39;s own emphasis on disciplinary knowledge and on diverse, rigorous content is partly an answer to the canon criticism, but the argument continues.\u003c/li>\n\u003cli>\u003cstrong>Who chooses the narrative?\u003c/strong> If curriculum is narrative, selection matters. Scholars concerned with representation ask whose stories are told. Counsell has written in support of broader and more diverse history content, grounded in scholarship.\u003c/li>\n\u003cli>\u003cstrong>Risk of new orthodoxy.\u003c/strong> Her vocabulary was absorbed quickly into inspection and school documents, sometimes as jargon (&#39;intent statements&#39;, sequencing rationales) rather than thought. She has herself warned against proxies and compliance.\u003c/li>\n\u003cli>\u003cstrong>Demand on leaders.\u003c/strong> Expecting senior leaders to understand every subject&#39;s structure is a high bar, especially in small schools. Trust-wide subject networks are one response.\u003c/li>\n\u003cli>\u003cstrong>Published evidence.\u003c/strong> Her arguments are scholarly and theoretical, supported by a large body of teacher-authored research in history education, not by trials comparing curriculum models.\u003c/li>\n\u003c/ul>\n","text":"At a glance Counsell's central distinction: substantive knowledge (the established facts, concepts and accounts of a subject) and disciplinary knowledge (how the subject establishes, tests and revises that knowledge). Pupils need both. Curriculum is content structured as narrative over time : what pupils learn now only makes sense in light of what came before and prepares for what comes later. Core and hinterland : the residue you want pupils to retain depends on the rich surrounding material through which it is taught. Cut the hinterland and the core becomes brittle. The curriculum is the progression model : getting better at a subject means knowing more of its curriculum, not climbing generic skill ladders. Senior leaders cannot lead curriculum generically. They need enough understanding of each subject's structure to ask good questions of subject leaders. Her work is the intellectual backbone of much of the post-2019 'curriculum turn' in England, including Ofsted's language. Who they are Christine Counsell was a secondary history teacher, head of department and deputy headteacher before leading the history PGCE at the University of Cambridge for 19 years. She was for many years an editor of the Historical Association's journal Teaching History , where she fostered a tradition of history teachers publishing their own curriculum research. From 2016 she was director of education at the Inspiration Trust, and she served on Ofsted's curriculum advisory group during development of the 2019 framework (dates and titles not verified against primary sources). She now works independently as a curriculum consultant and is co-founder, with Steve Mastin, of Opening Worlds , a knowledge-rich humanities programme for key stage 2. Her blog, The Dignity of the Thing , carried her influential 2018 posts on senior curriculum leadership. Core ideas Substantive and disciplinary knowledge. Substantive knowledge is what the subject claims: that the Reformation happened and how, what photosynthesis is, what a sonnet does. Disciplinary knowledge is what pupils learn about how such claims come to be made: how historians use evidence and argue about causation, how scientists test hypotheses, how critics construct interpretations. Counsell insists this is knowledge about the discipline , taught explicitly, not a set of generic 'skills'. A curriculum with only substantive content presents knowledge as fixed; one that chases disciplinary 'skills' without content has nothing to think with. Curriculum as narrative. A curriculum works like a story: early content establishes characters, settings and ideas that later content relies on. Sequence therefore matters in its own right. Asking 'why this, why now?' of any unit is asking what it does for the narrative: what earlier knowledge makes it accessible, and what later learning it makes possible. Core and hinterland. The core is what pupils should remember long-term. The hinterland is the supporting material (stories, examples, context, texts) that makes the core meaningful and memorable. In her account, reducing a novel or a historical period to a list of key points for retrieval strips out exactly what gives those points meaning. The distinction is a warning against thin knowledge organisers as much as against content-free skills. The curriculum as the progression model. With her colleague Michael Fordham, Counsell argues that progress means having learned the curriculum. Assessment should check whether pupils have secured the specific content taught, cumulatively, rather than assign generic levels or GCSE-style grades in key stage 3. Final performance as 'deceiver and guide'. The end product (an essay, an exam answer) is a poor guide to what should be taught on the way. Fluent reading and writing at 16 are the indirect result of broad knowledge accumulated over years. Rehearsing the final performance early, such as GCSE question types in Year 7, mistakes the outcome for the route. Critique of genericism. She argues that English school leadership became dominated by generic tools (lesson grades, skills ladders, data tracking, uniform teaching policies) that ignore how subjects differ. What counts as good questioning, practice or feedback depends on the subject. Subject communities and middle leaders. Curriculum quality depends on subject leaders who are scholars of their subject's curriculum, connected to subject associations and to published teacher research. Senior leaders' job is to create the conditions: time, subject-specific professional development and intelligent line management. Key works 'Taking curriculum seriously', Impact (Chartered College of Teaching), Issue 4, 2018. 'Senior Curriculum Leadership' blog series, The Dignity of the Thing , 2018, including posts on curriculum as narrative and on final performance. 'Disciplinary knowledge for all, the secondary history curriculum and history teachers' achievement', The Curriculum Journal , 2011 (not opened for this entry). 'Historical knowledge and historical skills: a distracting dichotomy', in Issues in History Teaching (Routledge, 2000; not opened for this entry). Opening Worlds key stage 2 humanities curriculum (with Steve Mastin). Not verified: key stage 3 history textbook series published since 2023. Putting it into practice Subject leaders For each unit, list the substantive content pupils must retain and the disciplinary question the unit serves (for example, in history, a causation or interpretation enquiry). Check both are present. Trace one concept ('parliament', 'energy', 'metaphor') across five years. Where is it first met, where deepened, where relied on? Mark your core and your hinterland. Protect the hinterland when time is short; do not reduce the unit to the knowledge organiser. Rewrite key stage 3 assessment to test what was taught, cumulatively. Remove GCSE grade descriptors from Years 7 to 9. Join your subject association; read and discuss its journal in department time. Senior leaders Learn the basic shape of each subject you line-manage. Useful questions, in the spirit of her leadership posts: What is cumulative in your subject and what is hierarchical? What does this unit depend on, and what depends on it? What disciplinary thinking are pupils being introduced to? What would you lose if you cut this text or topic? Stop imposing generic lesson structures or feedback rules that do not fit particular subjects; let departments specify what good practice looks like for them, and hold them to it. Give subject teams regular, protected time for curriculum development and subject-specific CPD. Use quality assurance to look at the curriculum as enacted (plans, pupils' work, conversations with pupils about what they remember), not at isolated lessons against a generic checklist. Critiques and debate Subject range. Counsell's examples come mostly from history and the humanities. The substantive/disciplinary distinction maps less neatly on to mathematics, modern languages, PE or the arts, and subject specialists have had to adapt or contest it. Ofsted's subject research reviews use varying terminology for this reason. Knowledge-rich critiques. Critics of the knowledge turn, including some academics in curriculum studies and voices associated with the 2024-25 Curriculum and Assessment Review debates, argue that it can overload content, privilege a traditional canon and under-value creativity, oracy and applied learning. Counsell's own emphasis on disciplinary knowledge and on diverse, rigorous content is partly an answer to the canon criticism, but the argument continues. Who chooses the narrative? If curriculum is narrative, selection matters. Scholars concerned with representation ask whose stories are told. Counsell has written in support of broader and more diverse history content, grounded in scholarship. Risk of new orthodoxy. Her vocabulary was absorbed quickly into inspection and school documents, sometimes as jargon ('intent statements', sequencing rationales) rather than thought. She has herself warned against proxies and compliance. Demand on leaders. Expecting senior leaders to understand every subject's structure is a high bar, especially in small schools. Trust-wide subject networks are one response. Published evidence. Her arguments are scholarly and theoretical, supported by a large body of teacher-authored research in history education, not by trials comparing curriculum models."},{"slug":"cognitive-load-theory","title":"Cognitive load theory","category":"teaching","type":"topic","summary":"John Sweller's theory that learning is limited by working memory, so instruction should cut unnecessary load and manage the difficulty of new material. Influential, useful and contested.","status":"Research and theory","evidence":"","tags":["cognitive science","working memory","sweller","worked examples","instructional design"],"checked":"2026-11-12","sources":[{"title":"Cognitive load theory: Research that teachers really need to understand","publisher":"NSW Centre for Education Statistics and Evaluation","year":"2017","url":"https://education.nsw.gov.au/about-us/education-data-and-research/cese/publications/literature-reviews/cognitive-load-theory.html"},{"title":"Cognitive science approaches in the classroom: a review of the evidence (news release and report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/news/new-what-do-we-really-know-about-cognitive-science-in-the-classroom-eef-publishes-new-review-of-the-evidence/"},{"title":"Why Minimal Guidance During Instruction Does Not Work (Kirschner, Sweller and Clark)","publisher":"Open Universiteit research portal","year":"2006","url":"https://research.ou.nl/en/publications/why-minimal-guidance-during-instruction-does-not-work-an-analysis/"},{"title":"What do teachers need to know about cognitive load theory?","publisher":"David Didau, The Learning Spy","year":"2018","url":"https://learningspy.co.uk/psychology/what-do-teachers-need-to-know-about-cognitive-load-theory/"},{"title":"Cognitive load theory: the other loads teachers need to know","publisher":"Tes","year":"2021","url":"https://www.tes.com/magazine/teaching-learning/general/cognitive-load-theory-clt-other-loads-teachers-need-know"}],"related":["john-sweller","explicit-instruction","desirable-difficulties","rosenshine-principles-of-instruction"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Working memory can hold and process only a few new items at once; long-term memory is effectively unlimited. Learning means building knowledge (schemas) in long-term memory.\u003c/li>\n\u003cli>Once knowledge is secure it no longer taxes working memory, which is why experts cope with complexity that swamps novices.\u003c/li>\n\u003cli>Teachers can manage load by cutting what is irrelevant (extraneous load) and by sequencing and breaking down what is inherently hard (intrinsic load).\u003c/li>\n\u003cli>The best-supported classroom implications are worked examples for novices, integrating text with diagrams, removing redundant material and fading guidance as expertise grows.\u003c/li>\n\u003cli>&#39;Reduce cognitive load&#39; does not mean &#39;make it easy&#39;. The aim is to spend limited attention on the thing to be learned.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>Sweller set out the theory in 1988 from experiments showing that novices who solved problems by search learned less than those who studied solutions. The theory has since generated a family of &#39;effects&#39;, mostly from controlled experiments:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Worked example effect.\u003c/strong> Novices learn more from studying worked solutions than from solving equivalent problems.\u003c/li>\n\u003cli>\u003cstrong>Split-attention effect.\u003c/strong> Learning suffers when pupils must mentally combine separated sources, such as a diagram and a key on another page. Integrate labels into the diagram.\u003c/li>\n\u003cli>\u003cstrong>Redundancy effect.\u003c/strong> Presenting the same information twice (reading slides aloud word for word, decorative extras) can impair learning.\u003c/li>\n\u003cli>\u003cstrong>Modality effect.\u003c/strong> A diagram with spoken explanation can work better than a diagram with dense written text.\u003c/li>\n\u003cli>\u003cstrong>Expertise reversal effect.\u003c/strong> Supports that help novices become unnecessary, and sometimes harmful, for more knowledgeable learners.\u003c/li>\n\u003cli>\u003cstrong>Guidance fading.\u003c/strong> Move from full worked examples to partially completed ones to independent problems.\u003c/li>\n\u003c/ul>\n\u003cp>The theory distinguishes \u003cstrong>intrinsic load\u003c/strong> (the complexity of the material relative to what the learner already knows) from \u003cstrong>extraneous load\u003c/strong> (caused by poor presentation or task design). A third type, &#39;germane&#39; load, appears in older accounts; Sweller and colleagues have since played it down, treating it as the working memory devoted to intrinsic load.\u003c/p>\n\u003cp>The New South Wales CESE review (2017) is the most-used teacher summary and notes that the theory rests on a large number of randomised experiments. The EEF&#39;s 2021 review of cognitive science in classrooms found support for worked examples (chiefly secondary maths and science) and for scaffolding to manage load in Key Stages 2–4 maths, science and reading comprehension, while stressing that classroom-based evidence is thin for other subjects and ages.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Explanations.\u003c/strong> One new idea at a time. In Year 7 maths, teach collecting like terms with positive coefficients before introducing negatives.\u003c/li>\n\u003cli>\u003cstrong>Slides and resources.\u003c/strong> Remove clip art, animations and paragraphs you intend to say anyway. Put labels on the diagram of the heart, not in a numbered key. Hand out the diagram so pupils do not copy and listen simultaneously.\u003c/li>\n\u003cli>\u003cstrong>Talk and text.\u003c/strong> Do not talk over pupils while they read or write. Give the instruction, then silence.\u003c/li>\n\u003cli>\u003cstrong>Worked examples.\u003c/strong> Pair each worked example with a near-identical problem (&#39;example–problem pairs&#39;), then fade: complete the last step, then the last two, then the whole.\u003c/li>\n\u003cli>\u003cstrong>Pre-teach components.\u003c/strong> Secure vocabulary and number facts before the complex task, so they are not competing for attention during it. In a Year 10 chemistry required practical, teach the method and the apparatus names the lesson before.\u003c/li>\n\u003cli>\u003cstrong>Routines.\u003c/strong> Familiar lesson routines free attention for content.\u003c/li>\n\u003cli>\u003cstrong>Adjust for expertise.\u003c/strong> A Year 13 class revising a familiar topic needs problems, not more worked examples.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Cognitive load theory is a useful \u003cstrong>lens for reviewing resources and explanations\u003c/strong> in department time: &#39;what in this booklet is not helping pupils learn the thing?&#39;\u003c/li>\n\u003cli>It should not be reduced to rules such as &#39;no more than X words on a slide&#39; or bans on group work or images.\u003c/li>\n\u003cli>The DfE&#39;s framework for trainee and early career teachers includes working memory and prior knowledge under &#39;how pupils learn&#39;, so new staff will arrive with the vocabulary. Check that it is being applied in subject-specific ways.\u003c/li>\n\u003cli>Cost is negligible; the investment is collaborative planning time.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Measurement and falsifiability.\u003c/strong> Cognitive load is usually inferred from self-ratings or from outcomes. Ton de Jong (2010) and others argue that, because load types cannot be measured separately, almost any result can be explained after the fact.\u003c/li>\n\u003cli>\u003cstrong>Lab-to-classroom gap.\u003c/strong> Many experiments are short, with university students or with maths and science content. The EEF review cautions against assuming the effects transfer to every subject, age and timescale.\u003c/li>\n\u003cli>\u003cstrong>Motivation and emotion\u003c/strong> are largely outside the theory. A sequence that is optimal for load can still be dull, and pupils who are anxious have less working memory to spare.\u003c/li>\n\u003cli>\u003cstrong>Tension with desirable difficulties.\u003c/strong> The Bjorks&#39; work shows that some difficulty during practice improves long-term retention. The usual reconciliation is: reduce load when first acquiring complex material, add difficulty when practising it.\u003c/li>\n\u003cli>\u003cstrong>Productive failure.\u003c/strong> Kapur&#39;s studies suggest attempting problems before instruction can help conceptual understanding in some cases, which challenges a strict &#39;examples first&#39; rule.\u003c/li>\n\u003cli>\u003cstrong>Overreach.\u003c/strong> Didau argues teachers need the core idea (novices should not be left to problem-solve unfamiliar, complex content) rather than the full technical apparatus.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The CESE review and its companion practice guide are free and written for teachers.\u003c/li>\n\u003cli>Sweller, van Merriënboer and Paas, &#39;Cognitive architecture and instructional design: 20 years later&#39; (2019), gives the theory&#39;s current form.\u003c/li>\n\u003cli>See the entries on John Sweller, modelling and worked examples, dual coding and desirable difficulties.\u003c/li>\n\u003c/ul>\n","text":"At a glance Working memory can hold and process only a few new items at once; long-term memory is effectively unlimited. Learning means building knowledge (schemas) in long-term memory. Once knowledge is secure it no longer taxes working memory, which is why experts cope with complexity that swamps novices. Teachers can manage load by cutting what is irrelevant (extraneous load) and by sequencing and breaking down what is inherently hard (intrinsic load). The best-supported classroom implications are worked examples for novices, integrating text with diagrams, removing redundant material and fading guidance as expertise grows. 'Reduce cognitive load' does not mean 'make it easy'. The aim is to spend limited attention on the thing to be learned. What the evidence says Sweller set out the theory in 1988 from experiments showing that novices who solved problems by search learned less than those who studied solutions. The theory has since generated a family of 'effects', mostly from controlled experiments: Worked example effect. Novices learn more from studying worked solutions than from solving equivalent problems. Split-attention effect. Learning suffers when pupils must mentally combine separated sources, such as a diagram and a key on another page. Integrate labels into the diagram. Redundancy effect. Presenting the same information twice (reading slides aloud word for word, decorative extras) can impair learning. Modality effect. A diagram with spoken explanation can work better than a diagram with dense written text. Expertise reversal effect. Supports that help novices become unnecessary, and sometimes harmful, for more knowledgeable learners. Guidance fading. Move from full worked examples to partially completed ones to independent problems. The theory distinguishes intrinsic load (the complexity of the material relative to what the learner already knows) from extraneous load (caused by poor presentation or task design). A third type, 'germane' load, appears in older accounts; Sweller and colleagues have since played it down, treating it as the working memory devoted to intrinsic load. The New South Wales CESE review (2017) is the most-used teacher summary and notes that the theory rests on a large number of randomised experiments. The EEF's 2021 review of cognitive science in classrooms found support for worked examples (chiefly secondary maths and science) and for scaffolding to manage load in Key Stages 2–4 maths, science and reading comprehension, while stressing that classroom-based evidence is thin for other subjects and ages. In the classroom Explanations. One new idea at a time. In Year 7 maths, teach collecting like terms with positive coefficients before introducing negatives. Slides and resources. Remove clip art, animations and paragraphs you intend to say anyway. Put labels on the diagram of the heart, not in a numbered key. Hand out the diagram so pupils do not copy and listen simultaneously. Talk and text. Do not talk over pupils while they read or write. Give the instruction, then silence. Worked examples. Pair each worked example with a near-identical problem ('example–problem pairs'), then fade: complete the last step, then the last two, then the whole. Pre-teach components. Secure vocabulary and number facts before the complex task, so they are not competing for attention during it. In a Year 10 chemistry required practical, teach the method and the apparatus names the lesson before. Routines. Familiar lesson routines free attention for content. Adjust for expertise. A Year 13 class revising a familiar topic needs problems, not more worked examples. For leaders Cognitive load theory is a useful lens for reviewing resources and explanations in department time: 'what in this booklet is not helping pupils learn the thing?' It should not be reduced to rules such as 'no more than X words on a slide' or bans on group work or images. The DfE's framework for trainee and early career teachers includes working memory and prior knowledge under 'how pupils learn', so new staff will arrive with the vocabulary. Check that it is being applied in subject-specific ways. Cost is negligible; the investment is collaborative planning time. Cautions and critiques Measurement and falsifiability. Cognitive load is usually inferred from self-ratings or from outcomes. Ton de Jong (2010) and others argue that, because load types cannot be measured separately, almost any result can be explained after the fact. Lab-to-classroom gap. Many experiments are short, with university students or with maths and science content. The EEF review cautions against assuming the effects transfer to every subject, age and timescale. Motivation and emotion are largely outside the theory. A sequence that is optimal for load can still be dull, and pupils who are anxious
