ow two contrasting paragraphs from the class, co-edit one live, then pupils redraft their own. MFL: list the five most frequent grammatical errors as sentences for pupils to correct before fixing their own work. Art, DT, PE: group critique of work or performance against criteria, with one specific refinement for the next attempt. Avoid giving each pupil a code that simply maps to a generic target; pupils need to locate the issue in their own work, with help if necessary. For leaders Allow departments to adopt WCF where it suits the task, rather than mandating a whole-school proforma. A compulsory WCF sheet that must be completed, filed and stuck in books recreates the compliance culture it was meant to remove. Train staff in the feedback lesson, which is the hard part: selecting examples, reteaching, designing improvement tasks. Tell parents and pupils why books have fewer written comments and what happens instead. Quality-assure by watching feedback lessons and comparing before-and-after work, not by collecting sheets. Keep individual written feedback where it has clear value: extended essays, A-level work, and coursework within exam board rules on permitted feedback. Cautions and critiques Not individualised. Critics argue pupils with atypical errors, high attainers and pupils with SEND can be missed. Mitigation: the \"names\" box, live circulation and adapting the improvement task. Pupils may not recognise the feedback as theirs. Novices often cannot tell which of the listed errors apply to them; they need the teacher to point, or a checklist to self-audit against. Can become a fad. Christodoulou has asked whether WCF is \"saviour or fad\"; the risk is the format spreading while the reteaching disappears. Evidence gap. Claims that WCF is \"more effective\" than marking are not supported by trial evidence; the defensible claim is that it is far cheaper in time and plausibly no worse. It is still reactive. Frequent WCF on the same error suggests the original teaching or task design needs changing. Go deeper Chartered College Research Hub pieces on WCF and on workload versus impact (sources above). EEF guidance report on teacher feedback, recommendations 1–3. Not verified: the published results of the FLASH Marking trial (a UK trial of code-based feedback in English) were not checked for this entry."},{"slug":"working-together-to-safeguard-children","title":"Working together to safeguard children","category":"safeguarding","type":"guidance","summary":"The statutory multi-agency safeguarding guidance for England. The 2026 edition (March 2026) replaced the 2023 version and embeds Family Help; schools follow it alongside KCSIE and local procedures.","status":"Statutory guidance","evidence":"","tags":["working together","multi-agency","family help","child protection","safeguarding partners","statutory guidance"],"checked":"2026-11-12","sources":[{"title":"Working together to safeguard children 2026: summary of changes","publisher":"Department for Education","year":"2026","url":"https://www.gov.uk/government/publications/working-together-to-safeguard-children--2/working-together-to-safeguard-children-2026-summary-of-changes"},{"title":"Working together to safeguard children 2026: summary of changes (CASPAR briefing)","publisher":"NSPCC Learning","year":"2026","url":"https://learning.nspcc.org.uk/research-resources/2026/working-together-to-safeguard-children-2026-summary-of-changes"},{"title":"Working Together to Safeguard Children 2026: what has changed","publisher":"Farrer & Co","year":"2026","url":"https://www.farrer.co.uk/news-and-insights/working-together-to-safeguard-children-2026-what-has-changed/"},{"title":"Working together to safeguard children 2026: what schools need to know","publisher":"Harrison Clark Rickerbys","year":"2026","url":"https://www.hcrlaw.com/news-and-insights/working-together-to-safeguard-children-2026-what-schools-need-to-know/"}],"related":["keeping-children-safe-in-education","safeguarding-records-and-information-sharing","designated-safeguarding-lead","child-protection-policy-and-procedures"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>&#39;Working together to safeguard children&#39; is the statutory guidance on how agencies in England work together to help, support and protect children.\u003c/li>\n\u003cli>The current edition is \u003cstrong>Working together 2026\u003c/strong>, published by the DfE in March 2026 (secondary sources give 18 March). It replaces the 2023 edition.\u003c/li>\n\u003cli>Its headline change is \u003cstrong>Family Help\u003c/strong>: targeted early help and section 17 &#39;child in need&#39; support are brought together as one offer, with a named lead practitioner for the family.\u003c/li>\n\u003cli>It applies to education providers. KCSIE 2026 was rewritten to align with it, so school policies should use its terminology.\u003c/li>\n\u003cli>Local detail (thresholds, referral forms, escalation routes) comes from the three statutory safeguarding partners: the local authority, the integrated care board and the police.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cp>\u003cstrong>Who it applies to.\u003c/strong> All organisations and agencies with functions relating to children, including local authorities, health bodies, police, and all schools, colleges and childcare settings. It is issued under several statutory powers (including the Children Acts 1989 and 2004); bodies covered must have regard to it and depart from it only with good reason.\u003c/p>\n\u003cp>\u003cstrong>Version.\u003c/strong> 2026 edition, replacing 2023. The DfE published a summary of changes and updated the Children&#39;s Social Care National Framework alongside it.\u003c/p>\n\u003cp>\u003cstrong>What changed in 2026\u003c/strong> (from the DfE summary and NSPCC and legal briefings):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Family Help\u003c/strong> set out as a distinct tier, delivered by multi-disciplinary teams, reflecting the national &#39;Families First&#39; reforms to children&#39;s social care.\u003c/li>\n\u003cli>\u003cstrong>Scope made explicit:\u003c/strong> all children, including those in kinship care, under special guardianship, adopted or looked after, and unborn children where there are concerns.\u003c/li>\n\u003cli>\u003cstrong>New or strengthened themes:\u003c/strong> recognising and challenging racism and discrimination; the needs of babies; domestic abuse; children facing several harms at once; hearing the child&#39;s voice through direct work, including non-verbal children.\u003c/li>\n\u003cli>\u003cstrong>Serious incident notifications and reviews:\u003c/strong> changes to notification requirements and timescales for rapid reviews. Not verified: the exact timescales; check the text.\u003c/li>\n\u003cli>\u003cstrong>Education and childcare:\u003c/strong> a dedicated section on partnership working with education and early years providers.\u003c/li>\n\u003cli>\u003cstrong>Unchanged:\u003c/strong> the chapter on child death reviews.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Related legislation.\u003c/strong> The Children&#39;s Wellbeing and Schools Act 2026 contains measures to strengthen the role of education in local multi-agency safeguarding arrangements and to create multi-agency child protection teams. Not verified: whether those sections had been commenced by November 2026. See the entry on the Act.\u003c/p>\n\u003ch2>What schools must do\u003c/h2>\n\u003cul>\n\u003cli>Schools are named &#39;relevant agencies&#39; in most local arrangements. When named, they \u003cstrong>must\u003c/strong> act in accordance with the local arrangements published by the safeguarding partners.\u003c/li>\n\u003cli>Schools \u003cstrong>must\u003c/strong> have regard to this guidance and to KCSIE in carrying out their safeguarding duties.\u003c/li>\n\u003cli>Schools \u003cstrong>should\u003c/strong> contribute to assessments, strategy discussions, child protection conferences, core groups and child-in-need or Family Help plans, and share relevant information.\u003c/li>\n\u003cli>Schools \u003cstrong>should\u003c/strong> supply information for, and act on learning from, local child safeguarding practice reviews.\u003c/li>\n\u003cli>Schools \u003cstrong>must\u003c/strong> tell the local authority when removing a pupil&#39;s name from the admission register at a non-standard transition point; this is a duty under the school attendance regulations, restated in the guidance.\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cp>\u003cstrong>Staff\u003c/strong> do not need to read the full document. They need to know: what early help and Family Help are, that concerns go to the DSL, and that anyone may refer to children&#39;s social care directly if a child is at risk and the DSL cannot be reached.\u003c/p>\n\u003cp>\u003cstrong>DSLs\u003c/strong> should:\u003c/p>\n\u003cul>\n\u003cli>read the chapters on Family Help, child protection and the education section, and the local partnership&#39;s updated threshold document;\u003c/li>\n\u003cli>know the local &#39;front door&#39; (often a MASH), the expected response time to a referral, and the local escalation or professional-disagreement procedure;\u003c/li>\n\u003cli>attend or send a written report to every conference and core group, and keep evidence of contribution;\u003c/li>\n\u003cli>be clear who the lead practitioner is for each child with a plan, and what the school&#39;s actions are.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Governors and trustees\u003c/strong> should check that the school is engaged with the local partnership (for example completing the section 175/157 safeguarding audit), that the policy reflects local procedures, and that the DSL reports on referral outcomes and escalations, not just counts.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Referrals that describe incidents but not the impact on the child or what the school has already tried.\u003c/li>\n\u003cli>Accepting &#39;no further action&#39; on a referral without following up or using the escalation procedure when concerns remain.\u003c/li>\n\u003cli>Policies using pre-2026 terms or a superseded local threshold document.\u003c/li>\n\u003cli>Poor attendance at multi-agency meetings in school holidays, with no report sent.\u003c/li>\n\u003cli>Assuming national guidance is enough: local arrangements differ and are what partners and inspectors will test against.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Start with the DfE summary of changes, then your local safeguarding children partnership&#39;s website for the threshold document and multi-agency procedures. This entry is general information, not legal advice.\u003c/p>\n","text":"At a glance 'Working together to safeguard children' is the statutory guidance on how agencies in England work together to help, support and protect children. The current edition is Working together 2026 , published by the DfE in March 2026 (secondary sources give 18 March). It replaces the 2023 edition. Its headline change is Family Help : targeted early help and section 17 'child in need' support are brought together as one offer, with a named lead practitioner for the family. It applies to education providers. KCSIE 2026 was rewritten to align with it, so school policies should use its terminology. Local detail (thresholds, referral forms, escalation routes) comes from the three statutory safeguarding partners: the local authority, the integrated care board and the police. Status and current version Who it applies to. All organisations and agencies with functions relating to children, including local authorities, health bodies, police, and all schools, colleges and childcare settings. It is issued under several statutory powers (including the Children Acts 1989 and 2004); bodies covered must have regard to it and depart from it only with good reason. Version. 2026 edition, replacing 2023. The DfE published a summary of changes and updated the Children's Social Care National Framework alongside it. What changed in 2026 (from the DfE summary and NSPCC and legal briefings): Family Help set out as a distinct tier, delivered by multi-disciplinary teams, reflecting the national 'Families First' reforms to children's social care. Scope made explicit: all children, including those in kinship care, under special guardianship, adopted or looked after, and unborn children where there are concerns. New or strengthened themes: recognising and challenging racism and discrimination; the needs of babies; domestic abuse; children facing several harms at once; hearing the child's voice through direct work, including non-verbal children. Serious incident notifications and reviews: changes to notification requirements and timescales for rapid reviews. Not verified: the exact timescales; check the text. Education and childcare: a dedicated section on partnership working with education and early years providers. Unchanged: the chapter on child death reviews. Related legislation. The Children's Wellbeing and Schools Act 2026 contains measures to strengthen the role of education in local multi-agency safeguarding arrangements and to create multi-agency child protection teams. Not verified: whether those sections had been commenced by November 2026. See the entry on the Act. What schools must do Schools are named 'relevant agencies' in most local arrangements. When named, they must act in accordance with the local arrangements published by the safeguarding partners. Schools must have regard to this guidance and to KCSIE in carrying out their safeguarding duties. Schools should contribute to assessments, strategy discussions, child protection conferences, core groups and child-in-need or Family Help plans, and share relevant information. Schools should supply information for, and act on learning from, local child safeguarding practice reviews. Schools must tell the local authority when removing a pupil's name from the admission register at a non-standard transition point; this is a duty under the school attendance regulations, restated in the guidance. In practice Staff do not need to read the full document. They need to know: what early help and Family Help are, that concerns go to the DSL, and that anyone may refer to children's social care directly if a child is at risk and the DSL cannot be reached. DSLs should: read the chapters on Family Help, child protection and the education section, and the local partnership's updated threshold document; know the local 'front door' (often a MASH), the expected response time to a referral, and the local escalation or professional-disagreement procedure; attend or send a written report to every conference and core group, and keep evidence of contribution; be clear who the lead practitioner is for each child with a plan, and what the school's actions are. Governors and trustees should check that the school is engaged with the local partnership (for example completing the section 175/157 safeguarding audit), that the policy reflects local procedures, and that the DSL reports on referral outcomes and escalations, not just counts. Common pitfalls Referrals that describe incidents but not the impact on the child or what the school has already tried. Accepting 'no further action' on a referral without following up or using the escalation procedure when concerns remain. Policies using pre-2026 terms or a superseded local threshold document. Poor attendance at multi-agency meetings in school holidays, with no report sent. Assuming national guidance is enough: local arrangements differ and are what partners and inspectors will test against. Go deeper Start with the DfE summary of changes, then your local safeguarding children partnership's website for the threshold document and multi-agency procedures. This entry is general information, not legal advice."}]}</script>
<script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('kb-data').textContent);
  var categories = data.categories;
  var entries = data.entries;
  var bySlug = {};
  var byCat = {};
  categories.forEach(function (c) { byCat[c.slug] = []; });
  entries.forEach(function (e) {
    bySlug[e.slug] = e;
    (byCat[e.category] = byCat[e.category] || []).push(e);
    e._t = e.title.toLowerCase();
    e._g = e.tags.join(' ');
    e._s = e.summary.toLowerCase();
    e._x = e.text.toLowerCase();
  });
  var catName = {};
  categories.forEach(function (c) { catName[c.slug] = c.name; });

  var TYPE_LABEL = { topic: 'Topics', guidance: 'Guidance and frameworks', person: 'People', source: 'Sources' };
  var STATUS_CLASS = {
    'Statutory guidance': 'must', 'Legislation': 'must', 'Non-statutory guidance': 'should',
    'Inspection framework': 'inspect', 'Evidence summary': 'evidence', 'Research and theory': 'evidence',
    'Thinker profile': 'person'
  };
  var ASKS = ['marking and feedback', 'behaviour management strategies', 'persistent absence', 'KCSIE',
    'Ofsted report card', 'retrieval practice', 'pupil premium', 'adaptive teaching', 'Paul Dix', 'Bill Rogers',
    'Tom Sherrington', 'Mary Myatt'];

  var main = document.getElementById('main');
  var nav = document.getElementById('areas');
  var input = document.getElementById('q');
  var clearBtn = document.getElementById('q-clear');
  var state = { query: '', type: 'all', lastQuery: '' };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function tokens(q) {
    return q.toLowerCase().split(/[^a-z0-9]+/).filter(function (t) { return t.length > 1 || /\d/.test(t); });
  }
  function highlight(text, toks) {
    var out = esc(text);
    if (!toks.length) return out;
    var re = new RegExp('(' + toks.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
    return out.replace(re, '<mark>$1</mark>');
  }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return iso || '';
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    return Number(m[3]) + ' ' + months[Number(m[2]) - 1] + ' ' + m[1];
  }

  function search(q) {
    var toks = tokens(q);
    if (!toks.length) return [];
    var phrase = q.toLowerCase().trim();
    var scored = [];
    entries.forEach(function (e) {
      var score = 0, hits = 0;
      toks.forEach(function (t) {
        var s = 0;
        var i = e._t.indexOf(t);
        if (i >= 0) s += (i === 0 || /[^a-z0-9]/.test(e._t.charAt(i - 1))) ? 14 : 8;
        if (e._g.indexOf(t) >= 0) s += 6;
        if (e._s.indexOf(t) >= 0) s += 4;
        var n = e._x.split(t).length - 1;
        if (n) s += Math.min(n, 6) * 0.5;
        if (s) hits++;
        score += s;
      });
      if (!hits) return;
      if (e._t === phrase) score += 40;
      else if (e._t.indexOf(phrase) >= 0) score += 15;
      if (toks.length > 1 && e._x.indexOf(phrase) >= 0) score += 5;
      scored.push({ e: e, score: score, all: hits === toks.length });
    });
    var all = scored.filter(function (r) { return r.all; });
    var use = all.length ? all : scored;
    use.sort(function (a, b) { return b.score - a.score || a.e.title.localeCompare(b.e.title); });
    return use.map(function (r) { return r.e; });
  }

  function pill(e) {
    return '<span class="pill ' + (STATUS_CLASS[e.status] || '') + '">' + esc(e.status) + '</span>';
  }
  function row(e, toks, showCat) {
    return '<li><a class="row" href="#' + e.slug + '"><h3>' + highlight(e.title, toks) + '</h3><p>' +
      highlight(e.summary, toks) + '</p><div class="meta">' + pill(e) +
      (showCat ? '<span>' + esc(catName[e.category] || '') + '</span>' : '') + '</div></a></li>';
  }
  function typeChips(list) {
    var present = {};
    list.forEach(function (e) { present[e.type] = (present[e.type] || 0) + 1; });
    var types = Object.keys(TYPE_LABEL).filter(function (t) { return present[t]; });
    if (types.length < 2) { state.type = 'all'; return ''; }
    if (state.type !== 'all' && !present[state.type]) state.type = 'all';
    var html = '<div class="chips" role="group" aria-label="Filter by type">' +
      '<button type="button" data-type="all" aria-pressed="' + (state.type === 'all') + '">All ' + list.length + '</button>';
    types.forEach(function (t) {
      html += '<button type="button" data-type="' + t + '" aria-pressed="' + (state.type === t) + '">' +
        TYPE_LABEL[t] + ' ' + present[t] + '</button>';
    });
    return html + '</div>';
  }
  function filtered(list) {
    return state.type === 'all' ? list : list.filter(function (e) { return e.type === state.type; });
  }

  function viewHome() {
    var html = '<section class="lede"><h1>What does the evidence, the guidance and the law say?</h1>' +
      '<p>' + entries.length + ' sourced summaries on secondary education in England: classroom practice, behaviour, ' +
      'attendance, safeguarding, curriculum, inspection and the people whose ideas shape them. Search above, or try one of these.</p>' +
      '<ul class="asks">' + ASKS.map(function (a) {
        return '<li><button type="button" data-ask="' + esc(a) + '">' + esc(a) + '</button></li>';
      }).join('') + '</ul></section>';
    html += '<h2 class="label">Browse by area</h2><div class="grid">';
    categories.forEach(function (c) {
      var n = (byCat[c.slug] || []).length;
      if (!n) return;
      html += '<a class="area-card" href="#cat-' + c.slug + '"><h2>' + esc(c.name) + '</h2><p>' + esc(c.blurb) +
        '</p><span class="n">' + n + (n === 1 ? ' entry' : ' entries') + '</span></a>';
    });
    main.innerHTML = html + '</div>';
    document.title = 'Staffroom Reference';
  }

  function viewCategory(c) {
    var list = byCat[c.slug] || [];
    var chips = typeChips(list);
    var shown = filtered(list);
    main.innerHTML = '<div class="head"><h1>' + esc(c.name) + '</h1><p>' + esc(c.blurb) + '</p></div>' + chips +
      '<ul class="rows">' + shown.map(function (e) { return row(e, [], false); }).join('') + '</ul>';
    document.title = c.name + ' · Staffroom Reference';
  }

  function viewResults() {
    var toks = tokens(state.query);
    var list = search(state.query);
    var chips = typeChips(list);
    var shown = filtered(list);
    var html = '<div class="head"><h1>' + (list.length ? list.length + (list.length === 1 ? ' result' : ' results') : 'No results') +
      ' for “' + esc(state.query.trim()) + '”</h1></div>';
    if (!list.length) {
      html += '<p class="empty">Nothing matches that. Try a shorter or more general term, for example “feedback” instead of ' +
        '“feedback policy for Year 9”, or browse the areas.</p>';
    } else {
      html += chips + '<ul class="rows">' + shown.map(function (e) { return row(e, toks, true); }).join('') + '</ul>';
    }
    main.innerHTML = html;
  }

  function viewEntry(e) {
    var html = '<article class="entry"><div class="crumb"><a href="#cat-' + e.category + '">' + esc(catName[e.category] || 'Area') + '</a>';
    if (state.lastQuery) html += '<a href="#home" data-back="1">Back to results for “' + esc(state.lastQuery) + '”</a>';
    html += '</div><h1>' + esc(e.title) + '</h1><div class="meta">' + pill(e) +
      (e.checked ? '<span>Checked ' + esc(fmtDate(e.checked)) + '</span>' : '') + '</div>' +
      '<p class="summary">' + esc(e.summary) + '</p>';
    if (e.evidence) html += '<p class="evidence"><b>Evidence rating:</b> ' + esc(e.evidence) + '</p>';
    html += '<div class="prose">' + e.html;
    if (e.sources.length) {
      html += '<h2>Sources</h2><ol class="srcs">' + e.sources.map(function (s) {
        var label = esc(s.title);
        var bits = [s.publisher, s.year].filter(Boolean).map(esc).join(', ');
        return '<li>' + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + label + '</a>' : label) +
          (bits ? ' <span>(' + bits + ')</span>' : '') + '</li>';
      }).join('') + '</ol>';
    }
    if (e.related.length) {
      html += '<h2>Related</h2><div class="rel">' + e.related.map(function (r) {
        return '<a href="#' + r + '">' + esc(bySlug[r].title) + '</a>';
      }).join('') + '</div>';
    }
    html += '</div>';
    if (e.tags.length) {
      html += '<p class="tags">Tags: ' + e.tags.map(function (t) {
        return '<button type="button" data-ask="' + esc(t) + '">' + esc(t) + '</button>';
      }).join(', ') + '</p>';
    }
    html += '<p class="note">This is a summary written to help you find and use the original. Check the linked source before ' +
      'relying on it for a decision, especially for statutory duties, which change.</p></article>';
    main.innerHTML = html;
    document.title = e.title + ' · Staffroom Reference';
  }

  function currentHash() {
    return decodeURIComponent((location.hash || '').replace(/^#/, ''));
  }
  function renderNav(active) {
    var html = '<a href="#home"' + (active === 'home' ? ' aria-current="page"' : '') + '>All areas<span class="n">' + entries.length + '</span></a>';
    categories.forEach(function (c) {
      var n = (byCat[c.slug] || []).length;
      if (!n) return;
      html += '<a href="#cat-' + c.slug + '"' + (active === c.slug ? ' aria-current="page"' : '') + '>' + esc(c.name) +
        '<span class="n">' + n + '</span></a>';
    });
    nav.innerHTML = html;
  }

  function render(keepScroll) {
    clearBtn.hidden = !state.query;
    if (state.query.trim()) {
      renderNav('');
      viewResults();
    } else {
      var h = currentHash();
      var e = bySlug[h];
      var c = h.indexOf('cat-') === 0 && categories.filter(function (x) { return x.slug === h.slice(4); })[0];
      if (e) { renderNav(e.category); viewEntry(e); }
      else if (c) { renderNav(c.slug); viewCategory(c); }
      else { renderNav('home'); viewHome(); }
    }
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function setQuery(q, focus) {
    state.query = q;
    state.type = 'all';
    input.value = q;
    render();
    if (focus) input.focus();
  }

  var timer;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.query = input.value;
      state.type = 'all';
      render();
    }, 90);
  });
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { setQuery('', true); }
  });
  clearBtn.addEventListener('click', function () { setQuery('', true); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== input && !ev.metaKey && !ev.ctrlKey) {
      ev.preventDefault();
      input.focus();
      input.select();
    }
  });

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-ask],[data-type],[data-back],a[href^="#"]');
    if (!t) return;
    if (t.hasAttribute('data-ask')) { state.lastQuery = ''; setQuery(t.getAttribute('data-ask')); return; }
    if (t.hasAttribute('data-type')) { state.type = t.getAttribute('data-type'); render(true); return; }
    if (t.hasAttribute('data-back')) { ev.preventDefault(); setQuery(state.lastQuery); return; }
    // An in-page link: leave search and show the target.
    var target = t.getAttribute('href').slice(1);
    state.lastQuery = (state.query.trim() && bySlug[target]) ? state.query.trim() : (bySlug[target] ? state.lastQuery : '');
    if (!bySlug[target]) state.lastQuery = '';
    var had = !!state.query;
    state.query = '';
    input.value = '';
    state.type = 'all';
    if (had && target === currentHash()) render();
  });
  window.addEventListener('hashchange', function () { render(); });

  document.getElementById('foot').innerHTML =
    '<p>Staffroom Reference covers secondary schools in England. Entries summarise published evidence, guidance and ' +
    'professional writing in our own words and link to the originals. It is general information, not legal advice.</p>' +
    '<p>' + entries.length + ' entries. Built ' + esc(fmtDate(data.built)) + '.</p>';

  render(true);
})();

</script>
</body>
</html>
