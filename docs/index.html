e standard, are present on corridors and at the gate, and take responsibility for serious and persistent issues. Clarity and simplicity. A behaviour policy should be short enough to be known by every pupil, parent and member of staff. Expectations are concrete (what to bring, how to enter, how to sit, how to move around the building), and the response to a breach is the same in every classroom. Centralisation. One consequence ladder used by all. Detentions set by teachers but run centrally by leaders. A staffed on-call system that responds quickly. A removal room with clear entry and exit expectations. The argument is workload and fairness: consistency is impossible if each teacher must enforce alone. Routines and rehearsal. Entry and exit routines, transitions, equipment checks, lining up and a common attention signal are taught at the start of the year and re-taught. Staff rehearse them in training. He treats induction of new staff and new pupils as part of the behaviour system. Warm-strict. High expectations are held together with visible care. Strickland stresses greeting pupils, knowing names, praise and recognition, and talking with pupils after a sanction. He rejects the idea that strict systems and good relationships are opposites. Roles at every level. The Behaviour Manual is organised around who does what: senior leaders, middle and pastoral leaders, classroom teachers, tutors, early career teachers and support staff each have a section of one-page strategies. Reviewers describe it as a what-to-do book rather than a why-to-do book. Teaching and curriculum. The Education Exposed books set behaviour within a wider model: a knowledge-rich curriculum, teacher-led explicit instruction, limited and purposeful assessment, and reduced marking and data workload. Behaviour is the precondition; curriculum and teaching are the purpose. Scenario thinking. They Don't Behave for Me takes 50 common situations, from low-level chatter to refusal and confrontation, and sets out possible responses, on the principle that teachers handle incidents better when they have thought them through in advance. Key works Education Exposed: Leading a school in a time of uncertainty (John Catt; 2019 or 2020, year not verified). Education Exposed 2: In pursuit of the halcyon dream (John Catt, 2020). The Behaviour Manual: An Educator's Guidebook (John Catt, 2022). They Don't Behave for Me: 50 classroom behaviour scenarios to support teachers (John Catt, 2023). Not verified: later leadership titles published since 2023. Putting it into practice Senior leaders Write the non-negotiables on one page. Test whether a Year 7 pupil and a supply teacher could both recite them. Publish a duty map and stick to it: leaders at the gate, in corridors at every changeover, in the canteen. Visibility is the cheapest intervention available. Centralise detentions. Teachers log; leaders run, chase and escalate non-attendance. Staff an on-call rota with a response-time expectation, and review the data weekly: which lessons, which pupils, which times of day. Script the removal process: what the teacher says, where the pupil goes, what work they do, who speaks to them and how they return to the next lesson. Start each term with a re-induction for pupils and a rehearsal session for staff. Give new and supply staff a short briefing before their first lesson. Walk the building asking one question: is the standard the same in every room? Where it is not, coach, do not blame. Classroom teachers Use the school's routines exactly as written, especially when you would prefer your own; pupils benefit from sameness across the day. Meet pupils at the door, have work ready, and narrate the positive before correcting. Follow the consequence steps in order, calmly and without debate; log accurately so leaders can act. Take one scenario you find hard (a pupil refusing to move seats, for example) and plan your first three sentences. After any removal, have a brief reset conversation before the next lesson. Middle and pastoral leaders Use behaviour data to spot patterns by class, subject and time. Support the teacher first. Hold the line on routines within your team and model them in your own classroom. Critiques and debate Practitioner evidence. Strickland's authority rests on leading one school's improvement. Schools Week's review of The Behaviour Manual saw that as the book's selling point, and also noted that it is practical rather than theoretical: it tells readers what to do more than why. Transfer to different contexts is argued, not demonstrated. Centralised, consequence-led systems. Relational and restorative practitioners (Paul Dix, Mark Finnis) argue that ladders, centralised detentions and removal rooms manage behaviour without changing it, and that the same pupils cycle through. Strickland and others reply that calm classrooms are the foundation for relationships and that most pupils benefit from predictability. Inclusion. Critics of strict systems argue that they disadvantage pupils with SEND or unmet needs and can raise suspensions. Proponents argue for adjustments within a consistent framework. The DfE's Behaviour in Schools guidance expects both clear systems and reasonable adjustments. Teacher autonomy. Some teachers find highly prescribed routines deskilling. Supporters argue that shared routines free attention for teaching and protect new staff. Breadth. The books range across behaviour, curriculum, teaching and leadership in short sections; readers wanting depth on any one area will need other sources."},{"slug":"searching-screening-and-confiscation","title":"Searching, screening and confiscation","category":"behaviour","type":"guidance","summary":"DfE advice on the legal powers to screen and search pupils and confiscate items. The July 2022 version, rewritten after the Child Q case with a stronger safeguarding emphasis, still appears to be current.","status":"Non-statutory guidance","evidence":"","tags":["searching","confiscation","prohibited items","strip search","safeguarding","weapons"],"checked":"2026-11-12","sources":[{"title":"Searching, screening and confiscation at school","publisher":"Department for Education","year":"2022","url":"https://www.gov.uk/government/publications/searching-screening-and-confiscation"},{"title":"Searching, Screening and Confiscation: advice for schools (July 2022), archived copy","publisher":"Digital Education Resource Archive, UCL IOE","year":"2022","url":"https://dera.ioe.ac.uk/id/eprint/39377/"},{"title":"Searching, screening and confiscation: advice for schools","publisher":"NASUWT","year":"2022","url":"https://www.nasuwt.org.uk/advice/in-the-classroom/behaviour-management-for-teachers-in-the-classroom/searching-screening-confiscation-advice-schools.html"},{"title":"Assess wellbeing risk of strip searches before calling police, schools told","publisher":"Schools Week","year":"2022","url":"https://schoolsweek.co.uk/assess-wellbeing-risk-of-strip-searches-before-calling-police-schools-told"},{"title":"School powers to search and screen pupils","publisher":"Child Law Advice (Coram)","year":"2026","url":"https://childlawadvice.org.uk/information-pages/school-powers-to-search-and-screen-pupils/"}],"related":["behaviour-in-schools-guidance","mobile-phones-in-schools","use-of-reasonable-force","designated-safeguarding-lead","keeping-children-safe-in-education"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Headteachers, and staff they authorise, have a \u003cstrong>statutory power to search a pupil without consent\u003c/strong> for a defined list of prohibited items, and for items the school rules identify as searchable.\u003c/li>\n\u003cli>A without-consent search needs \u003cstrong>reasonable grounds to suspect\u003c/strong> the pupil has such an item.\u003c/li>\n\u003cli>The DfE advice in force is the \u003cstrong>July 2022\u003c/strong> version (in effect from 1 September 2022). Schools&#39; own 2025 and 2026 policies still cite it and no later edition was found on 12 November 2026.\u003c/li>\n\u003cli>The 2022 rewrite followed the Child Q safeguarding review. It puts the pupil&#39;s welfare first, expects every search to be recorded and parents told, and sets out the school&#39;s role when \u003cstrong>police\u003c/strong> consider a strip search.\u003c/li>\n\u003cli>School staff may only require removal of \u003cstrong>outer clothing\u003c/strong>. Staff never conduct a strip search.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Status:\u003c/strong> non-statutory advice explaining statutory powers. The powers are in the Education Act 1996 (ss.550ZA to 550ZD), the Education and Inspections Act 2006 (ss.91 and 94) and the Schools (Specification and Disposal of Articles) Regulations 2012.\u003c/li>\n\u003cli>\u003cstrong>Applies to:\u003c/strong> all schools in England.\u003c/li>\n\u003cli>\u003cstrong>Version:\u003c/strong> July 2022, replacing the 2018 edition. Main changes: safeguarding foregrounded; designated safeguarding lead (DSL) to be informed of searches; recording and parental notification expectations; a new section on strip searches by police; emphasis on analysing search data for disproportionality.\u003c/li>\n\u003cli>Not verified: the GOV.UK page could not be opened directly to confirm its last-updated date. The 2026 mobile phones guidance refers schools to this document, which is consistent with it remaining current.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>Legal requirements for a search \u003cstrong>without consent\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Who:\u003c/strong> the headteacher or a member of staff authorised by the head. The head can authorise individuals, groups, or all staff, but cannot compel a teacher to search (security staff aside).\u003c/li>\n\u003cli>\u003cstrong>Grounds:\u003c/strong> reasonable suspicion that the pupil has a prohibited item.\u003c/li>\n\u003cli>\u003cstrong>Prohibited items in law:\u003c/strong> knives and weapons; alcohol; illegal drugs; stolen items; tobacco and cigarette papers; fireworks; pornographic images; any article the staff member reasonably suspects has been, or is likely to be, used to commit an offence, injure someone or damage property. Plus any item the school rules ban and identify as one that may be searched for.\u003c/li>\n\u003cli>\u003cstrong>Sex and witness:\u003c/strong> the searcher must be the same sex as the pupil, with another member of staff present as witness. The only exception is where there is risk of serious harm if the search is not carried out urgently and it is not reasonably practicable to comply.\u003c/li>\n\u003cli>\u003cstrong>Extent:\u003c/strong> outer clothing, pockets, possessions, desks and lockers. Nothing beyond outer clothing may be required to be removed.\u003c/li>\n\u003cli>\u003cstrong>Where:\u003c/strong> on school premises, or elsewhere when the member of staff has lawful control or charge of the pupil, such as on a trip.\u003c/li>\n\u003cli>\u003cstrong>Disposal:\u003c/strong> controlled drugs, weapons, stolen items of value and suspected indecent images of children go to the police. Do not view or forward suspected indecent images of a child; pass the device to the DSL.\u003c/li>\n\u003c/ul>\n\u003cp>For items banned only by school rules and not designated as searchable, a search needs the pupil&#39;s agreement; refusal can be sanctioned under the behaviour policy.\u003c/p>\n\u003ch2>In practice\u003c/h2>\n\u003cp>What the guidance says schools \u003cstrong>should\u003c/strong> do:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Before:\u003c/strong> explain to the pupil why they are being searched, how and where, and give them the chance to ask questions. Seek co-operation first. Use a private place away from other pupils.\u003c/li>\n\u003cli>\u003cstrong>A workable script:\u003c/strong> &quot;I have reason to think you may have a vape in your bag, which our rules don&#39;t allow. Ms Khan and I are going to ask you to empty your pockets and bag in the office. You won&#39;t be asked to take off anything other than your blazer. Do you have anything you want to hand over first?&quot;\u003c/li>\n\u003cli>\u003cstrong>If the pupil refuses:\u003c/strong> assess the risk. For a suspected weapon, keep the pupil supervised and away from others and call the police rather than attempt a contested search. Reasonable force may lawfully be used to search for statutory prohibited items but not for items banned only by school rules; treat it as a last resort and follow the 2026 restrictive interventions guidance.\u003c/li>\n\u003cli>\u003cstrong>After:\u003c/strong> record the search in the safeguarding system whether or not anything was found: date, time, location, who searched and witnessed, the pupil, the reason, what was looked for, what was found and follow-up. Inform the DSL without delay where there is a safeguarding concern. Tell parents as soon as practicable.\u003c/li>\n\u003cli>\u003cstrong>Electronic devices:\u003c/strong> staff may examine data or files where there is good reason, and may delete material in some circumstances, but should involve the DSL first and must not delete possible evidence of a crime.\u003c/li>\n\u003cli>\u003cstrong>Screening:\u003c/strong> schools can require pupils to pass through a metal detector or be wanded without consent or suspicion; this is not a search. A pupil who refuses can be refused entry, recorded as unauthorised absence rather than suspension.\u003c/li>\n\u003cli>\u003cstrong>Strip searches:\u003c/strong> only police can carry these out, under PACE Code C. Before calling police in, consider less invasive options and the pupil&#39;s wellbeing. Staff should remain the pupil&#39;s advocate, ensure an appropriate adult is present except in urgent cases, inform parents, and record it as a safeguarding matter.\u003c/li>\n\u003cli>\u003cstrong>Monitoring:\u003c/strong> the DSL and governors should review search data by ethnicity, sex, SEND and year group for patterns.\u003c/li>\n\u003c/ul>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Searching on a hunch or as a blanket measure with no recorded grounds.\u003c/li>\n\u003cli>An opposite-sex or unwitnessed search without the urgent-harm exception genuinely applying.\u003c/li>\n\u003cli>Asking pupils to lift or remove clothing beyond outer garments.\u003c/li>\n\u003cli>Treating phones, vapes or energy drinks as &#39;prohibited items&#39; when the behaviour policy does not list them as searchable.\u003c/li>\n\u003cli>Handing a pupil over to police and stepping back.\u003c/li>\n\u003cli>Not recording searches that find nothing, which hides disproportionality.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The City and Hackney Child Q local safeguarding practice review (2022) explains why the guidance changed.\u003c/li>\n\u003cli>The Children&#39;s Commissioner has published analyses of police strip searches of children.\u003c/li>\n\u003cli>Keeping Children Safe in Education and the UKCIS advice on sharing nudes cover devices and imagery.\u003c/li>\n\u003c/ul>\n","text":"At a glance Headteachers, and staff they authorise, have a statutory power to search a pupil without consent for a defined list of prohibited items, and for items the school rules identify as searchable. A without-consent search needs reasonable grounds to suspect the pupil has such an item. The DfE advice in force is the July 2022 version (in effect from 1 September 2022). Schools' own 2025 and 2026 policies still cite it and no later edition was found on 12 November 2026. The 2022 rewrite followed the Child Q safeguarding review. It puts the pupil's welfare first, expects every search to be recorded and parents told, and sets out the school's role when police consider a strip search. School staff may only require removal of outer clothing . Staff never conduct a strip search. Status and current version Status: non-statutory advice explaining statutory powers. The powers are in the Education Act 1996 (ss.550ZA to 550ZD), the Education and Inspections Act 2006 (ss.91 and 94) and the Schools (Specification and Disposal of Articles) Regulations 2012. Applies to: all schools in England. Version: July 2022, replacing the 2018 edition. Main changes: safeguarding foregrounded; designated safeguarding lead (DSL) to be informed of searches; recording and parental notification expectations; a new section on strip searches by police; emphasis on analysing search data for disproportionality. Not verified: the GOV.UK page could not be opened directly to confirm its last-updated date. The 2026 mobile phones guidance refers schools to this document, which is consistent with it remaining current. What schools must do Legal requirements for a search without consent : Who: the headteacher or a member of staff authorised by the head. The head can authorise individuals, groups, or all staff, but cannot compel a teacher to search (security staff aside). Grounds: reasonable suspicion that the pupil has a prohibited item. Prohibited items in law: knives and weapons; alcohol; illegal drugs; stolen items; tobacco and cigarette papers; fireworks; pornographic images; any article the staff member reasonably suspects has been, or is likely to be, used to commit an offence, injure someone or damage property. Plus any item the school rules ban and identify as one that may be searched for. Sex and witness: the searcher must be the same sex as the pupil, with another member of staff present as witness. The only exception is where there is risk of serious harm if the search is not carried out urgently and it is not reasonably practicable to comply. Extent: outer clothing, pockets, possessions, desks and lockers. Nothing beyond outer clothing may be required to be removed. Where: on school premises, or elsewhere when the member of staff has lawful control or charge of the pupil, such as on a trip. Disposal: controlled drugs, weapons, stolen items of value and suspected indecent images of children go to the police. Do not view or forward suspected indecent images of a child; pass the device to the DSL. For items banned only by school rules and not designated as searchable, a search needs the pupil's agreement; refusal can be sanctioned under the behaviour policy. In practice What the guidance says schools should do: Before: explain to the pupil why they are being searched, how and where, and give them the chance to ask questions. Seek co-operation first. Use a private place away from other pupils. A workable script: \"I have reason to think you may have a vape in your bag, which our rules don't allow. Ms Khan and I are going to ask you to empty your pockets and bag in the office. You won't be asked to take off anything other than your blazer. Do you have anything you want to hand over first?\" If the pupil refuses: assess the risk. For a suspected weapon, keep the pupil supervised and away from others and call the police rather than attempt a contested search. Reasonable force may lawfully be used to search for statutory prohibited items but not for items banned only by school rules; treat it as a last resort and follow the 2026 restrictive interventions guidance. After: record the search in the safeguarding system whether or not anything was found: date, time, location, who searched and witnessed, the pupil, the reason, what was looked for, what was found and follow-up. Inform the DSL without delay where there is a safeguarding concern. Tell parents as soon as practicable. Electronic devices: staff may examine data or files where there is good reason, and may delete material in some circumstances, but should involve the DSL first and must not delete possible evidence of a crime. Screening: schools can require pupils to pass through a metal detector or be wanded without consent or suspicion; this is not a search. A pupil who refuses can be refused entry, recorded as unauthorised absence rather than suspension. Strip searches: only police can carry these out, under PACE Code C. Before calling police in, consider less invasive options and the pupil's wellbeing. Staff should remain the pupil's advocate, ensure an appropriate adult is present except in urgent cases, inform parents, and record it as a safeguarding matter. Monitoring: the DSL and governors should review search data by ethnicity, sex, SEND and year group for patterns. Common pitfalls Searching on a hunch or as a blanket measure with no recorded grounds. An opposite-sex or unwitnessed search without the urgent-harm exception genuinely applying. Asking pupils to lift or remove clothing beyond outer garments. Treating phones, vapes or energy drinks as 'prohibited items' when the behaviour policy does not list them as searchable. Handing a pupil over to police and stepping back. Not recording searches that find nothing, which hides disproportionality. Go deeper The City and Hackney Child Q local safeguarding practice review (2022) explains why the guidance changed. The Children's Commissioner has published analyses of police strip searches of children. Keeping Children Safe in Education and the UKCIS advice on sharing nudes cover devices and imagery."},{"slug":"self-and-peer-assessment","title":"Self- and peer assessment","category":"assessment","type":"topic","summary":"Pupils judging their own or each other's work against clear criteria. It can improve learning and save teacher time, but only when pupils are taught what quality looks like and how to give useful feedback.","status":"Research and theory","evidence":"","tags":["peer assessment","self-assessment","metacognition","success criteria","formative assessment"],"checked":"2026-11-12","sources":[{"title":"Classroom Assessment: Minute by Minute, Day by Day","publisher":"ASCD, Educational Leadership 63(3)","year":"2005","url":"https://ascd.org/el/articles/classroom-assessment-minute-by-minute-day-by-day"},{"title":"Embedding Formative Assessment (project page and evaluation)","publisher":"Education Endowment Foundation","year":"2018","url":"https://educationendowmentfoundation.org.uk/projects-and-evaluation/projects/embedding-formative-assessment/"},{"title":"Reducing teacher workload: Marking Policy Review Group report","publisher":"Department for Education","year":"2016","url":"https://www.gov.uk/government/publications/reducing-teacher-workload-marking-policy-review-group-report"},{"title":"Teacher Feedback to Improve Pupil Learning (guidance report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/feedback"}],"related":["formative-assessment-five-strategies","marking-policy-and-workload"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Self- and peer assessment are strategies four and five of Wiliam&#39;s five formative assessment strategies: pupils as resources for each other and as owners of their own learning.\u003c/li>\n\u003cli>The purpose is learning, not marking. Pupils improve by internalising what good work looks like; the feedback they give each other is a secondary benefit.\u003c/li>\n\u003cli>Novices judge quality poorly. Without models, criteria and training, peer comments are vague or wrong and self-assessment is over-optimistic.\u003c/li>\n\u003cli>Best suited to checking against clear right/wrong answers or specific, observable criteria; least suited to holistic grading.\u003c/li>\n\u003cli>Never use pupil-awarded marks for reporting, tracking or anything high-stakes.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Peer assessment.\u003c/strong> A 2020 meta-analysis of control-group studies by Double, McGrane and Hopfenbeck reported a small-to-moderate positive average effect of peer assessment on attainment (around 0.3), compared with no assessment and with teacher assessment. Not verified: the paper was not opened for this entry; the figure is from memory of the published abstract and should be checked before being quoted.\u003c/li>\n\u003cli>\u003cstrong>Self-assessment.\u003c/strong> Reviews (for example by Brown and Harris, and by Andrade) find that self-assessment tends to help when it is formative, criteria-based and followed by a chance to revise, and that accuracy is lower among younger and lower-attaining pupils. Novices overestimate their own performance, which is consistent with wider cognitive science findings on judgements of learning.\u003c/li>\n\u003cli>\u003cstrong>Metacognition.\u003c/strong> The EEF Toolkit rates metacognition and self-regulation approaches as high impact; self-assessment is one component of these, not the whole. The EEF&#39;s EFA trial, which included peer and self-assessment among its five strategies, found a small positive effect on Attainment 8 (+2 months).\u003c/li>\n\u003cli>\u003cstrong>EEF feedback guidance (2021)\u003c/strong> focuses on teacher feedback but notes that pupils need to be prepared to receive and use feedback, including being taught to monitor their own work.\u003c/li>\n\u003c/ul>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>\u003cstrong>Self-marking of closed tasks (lowest risk, immediate gain)\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>After a retrieval quiz in science or a set of maths questions, pupils mark their own in a different colour from answers displayed. Teacher asks for a show of scores or samples specific questions, then responds.\u003c/li>\n\u003cli>Pupils write a correction, not just a cross.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Checklists against specific criteria\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>English, Year 9 persuasive writing: &quot;Underline your counter-argument. Circle three rhetorical devices and label them. If you can&#39;t find one, add it now.&quot;\u003c/li>\n\u003cli>Geography: &quot;Tick where you have used a named example and a figure.&quot;\u003c/li>\n\u003cli>This is self-assessment as editing, with something to do at the end.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Structured peer feedback\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Teach the standard first: compare two models and agree what makes one stronger.\u003c/li>\n\u003cli>Give a tight frame: one &quot;kind, specific, helpful&quot; comment per criterion, or &quot;one thing done well with evidence; one precise next step&quot;.\u003c/li>\n\u003cli>Rehearse on an anonymous piece as a class before pupils assess each other.\u003c/li>\n\u003cli>The author must act: redraft the weakest section in response.\u003c/li>\n\u003cli>Teacher samples the peer comments to check quality.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Practical and performance subjects\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>PE, drama, music and MFL speaking lend themselves to peer coaching with a single observation focus (&quot;watch the plant foot&quot;, &quot;listen for the past tense endings&quot;), often with tablets for video replay.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Exam classes\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Pupils mark a past-paper answer with the mark scheme, then compare with the teacher&#39;s mark and discuss the difference. This teaches the mark scheme; it does not produce a trustworthy mark.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Do not count peer or self-assessment as a marking substitute in policy (&quot;one in three pieces peer-marked&quot;). Position it as a teaching strategy.\u003c/li>\n\u003cli>Agree departmental models and criteria so pupils meet consistent standards.\u003c/li>\n\u003cli>Train staff in the set-up; done badly it wastes lesson time.\u003c/li>\n\u003cli>Be alert to social dynamics: pairing, friendship bias and the exposure of pupils with SEND or low prior attainment. Anonymised or teacher-selected examples reduce risk.\u003c/li>\n\u003cli>No internal data should be built on pupil-assigned grades.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Accuracy.\u003c/strong> Pupils are unreliable judges of quality in complex tasks; peer marks correlate imperfectly with teacher marks and are inflated among friends.\u003c/li>\n\u003cli>\u003cstrong>The curse of the criteria.\u003c/strong> Christodoulou argues that prose criteria and rubrics do not convey a standard; pupils (and teachers) need exemplars. Self-assessment against &quot;level descriptors&quot; was a weak legacy of the levels era.\u003c/li>\n\u003cli>\u003cstrong>Confidence ratings\u003c/strong> (traffic lights, thumbs) measure feelings, not learning, and can mislead the teacher.\u003c/li>\n\u003cli>\u003cstrong>Opportunity cost.\u003c/strong> Time spent on poor peer assessment could be spent on teacher instruction or practice.\u003c/li>\n\u003cli>\u003cstrong>Workload displacement.\u003c/strong> The 2016 workload review cautioned against practices done to satisfy policy rather than help pupils; mandated peer-marking stickers and logs fall into this category.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Wiliam, &#39;Embedded Formative Assessment&#39;, chapters on activating learners.\u003c/li>\n\u003cli>Ron Berger&#39;s &quot;Austin&#39;s Butterfly&quot; is a widely used illustration of critique and redrafting.\u003c/li>\n\u003cli>EEF guidance on metacognition and self-regulated learning.\u003c/li>\n\u003c/ul>\n","text":"At a glance Self- and peer assessment are strategies four and five of Wiliam's five formative assessment strategies: pupils as resources for each other and as owners of their own learning. The purpose is learning, not marking. Pupils improve by internalising what good work looks like; the feedback they give each other is a secondary benefit. Novices judge quality poorly. Without models, criteria and training, peer comments are vague or wrong and self-assessment is over-optimistic. Best suited to checking against clear right/wrong answers or specific, observable criteria; least suited to holistic grading. Never use pupil-awarded marks for reporting, tracking or anything high-stakes. What the evidence says Peer assessment. A 2020 meta-analysis of control-group studies by Double, McGrane and Hopfenbeck reported a small-to-moderate positive average effect of peer assessment on attainment (around 0.3), compared with no assessment and with teacher assessment. Not verified: the paper was not opened for this entry; the figure is from memory of the published abstract and should be checked before being quoted. Self-assessment. Reviews (for example by Brown and Harris, and by Andrade) find that self-assessment tends to help when it is formative, criteria-based and followed by a chance to revise, and that accuracy is lower among younger and lower-attaining pupils. Novices overestimate their own performance, which is consistent with wider cognitive science findings on judgements of learning. Metacognition. The EEF Toolkit rates metacognition and self-regulation approaches as high impact; self-assessment is one component of these, not the whole. The EEF's EFA trial, which included peer and self-assessment among its five strategies, found a small positive effect on Attainment 8 (+2 months). EEF feedback guidance (2021) focuses on teacher feedback but notes that pupils need to be prepared to receive and use feedback, including being taught to monitor their own work. In the classroom Self-marking of closed tasks (lowest risk, immediate gain) After a retrieval quiz in science or a set of maths questions, pupils mark their own in a different colour from answers displayed. Teacher asks for a show of scores or samples specific questions, then responds. Pupils write a correction, not just a cross. Checklists against specific criteria English, Year 9 persuasive writing: \"Underline your counter-argument. Circle three rhetorical devices and label them. If you can't find one, add it now.\" Geography: \"Tick where you have used a named example and a figure.\" This is self-assessment as editing, with something to do at the end. Structured peer feedback Teach the standard first: compare two models and agree what makes one stronger. Give a tight frame: one \"kind, specific, helpful\" comment per criterion, or \"one thing done well with evidence; one precise next step\". Rehearse on an anonymous piece as a class before pupils assess each other. The author must act: redraft the weakest section in response. Teacher samples the peer comments to check quality. Practical and performance subjects PE, drama, music and MFL speaking lend themselves to peer coaching with a single observation focus (\"watch the plant foot\", \"listen for the past tense endings\"), often with tablets for video replay. Exam classes Pupils mark a past-paper answer with the mark scheme, then compare with the teacher's mark and discuss the difference. This teaches the mark scheme; it does not produce a trustworthy mark. For leaders Do not count peer or self-assessment as a marking substitute in policy (\"one in three pieces peer-marked\"). Position it as a teaching strategy. Agree departmental models and criteria so pupils meet consistent standards. Train staff in the set-up; done badly it wastes lesson time. Be alert to social dynamics: pairing, friendship bias and the exposure of pupils with SEND or low prior attainment. Anonymised or teacher-selected examples reduce risk. No internal data should be built on pupil-assigned grades. Cautions and critiques Accuracy. Pupils are unreliable judges of quality in complex tasks; peer marks correlate imperfectly with teacher marks and are inflated among friends. The curse of the criteria. Christodoulou argues that prose criteria and rubrics do not convey a standard; pupils (and teachers) need exemplars. Self-assessment against \"level descriptors\" was a weak legacy of the levels era. Confidence ratings (traffic lights, thumbs) measure feelings, not learning, and can mislead the teacher. Opportunity cost. Time spent on poor peer assessment could be spent on teacher instruction or practice. Workload displacement. The 2016 workload review cautioned against practices done to satisfy policy rather than help pupils; mandated peer-marking stickers and logs fall into this category. Go deeper Wiliam, 'Embedded Formative Assessment', chapters on activating learners. Ron Berger's \"Austin's Butterfly\" is a widely used illustration of critique and redrafting. EEF guidance on metacognition and self-regulated learning."},{"slug":"spaced-and-interleaved-practice","title":"Spaced and interleaved practice","category":"teaching","type":"topic","summary":"Spreading study of a topic over time, and mixing problem types within practice, both improve long-term retention. Spacing is robust; interleaving is well supported mainly in mathematics.","status":"Research and theory","evidence":"","tags":["memory","cognitive science","spacing","interleaving","curriculum sequencing","revision"],"checked":"2026-11-12","sources":[{"title":"Improving Students' Learning With Effective Learning Techniques (Dunlosky et al.) - press summary","publisher":"Association for Psychological Science","year":"2013","url":"https://www.psychologicalscience.org/news/releases/which-study-strategies-make-the-grade.html"},{"title":"Cognitive science approaches in the classroom: a review of the evidence (news release and report)","publisher":"Education Endowment Foundation","year":"2021","url":"https://educationendowmentfoundation.org.uk/news/new-what-do-we-really-know-about-cognitive-science-in-the-classroom-eef-publishes-new-review-of-the-evidence/"},{"title":"Cognitive science in the classroom: impact evidence limited","publisher":"Tes","year":"2021","url":"https://www.tes.com/news/cognitive-science-classroom-impact-evidence-limited"},{"title":"Boosting learning by making it desirably difficult (summary of Bjork and Bjork)","publisher":"RE:ONLINE","year":"2020","url":"https://www.reonline.org.uk/research/boosting-learning-by-making-it-desirably-difficult"}],"related":["retrieval-practice","desirable-difficulties","robert-and-elizabeth-bjork"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Spacing\u003c/strong>: returning to material after a gap produces better long-term retention than the same time spent in one block (&#39;massing&#39; or cramming).\u003c/li>\n\u003cli>\u003cstrong>Interleaving\u003c/strong>: mixing different types of problem within a practice set, so pupils must choose the method, beats practising one type at a time (&#39;blocking&#39;) for later performance, at least in mathematics.\u003c/li>\n\u003cli>Both make practice feel harder and reduce performance in the moment. Pupils and teachers often misread that as failure.\u003c/li>\n\u003cli>Dunlosky et al. (2013) rated distributed practice &#39;high utility&#39; and interleaved practice &#39;moderate utility&#39;.\u003c/li>\n\u003cli>The EEF&#39;s 2021 review found classroom evidence for spacing positive but limited, and evidence for interleaving confined almost entirely to maths.\u003c/li>\n\u003cli>Block first, then mix: pupils need initial instruction and some blocked practice before interleaving helps.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>Spacing.\u003c/strong> The spacing effect has been replicated since Ebbinghaus in the 1880s, and the Bjorks describe it as among the oldest and most robust findings in research on learning. Reviews suggest the best gap grows with the length of time you want material retained: days or weeks for an end-of-term test, longer for an examination a year away. There is no single optimal schedule to prescribe.\u003c/p>\n\u003cp>\u003cstrong>Interleaving.\u003c/strong> The strongest classroom evidence comes from Doug Rohrer and colleagues&#39; studies of school mathematics in the United States, including a large randomised study with pupils aged about 12–13 that found substantially higher scores on a delayed test for classes given interleaved practice sets (Not verified against the paper for this entry: exact sample and effect size). The proposed mechanism is discrimination: in a blocked set every question uses the same method, so pupils never practise the step examinations demand, which is recognising what kind of problem this is.\u003c/p>\n\u003cp>\u003cstrong>The EEF review (2021)\u003c/strong> concluded that spacing in classrooms has a small number of studies with mostly positive results, varying greatly in the gaps used; and that interleaving research is largely limited to maths, so teachers in other subjects have little direct evidence to go on. It also warned against confusing interleaving of similar, confusable problem types with simply switching between unrelated topics.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>\u003cstrong>Spacing\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Review cycles built into schemes of work.\u003c/strong> Starter quizzes and homework draw on last week, last term and last year, on a planned schedule.\u003c/li>\n\u003cli>\u003cstrong>Lagged homework.\u003c/strong> Set homework on the topic taught three weeks ago, not today&#39;s. A Year 9 maths homework during a geometry unit might be 70% earlier topics (fractions, ratio, equations) and 30% current.\u003c/li>\n\u003cli>\u003cstrong>Cumulative assessments.\u003c/strong> End-of-unit tests include a section on prior units, so pupils have a reason to keep earlier content alive.\u003c/li>\n\u003cli>\u003cstrong>Split revision.\u003c/strong> Four 20-minute sessions on electrolysis across a fortnight beat one 80-minute session. Give Year 11 a revision timetable that returns to each topic at least three times.\u003c/li>\n\u003cli>\u003cstrong>Revisit through the curriculum.\u003c/strong> A history curriculum that returns to &#39;parliament and monarchy&#39; in Years 7, 8 and 9 spaces the concept, not just the facts.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Interleaving\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Mixed practice sets in maths and sciences.\u003c/strong> After teaching area of a circle, a set includes circumference, area of sectors and compound shapes from earlier, so pupils must select the formula. In physics, mix the equations for speed, acceleration and force.\u003c/li>\n\u003cli>\u003cstrong>Confusable concepts side by side\u003c/strong> in other subjects: metaphor versus personification versus pathetic fallacy in English; preterite versus imperfect in Spanish; ionic versus covalent bonding. The value is in telling them apart.\u003c/li>\n\u003cli>\u003cstrong>Sequence\u003c/strong>: worked examples and a short blocked set first; interleave once pupils can do each type with support.\u003c/li>\n\u003cli>\u003cstrong>Tell pupils why.\u003c/strong> &#39;This will feel harder and you will make more mistakes than yesterday. That is expected, and it is what makes it stick.&#39;\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Spacing is largely a \u003cstrong>curriculum and assessment design\u003c/strong> matter: schemes of work, homework policy and assessment calendars determine whether it happens. Individual teachers cannot do it alone.\u003c/li>\n\u003cli>Ask each department how prior content is revisited, and look at homework and assessment papers for evidence, not lesson plans.\u003c/li>\n\u003cli>Interleaving should be expected in maths and encouraged, cautiously, where subjects have confusable procedures or concepts. Do not mandate it across the school.\u003c/li>\n\u003cli>Avoid &#39;interleaved curricula&#39; that chop topics into fragments taught in rotation. That is not what the research tested and it can damage coherence.\u003c/li>\n\u003cli>Costs are low: the work is in rewriting practice sets and homework.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Thin classroom evidence outside maths and science.\u003c/strong> This is the EEF review&#39;s main message. Laboratory results with word lists or picture categories do not show that mixing topics helps in English literature or geography.\u003c/li>\n\u003cli>\u003cstrong>Short-term dip.\u003c/strong> Lower scores during practice can demotivate, and lesson observers may mistake the struggle for weak teaching.\u003c/li>\n\u003cli>\u003cstrong>Novices and low prior attainment.\u003c/strong> Interleaving too early, before any method is secure, raises load and error rates without the benefit.\u003c/li>\n\u003cli>\u003cstrong>Unknown optimal gaps.\u003c/strong> Published rules of thumb for spacing intervals come largely from laboratory studies of fact learning.\u003c/li>\n\u003cli>\u003cstrong>Curriculum time.\u003c/strong> Spacing means less time on new content now; over-zealous review can slow coverage in content-heavy GCSEs.\u003c/li>\n\u003cli>\u003cstrong>Terminology drift.\u003c/strong> &#39;Interleaving&#39; is often used in schools to mean a spiral or rotating topic order. Be precise about which is meant.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Dunlosky&#39;s &#39;Strengthening the Student Toolbox&#39; (\u003cem>American Educator\u003c/em>, 2013) for an accessible overview.\u003c/li>\n\u003cli>Rohrer&#39;s papers and free interleaved maths materials for the best-evidenced application.\u003c/li>\n\u003cli>See the entries on retrieval practice, desirable difficulties and curriculum sequencing and coherence.\u003c/li>\n\u003c/ul>\n","text":"At a glance Spacing : returning to material after a gap produces better long-term retention than the same time spent in one block ('massing' or cramming). Interleaving : mixing different types of problem within a practice set, so pupils must choose the method, beats practising one type at a time ('blocking') for later performance, at least in mathematics. Both make practice feel harder and reduce performance in the moment. Pupils and teachers often misread that as failure. Dunlosky et al. (2013) rated distributed practice 'high utility' and interleaved practice 'moderate utility'. The EEF's 2021 review found classroom evidence for spacing positive but limited, and evidence for interleaving confined almost entirely to maths. Block first, then mix: pupils need initial instruction and some blocked practice before interleaving helps. What the evidence says Spacing. The spacing effect has been replicated since Ebbinghaus in the 1880s, and the Bjorks describe it as among the oldest and most robust findings in research on learning. Reviews suggest the best gap grows with the length of time you want material retained: days or weeks for an end-of-term test, longer for an examination a year away. There is no single optimal schedule to prescribe. Interleaving. The strongest classroom evidence comes from Doug Rohrer and colleagues' studies of school mathematics in the United States, including a large randomised study with pupils aged about 12–13 that found substantially higher scores on a delayed test for classes given interleaved practice sets (Not verified against the paper for this entry: exact sample and effect size). The proposed mechanism is discrimination: in a blocked set every question uses the same method, so pupils never practise the step examinations demand, which is recognising what kind of problem this is. The EEF review (2021) concluded that spacing in classrooms has a small number of studies with mostly positive results, varying greatly in the gaps used; and that interleaving research is largely limited to maths, so teachers in other subjects have little direct evidence to go on. It also warned against confusing interleaving of similar, confusable problem types with simply switching between unrelated topics. In the classroom Spacing Review cycles built into schemes of work. Starter quizzes and homework draw on last week, last term and last year, on a planned schedule. Lagged homework. Set homework on the topic taught three weeks ago, not today's. A Year 9 maths homework during a geometry unit might be 70% earlier topics (fractions, ratio, equations) and 30% current. Cumulative assessments. End-of-unit tests include a section on prior units, so pupils have a reason to keep earlier content alive. Split revision. Four 20-minute sessions on electrolysis across a fortnight beat one 80-minute session. Give Year 11 a revision timetable that returns to each topic at least three times. Revisit through the curriculum. A history curriculum that returns to 'parliament and monarchy' in Years 7, 8 and 9 spaces the concept, not just the facts. Interleaving Mixed practice sets in maths and sciences. After teaching area of a circle, a set includes circumference, area of sectors and compound shapes from earlier, so pupils must select the formula. In physics, mix the equations for speed, acceleration and force. Confusable concepts side by side in other subjects: metaphor versus personification versus pathetic fallacy in English; preterite versus imperfect in Spanish; ionic versus covalent bonding. The value is in telling them apart. Sequence : worked examples and a short blocked set first; interleave once pupils can do each type with support. Tell pupils why. 'This will feel harder and you will make more mistakes than yesterday. That is expected, and it is what makes it stick.' For leaders Spacing is largely a curriculum and assessment design matter: schemes of work, homework policy and assessment calendars determine whether it happens. Individual teachers cannot do it alone. Ask each department how prior content is revisited, and look at homework and assessment papers for evidence, not lesson plans. Interleaving should be expected in maths and encouraged, cautiously, where subjects have confusable procedures or concepts. Do not mandate it across the school. Avoid 'interleaved curricula' that chop topics into fragments taught in rotation. That is not what the research tested and it can damage coherence. Costs are low: the work is in rewriting practice sets and homework. Cautions and critiques Thin classroom evidence outside maths and science. This is the EEF review's main message. Laboratory results with word lists or picture categories do not show that mixing topics helps in English literature or geography. Short-term dip. Lower scores during practice can demotivate, and lesson observers may mistake the struggle for weak teaching. Novices and low prior attainment. Interleaving too early, before any method is secure, raises load and error rates without the benefit. Unknown optimal gaps. Published rules of thumb for spacing intervals come largely from laboratory studies of fact learning. Curriculum time. Spacing means less time on new content now; over-zealous review can slow coverage in content-heavy GCSEs. Terminology drift. 'Interleaving' is often used in schools to mean a spiral or rotating topic order. Be precise about which is meant. Go deeper Dunlosky's 'Strengthening the Student Toolbox' ( American Educator , 2013) for an accessible overview. Rohrer's papers and free interleaved maths materials for the best-evidenced application. See the entries on retrieval practice, desirable difficulties and curriculum sequencing and coherence."},{"slug":"summative-assessment-and-data-collection","title":"Summative assessment and data collection","category":"assessment","type":"topic","summary":"How often to test, what to record and what to do with it. 'Making data work' (2018) advised no more than two or three attainment data collections a year and an end to data gathered only for accountability.","status":"Non-statutory guidance","evidence":"","tags":["data drops","summative assessment","tracking","workload","making data work"],"checked":"2026-11-12","sources":[{"title":"Teacher workload advisory group report and government response ('Making data work')","publisher":"Department for Education","year":"2018","url":"https://www.gov.uk/government/publications/teacher-workload-advisory-group-report-and-government-response"},{"title":"Making data work: report of the Teacher Workload Advisory Group (archived PDF)","publisher":"Department for Education (DERA archive)","year":"2018","url":"https://dera.ioe.ac.uk/id/eprint/32443/1/Workload_Advisory_Group-report.pdf"},{"title":"Commission on Assessment Without Levels: final report","publisher":"Department for Education","year":"2015","url":"https://www.gov.uk/government/publications/commission-on-assessment-without-levels-final-report"},{"title":"Tackling teacher workload: should we ditch the data?","publisher":"NFER","year":"2018","url":"https://www.nfer.ac.uk/blogs/tackling-teacher-workload-should-we-ditch-the-data"}],"related":["target-setting-and-flight-paths","ks3-assessment-after-levels"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Summative assessment sums up what a pupil has learned at a point in time: end-of-unit tests, end-of-year exams, mocks. Its results support reporting, intervention decisions and curriculum review.\u003c/li>\n\u003cli>The Teacher Workload Advisory Group&#39;s &#39;Making data work&#39; (November 2018, chaired by Becky Allen) said schools should not have more than two or three attainment data collection points a year, and that each should be used to act. The DfE and Ofsted accepted its recommendations.\u003c/li>\n\u003cli>Collect data only where you know who will use it, for what decision, and that it is accurate enough for that decision.\u003c/li>\n\u003cli>Half-termly &quot;data drops&quot; of teacher-estimated grades are costly, unreliable and rarely change anything.\u003c/li>\n\u003cli>There is no statutory requirement for any internal tracking system, and none for a particular format.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>&#39;Making data work&#39; (2018).\u003c/strong> The group found that data collection had become a major driver of workload, much of it producing information too unreliable to support the inferences drawn from it. Its principles: be clear about the purpose of any data; make collection efficient; and be confident the data is valid for that use. Specific messages, as summarised from the report (exact wording not re-checked against the PDF for this entry):\u003c/p>\n\u003cul>\n\u003cli>No more than two or three attainment data collection points per year.\u003c/li>\n\u003cli>Do not ask teachers to predict or track attainment in ways that imply false precision, such as sub-grades or &quot;flight paths&quot; from Key Stage 2.\u003c/li>\n\u003cli>Pupil targets should not be set mechanically from prior attainment, nor used in teacher appraisal as a sole measure.\u003c/li>\n\u003cli>Leaders, governors, trusts and local authorities should not request data in extra formats or at extra times.\u003c/li>\n\u003cli>Ofsted should not ask for internal data in a particular form; inspection handbooks from 2019 said inspectors would not look at schools&#39; internal progress and attainment data. Not verified: how the framework in force since November 2025 words this.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Commission on Assessment Without Levels (2015).\u003c/strong> Distinguished three purposes: in-school formative assessment, in-school summative assessment and nationally standardised summative assessment. A single assessment rarely serves all three well. It warned against recreating levels and against recording formative judgements in tracking systems.\u003c/p>\n\u003cp>\u003cstrong>Measurement basics.\u003c/strong> Any test samples a domain and carries error; small changes between collection points are usually noise. Teacher-assessed grades on short topic tests cannot reliably be mapped to GCSE grades, which describe performance across a full specification under exam conditions.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Design cumulative tests.\u003c/strong> An end-of-term Year 8 science test should sample everything taught so far this year, not just the last unit, so the score says something about retained learning.\u003c/li>\n\u003cli>\u003cstrong>Report raw scores or percentages\u003c/strong> with the class or year average for context, rather than converting a 30-mark history test into a GCSE grade.\u003c/li>\n\u003cli>\u003cstrong>Use common assessments.\u003c/strong> All classes in the year sit the same paper under similar conditions, marked to an agreed scheme and moderated, so results can be compared.\u003c/li>\n\u003cli>\u003cstrong>Keep formative information out of the tracker.\u003c/strong> Quiz scores, hinge question responses and homework marks stay in the teacher&#39;s markbook to inform teaching.\u003c/li>\n\u003cli>\u003cstrong>Act on the results.\u003c/strong> After the Year 10 mock, the department identifies the three weakest topics by question and adjusts the scheme of work; the class teacher identifies pupils for specific reteaching.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Map the assessment calendar for a single pupil and a single teacher. Count the hours of marking and data entry, then ask what decisions each collection informed last year.\u003c/li>\n\u003cli>A defensible secondary model: Key Stage 3, two summative points (one mid-year, one end-of-year exam) in each subject; Key Stage 4 and 5, mocks plus one other common assessment per year. Scale down for subjects taught once a week.\u003c/li>\n\u003cli>Align collection points with reports to parents and with intervention planning so one collection serves several uses.\u003c/li>\n\u003cli>Stop collecting: predicted grades every half-term; &quot;working at&quot; grades in Year 7; effort grades on multiple scales; progress RAG ratings derived from sub-grades.\u003c/li>\n\u003cli>Present data to governors with its uncertainty: cohort-level patterns, standardised test results and external exam results are more trustworthy than internal grade forecasts.\u003c/li>\n\u003cli>Trusts should take common data once and not ask for re-keying. Check the MIS can export it.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Over-frequent data drops.\u003c/strong> The main critique, from Allen and from the workload group, is that six collections a year of estimated grades give an illusion of control. Changes between drops are mostly measurement error, and teachers learn to enter numbers that keep leaders satisfied.\u003c/li>\n\u003cli>\u003cstrong>Predictions are weak.\u003c/strong> Teacher predictions of individual GCSE grades are often wrong by a grade or more; aggregate forecasts are somewhat better. Leaders should not treat the gap between prediction and outcome as a performance measure for teachers.\u003c/li>\n\u003cli>\u003cstrong>The opposite risk.\u003c/strong> Too little summative assessment leaves pupils unpractised at extended exams and leaders without warning of problems. Two or three points a year is advice on collection, not a cap on testing in class.\u003c/li>\n\u003cli>\u003cstrong>Curriculum-linked versus standardised.\u003c/strong> Internal tests show whether your curriculum was learned; they cannot show how pupils compare nationally. Standardised tests do the reverse. Know which question you are asking.\u003c/li>\n\u003cli>\u003cstrong>Accountability pressure remains.\u003c/strong> Critics note that, whatever national advice says, trusts and governors anxious about results often still demand frequent forecasts.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>&#39;Making data work&#39; and the government response (sources above).\u003c/li>\n\u003cli>Becky Allen&#39;s writing on what we can and cannot measure in schools; Daisy Christodoulou, &#39;Making Good Progress?&#39; (2017).\u003c/li>\n\u003cli>See the entries on validity and reliability, and on target-setting and flight paths.\u003c/li>\n\u003c/ul>\n","text":"At a glance Summative assessment sums up what a pupil has learned at a point in time: end-of-unit tests, end-of-year exams, mocks. Its results support reporting, intervention decisions and curriculum review. The Teacher Workload Advisory Group's 'Making data work' (November 2018, chaired by Becky Allen) said schools should not have more than two or three attainment data collection points a year, and that each should be used to act. The DfE and Ofsted accepted its recommendations. Collect data only where you know who will use it, for what decision, and that it is accurate enough for that decision. Half-termly \"data drops\" of teacher-estimated grades are costly, unreliable and rarely change anything. There is no statutory requirement for any internal tracking system, and none for a particular format. What the evidence says 'Making data work' (2018). The group found that data collection had become a major driver of workload, much of it producing information too unreliable to support the inferences drawn from it. Its principles: be clear about the purpose of any data; make collection efficient; and be confident the data is valid for that use. Specific messages, as summarised from the report (exact wording not re-checked against the PDF for this entry): No more than two or three attainment data collection points per year. Do not ask teachers to predict or track attainment in ways that imply false precision, such as sub-grades or \"flight paths\" from Key Stage 2. Pupil targets should not be set mechanically from prior attainment, nor used in teacher appraisal as a sole measure. Leaders, governors, trusts and local authorities should not request data in extra formats or at extra times. Ofsted should not ask for internal data in a particular form; inspection handbooks from 2019 said inspectors would not look at schools' internal progress and attainment data. Not verified: how the framework in force since November 2025 words this. Commission on Assessment Without Levels (2015). Distinguished three purposes: in-school formative assessment, in-school summative assessment and nationally standardised summative assessment. A single assessment rarely serves all three well. It warned against recreating levels and against recording formative judgements in tracking systems. Measurement basics. Any test samples a domain and carries error; small changes between collection points are usually noise. Teacher-assessed grades on short topic tests cannot reliably be mapped to GCSE grades, which describe performance across a full specification under exam conditions. In the classroom Design cumulative tests. An end-of-term Year 8 science test should sample everything taught so far this year, not just the last unit, so the score says something about retained learning. Report raw scores or percentages with the class or year average for context, rather than converting a 30-mark history test into a GCSE grade. Use common assessments. All classes in the year sit the same paper under similar conditions, marked to an agreed scheme and moderated, so results can be compared. Keep formative information out of the tracker. Quiz scores, hinge question responses and homework marks stay in the teacher's markbook to inform teaching. Act on the results. After the Year 10 mock, the department identifies the three weakest topics by question and adjusts the scheme of work; the class teacher identifies pupils for specific reteaching. For leaders Map the assessment calendar for a single pupil and a single teacher. Count the hours of marking and data entry, then ask what decisions each collection informed last year. A defensible secondary model: Key Stage 3, two summative points (one mid-year, one end-of-year exam) in each subject; Key Stage 4 and 5, mocks plus one other common assessment per year. Scale down for subjects taught once a week. Align collection points with reports to parents and with intervention planning so one collection serves several uses. Stop collecting: predicted grades every half-term; \"working at\" grades in Year 7; effort grades on multiple scales; progress RAG ratings derived from sub-grades. Present data to governors with its uncertainty: cohort-level patterns, standardised test results and external exam results are more trustworthy than internal grade forecasts. Trusts should take common data once and not ask for re-keying. Check the MIS can export it. Cautions and critiques Over-frequent data drops. The main critique, from Allen and from the workload group, is that six collections a year of estimated grades give an illusion of control. Changes between drops are mostly measurement error, and teachers learn to enter numbers that keep leaders satisfied. Predictions are weak. Teacher predictions of individual GCSE grades are often wrong by a grade or more; aggregate forecasts are somewhat better. Leaders should not treat the gap between prediction and outcome as a performance measure for teachers. The opposite risk. Too little summative assessment leaves pupils unpractised at extended exams and leaders without warning of problems. Two or three points a year is advice on collection, not a cap on testing in class. Curriculum-linked versus standardised. Internal tests show whether your curriculum was learned; they cannot show how pupils compare nationally. Standardised tests do the reverse. Know which question you are asking. Accountability pressure remains. Critics note that, whatever national advice says, trusts and governors anxious about results often still demand frequent forecasts. Go deeper 'Making data work' and the government response (sources above). Becky Allen's writing on what we can and cannot measure in schools; Daisy Christodoulou, 'Making Good Progress?' (2017). See the entries on validity and reliability, and on target-setting and flight paths."},{"slug":"suspension-and-permanent-exclusion","title":"Suspension and permanent exclusion (statutory guidance)","category":"behaviour","type":"guidance","summary":"The statutory guidance on suspending and permanently excluding pupils in England. A new version applies to exclusions from 26 July 2026, reflecting the Children's Wellbeing and Schools Act 2026.","status":"Statutory guidance","evidence":"","tags":["exclusion","suspension","governing board","independent review panel","statutory","send"],"checked":"2026-11-12","sources":[{"title":"Suspension and permanent exclusion from maintained schools, academies and pupil referral units in England, including pupil movement (July 2026)","publisher":"Department for Education","year":"2026","url":"https://www.gov.uk/government/publications/school-suspensions-and-permanent-exclusions"},{"title":"Suspension and Permanent Exclusion guidance July 2026 (PDF)","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6a102af79819be865f421c7d/Suspension_and_Permanent_Exclusion_guidance_July_2026.pdf"},{"title":"DfE issues new statutory guidance on suspensions and school exclusions","publisher":"Harrison Clark Rickerbys","year":"2026","url":"https://www.hcrlaw.com/news-and-insights/dfe-issues-new-statutory-guidance-on-suspensions-and-school-exclusions/"},{"title":"Department for Education releases new statutory suspension and exclusions guidance","publisher":"Hill Dickinson","year":"2026","url":"https://www.hilldickinson.com/our-view/articles/department-for-education-releases-new-statutory-suspension-and-exclusions-guidance/"},{"title":"Suspension and exclusion guidance: summary of changes","publisher":"The Key","year":"2026","url":"https://schoolleaders.thekeysupport.com/pupils-and-parents/behaviour-and-attendance/exclusions/suspension-and-exclusion-guidance-summary-of-changes/"}],"related":["alternative-provision","behaviour-in-schools-guidance"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Only the \u003cstrong>headteacher\u003c/strong> (or acting head) can suspend or permanently exclude, and only on \u003cstrong>disciplinary\u003c/strong> grounds. Sending a pupil home &#39;to cool off&#39;, or because the school cannot meet their needs, without recording a suspension is unlawful.\u003c/li>\n\u003cli>A new edition of the statutory guidance, published on 26 May 2026, governs every suspension and permanent exclusion that takes effect \u003cstrong>on or after 26 July 2026\u003c/strong>. It replaces the August 2024 version.\u003c/li>\n\u003cli>The 2026 edition separates the two sanctions: suspension may sometimes be necessary; \u003cstrong>permanent exclusion is a last resort\u003c/strong>.\u003c/li>\n\u003cli>It also rewrites the &#39;pupil movement&#39; sections (off-site direction, managed moves) after the Children&#39;s Wellbeing and Schools Act 2026, and adds a section on \u003cstrong>safeguarding separation\u003c/strong>.\u003c/li>\n\u003cli>A pupil can be suspended for at most \u003cstrong>45 school days in one academic year\u003c/strong>.\u003c/li>\n\u003cli>Decisions are judged on the civil standard (balance of probabilities) and on public law principles: lawful, rational, reasonable, fair and proportionate.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Status:\u003c/strong> statutory guidance. Headteachers, governing boards, academy trusts, local authorities and review panels must have regard to it. The procedural duties come from the Education Act 2002 (s.51A) and the School Discipline (Pupil Exclusions and Reviews) (England) Regulations 2012, as amended.\u003c/li>\n\u003cli>\u003cstrong>Applies to:\u003c/strong> maintained schools, academies and free schools, alternative provision academies and PRUs. It does not apply to independent schools or to post-16 institutions other than school sixth forms.\u003c/li>\n\u003cli>\u003cstrong>Version:\u003c/strong> July 2026 edition (published 26 May 2026). Exclusions that took effect before 26 July 2026 continue under the 2024 guidance.\u003c/li>\n\u003cli>\u003cstrong>What changed in 2026,\u003c/strong> as reported by DfE-facing summaries and education law firms:\u003cul>\n\u003cli>permanent exclusion is defined as removal from the school on disciplinary grounds only;\u003c/li>\n\u003cli>academies now have the same statutory power as maintained schools to direct a pupil off site to improve behaviour, and PRU management committees gain it too; parents should have two school days&#39; notice;\u003c/li>\n\u003cli>managed moves are to be permanent from the start, with no trial period; a family&#39;s refusal of a managed move is not a ground for permanent exclusion;\u003c/li>\n\u003cli>new text on safeguarding separation, which is not a substitute for suspension while an incident is investigated;\u003c/li>\n\u003cli>clearer expectations on reintegration after suspension, cancelled exclusion, off-site direction or separation;\u003c/li>\n\u003cli>clarification on a further suspension or a permanent exclusion where an investigation produces new evidence;\u003c/li>\n\u003cli>designated teachers should contact the virtual school head as soon as possible when a looked-after child is at risk of suspension or exclusion;\u003c/li>\n\u003cli>stronger emphasis on Equality Act and SEND duties.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Not verified: GOV.UK could not be opened directly when this entry was written. The list above is drawn from secondary summaries; check paragraph-level wording in the guidance itself before relying on it in a hearing.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>The following duties are long-standing in the 2012 Regulations and earlier editions. Not verified line by line against the July 2026 text; confirm before acting.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Notify parents without delay\u003c/strong> of the suspension or exclusion, the reasons, its length, their right to make representations to the governing board and how. Follow up in writing.\u003c/li>\n\u003cli>\u003cstrong>Notify the local authority\u003c/strong> without delay of every suspension and exclusion, and the social worker and virtual school head where the pupil has one.\u003c/li>\n\u003cli>\u003cstrong>Set and mark work\u003c/strong> for the first five school days. From the \u003cstrong>sixth\u003c/strong> school day, full-time alternative education must be arranged: by the school for a suspension, by the local authority for a permanent exclusion.\u003c/li>\n\u003cli>\u003cstrong>Governing board review.\u003c/strong> The board must meet within 15 school days to consider reinstatement for a permanent exclusion, for suspensions taking the pupil over 15 school days in a term, or where a pupil would miss a public exam. For totals of more than 5 and up to 15 days in a term it must meet if parents make representations. For shorter totals it must consider any representations but cannot reinstate.\u003c/li>\n\u003cli>\u003cstrong>Independent review panel.\u003c/strong> After a board upholds a permanent exclusion, parents have 15 school days to apply for an independent review and may ask for a SEN expert. The panel can uphold, recommend reconsideration, or quash and direct reconsideration.\u003c/li>\n\u003cli>\u003cstrong>Cancellation.\u003c/strong> The head may cancel (withdraw) an exclusion that the governing board has not yet reviewed; parents, the board, the local authority and relevant professionals must then be told and the pupil allowed back.\u003c/li>\n\u003cli>\u003cstrong>Do not discriminate.\u003c/strong> Disabled pupils are protected by the Equality Act 2010; claims go to the First-tier Tribunal (SEND).\u003c/li>\n\u003cli>\u003cstrong>Never exclude informally\u003c/strong> or pressure parents to remove a child (off-rolling).\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Before deciding,\u003c/strong> establish the facts, hear the pupil&#39;s account, and record evidence and reasoning at the time. Consider contributing factors: bereavement, bullying, unmet SEND, safeguarding concerns.\u003c/li>\n\u003cli>\u003cstrong>For permanent exclusion,\u003c/strong> the established two-part test is a serious breach or persistent breaches of the behaviour policy, and that allowing the pupil to remain would seriously harm the education or welfare of the pupil or others. The decision letter should address both parts.\u003c/li>\n\u003cli>\u003cstrong>Pupils with an EHC plan or a social worker, and looked-after children:\u003c/strong> contact the local authority, virtual school head or social worker early, and consider an emergency annual review, before exclusion becomes likely.\u003c/li>\n\u003cli>\u003cstrong>Reintegration.\u003c/strong> Hold a short planned meeting on return: what happened, what support is in place, what the pupil will do differently, who checks in and when. Return to school should not be made conditional on parents attending.\u003c/li>\n\u003cli>\u003cstrong>Governors\u003c/strong> need at least three members with no prior involvement, trained, with papers circulated in advance (five school days is the usual expectation).\u003c/li>\n\u003cli>\u003cstrong>Data.\u003c/strong> Report suspensions and exclusions to governors termly by year group, SEND, free school meal eligibility, ethnicity and sex, alongside removals, off-site directions and managed moves, so that patterns of pupil movement are visible.\u003c/li>\n\u003c/ul>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Suspensions without an end date, or extended rather than a fresh decision being taken.\u003c/li>\n\u003cli>Vague reasons (&#39;persistent disruptive behaviour&#39;) with no chronology of incidents and support.\u003c/li>\n\u003cli>Part-time timetables, long removal or &#39;safeguarding separation&#39; used to avoid the exclusion process.\u003c/li>\n\u003cli>Decision letters that omit representation rights or deadlines.\u003c/li>\n\u003cli>Treating a managed move as a trial, or presenting it as the only alternative to exclusion.\u003c/li>\n\u003cli>Governing boards rubber-stamping; panels expect to see genuine scrutiny of proportionality and of SEND.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The guidance includes model letters and parent guides on its GOV.UK page.\u003c/li>\n\u003cli>DfE publishes termly suspension and exclusion statistics; persistent disruptive behaviour is consistently the most common recorded reason.\u003c/li>\n\u003cli>See the entries on managed moves and off-site direction and on alternative provision for the 2026 pupil movement rules.\u003c/li>\n\u003c/ul>\n","text":"At a glance Only the headteacher (or acting head) can suspend or permanently exclude, and only on disciplinary grounds. Sending a pupil home 'to cool off', or because the school cannot meet their needs, without recording a suspension is unlawful. A new edition of the statutory guidance, published on 26 May 2026, governs every suspension and permanent exclusion that takes effect on or after 26 July 2026 . It replaces the August 2024 version. The 2026 edition separates the two sanctions: suspension may sometimes be necessary; permanent exclusion is a last resort . It also rewrites the 'pupil movement' sections (off-site direction, managed moves) after the Children's Wellbeing and Schools Act 2026, and adds a section on safeguarding separation . A pupil can be suspended for at most 45 school days in one academic year . Decisions are judged on the civil standard (balance of probabilities) and on public law principles: lawful, rational, reasonable, fair and proportionate. Status and current version Status: statutory guidance. Headteachers, governing boards, academy trusts, local authorities and review panels must have regard to it. The procedural duties come from the Education Act 2002 (s.51A) and the School Discipline (Pupil Exclusions and Reviews) (England) Regulations 2012, as amended. Applies to: maintained schools, academies and free schools, alternative provision academies and PRUs. It does not apply to independent schools or to post-16 institutions other than school sixth forms. Version: July 2026 edition (published 26 May 2026). Exclusions that took effect before 26 July 2026 continue under the 2024 guidance. What changed in 2026, as reported by DfE-facing summaries and education law firms: permanent exclusion is defined as removal from the school on disciplinary grounds only; academies now have the same statutory power as maintained schools to direct a pupil off site to improve behaviour, and PRU management committees gain it too; parents should have two school days' notice; managed moves are to be permanent from the start, with no trial period; a family's refusal of a managed move is not a ground for permanent exclusion; new text on safeguarding separation, which is not a substitute for suspension while an incident is investigated; clearer expectations on reintegration after suspension, cancelled exclusion, off-site direction or separation; clarification on a further suspension or a permanent exclusion where an investigation produces new evidence; designated teachers should contact the virtual school head as soon as possible when a looked-after child is at risk of suspension or exclusion; stronger emphasis on Equality Act and SEND duties. Not verified: GOV.UK could not be opened directly when this entry was written. The list above is drawn from secondary summaries; check paragraph-level wording in the guidance itself before relying on it in a hearing. What schools must do The following duties are long-standing in the 2012 Regulations and earlier editions. Not verified line by line against the July 2026 text; confirm before acting. Notify parents without delay of the suspension or exclusion, the reasons, its length, their right to make representations to the governing board and how. Follow up in writing. Notify the local authority without delay of every suspension and exclusion, and the social worker and virtual school head where the pupil has one. Set and mark work for the first five school days. From the sixth school day, full-time alternative education must be arranged: by the school for a suspension, by the local authority for a permanent exclusion. Governing board review. The board must meet within 15 school days to consider reinstatement for a permanent exclusion, for suspensions taking the pupil over 15 school days in a term, or where a pupil would miss a public exam. For totals of more than 5 and up to 15 days in a term it must meet if parents make representations. For shorter totals it must consider any representations but cannot reinstate. Independent review panel. After a board upholds a permanent exclusion, parents have 15 school days to apply for an independent review and may ask for a SEN expert. The panel can uphold, recommend reconsideration, or quash and direct reconsideration. Cancellation. The head may cancel (withdraw) an exclusion that the governing board has not yet reviewed; parents, the board, the local authority and relevant professionals must then be told and the pupil allowed back. Do not discriminate. Disabled pupils are protected by the Equality Act 2010; claims go to the First-tier Tribunal (SEND). Never exclude informally or pressure parents to remove a child (off-rolling). In practice Before deciding, establish the facts, hear the pupil's account, and record evidence and reasoning at the time. Consider contributing factors: bereavement, bullying, unmet SEND, safeguarding concerns. For permanent exclusion, the established two-part test is a serious breach or persistent breaches of the behaviour policy, and that allowing the pupil to remain would seriously harm the education or welfare of the pupil or others. The decision letter should address both parts. Pupils with an EHC plan or a social worker, and looked-after children: contact the local authority, virtual school head or social worker early, and consider
