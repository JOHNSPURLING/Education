<style>
/* Layout: sticky search bar; areas rail on the left (chip row on phones); one reading column. */
:root {
  --bg: #f3f6fa;
  --surface: #ffffff;
  --ink: #14213d;
  --muted: #56627b;
  --line: #d8dfea;
  --accent: #0b6b58;        /* green marking pen */
  --accent-ink: #ffffff;
  --accent-soft: #dff0eb;
  --hl: #ffe680;            /* highlighter */
  --st-must: #b3261e;
  --st-should: #8a5a00;
  --st-inspect: #1f5fbf;
  --st-evidence: #0b6b58;
  --st-practice: #4a5670;
  --st-person: #6d3fb5;
  --font-display: "Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --bar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1524; --surface: #171f33; --ink: #e8ecf5; --muted: #9da9c2; --line: #2b3652;
    --accent: #5fd1b5; --accent-ink: #06231c; --accent-soft: #15342e; --hl: #6b5a12;
    --st-must: #ff8a80; --st-should: #f0b955; --st-inspect: #8bb8ff; --st-evidence: #5fd1b5;
    --st-practice: #aab5cc; --st-person: #c3a2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1524; --surface: #171f33; --ink: #e8ecf5; --muted: #9da9c2; --line: #2b3652;
  --accent: #5fd1b5; --accent-ink: #06231c; --accent-soft: #15342e; --hl: #6b5a12;
  --st-must: #ff8a80; --st-should: #f0b955; --st-inspect: #8bb8ff; --st-evidence: #5fd1b5;
  --st-practice: #aab5cc; --st-person: #c3a2ff;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, main:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
main:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
mark { background: var(--hl); color: inherit; padding: 0 1px; border-radius: 2px; }

/* Bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1180px; margin: 0 auto; min-height: var(--bar-h);
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap;
}
.brand {
  font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em;
  color: var(--ink); text-decoration: none; white-space: nowrap;
}
.brand span { color: var(--accent); }
.search { position: relative; flex: 1 1 280px; min-width: 0; }
.search input {
  width: 100%; height: 40px; padding: 0 70px 0 14px;
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.clear {
  position: absolute; right: 6px; top: 6px; height: 28px; padding: 0 10px;
  font: inherit; font-size: 0.8rem; color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
}

/* Shell */
.shell {
  max-width: 1180px; margin: 0 auto;
  padding-block: 20px 48px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; align-items: start;
}
main { min-width: 0; }

.areas {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 20px);
  display: flex; flex-direction: column; gap: 2px; font-size: 0.92rem;
  max-height: calc(100vh - var(--bar-h) - 40px); overflow-y: auto;
}
.areas a {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; line-height: 1.3;
}
.areas a:hover { background: var(--accent-soft); }
.areas a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.areas .n { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.areas a[aria-current="page"] .n { color: inherit; opacity: 0.85; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 40px; }
  .areas {
    position: static; flex-direction: row; overflow-x: auto; max-height: none; gap: 6px;
    padding-bottom: 6px; scrollbar-width: thin;
  }
  .areas a { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; }
  .areas a[aria-current="page"] { border-color: var(--accent); }
}

/* Home */
.lede { max-width: 62ch; }
.lede h1 { font-size: clamp(1.7rem, 4.5vw, 2.5rem); letter-spacing: -0.02em; }
.lede p { color: var(--muted); margin: 10px 0 0; }
.asks { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; padding: 0; list-style: none; }
.asks button, .chips button {
  font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.asks button:hover, .chips button:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.label {
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  margin: 36px 0 12px;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.area-card {
  display: flex; flex-direction: column; gap: 6px; padding: 16px 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  color: var(--ink); text-decoration: none;
}
.area-card:hover { border-color: var(--accent); }
.area-card h2 { font-size: 1.08rem; }
.area-card p { margin: 0; font-size: 0.9rem; color: var(--muted); line-height: 1.45; }
.area-card .n { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-top: auto; padding-top: 6px; }

/* Lists */
.head h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: -0.02em; }
.head p { color: var(--muted); margin: 8px 0 0; max-width: 65ch; }
.rows { list-style: none; margin: 20px 0 0; padding: 0; border-top: 1px solid var(--line); }
.rows li { border-bottom: 1px solid var(--line); }
.row { display: block; padding: 14px 4px; color: var(--ink); text-decoration: none; }
.row:hover h3 { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.row h3 { font-size: 1.08rem; font-weight: 600; }
.row p { margin: 4px 0 0; font-size: 0.93rem; color: var(--muted); max-width: 75ch; line-height: 1.5; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
.pill {
  --c: var(--st-practice);
  display: inline-block; font-size: 0.74rem; font-weight: 600; line-height: 1; padding: 4px 8px; border-radius: 4px;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap;
}
.pill.must { --c: var(--st-must); }
.pill.should { --c: var(--st-should); }
.pill.inspect { --c: var(--st-inspect); }
.pill.evidence { --c: var(--st-evidence); }
.pill.person { --c: var(--st-person); }
.empty { margin-top: 24px; color: var(--muted); max-width: 60ch; }

/* Entry */
.crumb { font-size: 0.86rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.entry { max-width: 72ch; }
.entry > h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); letter-spacing: -0.02em; margin-top: 12px; }
.entry .summary { font-size: 1.1rem; line-height: 1.5; margin: 12px 0 0; }
.evidence {
  margin: 16px 0 0; padding: 10px 14px; font-size: 0.92rem;
  background: var(--accent-soft); border-radius: 8px;
}
.evidence b { font-weight: 600; }
.prose { margin-top: 8px; overflow-wrap: break-word; }
.prose h2 { font-size: 1.3rem; margin: 32px 0 10px; padding-top: 20px; border-top: 1px solid var(--line); }
.prose h3 { font-size: 1.05rem; margin: 22px 0 6px; }
.prose h4 { font-size: 1rem; margin: 18px 0 4px; }
.prose p { margin: 0 0 12px; }
.prose ul, .prose ol { margin: 0 0 14px; padding-left: 1.3em; }
.prose li { margin: 0 0 6px; }
.prose li > ul, .prose li > ol { margin: 6px 0 0; }
.prose blockquote { margin: 0 0 14px; padding: 2px 0 2px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.prose code { font-size: 0.9em; background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; }
.table-wrap { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 9em; }
.prose th { font-weight: 600; background: var(--bg); }
.prose tr:last-child td { border-bottom: 0; }
.srcs { margin: 0; padding-left: 1.3em; font-size: 0.93rem; }
.srcs li { margin-bottom: 8px; overflow-wrap: anywhere; }
.srcs span { color: var(--muted); }
.rel { display: flex; flex-wrap: wrap; gap: 8px; }
.rel a {
  font-size: 0.9rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); text-decoration: none;
}
.rel a:hover { border-color: var(--accent); color: var(--accent); }
.tags { margin-top: 28px; font-size: 0.85rem; color: var(--muted); }
.tags button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.note { margin-top: 28px; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

.foot { border-top: 1px solid var(--line); }
.foot-in {
  max-width: 1180px; margin: 0 auto; padding-block: 20px 28px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  font-size: 0.84rem; color: var(--muted);
}
.foot-in p { margin: 0 0 6px; max-width: 80ch; }

</style>

<script type="application/json" id="kb-data">{"built":"2026-11-14","categories":[{"slug":"teaching","name":"Teaching and instruction","blurb":"Explicit instruction, cognitive science, questioning, modelling, practice and adaptive teaching."},{"slug":"assessment","name":"Assessment, marking and feedback","blurb":"Feedback that moves learning on, marking and workload, formative and summative assessment, exams."},{"slug":"behaviour","name":"Behaviour and culture","blurb":"DfE behaviour guidance, exclusions, routines, scripts, sanctions, restorative practice and school culture."},{"slug":"attendance","name":"Attendance and wellbeing","blurb":"Statutory attendance duties, persistent absence, EBSA, working with families and pupil mental health."},{"slug":"safeguarding","name":"Safeguarding","blurb":"KCSIE, the DSL role, safer recruitment, online safety, Prevent, child-on-child abuse and record keeping."},{"slug":"curriculum","name":"Curriculum","blurb":"National curriculum and its review, knowledge and sequencing, Key Stages 3 to 5, RSHE, careers and personal development."},{"slug":"literacy","name":"Literacy, oracy and numeracy","blurb":"Disciplinary literacy, struggling readers, vocabulary, writing, oracy and maths and science guidance."},{"slug":"send-inclusion","name":"SEND, inclusion and disadvantage","blurb":"The SEND code, EHCPs, teaching assistants, specific needs, the Equality Act and pupil premium."},{"slug":"ofsted-accountability","name":"Ofsted, accountability and compliance","blurb":"The inspection framework and report cards, performance measures, statutory policies and website requirements."},{"slug":"leadership","name":"Leadership and professional development","blurb":"Implementation, professional development, coaching, governance, workload, pay and conditions."},{"slug":"thinkers","name":"Key thinkers","blurb":"Profiles of the people whose ideas shape practice: what they argue, how to use it, and the critiques."},{"slug":"sources","name":"Sources and organisations","blurb":"Where the evidence and news come from, what each source is good for, and how to read it critically."}],"entries":[{"slug":"allegations-and-low-level-concerns","title":"Allegations against staff and low-level concerns","category":"safeguarding","type":"guidance","summary":"Part four of KCSIE: how schools must handle allegations that an adult may pose a risk to children, the role of the LADO, and how to record and respond to low-level concerns.","status":"Statutory guidance","evidence":"","tags":["allegations","low-level concerns","lado","kcsie","staff conduct","whistleblowing"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"KCSIE 2026 key changes","publisher":"High Speed Training","year":"2026","url":"https://www.highspeedtraining.co.uk/hub/keeping-children-safe-in-education-changes/"},{"title":"Updates to Keeping children safe in education: what regulated professionals and regulators need to know","publisher":"Kingsley Napley","year":"2026","url":"https://www.kingsleynapley.co.uk/our-insights/articles/updates-to-keeping-children-safe-in-education-what-regulated-professionals-and-regulators-need-to-know/"},{"title":"Keeping children safe in education (KCSIE) 2026: summary of changes (CASPAR briefing)","publisher":"NSPCC Learning","year":"2026","url":"https://learning.nspcc.org.uk/research-resources/schools/keeping-children-safe-in-education-caspar-briefing"}],"related":["keeping-children-safe-in-education","safer-recruitment-and-single-central-record","designated-safeguarding-lead","child-protection-policy-and-procedures","use-of-reasonable-force"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Part four of KCSIE has two sections: allegations that \u003cstrong>may meet the harm threshold\u003c/strong>, and concerns that do not (\u003cstrong>low-level concerns\u003c/strong>).\u003c/li>\n\u003cli>It covers everyone working in the school: teachers, support staff, supply staff, volunteers and contractors. KCSIE 2026 adds \u003cstrong>trainee teachers\u003c/strong> throughout and is clearer about shared responsibility with agencies and other third parties.\u003c/li>\n\u003cli>Threshold allegations go to the headteacher (or chair of governors if about the head) and are discussed with the \u003cstrong>local authority designated officer (LADO)\u003c/strong> before any investigation.\u003c/li>\n\u003cli>&#39;Low-level&#39; does not mean insignificant: it means behaviour inconsistent with the code of conduct that does not meet the harm threshold. All such concerns should be shared and recorded.\u003c/li>\n\u003cli>Schools have a \u003cstrong>legal duty\u003c/strong> to refer to the Disclosure and Barring Service when someone is removed from regulated activity (or would have been had they not left) because of harm or risk of harm to a child.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cp>Statutory guidance: KCSIE 2026, Part four, in force 1 September 2026. Applies to all schools and colleges.\u003c/p>\n\u003cp>\u003cstrong>What changed in 2026\u003c/strong> (from secondary briefings; confirm against the text): trainee teachers are referenced throughout; the text makes clearer that schools share safeguarding responsibility with third-party organisations such as supply agencies. Not verified: any change to the low-level concerns wording in 2026.\u003c/p>\n\u003cp>\u003cstrong>The harm threshold.\u003c/strong> An allegation meets it where a person has:\u003c/p>\n\u003cul>\n\u003cli>behaved in a way that has harmed or may have harmed a child;\u003c/li>\n\u003cli>possibly committed a criminal offence against or related to a child;\u003c/li>\n\u003cli>behaved towards a child in a way that indicates they may pose a risk of harm; or\u003c/li>\n\u003cli>behaved, or may have behaved, in a way that indicates they may not be suitable to work with children (which covers conduct outside school, sometimes called transferable risk).\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>\u003cstrong>Must (legal duties):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>refer to the DBS where the conditions above are met;\u003c/li>\n\u003cli>consider referral to the Teaching Regulation Agency where a teacher is dismissed, or would have been, for serious misconduct;\u003c/li>\n\u003cli>comply with reporting restrictions: it is an offence to publish material identifying a teacher subject to an allegation by a pupil at the school before charge.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Should (KCSIE):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>have procedures for both tiers, referenced in the child protection policy and staff code of conduct;\u003c/li>\n\u003cli>make an immediate check that children are safe, then contact the LADO; the conventional expectation in local procedures is within one working day;\u003c/li>\n\u003cli>not investigate or tell the accused before speaking to the LADO, and to the police where a crime may have been committed;\u003c/li>\n\u003cli>appoint a case manager (normally the head); consider alternatives before suspension and record the rationale;\u003c/li>\n\u003cli>record the outcome using KCSIE&#39;s definitions: substantiated, malicious, false, unsubstantiated or unfounded;\u003c/li>\n\u003cli>keep a clear, comprehensive record on the personnel file (except for malicious or false allegations) and give a copy to the person; retain at least until normal pension age or ten years from the allegation if longer;\u003c/li>\n\u003cli>not use settlement agreements to prevent referrals, and include substantiated safeguarding allegations in references;\u003c/li>\n\u003cli>for supply staff, lead the process with the agency involved rather than simply ending the booking.\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cp>\u003cstrong>Staff:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>report any concern about an adult&#39;s conduct, however small, to the head (or the person named in the policy); self-report if you find yourself in a situation open to misinterpretation;\u003c/li>\n\u003cli>if the concern is about the head, go to the chair of governors or trust; if you feel unable to raise it internally, use whistleblowing routes, including the NSPCC whistleblowing helpline;\u003c/li>\n\u003cli>do not discuss with colleagues or pupils.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Low-level concerns\u003c/strong> (examples in KCSIE include being over-friendly, having favourites, photographing pupils on a personal phone, one-to-one contact behind a closed door, humiliating language):\u003c/p>\n\u003cul>\n\u003cli>record each concern in writing with context and action taken; hold records centrally and securely;\u003c/li>\n\u003cli>review regularly for patterns across one person and across the culture;\u003c/li>\n\u003cli>respond proportionately, usually a conversation and clarified expectations;\u003c/li>\n\u003cli>consult the LADO if unsure whether the threshold is met.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>DSL:\u003c/strong> is normally informed and advises on child protection aspects, even though the head manages the case. Make sure the child and parents are supported and kept informed within confidentiality limits.\u003c/p>\n\u003cp>\u003cstrong>Governors and trustees:\u003c/strong> the chair must know how to contact the LADO; the board should receive anonymised numbers of allegations and low-level concerns, timeliness and themes, and check that learning reviews happen after substantiated cases.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Investigating first and calling the LADO afterwards.\u003c/li>\n\u003cli>Automatic suspension, or no recorded consideration of alternatives.\u003c/li>\n\u003cli>Accepting a resignation and stopping the process; the investigation and any DBS referral should still follow.\u003c/li>\n\u003cli>No low-level concerns system, or one that staff see as punitive so nothing is reported.\u003c/li>\n\u003cli>Records scattered across emails; patterns missed.\u003c/li>\n\u003cli>Supply or contractor concerns handled by &#39;do not send again&#39;.\u003c/li>\n\u003cli>Conduct outside school ignored.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Your local safeguarding partnership&#39;s managing-allegations procedure sets LADO contact routes and timescales and must be followed. This is general information, not legal advice; take HR and legal advice on individual cases.\u003c/p>\n","text":"At a glance Part four of KCSIE has two sections: allegations that may meet the harm threshold , and concerns that do not ( low-level concerns ). It covers everyone working in the school: teachers, support staff, supply staff, volunteers and contractors. KCSIE 2026 adds trainee teachers throughout and is clearer about shared responsibility with agencies and other third parties. Threshold allegations go to the headteacher (or chair of governors if about the head) and are discussed with the local authority designated officer (LADO) before any investigation. 'Low-level' does not mean insignificant: it means behaviour inconsistent with the code of conduct that does not meet the harm threshold. All such concerns should be shared and recorded. Schools have a legal duty to refer to the Disclosure and Barring Service when someone is removed from regulated activity (or would have been had they not left) because of harm or risk of harm to a child. Status and current version Statutory guidance: KCSIE 2026, Part four, in force 1 September 2026. Applies to all schools and colleges. What changed in 2026 (from secondary briefings; confirm against the text): trainee teachers are referenced throughout; the text makes clearer that schools share safeguarding responsibility with third-party organisations such as supply agencies. Not verified: any change to the low-level concerns wording in 2026. The harm threshold. An allegation meets it where a person has: behaved in a way that has harmed or may have harmed a child; possibly committed a criminal offence against or related to a child; behaved towards a child in a way that indicates they may pose a risk of harm; or behaved, or may have behaved, in a way that indicates they may not be suitable to work with children (which covers conduct outside school, sometimes called transferable risk). What schools must do Must (legal duties): refer to the DBS where the conditions above are met; consider referral to the Teaching Regulation Agency where a teacher is dismissed, or would have been, for serious misconduct; comply with reporting restrictions: it is an offence to publish material identifying a teacher subject to an allegation by a pupil at the school before charge. Should (KCSIE): have procedures for both tiers, referenced in the child protection policy and staff code of conduct; make an immediate check that children are safe, then contact the LADO; the conventional expectation in local procedures is within one working day; not investigate or tell the accused before speaking to the LADO, and to the police where a crime may have been committed; appoint a case manager (normally the head); consider alternatives before suspension and record the rationale; record the outcome using KCSIE's definitions: substantiated, malicious, false, unsubstantiated or unfounded; keep a clear, comprehensive record on the personnel file (except for malicious or false allegations) and give a copy to the person; retain at least until normal pension age or ten years from the allegation if longer; not use settlement agreements to prevent referrals, and include substantiated safeguarding allegations in references; for supply staff, lead the process with the agency involved rather than simply ending the booking. In practice Staff: report any concern about an adult's conduct, however small, to the head (or the person named in the policy); self-report if you find yourself in a situation open to misinterpretation; if the concern is about the head, go to the chair of governors or trust; if you feel unable to raise it internally, use whistleblowing routes, including the NSPCC whistleblowing helpline; do not discuss with colleagues or pupils. Low-level concerns (examples in KCSIE include being over-friendly, having favourites, photographing pupils on a personal phone, one-to-one contact behind a closed door, humiliating language): record each concern in writing with context and action taken; hold records centrally and securely; review regularly for patterns across one person and across the culture; respond proportionately, usually a conversation and clarified expectations; consult the LADO if unsure whether the threshold is met. DSL: is normally informed and advises on child protection aspects, even though the head manages the case. Make sure the child and parents are supported and kept informed within confidentiality limits. Governors and trustees: the chair must know how to contact the LADO; the board should receive anonymised numbers of allegations and low-level concerns, timeliness and themes, and check that learning reviews happen after substantiated cases. Common pitfalls Investigating first and calling the LADO afterwards. Automatic suspension, or no recorded consideration of alternatives. Accepting a resignation and stopping the process; the investigation and any DBS referral should still follow. No low-level concerns system, or one that staff see as punitive so nothing is reported. Records scattered across emails; patterns missed. Supply or contractor concerns handled by 'do not send again'. Conduct outside school ignored. Go deeper Your local safeguarding partnership's managing-allegations procedure sets LADO contact routes and timescales and must be followed. This is general information, not legal advice; take HR and legal advice on individual cases."},{"slug":"alternative-provision","title":"Alternative provision","category":"behaviour","type":"guidance","summary":"Education arranged for pupils who cannot attend mainstream school because of exclusion, illness or other reasons, or directed off site to improve behaviour. Governed by DfE's 'Arranging alternative provision' (February 2025).","status":"Statutory guidance","evidence":"","tags":["alternative provision","pru","commissioning","unregistered provision","safeguarding","exclusion"],"checked":"2026-11-12","sources":[{"title":"New alternative provision guidance","publisher":"Browne Jacobson","year":"2025","url":"https://www.brownejacobson.com/insights/new-alternative-provision-guidance"},{"title":"What do academy trusts need to know about the updated guidance on alternative provision?","publisher":"Wrigleys Solicitors","year":"2025","url":"https://www.wrigleys.co.uk/news/education/what-do-academy-trusts-need-to-know-about-the-updated-guidance-on-alternative-provision-/"},{"title":"Non-school alternative provision: voluntary national standards","publisher":"Department for Education","year":"2025","url":"https://www.gov.uk/government/publications/non-school-alternative-provision-voluntary-national-standards"},{"title":"Strengthening protections in unregistered alternative provision (consultation outcome)","publisher":"Department for Education","year":"2025","url":"https://www.gov.uk/government/consultations/strengthening-protections-in-unregistered-alternative-provision"},{"title":"Unregistered AP clampdown: everything you need to know","publisher":"Schools Week","year":"2025","url":"https://schoolsweek.co.uk/unregistered-ap-clampdown-everything-you-need-to-know/"},{"title":"Suspension and permanent exclusion from maintained schools, academies and pupil referral units in England, including pupil movement (July 2026)","publisher":"Department for Education","year":"2026","url":"https://www.gov.uk/government/publications/school-suspensions-and-permanent-exclusions"}],"related":["suspension-and-permanent-exclusion","safeguarding-records-and-information-sharing"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Alternative provision (AP) is education arranged by a \u003cstrong>local authority\u003c/strong> for pupils who would otherwise not receive suitable education, or by a \u003cstrong>school\u003c/strong> for a suspended pupil or a pupil directed off site to improve behaviour.\u003c/li>\n\u003cli>The DfE guidance is \u003cstrong>&#39;Arranging alternative provision: a guide for local authorities and schools&#39;\u003c/strong>, rewritten in \u003cstrong>February 2025\u003c/strong> to replace the 2013 version. It was still the reference text in 2026; the July 2026 exclusions guidance is to be read alongside it.\u003c/li>\n\u003cli>The commissioning school \u003cstrong>keeps responsibility\u003c/strong> for a pupil it places: safeguarding, attendance, quality of education and outcomes.\u003c/li>\n\u003cli>Providers range from PRUs and AP academies to registered independent schools, FE colleges and \u003cstrong>unregistered\u003c/strong> settings. Unregistered settings are not inspected; the checks fall to the commissioner.\u003c/li>\n\u003cli>Government has said it will legislate for mandatory standards and time limits in unregistered AP; for now the national standards (August 2025) are \u003cstrong>voluntary\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Status:\u003c/strong> statutory guidance for local authorities and maintained schools. Academies are not bound in the same way, but legal commentary notes they are expected to take account of it, and Ofsted will judge them against the same practice.\u003c/li>\n\u003cli>\u003cstrong>Legal basis:\u003c/strong> Education Act 1996 s.19 (local authority duty to arrange suitable education for children who, because of exclusion, illness or otherwise, would not receive it; full-time from the sixth school day of a permanent exclusion); Education and Inspections Act 2006 s.100 (schools arrange full-time education from day six of a suspension); the off-site direction power, extended to academies and PRUs from 26 July 2026 by the Children&#39;s Wellbeing and Schools Act 2026.\u003c/li>\n\u003cli>\u003cstrong>Version:\u003c/strong> February 2025. Not verified: the exact GOV.UK landing page and whether minor amendments were made in 2026; GOV.UK could not be opened directly and the publication page did not appear in search results, so law firm summaries are cited instead.\u003c/li>\n\u003cli>\u003cstrong>Policy direction:\u003c/strong> the 2023 SEND and AP Improvement Plan described AP as a three-tier service (targeted support in mainstream, time-limited placements, transitional placements). The government&#39;s 2025 response on unregistered AP proposed local authority approved lists, mandatory national standards and limits on time spent in unregistered settings &#39;when parliamentary time allows&#39;. A 2026 consultation on education otherwise than at school was due a response in autumn 2026. Not verified: any outcome as at November 2026.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Arrange suitable full-time education\u003c/strong> from the sixth school day of a suspension.\u003c/li>\n\u003cli>\u003cstrong>Follow the off-site direction rules\u003c/strong> when directing a pupil to AP for behaviour: written notice to parents, clear objectives, regular review involving parents, and time limits (see the linked entry).\u003c/li>\n\u003cli>\u003cstrong>Record attendance correctly.\u003c/strong> A pupil at AP stays on the school roll; use the attendance codes for approved off-site education or dual registration, and obtain daily attendance from the provider.\u003c/li>\n\u003cli>\u003cstrong>Safeguard.\u003c/strong> Keeping Children Safe in Education requires the school to obtain written confirmation that appropriate safeguarding checks have been carried out on staff at the provider, to know where the pupil is during school hours, and to review placements to check they are safe and meeting need.\u003c/li>\n\u003cli>\u003cstrong>Do not use an illegal school.\u003c/strong> A setting providing full-time education to five or more pupils of compulsory school age, or one with an EHC plan or who is looked after, must be registered as a school.\u003c/li>\n\u003cli>\u003cstrong>Report AP placements in the school census.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cp>A commissioning checklist for a secondary school:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Purpose.\u003c/strong> Write down what the placement is for and what success looks like: for example, 12 weeks, two days a week, to re-establish attendance and complete a Level 1 construction unit, returning to full timetable in January.\u003c/li>\n\u003cli>\u003cstrong>Due diligence before placement:\u003c/strong> registration status; latest inspection; safeguarding policy and named DSL; DBS and safer recruitment confirmation in writing; insurance; health and safety and risk assessments; curriculum offer including English and maths; staff qualifications; how behaviour and physical intervention are handled.\u003c/li>\n\u003cli>\u003cstrong>Visit\u003c/strong> before placing and at least termly, unannounced where possible. Talk to the pupil there.\u003c/li>\n\u003cli>\u003cstrong>Share information:\u003c/strong> needs, risk assessment, EHC plan, medical details, emergency contacts, who to phone if the pupil does not arrive.\u003c/li>\n\u003cli>\u003cstrong>Agree in writing:\u003c/strong> timetable, cost, daily attendance reporting by a set time, weekly progress update, incident reporting the same day, review dates.\u003c/li>\n\u003cli>\u003cstrong>Keep the pupil connected:\u003c/strong> a named member of staff, a weekly check-in, access to careers guidance, exam entries and school events.\u003c/li>\n\u003cli>\u003cstrong>Plan the return\u003c/strong> from day one. Reintegration needs a phased timetable, a key adult and teachers briefed on what has changed.\u003c/li>\n\u003c/ol>\n\u003cp>For leaders: keep a single register of every pupil educated off site, with provider, hours, cost, attendance and review dates; report it to governors termly with breakdowns by SEND, disadvantage and ethnicity; and check total hours add up to full time unless a part-time arrangement is justified and time-limited.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>&#39;Out of sight&#39; placements with no review date, which function as informal exclusion.\u003c/li>\n\u003cli>Assuming the local authority or the provider has done the safeguarding checks.\u003c/li>\n\u003cli>A mosaic of part-time unregistered placements that adds up to an unregistered school.\u003c/li>\n\u003cli>A narrow curriculum that closes off GCSE English and maths.\u003c/li>\n\u003cli>Attendance marked as present on the provider&#39;s say-so with no daily confirmation.\u003c/li>\n\u003cli>Placing pupils whose underlying need is unassessed SEND; AP then substitutes for an EHC needs assessment.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Ofsted and the Care Quality Commission have published thematic reviews of AP commissioning that describe inconsistent oversight.\u003c/li>\n\u003cli>The Centre for Social Justice and IntegratED publish annual AP data analyses.\u003c/li>\n\u003cli>FFT Education Datalab&#39;s &#39;Who&#39;s Left&#39; series tracks outcomes for pupils who leave mainstream rolls.\u003c/li>\n\u003c/ul>\n","text":"At a glance Alternative provision (AP) is education arranged by a local authority for pupils who would otherwise not receive suitable education, or by a school for a suspended pupil or a pupil directed off site to improve behaviour. The DfE guidance is 'Arranging alternative provision: a guide for local authorities and schools' , rewritten in February 2025 to replace the 2013 version. It was still the reference text in 2026; the July 2026 exclusions guidance is to be read alongside it. The commissioning school keeps responsibility for a pupil it places: safeguarding, attendance, quality of education and outcomes. Providers range from PRUs and AP academies to registered independent schools, FE colleges and unregistered settings. Unregistered settings are not inspected; the checks fall to the commissioner. Government has said it will legislate for mandatory standards and time limits in unregistered AP; for now the national standards (August 2025) are voluntary . Status and current version Status: statutory guidance for local authorities and maintained schools. Academies are not bound in the same way, but legal commentary notes they are expected to take account of it, and Ofsted will judge them against the same practice. Legal basis: Education Act 1996 s.19 (local authority duty to arrange suitable education for children who, because of exclusion, illness or otherwise, would not receive it; full-time from the sixth school day of a permanent exclusion); Education and Inspections Act 2006 s.100 (schools arrange full-time education from day six of a suspension); the off-site direction power, extended to academies and PRUs from 26 July 2026 by the Children's Wellbeing and Schools Act 2026. Version: February 2025. Not verified: the exact GOV.UK landing page and whether minor amendments were made in 2026; GOV.UK could not be opened directly and the publication page did not appear in search results, so law firm summaries are cited instead. Policy direction: the 2023 SEND and AP Improvement Plan described AP as a three-tier service (targeted support in mainstream, time-limited placements, transitional placements). The government's 2025 response on unregistered AP proposed local authority approved lists, mandatory national standards and limits on time spent in unregistered settings 'when parliamentary time allows'. A 2026 consultation on education otherwise than at school was due a response in autumn 2026. Not verified: any outcome as at November 2026. What schools must do Arrange suitable full-time education from the sixth school day of a suspension. Follow the off-site direction rules when directing a pupil to AP for behaviour: written notice to parents, clear objectives, regular review involving parents, and time limits (see the linked entry). Record attendance correctly. A pupil at AP stays on the school roll; use the attendance codes for approved off-site education or dual registration, and obtain daily attendance from the provider. Safeguard. Keeping Children Safe in Education requires the school to obtain written confirmation that appropriate safeguarding checks have been carried out on staff at the provider, to know where the pupil is during school hours, and to review placements to check they are safe and meeting need. Do not use an illegal school. A setting providing full-time education to five or more pupils of compulsory school age, or one with an EHC plan or who is looked after, must be registered as a school. Report AP placements in the school census. In practice A commissioning checklist for a secondary school: Purpose. Write down what the placement is for and what success looks like: for example, 12 weeks, two days a week, to re-establish attendance and complete a Level 1 construction unit, returning to full timetable in January. Due diligence before placement: registration status; latest inspection; safeguarding policy and named DSL; DBS and safer recruitment confirmation in writing; insurance; health and safety and risk assessments; curriculum offer including English and maths; staff qualifications; how behaviour and physical intervention are handled. Visit before placing and at least termly, unannounced where possible. Talk to the pupil there. Share information: needs, risk assessment, EHC plan, medical details, emergency contacts, who to phone if the pupil does not arrive. Agree in writing: timetable, cost, daily attendance reporting by a set time, weekly progress update, incident reporting the same day, review dates. Keep the pupil connected: a named member of staff, a weekly check-in, access to careers guidance, exam entries and school events. Plan the return from day one. Reintegration needs a phased timetable, a key adult and teachers briefed on what has changed. For leaders: keep a single register of every pupil educated off site, with provider, hours, cost, attendance and review dates; report it to governors termly with breakdowns by SEND, disadvantage and ethnicity; and check total hours add up to full time unless a part-time arrangement is justified and time-limited. Common pitfalls 'Out of sight' placements with no review date, which function as informal exclusion. Assuming the local authority or the provider has done the safeguarding checks. A mosaic of part-time unregistered placements that adds up to an unregistered school. A narrow curriculum that closes off GCSE English and maths. Attendance marked as present on the provider's say-so with no daily confirmation. Placing pupils whose underlying need is unassessed SEND; AP then substitutes for an EHC needs assessment. Go deeper Ofsted and the Care Quality Commission have published thematic reviews of AP commissioning that describe inconsistent oversight. The Centre for Social Justice and IntegratED publish annual AP data analyses. FFT Education Datalab's 'Who's Left' series tracks outcomes for pupils who leave mainstream rolls."},{"slug":"barak-rosenshine","title":"Barak Rosenshine","category":"thinkers","type":"person","summary":"American educational psychologist (1930-2017) whose 'Principles of Instruction' distilled decades of research on effective teaching into ten principles now embedded in English teacher training and school CPD.","status":"Thinker profile","evidence":"","tags":["principles of instruction","explicit instruction","guided practice","daily review","scaffolding","process-product research"],"checked":"2026-11-12","sources":[{"title":"Barak Rosenshine's Principles of Instruction","publisher":"Tony Little Centre for Innovation and Research in Learning, Eton College","year":"Not verified","url":"https://cirl.etoncollege.com/barak-rosenshines-principles-of-instruction/"},{"title":"Principles of Instruction (2012)","publisher":"Five from Five","year":"Not verified","url":"https://fivefromfive.com.au/?p=1034"},{"title":"10 Principles of Instruction (research summary)","publisher":"RE:ONLINE","year":"Not verified","url":"https://www.reonline.org.uk/research/10-principles-of-instruction"},{"title":"Principles of Instruction","publisher":"Association of Independent Schools of NSW","year":"Not verified","url":"https://www.aisnsw.edu.au/teachers-and-staff/teaching-and-learning/literacy-and-numeracy/foundations-of-effective-instruction/principles-of-instruction"},{"title":"Rosenshine's Principles: Sequencing concepts and Modelling, with Tom Sherrington","publisher":"Chartered College of Teaching","year":"Not verified","url":"https://my.chartered.college/?p=21287"}],"related":["rosenshine-principles-of-instruction","explicit-instruction","tom-sherrington","retrieval-practice"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Rosenshine&#39;s ten principles describe what the most effective teachers were observed to do, cross-checked against cognitive science and research on scaffolds.\u003c/li>\n\u003cli>The essence: review often, teach in small steps, model, ask lots of questions, check everyone&#39;s understanding, guide practice until success is high, then build independent fluency.\u003c/li>\n\u003cli>The original article is the primary source. It is short, free and readable; teachers should read it rather than a poster summary.\u003c/li>\n\u003cli>The principles are a description of effective explicit teaching, not a lesson plan, and Rosenshine did not present them as a checklist.\u003c/li>\n\u003cli>The evidence base is strongest for well-structured content and novices, and much of the underlying classroom research is from primary reading and mathematics.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Barak Rosenshine (1930–2017) taught history in Chicago schools before completing a doctorate at Stanford and spending his academic career in educational psychology at the University of Illinois at Urbana-Champaign, where he became emeritus professor. From the late 1960s he was a central figure in &#39;process-product&#39; research: studies that observed what teachers did (process) and related it to pupils&#39; achievement gains (product). He also wrote on teacher effects, direct instruction, reciprocal teaching and the teaching of cognitive strategies. He died in 2017, shortly before his principles became ubiquitous in English schools, largely through Tom Sherrington&#39;s 2019 book and the wider researchED movement.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Where the principles came from.\u003c/strong> Rosenshine drew on three bodies of research that, he argued, do not contradict each other:\u003c/p>\n\u003col>\n\u003cli>\u003cem>Cognitive science\u003c/em>: how the brain acquires and uses information, especially the limits of working memory and the role of well-connected background knowledge.\u003c/li>\n\u003cli>\u003cem>Classroom practices of master teachers\u003c/em>: observational studies of teachers whose classes made the largest gains.\u003c/li>\n\u003cli>\u003cem>Cognitive supports\u003c/em>: research on scaffolds, models and thinking aloud that help pupils learn complex tasks.\u003c/li>\n\u003c/ol>\n\u003cp>The principles appeared first as a pamphlet for the International Academy of Education (2010) and then in revised form in \u003cem>American Educator\u003c/em> (Spring 2012). They develop earlier lists, notably the six &#39;teaching functions&#39; he set out with Robert Stevens in 1986.\u003c/p>\n\u003cp>\u003cstrong>The ten principles.\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Begin a lesson with a short review of previous learning.\u003c/li>\n\u003cli>Present new material in small steps, with pupil practice after each step.\u003c/li>\n\u003cli>Ask a large number of questions and check the responses of all pupils.\u003c/li>\n\u003cli>Provide models, including worked examples and thinking aloud.\u003c/li>\n\u003cli>Guide pupil practice.\u003c/li>\n\u003cli>Check for pupil understanding.\u003c/li>\n\u003cli>Obtain a high success rate.\u003c/li>\n\u003cli>Provide scaffolds for difficult tasks.\u003c/li>\n\u003cli>Require and monitor independent practice.\u003c/li>\n\u003cli>Engage pupils in weekly and monthly review.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>The seventeen procedures.\u003c/strong> The article also lists seventeen &#39;instructional procedures&#39;. These overlap with the ten and add detail: for example, limiting the amount of material pupils receive at one time, giving clear and detailed instructions, thinking aloud and modelling steps, asking pupils to explain what they have learned, providing systematic feedback and corrections, reteaching when necessary, and preparing pupils for independent practice. This is why some summaries refer to &#39;seventeen principles&#39;.\u003c/p>\n\u003cp>\u003cstrong>Details that are often lost.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Success rate.\u003c/em> Rosenshine reported that the most effective teachers obtained a success rate of around 80% during guided practice: high enough to show secure learning, with enough challenge to avoid triviality.\u003c/li>\n\u003cli>\u003cem>Time on guided practice.\u003c/em> More effective teachers spent longer presenting, questioning and guiding practice before releasing pupils to work alone. Less effective teachers gave short presentations and long worksheets, so pupils practised errors.\u003c/li>\n\u003cli>\u003cem>Checking everyone.\u003c/em> The least effective teachers asked &#39;Are there any questions?&#39; and took silence as understanding. Effective teachers asked pupils to explain, summarise or show working.\u003c/li>\n\u003cli>\u003cem>Scaffolds are temporary.\u003c/em> Cue cards, checklists, partially completed examples and anticipating errors are withdrawn as competence grows: a cognitive apprenticeship.\u003c/li>\n\u003cli>\u003cem>Overlearning.\u003c/em> Independent practice continues beyond first success, to build automaticity.\u003c/li>\n\u003c/ul>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>Teaching Behaviours and Student Achievement\u003c/em> (1971)\u003c/li>\n\u003cli>&#39;Teaching functions&#39;, with Robert Stevens, in \u003cem>Handbook of Research on Teaching\u003c/em> (1986)\u003c/li>\n\u003cli>&#39;Reciprocal teaching: a review of the research&#39;, with Carla Meister (1994)\u003c/li>\n\u003cli>\u003cem>Principles of Instruction\u003c/em>, International Academy of Education, Educational Practices Series 21 (2010)\u003c/li>\n\u003cli>&#39;Principles of instruction: research-based strategies that all teachers should know&#39;, \u003cem>American Educator\u003c/em>, 36(1), pp. 12–19 (2012)\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>For a classroom teacher:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Start with five minutes of review\u003c/strong> of material pupils will need today and material from weeks ago. Make everyone answer in writing.\u003c/li>\n\u003cli>\u003cstrong>Chunk the explanation.\u003c/strong> Teach one step, model it, then ask every pupil to try a near-identical example before the next step.\u003c/li>\n\u003cli>\u003cstrong>Script the questions.\u003c/strong> Plan process questions (&#39;How did you get that?&#39;, &#39;Why is the other option wrong?&#39;) and decide how every pupil will respond.\u003c/li>\n\u003cli>\u003cstrong>Stay in guided practice longer.\u003c/strong> Do not set independent work until most of the class is getting most items right. If they are not, reteach; do not circulate and patch pupils one at a time.\u003c/li>\n\u003cli>\u003cstrong>Fade the scaffold.\u003c/strong> Move from a full worked example, to a partially completed one, to a prompt card, to nothing.\u003c/li>\n\u003cli>\u003cstrong>Build weekly and monthly review\u003c/strong> into the scheme of work, not as an afterthought.\u003c/li>\n\u003c/ul>\n\u003cp>For leaders:\u003c/p>\n\u003cul>\n\u003cli>Give staff the original twelve-page article and discuss what the principles look like in each subject. Practice in art, PE and English literature will not look like practice in mathematics.\u003c/li>\n\u003cli>Do not require all ten principles in every lesson or use them as an observation checklist. They describe teaching over a sequence of lessons.\u003c/li>\n\u003cli>Use them as a shared vocabulary for coaching conversations about one specific area at a time.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Narrow evidence base.\u003c/strong> Much of the process-product research was conducted in the 1970s and 1980s in American primary classrooms, teaching basic skills, with standardised tests as the outcome. Critics question how far the findings transfer to, for example, A-level literature or design subjects. Rosenshine himself distinguished between well-structured and less-structured tasks and recommended scaffolds, not step-by-step procedures, for the latter.\u003c/li>\n\u003cli>\u003cstrong>Correlational roots.\u003c/strong> Process-product studies are largely correlational, though Rosenshine noted that experimental studies training teachers in the methods found gains.\u003c/li>\n\u003cli>\u003cstrong>Lethal mutations.\u003c/strong> Writers including Tom Sherrington and Christine Counsell have warned that the principles have been turned into generic lesson templates and monitoring forms. Counsell and other subject specialists argue that they say nothing about \u003cem>what\u003c/em> is taught and can crowd out subject-specific thinking.\u003c/li>\n\u003cli>\u003cstrong>Not a theory of curriculum or motivation.\u003c/strong> The principles are silent on curriculum content, relationships, behaviour and motivation, so they cannot serve as a complete model of teaching.\u003c/li>\n\u003cli>\u003cstrong>Ideological objection.\u003c/strong> Advocates of enquiry-based learning see the principles as privileging transmission. Supporters respond that the principles end with independent practice and that the evidence favours explicit teaching for novices.\u003c/li>\n\u003c/ul>\n","text":"At a glance Rosenshine's ten principles describe what the most effective teachers were observed to do, cross-checked against cognitive science and research on scaffolds. The essence: review often, teach in small steps, model, ask lots of questions, check everyone's understanding, guide practice until success is high, then build independent fluency. The original article is the primary source. It is short, free and readable; teachers should read it rather than a poster summary. The principles are a description of effective explicit teaching, not a lesson plan, and Rosenshine did not present them as a checklist. The evidence base is strongest for well-structured content and novices, and much of the underlying classroom research is from primary reading and mathematics. Who they are Barak Rosenshine (1930–2017) taught history in Chicago schools before completing a doctorate at Stanford and spending his academic career in educational psychology at the University of Illinois at Urbana-Champaign, where he became emeritus professor. From the late 1960s he was a central figure in 'process-product' research: studies that observed what teachers did (process) and related it to pupils' achievement gains (product). He also wrote on teacher effects, direct instruction, reciprocal teaching and the teaching of cognitive strategies. He died in 2017, shortly before his principles became ubiquitous in English schools, largely through Tom Sherrington's 2019 book and the wider researchED movement. Core ideas Where the principles came from. Rosenshine drew on three bodies of research that, he argued, do not contradict each other: Cognitive science : how the brain acquires and uses information, especially the limits of working memory and the role of well-connected background knowledge. Classroom practices of master teachers : observational studies of teachers whose classes made the largest gains. Cognitive supports : research on scaffolds, models and thinking aloud that help pupils learn complex tasks. The principles appeared first as a pamphlet for the International Academy of Education (2010) and then in revised form in American Educator (Spring 2012). They develop earlier lists, notably the six 'teaching functions' he set out with Robert Stevens in 1986. The ten principles. Begin a lesson with a short review of previous learning. Present new material in small steps, with pupil practice after each step. Ask a large number of questions and check the responses of all pupils. Provide models, including worked examples and thinking aloud. Guide pupil practice. Check for pupil understanding. Obtain a high success rate. Provide scaffolds for difficult tasks. Require and monitor independent practice. Engage pupils in weekly and monthly review. The seventeen procedures. The article also lists seventeen 'instructional procedures'. These overlap with the ten and add detail: for example, limiting the amount of material pupils receive at one time, giving clear and detailed instructions, thinking aloud and modelling steps, asking pupils to explain what they have learned, providing systematic feedback and corrections, reteaching when necessary, and preparing pupils for independent practice. This is why some summaries refer to 'seventeen principles'. Details that are often lost. Success rate. Rosenshine reported that the most effective teachers obtained a success rate of around 80% during guided practice: high enough to show secure learning, with enough challenge to avoid triviality. Time on guided practice. More effective teachers spent longer presenting, questioning and guiding practice before releasing pupils to work alone. Less effective teachers gave short presentations and long worksheets, so pupils practised errors. Checking everyone. The least effective teachers asked 'Are there any questions?' and took silence as understanding. Effective teachers asked pupils to explain, summarise or show working. Scaffolds are temporary. Cue cards, checklists, partially completed examples and anticipating errors are withdrawn as competence grows: a cognitive apprenticeship. Overlearning. Independent practice continues beyond first success, to build automaticity. Key works Teaching Behaviours and Student Achievement (1971) 'Teaching functions', with Robert Stevens, in Handbook of Research on Teaching (1986) 'Reciprocal teaching: a review of the research', with Carla Meister (1994) Principles of Instruction , International Academy of Education, Educational Practices Series 21 (2010) 'Principles of instruction: research-based strategies that all teachers should know', American Educator , 36(1), pp. 12–19 (2012) Putting it into practice For a classroom teacher: Start with five minutes of review of material pupils will need today and material from weeks ago. Make everyone answer in writing. Chunk the explanation. Teach one step, model it, then ask every pupil to try a near-identical example before the next step. Script the questions. Plan process questions ('How did you get that?', 'Why is the other option wrong?') and decide how every pupil will respond. Stay in guided practice longer. Do not set independent work until most of the class is getting most items right. If they are not, reteach; do not circulate and patch pupils one at a time. Fade the scaffold. Move from a full worked example, to a partially completed one, to a prompt card, to nothing. Build weekly and monthly review into the scheme of work, not as an afterthought. For leaders: Give staff the original twelve-page article and discuss what the principles look like in each subject. Practice in art, PE and English literature will not look like practice in mathematics. Do not require all ten principles in every lesson or use them as an observation checklist. They describe teaching over a sequence of lessons. Use them as a shared vocabulary for coaching conversations about one specific area at a time. Critiques and debate Narrow evidence base. Much of the process-product research was conducted in the 1970s and 1980s in American primary classrooms, teaching basic skills, with standardised tests as the outcome. Critics question how far the findings transfer to, for example, A-level literature or design subjects. Rosenshine himself distinguished between well-structured and less-structured tasks and recommended scaffolds, not step-by-step procedures, for the latter. Correlational roots. Process-product studies are largely correlational, though Rosenshine noted that experimental studies training teachers in the methods found gains. Lethal mutations. Writers including Tom Sherrington and Christine Counsell have warned that the principles have been turned into generic lesson templates and monitoring forms. Counsell and other subject specialists argue that they say nothing about what is taught and can crowd out subject-specific thinking. Not a theory of curriculum or motivation. The principles are silent on curriculum content, relationships, behaviour and motivation, so they cannot serve as a complete model of teaching. Ideological objection. Advocates of enquiry-based learning see the principles as privileging transmission. Supporters respond that the principles end with independent practice and that the evidence favours explicit teaching for novices."},{"slug":"behaviour-in-schools-guidance","title":"Behaviour in schools (DfE guidance)","category":"behaviour","type":"guidance","summary":"The DfE's core non-statutory advice on behaviour policy, culture, sanctions, removal from class and behaviour outside school. Rewritten in 2022, last revised February 2024; other behaviour guidance hangs off it.","status":"Non-statutory guidance","evidence":"","tags":["behaviour policy","dfe","sanctions","removal","behaviour curriculum","send"],"checked":"2026-11-12","sources":[{"title":"Behaviour in schools: advice for headteachers and school staff","publisher":"Department for Education","year":"2024","url":"https://www.gov.uk/government/publications/behaviour-in-schools--2"},{"title":"Education and Inspections Act 2006, Part 7 (sections 88 to 94)","publisher":"legislation.gov.uk","year":"2006","url":"https://www.legislation.gov.uk/ukpga/2006/40/part/7"},{"title":"Government response to Behaviour guidance and Exclusions guidance consultation","publisher":"Department for Education","year":"2022","url":"https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1090090/Government_response_to_Behaviour_guidance_and_Exclusions_guidance_consultation_July_2022.pdf"},{"title":"Suspension and permanent exclusion from maintained schools, academies and pupil referral units in England, including pupil movement","publisher":"Department for Education","year":"2026","url":"https://www.gov.uk/government/publications/school-suspensions-and-permanent-exclusions"}],"related":["suspension-and-permanent-exclusion","mobile-phones-in-schools","use-of-reasonable-force"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>This is the DfE&#39;s main advice document on behaviour. It is \u003cstrong>non-statutory\u003c/strong>, but it describes legal duties that sit in Acts and regulations, and Ofsted and tribunals treat it as the benchmark of reasonable practice.\u003c/li>\n\u003cli>The version in force is the one substantially rewritten in 2022 (in effect from September 2022) and last revised on 19 February 2024. As far as could be established on 12 November 2026 it has not been reissued since, although several documents it cross-refers to changed in 2026.\u003c/li>\n\u003cli>Its central argument: good behaviour is created by a deliberately designed whole-school culture, taught explicitly, led visibly by the headteacher and applied consistently by all staff.\u003c/li>\n\u003cli>It introduced or formalised three ideas now common in secondary schools: a \u003cstrong>behaviour curriculum\u003c/strong>, \u003cstrong>removal from classrooms\u003c/strong> as a serious sanction with safeguards, and the expectation that schools \u003cstrong>anticipate\u003c/strong> likely triggers for pupils with SEND.\u003c/li>\n\u003cli>Read it alongside the 2026 exclusions guidance, the 2026 restrictive interventions guidance and the now-statutory mobile phones guidance: the 2024 text predates all three.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Title:\u003c/strong> Behaviour in schools: advice for headteachers and school staff.\u003c/li>\n\u003cli>\u003cstrong>Applies to:\u003c/strong> maintained schools, academies and free schools, non-maintained special schools, pupil referral units and, as the February 2024 revision made explicit, independent schools.\u003c/li>\n\u003cli>\u003cstrong>Version history:\u003c/strong> it replaced &#39;Behaviour and discipline in schools&#39; (2016) after a consultation in early 2022. The February 2024 revision was narrow: it rewrote the mobile phones section to match the separate phones guidance published the same day.\u003c/li>\n\u003cli>\u003cstrong>What has moved around it since:\u003c/strong> the mobile phones guidance became statutory in 2026; the 2013 reasonable force advice was replaced from 1 April 2026; new exclusions guidance applies from 26 July 2026. Where the 2024 behaviour guidance summarises those areas, the newer document prevails.\u003c/li>\n\u003cli>Not verified: whether DfE made any minor edit to this document after February 2024. GOV.UK could not be opened directly when this entry was written; the dating above rests on search results and on 2026 legal commentary that still describes it as the February 2024 guidance.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>The &#39;musts&#39; come from legislation, not from the guidance itself.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Maintained schools:\u003c/strong> the headteacher must determine measures to promote good behaviour, self-discipline and respect, and to prevent bullying, and must publicise them in a written behaviour policy (Education and Inspections Act 2006, s.89). The governing body must make and review a written statement of behaviour principles (s.88). The policy must be brought to the attention of pupils, parents and staff at least once a year and published on the school website.\u003c/li>\n\u003cli>\u003cstrong>Academies and independent schools:\u003c/strong> the proprietor must ensure a written policy to promote good behaviour is drawn up and implemented effectively, with sanctions set out (Independent School Standards Regulations 2014).\u003c/li>\n\u003cli>\u003cstrong>Sanctions must be lawful:\u003c/strong> imposed by a paid member of staff or someone authorised by the head, on the premises or while the pupil is under staff charge, and reasonable and proportionate in all the circumstances, taking account of age, SEND and religious requirements (s.91).\u003c/li>\n\u003cli>\u003cstrong>Equality and SEND law applies throughout:\u003c/strong> no discrimination, reasonable adjustments for disabled pupils, and best endeavours to meet special educational needs.\u003c/li>\n\u003cli>\u003cstrong>Safeguarding:\u003c/strong> staff must consider whether misbehaviour gives cause to suspect a pupil is suffering, or likely to suffer, harm.\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cp>What the guidance says schools \u003cstrong>should\u003c/strong> do:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Define the culture.\u003c/strong> State the behaviour you want in concrete terms, not just what is banned. The head and senior team should be visible and should model it.\u003c/li>\n\u003cli>\u003cstrong>Teach a behaviour curriculum.\u003c/strong> Routines and expectations are taught, practised and re-taught, with induction for new pupils and mid-year arrivals. Adjust routines for individual pupils where needed rather than lowering the expectation.\u003c/li>\n\u003cli>\u003cstrong>Train staff.\u003c/strong> All staff, including support and site staff, should know the policy and their role in it, with induction and regular refreshers.\u003c/li>\n\u003cli>\u003cstrong>Respond predictably.\u003c/strong> Every incident gets a response that is consistent, fair and proportionate. Sanctions have stated purposes: deterrence, protection, improvement.\u003c/li>\n\u003cli>\u003cstrong>Follow up.\u003c/strong> After a sanction, consider a conversation with the pupil, contact with parents, or a targeted intervention, so the same behaviour is less likely next time.\u003c/li>\n\u003cli>\u003cstrong>Removal from classrooms\u003c/strong> should be for serious disruption, for a limited time, in a supervised place where education continues, governed by a published policy, with parents informed the same day and data monitored by group. It is distinct from a pupil choosing to use a separation or regulation space.\u003c/li>\n\u003cli>\u003cstrong>Behaviour outside school and online.\u003c/strong> The policy can cover conduct off site when the pupil is identifiable as a member of the school, travelling to or from it, or where the behaviour could affect the school&#39;s orderly running or threaten others.\u003c/li>\n\u003cli>\u003cstrong>Child-on-child sexual violence and harassment\u003c/strong> should never be passed off as banter; respond in line with Keeping Children Safe in Education.\u003c/li>\n\u003cli>\u003cstrong>Use data.\u003c/strong> Leaders should analyse behaviour incidents, removals, suspensions and attendance together, by pupil characteristic, to spot patterns and test whether the policy works.\u003c/li>\n\u003c/ul>\n\u003cp>A secondary example: a head of year sees one Year 9 pupil removed from science six times in three weeks. The guidance points towards asking what precedes the removals (seating, literacy demand, a particular lesson slot), involving the SENCO, agreeing an adjustment and a re-entry routine, and reviewing in two weeks, while the removal sanction itself still stands.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Treating it as law, or as optional.\u003c/strong> It is neither. Departing from it needs a reason you could defend to governors, Ofsted or a tribunal.\u003c/li>\n\u003cli>\u003cstrong>A policy that describes sanctions but not teaching.\u003c/strong> The guidance expects the positive curriculum and the staff training to be as detailed as the consequences.\u003c/li>\n\u003cli>\u003cstrong>&#39;Consistency&#39; used to refuse adjustments.\u003c/strong> The guidance is explicit that schools should anticipate SEND-related triggers. Blanket application that disadvantages a disabled pupil can be unlawful discrimination.\u003c/li>\n\u003cli>\u003cstrong>Removal drifting into routine.\u003c/strong> Long or repeated stays, no curriculum work, no record and no parental contact are the features the guidance warns against.\u003c/li>\n\u003cli>\u003cstrong>Reading the 2024 text on phones, force or exclusion in isolation.\u003c/strong> Each has been superseded by a 2026 document.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>The guidance&#39;s own annex of further resources lists the linked DfE documents.\u003c/li>\n\u003cli>For drafting, see the entries on writing a behaviour policy and the behaviour curriculum.\u003c/li>\n\u003cli>For the evidence behind the approach, see the Bennett review and the EEF guidance report.\u003c/li>\n\u003c/ul>\n","text":"At a glance This is the DfE's main advice document on behaviour. It is non-statutory , but it describes legal duties that sit in Acts and regulations, and Ofsted and tribunals treat it as the benchmark of reasonable practice. The version in force is the one substantially rewritten in 2022 (in effect from September 2022) and last revised on 19 February 2024. As far as could be established on 12 November 2026 it has not been reissued since, although several documents it cross-refers to changed in 2026. Its central argument: good behaviour is created by a deliberately designed whole-school culture, taught explicitly, led visibly by the headteacher and applied consistently by all staff. It introduced or formalised three ideas now common in secondary schools: a behaviour curriculum , removal from classrooms as a serious sanction with safeguards, and the expectation that schools anticipate likely triggers for pupils with SEND. Read it alongside the 2026 exclusions guidance, the 2026 restrictive interventions guidance and the now-statutory mobile phones guidance: the 2024 text predates all three. Status and current version Title: Behaviour in schools: advice for headteachers and school staff. Applies to: maintained schools, academies and free schools, non-maintained special schools, pupil referral units and, as the February 2024 revision made explicit, independent schools. Version history: it replaced 'Behaviour and discipline in schools' (2016) after a consultation in early 2022. The February 2024 revision was narrow: it rewrote the mobile phones section to match the separate phones guidance published the same day. What has moved around it since: the mobile phones guidance became statutory in 2026; the 2013 reasonable force advice was replaced from 1 April 2026; new exclusions guidance applies from 26 July 2026. Where the 2024 behaviour guidance summarises those areas, the newer document prevails. Not verified: whether DfE made any minor edit to this document after February 2024. GOV.UK could not be opened directly when this entry was written; the dating above rests on search results and on 2026 legal commentary that still describes it as the February 2024 guidance. What schools must do The 'musts' come from legislation, not from the guidance itself. Maintained schools: the headteacher must determine measures to promote good behaviour, self-discipline and respect, and to prevent bullying, and must publicise them in a written behaviour policy (Education and Inspections Act 2006, s.89). The governing body must make and review a written statement of behaviour principles (s.88). The policy must be brought to the attention of pupils, parents and staff at least once a year and published on the school website. Academies and independent schools: the proprietor must ensure a written policy to promote good behaviour is drawn up and implemented effectively, with sanctions set out (Independent School Standards Regulations 2014). Sanctions must be lawful: imposed by a paid member of staff or someone authorised by the head, on the premises or while the pupil is under staff charge, and reasonable and proportionate in all the circumstances, taking account of age, SEND and religious requirements (s.91). Equality and SEND law applies throughout: no discrimination, reasonable adjustments for disabled pupils, and best endeavours to meet special educational needs. Safeguarding: staff must consider whether misbehaviour gives cause to suspect a pupil is suffering, or likely to suffer, harm. In practice What the guidance says schools should do: Define the culture. State the behaviour you want in concrete terms, not just what is banned. The head and senior team should be visible and should model it. Teach a behaviour curriculum. Routines and expectations are taught, practised and re-taught, with induction for new pupils and mid-year arrivals. Adjust routines for individual pupils where needed rather than lowering the expectation. Train staff. All staff, including support and site staff, should know the policy and their role in it, with induction and regular refreshers. Respond predictably. Every incident gets a response that is consistent, fair and proportionate. Sanctions have stated purposes: deterrence, protection, improvement. Follow up. After a sanction, consider a conversation with the pupil, contact with parents, or a targeted intervention, so the same behaviour is less likely next time. Removal from classrooms should be for serious disruption, for a limited time, in a supervised place where education continues, governed by a published policy, with parents informed the same day and data monitored by group. It is distinct from a pupil choosing to use a separation or regulation space. Behaviour outside school and online. The policy can cover conduct off site when the pupil is identifiable as a member of the school, travelling to or from it, or where the behaviour could affect the school's orderly running or threaten others. Child-on-child sexual violence and harassment should never be passed off as banter; respond in line with Keeping Children Safe in Education. Use data. Leaders should analyse behaviour incidents, removals, suspensions and attendance together, by pupil characteristic, to spot patterns and test whether the policy works. A secondary example: a head of year sees one Year 9 pupil removed from science six times in three weeks. The guidance points towards asking what precedes the removals (seating, literacy demand, a particular lesson slot), involving the SENCO, agreeing an adjustment and a re-entry routine, and reviewing in two weeks, while the removal sanction itself still stands. Common pitfalls Treating it as law, or as optional. It is neither. Departing from it needs a reason you could defend to governors, Ofsted or a tribunal. A policy that describes sanctions but not teaching. The guidance expects the positive curriculum and the staff training to be as detailed as the consequences. 'Consistency' used to refuse adjustments. The guidance is explicit that schools should anticipate SEND-related triggers. Blanket application that disadvantages a disabled pupil can be unlawful discrimination. Removal drifting into routine. Long or repeated stays, no curriculum work, no record and no parental contact are the features the guidance warns against. Reading the 2024 text on phones, force or exclusion in isolation. Each has been superseded by a 2026 document. Go deeper The guidance's own annex of further resources lists the linked DfE documents. For drafting, see the entries on writing a behaviour policy and the behaviour curriculum. For the evidence behind the approach, see the Bennett review and the EEF guidance report."},{"slug":"bill-rogers","title":"Bill Rogers","category":"thinkers","type":"person","summary":"Australian behaviour consultant whose 'positive correction' toolkit (least-to-most intrusive responses, tactical ignoring, take-up time, partial agreement, directed choices) underpins much UK teacher training on classroom language.","status":"Thinker profile","evidence":"","tags":["behaviour","classroom management","positive correction","scripts","de-escalation","routines"],"checked":"2026-11-12","sources":[{"title":"Classroom Behaviour: A Practical Guide to Effective Teaching, Behaviour Management and Colleague Support (4th edition, publisher page)","publisher":"SAGE Publications","year":"2015","url":"https://www.sagepub.com/books/Book242712"},{"title":"Dr Bill Rogers: Behaviour and Classroom Management (author website)","publisher":"Bill Rogers","year":"2026","url":"https://billrogers.com.au/"},{"title":"Bill Rogers (author page)","publisher":"SAGE Publications","year":"Not verified","url":"https://www.sagepub.com/explore-our-content/authors/bill-rogers-457879"},{"title":"Droichead: Positive Behaviour Management (Post-primary) handout","publisher":"Oide (Ireland)","year":"202
