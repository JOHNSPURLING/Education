ols is low in interactivity: each can be learned alone. Balancing an equation is high: the elements only make sense together. Many CLT effects appear only with high element interactivity material.\u003c/p>\n\u003cp>\u003cstrong>The main effects.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Goal-free effect\u003c/em>: &#39;find what you can&#39; produces more learning than &#39;find angle X&#39;, because it removes the means-ends search.\u003c/li>\n\u003cli>\u003cem>Worked example effect\u003c/em>: novices learn more from studying worked solutions than from solving the same problems.\u003c/li>\n\u003cli>\u003cem>Completion problem effect\u003c/em>: partially worked examples are a bridge to independent solving.\u003c/li>\n\u003cli>\u003cem>Split-attention effect\u003c/em>: learners lose capacity when they must integrate separated sources, such as a diagram and a distant key. Integrate labels into the diagram.\u003c/li>\n\u003cli>\u003cem>Redundancy effect\u003c/em>: adding information that duplicates what is already intelligible (for example, reading aloud text that is on the slide) harms learning.\u003c/li>\n\u003cli>\u003cem>Modality effect\u003c/em>: a diagram with spoken explanation can beat a diagram with written text, as it uses both visual and auditory channels.\u003c/li>\n\u003cli>\u003cem>Transient information effect\u003c/em>: long spoken or animated explanations vanish before they can be processed; a static, permanent record helps.\u003c/li>\n\u003cli>\u003cem>Expertise reversal effect\u003c/em>: as learners gain knowledge, worked examples and integrated guidance become redundant and can slow them down.\u003c/li>\n\u003cli>\u003cem>Guidance fading effect\u003c/em>: the practical upshot, moving from examples to completion problems to full problems.\u003c/li>\n\u003cli>\u003cem>Isolated elements effect\u003c/em>: for very complex content, teach elements separately first, accepting partial understanding, then combine.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Against minimal guidance.\u003c/strong> With Kirschner and Clark (2006) he argued that discovery, problem-based and enquiry learning ignore the architecture above and are less effective for novices than explicit instruction.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>&#39;Cognitive load during problem solving: effects on learning&#39;, \u003cem>Cognitive Science\u003c/em> (1988)\u003c/li>\n\u003cli>&#39;Cognitive architecture and instructional design&#39;, with van Merriënboer and Paas, \u003cem>Educational Psychology Review\u003c/em> (1998)\u003c/li>\n\u003cli>&#39;Why minimal guidance during instruction does not work&#39;, with Kirschner and Clark, \u003cem>Educational Psychologist\u003c/em> (2006)\u003c/li>\n\u003cli>\u003cem>Cognitive Load Theory\u003c/em>, with Ayres and Kalyuga (Springer, 2011)\u003c/li>\n\u003cli>&#39;Cognitive architecture and instructional design: 20 years later&#39;, with van Merriënboer and Paas (2019)\u003c/li>\n\u003cli>&#39;The development of cognitive load theory: replication crises and incorporation of other theories can lead to theory expansion&#39; (2023)\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>For a classroom teacher:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Use example-problem pairs.\u003c/strong> Show a worked example, then set a near-identical problem straight away. Then fade: give the first steps and ask pupils to finish.\u003c/li>\n\u003cli>\u003cstrong>Clean up slides and worksheets.\u003c/strong> Put labels on the diagram, not in a key. Remove decorative images. Do not talk over dense text; either let pupils read in silence or say it and show only the diagram.\u003c/li>\n\u003cli>\u003cstrong>Leave the model visible.\u003c/strong> Keep the worked example on the board during practice so pupils do not have to hold it in memory.\u003c/li>\n\u003cli>\u003cstrong>Pre-teach components.\u003c/strong> Secure vocabulary and sub-procedures before the lesson that combines them.\u003c/li>\n\u003cli>\u003cstrong>Watch for reversal.\u003c/strong> When a pupil or class is fluent, drop the scaffolds and set problems; continued worked examples will bore and slow them.\u003c/li>\n\u003c/ul>\n\u003cp>For leaders:\u003c/p>\n\u003cul>\n\u003cli>Check shared resources and centrally produced slides for split attention and redundancy.\u003c/li>\n\u003cli>Sequence curricula so that high-interactivity topics are preceded by their components.\u003c/li>\n\u003cli>Treat CLT as a design principle for novices meeting complex material, not as a rule that every lesson must be teacher-led.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Falsifiability and measurement.\u003c/strong> Ton de Jong (2010) and others argue that, because the types of load cannot be measured independently (most studies use a single self-rating of mental effort), almost any result can be explained after the fact. Sweller&#39;s 2023 paper presents the theory&#39;s revisions after failed replications as a strength; critics see post hoc patching.\u003c/li>\n\u003cli>\u003cstrong>The status of germane load.\u003c/strong> Its introduction and later demotion are cited as evidence of conceptual instability.\u003c/li>\n\u003cli>\u003cstrong>Productive failure.\u003c/strong> Manu Kapur&#39;s research suggests that, for conceptual understanding, attempting problems \u003cem>before\u003c/em> instruction can outperform instruction first. Sweller and colleagues dispute the design of some studies; the debate is live, and element interactivity is offered as a possible reconciliation.\u003c/li>\n\u003cli>\u003cstrong>Desirable difficulties.\u003c/strong> The Bjorks&#39; work shows that some added difficulty improves retention. Researchers on both sides have suggested that the two accounts apply at different stages or to material of different complexity.\u003c/li>\n\u003cli>\u003cstrong>Motivation and transfer.\u003c/strong> CLT says little about motivation, emotion or collaboration, and most experiments use short interventions with well-structured mathematics, science or technical content. Its reach into the humanities and arts is argued by analogy more than tested.\u003c/li>\n\u003cli>\u003cstrong>Primary/secondary distinction.\u003c/strong> Some psychologists consider Geary&#39;s distinction speculative and doubt it can bear the weight Sweller places on it.\u003c/li>\n\u003cli>\u003cstrong>Ideological critique.\u003c/strong> Alfie Kohn and other progressive educators argue that CLT is used to legitimise teacher-directed instruction. David Didau and Paul Kirschner have published rebuttals.\u003c/li>\n\u003c/ul>\n","text":"At a glance Sweller's claim: working memory is small and short-lived when handling new information; long-term memory is vast. Instruction should be designed around that bottleneck. Novices learn more from studying worked examples than from solving equivalent problems unaided. Reduce load that comes from poor presentation (split attention, redundancy); manage load that comes from the content itself by sequencing and pre-teaching. What helps novices can hinder experts (the expertise reversal effect), so guidance must be faded. The theory is influential and well supported in laboratory-style experiments, but load is hard to measure directly and critics question its falsifiability. Who they are John Sweller is emeritus professor of educational psychology at the University of New South Wales, Sydney, where he spent most of his career. Cognitive load theory (CLT) grew out of his problem-solving experiments in the late 1970s and 1980s, in which students who solved many problems using means-ends analysis often failed to learn the underlying rule. His 1988 paper in Cognitive Science set out the explanation. He has since published several hundred papers and developed the theory with collaborators including Paul Chandler, Slava Kalyuga, Paul Ayres, Fred Paas, Jeroen van Merriënboer and Paul Kirschner. In England, CLT gained prominence in the late 2010s; Dylan Wiliam described it in 2017 as the most important thing for teachers to know, and it is referenced in Ofsted's research commentary for the 2019 inspection framework. Core ideas Human cognitive architecture. Learning is a change in long-term memory. Long-term memory stores knowledge as schemas, which can be large yet are handled as single elements in working memory. Experts differ from novices mainly in the schemas they hold, not in general problem-solving skill. Working memory can hold only a few new elements at once, for seconds, but those limits largely disappear for information retrieved from long-term memory. Biologically primary and secondary knowledge. Borrowing from David Geary, Sweller argues that humans acquire some things without instruction (speaking a first language, recognising faces, general problem-solving strategies) but that school subjects are 'biologically secondary' and need explicit teaching. He uses this to argue that generic thinking skills cannot usefully be taught. Types of load. Intrinsic load comes from the material itself and the learner's prior knowledge. Extraneous load comes from the way the material is presented and does not contribute to learning. Germane load was added in 1998 to describe effort devoted to schema building. In later formulations Sweller treats it not as a separate source of load but as the working memory resources devoted to intrinsic load. Element interactivity. The driver of intrinsic load is how many elements must be processed simultaneously. Learning a list of chemical symbols is low in interactivity: each can be learned alone. Balancing an equation is high: the elements only make sense together. Many CLT effects appear only with high element interactivity material. The main effects. Goal-free effect : 'find what you can' produces more learning than 'find angle X', because it removes the means-ends search. Worked example effect : novices learn more from studying worked solutions than from solving the same problems. Completion problem effect : partially worked examples are a bridge to independent solving. Split-attention effect : learners lose capacity when they must integrate separated sources, such as a diagram and a distant key. Integrate labels into the diagram. Redundancy effect : adding information that duplicates what is already intelligible (for example, reading aloud text that is on the slide) harms learning. Modality effect : a diagram with spoken explanation can beat a diagram with written text, as it uses both visual and auditory channels. Transient information effect : long spoken or animated explanations vanish before they can be processed; a static, permanent record helps. Expertise reversal effect : as learners gain knowledge, worked examples and integrated guidance become redundant and can slow them down. Guidance fading effect : the practical upshot, moving from examples to completion problems to full problems. Isolated elements effect : for very complex content, teach elements separately first, accepting partial understanding, then combine. Against minimal guidance. With Kirschner and Clark (2006) he argued that discovery, problem-based and enquiry learning ignore the architecture above and are less effective for novices than explicit instruction. Key works 'Cognitive load during problem solving: effects on learning', Cognitive Science (1988) 'Cognitive architecture and instructional design', with van Merriënboer and Paas, Educational Psychology Review (1998) 'Why minimal guidance during instruction does not work', with Kirschner and Clark, Educational Psychologist (2006) Cognitive Load Theory , with Ayres and Kalyuga (Springer, 2011) 'Cognitive architecture and instructional design: 20 years later', with van Merriënboer and Paas (2019) 'The development of cognitive load theory: replication crises and incorporation of other theories can lead to theory expansion' (2023) Putting it into practice For a classroom teacher: Use example-problem pairs. Show a worked example, then set a near-identical problem straight away. Then fade: give the first steps and ask pupils to finish. Clean up slides and worksheets. Put labels on the diagram, not in a key. Remove decorative images. Do not talk over dense text; either let pupils read in silence or say it and show only the diagram. Leave the model visible. Keep the worked example on the board during practice so pupils do not have to hold it in memory. Pre-teach components. Secure vocabulary and sub-procedures before the lesson that combines them. Watch for reversal. When a pupil or class is fluent, drop the scaffolds and set problems; continued worked examples will bore and slow them. For leaders: Check shared resources and centrally produced slides for split attention and redundancy. Sequence curricula so that high-interactivity topics are preceded by their components. Treat CLT as a design principle for novices meeting complex material, not as a rule that every lesson must be teacher-led. Critiques and debate Falsifiability and measurement. Ton de Jong (2010) and others argue that, because the types of load cannot be measured independently (most studies use a single self-rating of mental effort), almost any result can be explained after the fact. Sweller's 2023 paper presents the theory's revisions after failed replications as a strength; critics see post hoc patching. The status of germane load. Its introduction and later demotion are cited as evidence of conceptual instability. Productive failure. Manu Kapur's research suggests that, for conceptual understanding, attempting problems before instruction can outperform instruction first. Sweller and colleagues dispute the design of some studies; the debate is live, and element interactivity is offered as a possible reconciliation. Desirable difficulties. The Bjorks' work shows that some added difficulty improves retention. Researchers on both sides have suggested that the two accounts apply at different stages or to material of different complexity. Motivation and transfer. CLT says little about motivation, emotion or collaboration, and most experiments use short interventions with well-structured mathematics, science or technical content. Its reach into the humanities and arts is argued by analogy more than tested. Primary/secondary distinction. Some psychologists consider Geary's distinction speculative and doubt it can bear the weight Sweller places on it. Ideological critique. Alfie Kohn and other progressive educators argue that CLT is used to legitimise teacher-directed instruction. David Didau and Paul Kirschner have published rebuttals."},{"slug":"katharine-birbalsingh","title":"Katharine Birbalsingh","category":"thinkers","type":"person","summary":"Co-founder and headmistress of Michaela Community School in Wembley, the best-known English example of a very strict, knowledge-rich, teacher-led school. Her edited books set out 'the Michaela way'; her approach is admired and contested.","status":"Thinker profile","evidence":"","tags":["behaviour","school culture","no excuses","knowledge-rich","michaela","headship","free schools"],"checked":"2026-11-12","sources":[{"title":"Katharine Birbalsingh CBE (government biography)","publisher":"GOV.UK","year":"Not verified","url":"https://gov.uk/government/people/katharine-birbalsingh"},{"title":"Michaela Community School (establishment record)","publisher":"Department for Education, Get Information about Schools","year":"2026","url":"https://www.get-information-schools.service.gov.uk/Establishments/Establishment/Details/140862"},{"title":"MPs give Birbalsingh social mobility role green light","publisher":"Schools Week","year":"2021","url":"https://schoolsweek.co.uk/mps-give-birbalsingh-social-mobility-role-green-light/"},{"title":"Britain's strictest head teacher: my case to ban prayer in school","publisher":"UnHerd","year":"2024","url":"https://unherd.com/newsroom/britains-strictest-head-teacher-my-case-to-ban-prayer-in-school/"},{"title":"Katharine Birbalsingh interview (on the Children's Wellbeing and Schools Bill)","publisher":"New Statesman","year":"2025","url":"https://www.newstatesman.com/politics/education/2025/02/katharine-birbalsingh-interview-destroy-our-schools-bridget-phillipson-academies"}],"related":["mobile-phones-in-schools","whole-class-feedback","explicit-instruction","tom-bennett","sam-strickland"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Birbalsingh leads Michaela Community School, a free school opened in 2014 that combines \u003cstrong>very strict behaviour routines\u003c/strong>, \u003cstrong>teacher-led instruction\u003c/strong> and a \u003cstrong>knowledge-rich curriculum\u003c/strong>.\u003c/li>\n\u003cli>Her argument: high expectations, adult authority and personal responsibility are what disadvantaged pupils most need, and lowering standards out of sympathy does them harm.\u003c/li>\n\u003cli>Michaela has reported some of the highest Progress 8 scores in England in recent years, and has been judged outstanding by Ofsted.\u003c/li>\n\u003cli>Signature practices: silent corridors, a behaviour &#39;boot camp&#39; induction, demerits and same-day detentions, family lunch, drilling of knowledge, minimal written marking.\u003c/li>\n\u003cli>The model is the reference point for the English &#39;no excuses&#39; debate. Supporters see proof of what is possible; critics question transferability and the cost to pupil autonomy and inclusion.\u003c/li>\n\u003cli>Useful for leaders as a fully worked-out, internally consistent example, whether or not they would copy it.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Katharine Birbalsingh taught French in London secondary schools and wrote an anonymous blog about inner-city teaching. A speech at the 2010 Conservative Party conference criticising the state of English schools made her nationally known. She co-founded Michaela Community School in Wembley, north-west London, which opened in 2014, and remains its headmistress (DfE records, 2026). She was appointed CBE in 2020. She chaired the Social Mobility Commission from late 2021 and stepped down in January 2023, saying her profile as a commentator made the role difficult. In 2024 the High Court upheld the school&#39;s ban on prayer rituals after a challenge brought on behalf of a pupil. She is a frequent public commentator and has been a vocal critic of the Children&#39;s Wellbeing and Schools Act&#39;s changes to academy freedoms.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Authority and high expectations.\u003c/strong> Adults should be unapologetically in charge. Children, especially those with less structure elsewhere, benefit from clear boundaries enforced every time. Excusing poor behaviour or weak work because of a pupil&#39;s background is, in her view, a form of low expectation.\u003c/p>\n\u003cp>\u003cstrong>&#39;No excuses&#39; with warmth.\u003c/strong> Michaela describes its approach as strict and loving. Sanctions are immediate and certain; staff explain the reason and maintain the relationship. Pupils are taught that effort and choices, not circumstances, determine outcomes: the school&#39;s values stress hard work, kindness, gratitude and personal responsibility.\u003c/p>\n\u003cp>\u003cstrong>Culture built from detail.\u003c/strong> Published accounts of the school describe:\u003c/p>\n\u003cul>\n\u003cli>a week-long induction (&#39;boot camp&#39;) for new Year 7s teaching routines, from how to sit and track the speaker to how to move between lessons;\u003c/li>\n\u003cli>\u003cstrong>silent, single-file corridors\u003c/strong> to protect learning time and prevent bullying;\u003c/li>\n\u003cli>a merit and demerit system with same-day detentions for small infractions such as missing equipment or turning round;\u003c/li>\n\u003cli>\u003cstrong>family lunch\u003c/strong>, with pupils serving each other at set tables, a topic for discussion and public &#39;appreciations&#39;;\u003c/li>\n\u003cli>strict limits on mobile phones and strong advice to families about screen use.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Teacher-led, knowledge-rich teaching.\u003c/strong> Lessons are didactic: explanation, whole-class reading, questioning, choral response, frequent low-stakes quizzing and extended writing practice. Knowledge organisers and self-quizzing homework support memorisation. The curriculum is traditional and academic, influenced by E. D. Hirsch.\u003c/p>\n\u003cp>\u003cstrong>Workload by design.\u003c/strong> Shared resources and centrally planned curricula; no graded observations; little written marking, replaced by whole-class feedback; centralised detentions. Her claim is that simple systems allow teachers to teach well for longer.\u003c/p>\n\u003cp>\u003cstrong>Shared identity.\u003c/strong> She argues that schools in diverse communities should build common belonging and gratitude rather than emphasising group difference. This underlay the school&#39;s defence in the prayer case.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>To Miss with Love\u003c/em> (Penguin, 2011), a fictionalised diary based on her blog.\u003c/li>\n\u003cli>\u003cem>Battle Hymn of the Tiger Teachers: The Michaela Way\u003c/em> (editor; John Catt, 2016), chapters by Michaela staff on behaviour, teaching, marking and culture.\u003c/li>\n\u003cli>\u003cem>Michaela: The Power of Culture\u003c/em> (editor; John Catt, 2020).\u003c/li>\n\u003cli>Documentary: \u003cem>Britain&#39;s Strictest Headmistress\u003c/em> (ITV, 2022).\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>Few schools will adopt the whole model, and Birbalsingh herself warns against copying fragments without the underlying culture. Elements that leaders commonly adapt:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Induct deliberately.\u003c/strong> Spend the first days of Year 7 teaching routines and the reasons for them, with practice, before the timetable starts in earnest.\u003c/li>\n\u003cli>\u003cstrong>Explain the why.\u003c/strong> Michaela staff routinely give the reason with the correction. Example form of words: &#39;That&#39;s a demerit for turning round, because every second you miss is a second of learning you don&#39;t get back.&#39;\u003c/li>\n\u003cli>\u003cstrong>Make transitions calm.\u003c/strong> If not silent corridors, then supervised, one-way, brisk changeovers with staff at doors.\u003c/li>\n\u003cli>\u003cstrong>Use lunchtime as curriculum.\u003c/strong> Seated dining with adults, a conversation topic and a routine for thanks.\u003c/li>\n\u003cli>\u003cstrong>Cut marking.\u003c/strong> Read the books, note common errors, re-teach the next lesson.\u003c/li>\n\u003cli>\u003cstrong>Remove graded observations\u003c/strong> in favour of frequent, short, low-stakes drop-ins with one action step.\u003c/li>\n\u003cli>\u003cstrong>Check consistency ruthlessly.\u003c/strong> The model depends on every adult applying every routine. Leaders are constantly present in lessons and around the site.\u003c/li>\n\u003cli>\u003cstrong>Visit before you borrow.\u003c/strong> The school hosts visitors; seeing the whole system is more useful than reading about parts of it.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Too controlling.\u003c/strong> Critics, including teaching union voices and many progressive educators, argue that silent corridors, demerits for minor matters and high adult control restrict autonomy and do not prepare pupils for self-direction. Birbalsingh replies that structure is what frees pupils to learn and that visitors find the pupils happy and articulate.\u003c/li>\n\u003cli>\u003cstrong>&#39;No excuses&#39; evidence.\u003c/strong> US research on &#39;no excuses&#39; charter schools finds academic gains, alongside criticism (for example from Joanne Golann&#39;s ethnographic work) that rigid behavioural scripts can produce compliance rather than initiative. Some US networks have since softened their practices. Whether these findings transfer to England is debated.\u003c/li>\n\u003cli>\u003cstrong>Transferability and intake.\u003c/strong> Sceptics note that Michaela is a small school built from scratch, with a head of unusual profile, staff recruited to the ethos and families who choose it. Results are real, but that does not show the model would work if imposed on an existing school. Supporters note the intake is non-selective and disadvantaged.\u003c/li>\n\u003cli>\u003cstrong>Inclusion.\u003c/strong> Disability and SEND advocates question how far uniform routines can be adjusted for pupils with additional needs. The school says it makes adjustments while holding expectations.\u003c/li>\n\u003cli>\u003cstrong>Curriculum breadth.\u003c/strong> Some commentators argue the academic focus narrows the offer in creative and technical subjects. Not verified: the school&#39;s current options at key stage 4.\u003c/li>\n\u003cli>\u003cstrong>The prayer ruling.\u003c/strong> The 2024 High Court judgment found the ban lawful and proportionate in the school&#39;s circumstances. Critics, including some faith organisations, saw it as restricting religious freedom; supporters saw it as protecting a secular, cohesive ethos. It is a judgment on one school&#39;s facts, not a general rule.\u003c/li>\n\u003cli>\u003cstrong>Public commentary.\u003c/strong> Her political interventions divide opinion; this entry is concerned with the school model, which should be judged on its own terms.\u003c/li>\n\u003c/ul>\n","text":"At a glance Birbalsingh leads Michaela Community School, a free school opened in 2014 that combines very strict behaviour routines , teacher-led instruction and a knowledge-rich curriculum . Her argument: high expectations, adult authority and personal responsibility are what disadvantaged pupils most need, and lowering standards out of sympathy does them harm. Michaela has reported some of the highest Progress 8 scores in England in recent years, and has been judged outstanding by Ofsted. Signature practices: silent corridors, a behaviour 'boot camp' induction, demerits and same-day detentions, family lunch, drilling of knowledge, minimal written marking. The model is the reference point for the English 'no excuses' debate. Supporters see proof of what is possible; critics question transferability and the cost to pupil autonomy and inclusion. Useful for leaders as a fully worked-out, internally consistent example, whether or not they would copy it. Who they are Katharine Birbalsingh taught French in London secondary schools and wrote an anonymous blog about inner-city teaching. A speech at the 2010 Conservative Party conference criticising the state of English schools made her nationally known. She co-founded Michaela Community School in Wembley, north-west London, which opened in 2014, and remains its headmistress (DfE records, 2026). She was appointed CBE in 2020. She chaired the Social Mobility Commission from late 2021 and stepped down in January 2023, saying her profile as a commentator made the role difficult. In 2024 the High Court upheld the school's ban on prayer rituals after a challenge brought on behalf of a pupil. She is a frequent public commentator and has been a vocal critic of the Children's Wellbeing and Schools Act's changes to academy freedoms. Core ideas Authority and high expectations. Adults should be unapologetically in charge. Children, especially those with less structure elsewhere, benefit from clear boundaries enforced every time. Excusing poor behaviour or weak work because of a pupil's background is, in her view, a form of low expectation. 'No excuses' with warmth. Michaela describes its approach as strict and loving. Sanctions are immediate and certain; staff explain the reason and maintain the relationship. Pupils are taught that effort and choices, not circumstances, determine outcomes: the school's values stress hard work, kindness, gratitude and personal responsibility. Culture built from detail. Published accounts of the school describe: a week-long induction ('boot camp') for new Year 7s teaching routines, from how to sit and track the speaker to how to move between lessons; silent, single-file corridors to protect learning time and prevent bullying; a merit and demerit system with same-day detentions for small infractions such as missing equipment or turning round; family lunch , with pupils serving each other at set tables, a topic for discussion and public 'appreciations'; strict limits on mobile phones and strong advice to families about screen use. Teacher-led, knowledge-rich teaching. Lessons are didactic: explanation, whole-class reading, questioning, choral response, frequent low-stakes quizzing and extended writing practice. Knowledge organisers and self-quizzing homework support memorisation. The curriculum is traditional and academic, influenced by E. D. Hirsch. Workload by design. Shared resources and centrally planned curricula; no graded observations; little written marking, replaced by whole-class feedback; centralised detentions. Her claim is that simple systems allow teachers to teach well for longer. Shared identity. She argues that schools in diverse communities should build common belonging and gratitude rather than emphasising group difference. This underlay the school's defence in the prayer case. Key works To Miss with Love (Penguin, 2011), a fictionalised diary based on her blog. Battle Hymn of the Tiger Teachers: The Michaela Way (editor; John Catt, 2016), chapters by Michaela staff on behaviour, teaching, marking and culture. Michaela: The Power of Culture (editor; John Catt, 2020). Documentary: Britain's Strictest Headmistress (ITV, 2022). Putting it into practice Few schools will adopt the whole model, and Birbalsingh herself warns against copying fragments without the underlying culture. Elements that leaders commonly adapt: Induct deliberately. Spend the first days of Year 7 teaching routines and the reasons for them, with practice, before the timetable starts in earnest. Explain the why. Michaela staff routinely give the reason with the correction. Example form of words: 'That's a demerit for turning round, because every second you miss is a second of learning you don't get back.' Make transitions calm. If not silent corridors, then supervised, one-way, brisk changeovers with staff at doors. Use lunchtime as curriculum. Seated dining with adults, a conversation topic and a routine for thanks. Cut marking. Read the books, note common errors, re-teach the next lesson. Remove graded observations in favour of frequent, short, low-stakes drop-ins with one action step. Check consistency ruthlessly. The model depends on every adult applying every routine. Leaders are constantly present in lessons and around the site. Visit before you borrow. The school hosts visitors; seeing the whole system is more useful than reading about parts of it. Critiques and debate Too controlling. Critics, including teaching union voices and many progressive educators, argue that silent corridors, demerits for minor matters and high adult control restrict autonomy and do not prepare pupils for self-direction. Birbalsingh replies that structure is what frees pupils to learn and that visitors find the pupils happy and articulate. 'No excuses' evidence. US research on 'no excuses' charter schools finds academic gains, alongside criticism (for example from Joanne Golann's ethnographic work) that rigid behavioural scripts can produce compliance rather than initiative. Some US networks have since softened their practices. Whether these findings transfer to England is debated. Transferability and intake. Sceptics note that Michaela is a small school built from scratch, with a head of unusual profile, staff recruited to the ethos and families who choose it. Results are real, but that does not show the model would work if imposed on an existing school. Supporters note the intake is non-selective and disadvantaged. Inclusion. Disability and SEND advocates question how far uniform routines can be adjusted for pupils with additional needs. The school says it makes adjustments while holding expectations. Curriculum breadth. Some commentators argue the academic focus narrows the offer in creative and technical subjects. Not verified: the school's current options at key stage 4. The prayer ruling. The 2024 High Court judgment found the ban lawful and proportionate in the school's circumstances. Critics, including some faith organisations, saw it as restricting religious freedom; supporters saw it as protecting a secular, cohesive ethos. It is a judgment on one school's facts, not a general rule. Public commentary. Her political interventions divide opinion; this entry is concerned with the school model, which should be judged on its own terms."},{"slug":"keeping-children-safe-in-education","title":"Keeping children safe in education (KCSIE)","category":"safeguarding","type":"guidance","summary":"The statutory safeguarding guidance every school and college in England must have regard to. The 2026 edition, in force from 1 September 2026, is the largest rewrite for several years.","status":"Statutory guidance","evidence":"","tags":["kcsie","safeguarding","child protection","statutory guidance","dsl","governance"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"Keeping children safe in education 2026: Government consultation response","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6a4cc3467abea59ac13fd2a8/Keeping_children_safe_in_education_2026_Government_consultation_response.pdf"},{"title":"Keeping children safe in education (KCSIE) 2026: summary of changes (CASPAR briefing)","publisher":"NSPCC Learning","year":"2026","url":"https://learning.nspcc.org.uk/research-resources/schools/keeping-children-safe-in-education-caspar-briefing"},{"title":"Keeping children safe in education (KCSIE) 2026: key changes","publisher":"Farrer & Co","year":"2026","url":"https://www.farrer.co.uk/news-and-insights/keeping-children-safe-in-education-2026-a-practical-guide-for-schools/"}],"related":["working-together-to-safeguard-children","designated-safeguarding-lead","safer-recruitment-and-single-central-record","child-protection-policy-and-procedures"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>KCSIE is the DfE&#39;s statutory safeguarding guidance for schools and colleges in England. Governing bodies, proprietors and trusts \u003cstrong>must\u003c/strong> have regard to it.\u003c/li>\n\u003cli>The version in force is \u003cstrong>KCSIE 2026\u003c/strong>, effective from \u003cstrong>1 September 2026\u003c/strong>. It replaced KCSIE 2025, which had made only technical changes.\u003c/li>\n\u003cli>The 2026 edition was consulted on (February to April 2026), published in final form in July 2026 and is described by commentators as the most significant revision for several years.\u003c/li>\n\u003cli>The condensed annex that some staff could read instead of Part one has been withdrawn: all staff are now expected to read \u003cstrong>Part one in full\u003c/strong>.\u003c/li>\n\u003cli>Guidance on children questioning their gender is now inside KCSIE rather than a separate document.\u003c/li>\n\u003cli>Local procedures still apply: KCSIE sits alongside &#39;Working together to safeguard children&#39; and your local safeguarding partnership&#39;s arrangements.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cp>\u003cstrong>Who it applies to.\u003c/strong> Maintained schools, academies, free schools, independent schools, non-maintained special schools, pupil referral units, further education and sixth-form colleges, and other 16–19 providers covered by the guidance. It covers children up to 18.\u003c/p>\n\u003cp>\u003cstrong>Version.\u003c/strong> KCSIE 2026, in force 1 September 2026. A &#39;for information&#39; version was released in July 2026 so schools could prepare. Not verified: whether the DfE made any further corrections to the text after July; check the GOV.UK publication page for the update history before quoting paragraph numbers. Paragraph numbering in the final text differs from the consultation draft, so citations taken from spring 2026 commentary may be wrong.\u003c/p>\n\u003cp>\u003cstrong>Structure.\u003c/strong> Part one (information for all staff); Part two (the management of safeguarding); Part three (safer recruitment); Part four (allegations and low-level concerns about staff); Part five (child-on-child sexual violence and sexual harassment); annexes, including further information on specific harms, the DSL role description and a summary of changes. Annex letters have shifted from 2025, so check references carried over in old policies.\u003c/p>\n\u003cp>\u003cstrong>What changed in 2026\u003c/strong> (as reported in the DfE&#39;s summary of changes and the NSPCC and legal briefings; confirm detail against the text):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Part one for everyone.\u003c/strong> The condensed version of Part one is gone. A short overview may be used as a prompt but does not replace reading Part one.\u003c/li>\n\u003cli>\u003cstrong>Alignment with &#39;Working together&#39; 2026\u003c/strong>, including Family Help terminology and updated descriptions of abuse and neglect (for example, verbal abuse within emotional abuse).\u003c/li>\n\u003cli>\u003cstrong>Gender questioning children.\u003c/strong> A new section of roughly 30 paragraphs on requests for social transition, parental involvement and single-sex spaces.\u003c/li>\n\u003cli>\u003cstrong>Online safety and AI.\u003c/strong> New paragraphs on generative AI, explicit reference to deepfakes and &#39;nudification&#39; tools, mobile phone policy brought into the online safety content, and an expectation that filtering and monitoring is reviewed at least annually and the review documented.\u003c/li>\n\u003cli>\u003cstrong>DSL role.\u003c/strong> Stronger expectations on skills, experience and cover arrangements.\u003c/li>\n\u003cli>\u003cstrong>Alternative provision.\u003c/strong> More emphasis on due diligence and ongoing quality assurance of placements.\u003c/li>\n\u003cli>\u003cstrong>Safer recruitment.\u003c/strong> The definition of regulated activity is revised following the Crime and Policing Act 2026, which removes the &#39;supervision&#39; exemption, bringing more supervised volunteers into scope of barred-list checks. Not verified: the commencement date of that statutory change.\u003c/li>\n\u003cli>\u003cstrong>Other additions\u003c/strong> reported include prejudice-based harm, mental health support, young carers, premises, a revised serious violence section and notification about children in temporary accommodation.\u003c/li>\n\u003cli>\u003cstrong>Part five\u003c/strong> expanded, with terminology aligned to &#39;Behaviour in schools&#39;.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>Statutory duties sit in legislation (for example section 175 of the Education Act 2002 and the independent school standards); KCSIE explains how to meet them. Governing bodies and proprietors \u003cstrong>must\u003c/strong> have regard to the guidance, which means following it unless there is good reason not to. Within that framework KCSIE says schools \u003cstrong>should\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>ensure all staff read Part one, and that leaders and those working directly with children read the further-information annex;\u003c/li>\n\u003cli>appoint a senior leader as designated safeguarding lead with appropriate status, time and resources;\u003c/li>\n\u003cli>have an effective child protection policy, a staff behaviour policy (code of conduct) and arrangements for children who are absent from education;\u003c/li>\n\u003cli>operate safer recruitment and maintain the single central record (the record itself is a legal requirement);\u003c/li>\n\u003cli>have procedures for allegations and low-level concerns;\u003c/li>\n\u003cli>provide safeguarding training at induction with regular updates;\u003c/li>\n\u003cli>have appropriate filtering and monitoring.\u003c/li>\n\u003c/ul>\n\u003ch2>In practice\u003c/h2>\n\u003cp>\u003cstrong>Staff:\u003c/strong> read Part one, know the DSL and deputies, report every concern promptly and in writing, never promise confidentiality, and know that anyone can make a referral to children&#39;s social care.\u003c/p>\n\u003cp>\u003cstrong>DSLs:\u003c/strong> complete a gap analysis of policies, training and the single central record against the 2026 text; brief staff on what is new rather than re-issuing the whole document; keep evidence that staff have read and understood Part one.\u003c/p>\n\u003cp>\u003cstrong>Governors and trustees:\u003c/strong> ask for the gap analysis and action plan; check the child protection policy cites KCSIE 2026; test, do not just receive, assurance on filtering and monitoring, the single central record, alternative provision checks and volunteer checks.\u003c/p>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Policies that still cite an earlier edition, an old annex letter or superseded terminology.\u003c/li>\n\u003cli>Recording that staff have &#39;signed for&#39; KCSIE without checking understanding.\u003c/li>\n\u003cli>Treating &#39;should&#39; as optional: inspectors and reviewers expect a recorded rationale for any departure.\u003c/li>\n\u003cli>Relying on consultation-draft summaries for paragraph references.\u003c/li>\n\u003cli>Applying national guidance without the local partnership&#39;s thresholds and referral routes.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Read the DfE&#39;s own summary-of-changes annex first, then the NSPCC CASPAR briefing for a neutral digest. This entry is general information, not legal advice; follow your local safeguarding partnership&#39;s procedures.\u003c/p>\n","text":"At a glance KCSIE is the DfE's statutory safeguarding guidance for schools and colleges in England. Governing bodies, proprietors and trusts must have regard to it. The version in force is KCSIE 2026 , effective from 1 September 2026 . It replaced KCSIE 2025, which had made only technical changes. The 2026 edition was consulted on (February to April 2026), published in final form in July 2026 and is described by commentators as the most significant revision for several years. The condensed annex that some staff could read instead of Part one has been withdrawn: all staff are now expected to read Part one in full . Guidance on children questioning their gender is now inside KCSIE rather than a separate document. Local procedures still apply: KCSIE sits alongside 'Working together to safeguard children' and your local safeguarding partnership's arrangements. Status and current version Who it applies to. Maintained schools, academies, free schools, independent schools, non-maintained special schools, pupil referral units, further education and sixth-form colleges, and other 16–19 providers covered by the guidance. It covers children up to 18. Version. KCSIE 2026, in force 1 September 2026. A 'for information' version was released in July 2026 so schools could prepare. Not verified: whether the DfE made any further corrections to the text after July; check the GOV.UK publication page for the update history before quoting paragraph numbers. Paragraph numbering in the final text differs from the consultation draft, so citations taken from spring 2026 commentary may be wrong. Structure. Part one (information for all staff); Part two (the management of safeguarding); Part three (safer recruitment); Part four (allegations and low-level concerns about staff); Part five (child-on-child sexual violence and sexual harassment); annexes, including further information on specific harms, the DSL role description and a summary of changes. Annex letters have shifted from 2025, so check references carried over in old policies. What changed in 2026 (as reported in the DfE's summary of changes and the NSPCC and legal briefings; confirm detail against the text): Part one for everyone. The condensed version of Part one is gone. A short overview may be used as a prompt but does not replace reading Part one. Alignment with 'Working together' 2026 , including Family Help terminology and updated descriptions of abuse and neglect (for example, verbal abuse within emotional abuse). Gender questioning children. A new section of roughly 30 paragraphs on requests for social transition, parental involvement and single-sex spaces. Online safety and AI. New paragraphs on generative AI, explicit reference to deepfakes and 'nudification' tools, mobile phone policy brought into the online safety content, and an expectation that filtering and monitoring is reviewed at least annually and the review documented. DSL role. Stronger expectations on skills, experience and cover arrangements. Alternative provision. More emphasis on due diligence and ongoing quality assurance of placements. Safer recruitment. The definition of regulated activity is revised following the Crime and Policing Act 2026, which removes the 'supervision' exemption, bringing more supervised volunteers into scope of barred-list checks. Not verified: the commencement date of that statutory change. Other additions reported include prejudice-based harm, mental health support, young carers, premises, a revised serious violence section and notification about children in temporary accommodation. Part five expanded, with terminology aligned to 'Behaviour in schools'. What schools must do Statutory duties sit in legislation (for example section 175 of the Education Act 2002 and the independent school standards); KCSIE explains how to meet them. Governing bodies and proprietors must have regard to the guidance, which means following it unless there is good reason not to. Within that framework KCSIE says schools should : ensure all staff read Part one, and that leaders and those working directly with children read the further-information annex; appoint a senior leader as designated safeguarding lead with appropriate status, time and resources; have an effective child protection policy, a staff behaviour policy (code of conduct) and arrangements for children who are absent from education; operate safer recruitment and maintain the single central record (the record itself is a legal requirement); have procedures for allegations and low-level concerns; provide safeguarding training at induction with regular updates; have appropriate filtering and monitoring. In practice Staff: read Part one, know the DSL and deputies, report every concern promptly and in writing, never promise confidentiality, and know that anyone can make a referral to children's social care. DSLs: complete a gap analysis of policies, training and the single central record against the 2026 text; brief staff on what is new rather than re-issuing the whole document; keep evidence that staff have read and understood Part one. Governors and trustees: ask for the gap analysis and action plan; check the child protection policy cites KCSIE 2026; test, do not just receive, assurance on filtering and monitoring, the single central record, alternative provision checks and volunteer checks. Common pitfalls Policies that still cite an earlier edition, an old annex letter or superseded terminology. Recording that staff have 'signed for' KCSIE without checking understanding. Treating 'should' as optional: inspectors and reviewers expect a recorded rationale for any departure. Relying on consultation-draft summaries for paragraph references. Applying national guidance without the local partnership's thresholds and referral routes. Go deeper Read the DfE's own summary-of-changes annex first, then the NSPCC CASPAR briefing for a neutral digest. This entry is general information, not legal advice; follow your local safeguarding partnership's procedures."},{"slug":"ks3-assessment-after-levels","title":"Key Stage 3 assessment after levels","category":"assessment","type":"topic","summary":"National curriculum levels ended in 2014 and schools design their own Key Stage 3 assessment. Good systems assess the taught curriculum directly; weak ones recreate levels or stretch GCSE grades down to Year 7.","status":"Professional practice","evidence":"","tags":["key stage 3","assessment without levels","curriculum-related expectations","gcse grades","year 8 reading test"],"checked":"2026-11-12","sources":[{"title":"Commission on Assessment Without Levels: final report","publisher":"Department for Education","year":"2015","url":"https://www.gov.uk/government/publications/commission-on-assessment-without-levels-final-report"},{"title":"Commission on Assessment Without Levels: government response","publisher":"Department for Education","year":"2015","url":"https://www.gov.uk/government/publications/commission-on-assessment-without-levels-government-response"},{"title":"Teacher workload advisory group report and government response ('Making data work')","publisher":"Department for Education","year":"2018","url":"https://www.gov.uk/government/publications/teacher-workload-advisory-group-report-and-government-response"},{"title":"Curriculum and Assessment Review: key messages (HFL Education briefing slides)","publisher":"HFL Education","year":"2025","url":"https://www.hfleducation.org/sites/default/files/2025-11/slides-for-key-messages-post-publication-711-%28002%29.pdf"}],"related":["summative-assessment-and-data-collection","target-setting-and-flight-paths"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Levels were removed with the 2014 national curriculum. There is no statutory assessment at Key Stage 3 at present and no prescribed in-school system.\u003c/li>\n\u003cli>The Commission on Assessment Without Levels (chaired by John McIntosh, final report September 2015) gave principles, not a template: assessment should follow the curriculum, and schools should not rebuild levels.\u003c/li>\n\u003cli>The most common secondary response, GCSE grades 1–9 applied from Year 7, is widely criticised as invalid.\u003c/li>\n\u003cli>The stronger model: specify what pupils should know and be able to do in each unit, test that, and report scores against the year group.\u003c/li>\n\u003cli>Change is coming: after the Curriculum and Assessment Review (November 2025), the government announced a statutory Year 8 reading test and an expectation that schools assess writing and maths in Year 8. Check the latest DfE position before planning.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>Why levels went.\u003c/strong> The Commission and the earlier expert panel argued that levels:\u003c/p>\n\u003cul>\n\u003cli>encouraged pace through content over secure understanding;\u003c/li>\n\u003cli>relied on &quot;best fit&quot; judgements that hid serious gaps, so two pupils at the same level could know very different things;\u003c/li>\n\u003cli>were used for incompatible purposes (formative feedback, tracking, accountability), distorting each;\u003c/li>\n\u003cli>labelled pupils, who came to see themselves as &quot;a level 4&quot;.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>What the Commission advised.\u003c/strong> Decide the purpose of each assessment first. Keep formative assessment for teaching; do not log it in tracking systems. Make in-school summative assessment a periodic check on what has been taught. Avoid systems that count objectives ticked or assign pupils to bands at frequent intervals. The government accepted the report.\u003c/p>\n\u003cp>\u003cstrong>The &#39;curriculum is the progression model&#39; argument.\u003c/strong> Associated with Michael Fordham and Christine Counsell, and with Daisy Christodoulou&#39;s &#39;Making Good Progress?&#39; (2017): if the curriculum is well sequenced, making progress means learning that curriculum. Assessment should therefore check the specific content, using a &quot;quality&quot; model (judging complex performances such as essays) sparingly and a &quot;difficulty&quot; model (many specific questions) often. Christodoulou also argues that prose descriptors, whether levels or grade criteria, cannot define a standard reliably.\u003c/p>\n\u003cp>\u003cstrong>What schools actually did.\u003c/strong> NFER and others found many schools kept level-like systems: emerging/developing/secure/mastered bands, or GCSE grade flight paths. Not verified: the detailed NFER findings were not re-read for this entry.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Unit specification.\u003c/strong> For each Year 7–9 unit the department lists the core knowledge and the performances expected (for example in Year 8 geography: define and use 20 terms on rivers, explain three processes of erosion, interpret a hydrograph, write an extended answer on flood management).\u003c/li>\n\u003cli>\u003cstrong>Regular low-stakes checks\u003c/strong> of the core knowledge: quizzes, hinge questions. Scores stay with the teacher.\u003c/li>\n\u003cli>\u003cstrong>Common summative assessments\u003c/strong> once or twice a year, cumulative, mixing short-answer questions with one extended task. Report as a percentage alongside the year-group mean.\u003c/li>\n\u003cli>\u003cstrong>Extended performances\u003c/strong> (essay, practical write-up, composition, artwork) judged against annotated exemplars from the department rather than a generic grid; comparative judgement can help moderate.\u003c/li>\n\u003cli>\u003cstrong>In practical subjects\u003c/strong> (PE, music, DT, art), assess specified techniques and knowledge taught in the unit; avoid forcing a numerical scale onto half-termly lessons.\u003c/li>\n\u003cli>\u003cstrong>Reading and maths\u003c/strong> tracked with a standardised test once a year gives a national reference point that subject tests cannot.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Test any system with three questions: does it tell teachers what to reteach, does it tell parents something true and understandable, and what does it cost in time?\u003c/li>\n\u003cli>Let subjects differ. A common reporting language (percentage and year average; or a small number of bands derived from test scores at the end of the year) is enough.\u003c/li>\n\u003cli>Review Key Stage 3 assessments alongside curriculum plans in line management: are tests sampling what was taught, including earlier units?\u003c/li>\n\u003cli>\u003cstrong>Prepare for national change.\u003c/strong> The government&#39;s response to the Curriculum and Assessment Review (5 November 2025) said it would introduce a statutory reading test in Year 8 and expect schools to assess writing and maths in Year 8; the Review itself had recommended diagnostic assessment in English and maths in Year 8. Not verified: the test&#39;s start date, format, and whether results will be published or used in accountability, as of November 2026. A revised national curriculum is planned for first teaching from September 2028.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>GCSE grades at Key Stage 3.\u003c/strong> Grades describe performance across a whole GCSE specification at 16. A Year 7 &quot;grade 2&quot; in history has no defined meaning, invites flight paths, and tells pupils with low prior attainment they are failing for years. Ofqual grade descriptors were never designed for this use.\u003c/li>\n\u003cli>\u003cstrong>Levels by another name.\u003c/strong> &quot;Emerging, developing, secure, mastery&quot; bands, judged by best fit each half-term, reproduce the problems the Commission identified.\u003c/li>\n\u003cli>\u003cstrong>Tick-list tracking.\u003c/strong> Recording hundreds of objectives per pupil as met or not met is unreliable and heavy on workload.\u003c/li>\n\u003cli>\u003cstrong>Loss of a common language.\u003c/strong> Critics of the removal of levels point out that parents and receiving schools lost a shared scale and that schools were left to invent systems with little support; inconsistency between schools is the price of autonomy.\u003c/li>\n\u003cli>\u003cstrong>Percentages need context.\u003c/strong> A raw 55% means little without the cohort average and some sense of test difficulty; tests vary in difficulty from year to year.\u003c/li>\n\u003cli>\u003cstrong>National testing concerns.\u003c/strong> Unions and some commentators have warned that a statutory Year 8 test could narrow the Key Stage 3 curriculum or become an accountability measure.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Commission on Assessment Without Levels final report and government response (sources above).\u003c/li>\n\u003cli>Christodoulou, &#39;Making Good Progress?&#39; (2017); Tim Oates&#39;s short video explanation of why levels were removed (DfE, 2014).\u003c/li>\n\u003cli>See the curriculum-and-assessment-review entry for the latest on Year 8 assessment.\u003c/li>\n\u003c/ul>\n","text":"At a glance Levels were removed with the 2014 national curriculum. There is no statutory assessment at Key Stage 3 at present and no prescribed in-school system. The Commission on Assessment Without Levels (chaired by John McIntosh, final report September 2015) gave principles, not a template: assessment should follow the curriculum, and schools should not rebuild levels. The most common secondary response, GCSE grades 1–9 applied from Year 7, is widely criticised as invalid. The stronger model: specify what pupils should know and be able to do in each unit, test that, and report scores against the year group. Change is coming: after the Curriculum and Assessment Review (November 2025), the government announced a statutory Year 8 reading test and an expectation that schools assess writing and maths in Year 8. Check the latest DfE position before planning. What the evidence says Why levels went. The Commission and the earlier expert panel argued that levels: encouraged pace through content over secure understanding; relied on \"best fit\" judgements that hid serious gaps, so two pupils at the same level could know very different things; were used for incompatible purposes (formative feedback, tracking, accountability), distorting each; labelled pupils, who came to see themselves as \"a level 4\". What the Commission advised. Decide the purpose of each assessment first. Keep formative assessment for teaching; do not log it in tracking systems. Make in-school summative assessment a periodic check on what has been taught. Avoid systems that count objectives ticked or assign pupils to bands at frequent intervals. The government accepted the report. The 'curriculum is the progression model' argument. Associated with Michael Fordham and Christine Counsell, and with Daisy Christodoulou's 'Making Good Progress?' (2017): if the curriculum is well sequenced, making progress means learning that curriculum. Assessment should therefore check the specific content, using a \"quality\" model (judging complex performances such as essays) sparingly and a \"difficulty\" model (many specific questions) often. Christodoulou also argues that prose descriptors, whether levels or grade criteria, cannot define a standard reliably. What schools actually did. NFER and others found many schools kept level-like systems: emerging/developing/secure/mastered bands, or GCSE grade flight paths. Not verified: the detailed NFER findings were not re-read for this entry. In the classroom Unit specification. For each Year 7–9 unit the department lists the core knowledge and the performances expected (for example in Year 8 geography: define and use 20 terms on rivers, explain three processes of erosion, interpret a hydrograph, write an extended answer on flood management). Regular low-stakes checks of the core knowledge: quizzes, hinge questions. Scores stay with the teacher. Common summative assessments once or twice a year, cumulative, mixing short-answer questions with one extended task. Report as a percentage alongside the year-group mean. Extended performances (essay, practical write-up, composition, artwork) judged against annotated exemplars from the department rather than a generic grid; comparative judgement can help moderate. In practical subjects (PE, music, DT, art), assess specified techniques and knowledge taught in the unit; avoid forcing a numerical scale onto half-termly lessons. Reading and maths tracked with a standardised test once a year gives a national reference point that subject tests cannot. For leaders Test any system with three questions: does it tell teachers what to reteach, does it tell parents something true and understandable, and what does it cost in time? Let subjects differ. A common reporting language (percentage and year average; or a small number of bands derived from test scores at the end of the year) is enough. Review Key Stage 3 assessments alongside curriculum plans in line management: are tests sampling what was taught, including earlier units? Prepare for national change. The government's response to the Curriculum and Assessment Review (5 November 2025) said it would introduce a statutory reading test in Year 8 and expect schools to assess writing and maths in Year 8; the Review itself had recommended diagnostic assessment in English and maths in Year 8. Not verified: the test's start date, format, and whether results will be published or used in accountability, as of November 2026. A revised national curriculum is planned for first teaching from September 2028. Cautions and critiques GCSE grades at Key Stage 3. Grades describe performance across a whole GCSE specification at 16. A Year 7 \"grade 2\" in history has no defined meaning, invites flight paths, and tells pupils with low prior attainment they are failing for years. Ofqual grade descriptors were never designed for this use. Levels by another name. \"Emerging, developing, secure, mastery\" bands, judged by best fit each half-term, reproduce the problems the Commission identified. Tick-list tracking. Recording hundreds of objectives per pupil as met or not met is unreliable and heavy on workload. Loss of a common language. Critics of the removal of levels point out that parents and receiving schools lost a shared scale and that schools were left to invent systems with little support; inconsistency between schools is the price of autonomy. Percentages need context. A raw 55% means little without the cohort average and some sense of test difficulty; tests vary in difficulty from year to year. National testing concerns. Unions and some commentators have warned that a statutory Year 8 test could narrow the Key Stage 3 curriculum or become an accountability measure. Go deeper Commission on Assessment Without Levels final report and government response (sources above). Christodoulou, 'Making Good Progress?' (2017); Tim Oates's short video explanation of why levels were removed (DfE, 2014). See the curriculum-and-assessment-review entry for the latest on Year 8 assessment."},{"slug":"lee-canter","title":"Lee Canter","category":"thinkers","type":"person","summary":"American originator, with Marlene Canter, of Assertive Discipline (1976): clear rules, positive recognition and a fixed hierarchy of consequences. The ancestor of the warning-and-consequence ladders used in many English secondary schools.","status":"Thinker profile","evidence":"","tags":["behaviour","assertive discipline","consequences","rules","rewards and sanctions","history of ideas"],"checked":"2026-11-12","sources":[{"title":"Order in the Classroom (feature on Assertive Discipline and its critics)","publisher":"Education Week","year":"1990","url":"https://www.edweek.org/education/order-in-the-classroom/1990/04"},{"title":"What Research Really Shows About Assertive Discipline (Render, Padilla and Krank)","publisher":"ASCD, Educational Leadership","year":"1989","url":"https://files.ascd.org/staticfiles/ascd/pdf/journals/ed_lead/el_198903_render.pdf"},{"title":"Assertive Discipline (overview of the model)","publisher":"University of North Carolina at Greensboro","year":"Not verified","url":"https://uncg.edu/~bblevin/class_management/models/ad.html"},{"title":"Broken Records, Broken Spirits","publisher":"Rethinking Schools","year":"Not verified","url":"https://rethinkingschools.org/articles/broken-records-broken-spirits"}],"related":["bill-rogers","paul-dix","tom-bennett"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Assertive Discipline is the source of the \u003cstrong>rules + recognition + stepped consequences\u003c/strong> model that most secondary behaviour policies still follow (C1, C2, C3 and so on).\u003c/li>\n\u003cli>Its premise: teachers have a \u003cstrong>right to teach\u003c/strong> and pupils a \u003cstrong>right to learn\u003c/strong>, and no pupil may be allowed to prevent either.\u003c/li>\n\u003cli>The teacher states expectations clearly, recognises pupils who meet them, and applies a \u003cstrong>pre-published hierarchy of consequences\u003c/strong> calmly and consistently.\u003c/li>\n\u003cli>Canter distinguished \u003cstrong>assertive\u003c/strong> teachers from \u003cstrong>non-assertive\u003c/strong> (passive, pleading) and \u003cstrong>hostile\u003c/strong> (angry, sarcastic) ones.\u003c/li>\n\u003cli>Later versions put much more weight on positive recognition, teaching routines and relationships, and dropped public devices such as names on the board.\u003c/li>\n\u003cli>The research base is thin and the approach has been heavily criticised as controlling. Know it because your policy probably descends from it, and so you can spot its weaknesses.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Lee Canter is an American educator and trainer whose background was in social work and child guidance. With Marlene Canter, a former special education teacher, he published \u003cem>Assertive Discipline\u003c/em> in 1976 and built a training company around it. Education Week reported that by 1989 some 500,000 teachers had been trained, making it probably the most widely used packaged discipline programme in American schools. It was imported into the UK in the early 1990s through commercial training and was widely adopted in English schools. Canter continued to revise the model over several decades and later worked on real-time classroom coaching (not verified: details of his later roles and organisations).\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Rights.\u003c/strong> The teacher has the right to set the limits of the classroom, to expect pupils to follow them and to receive backing from school leaders and parents. Pupils have the right to a teacher who sets firm, consistent limits, gives positive encouragement and tells them clearly what is expected.\u003c/p>\n\u003cp>\u003cstrong>Three response styles.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Non-assertive\u003c/em>: vague, pleading or inconsistent (&#39;Will you please try to settle down?&#39;); threats that are not followed through.\u003c/li>\n\u003cli>\u003cem>Hostile\u003c/em>: shouting, sarcasm, put-downs, sanctions out of proportion. Gets short-term compliance at the cost of relationships.\u003c/li>\n\u003cli>\u003cem>Assertive\u003c/em>: states clearly and calmly what is wanted, and backs words with action, whether recognition or consequence.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The classroom discipline plan.\u003c/strong> Three parts, taught to pupils and shared with parents and leaders:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Rules\u003c/strong>: a small number, observable and applying at all times (for example &#39;Follow directions the first time they are given&#39;).\u003c/li>\n\u003cli>\u003cstrong>Positive recognition\u003c/strong>: praise, positive notes and calls home, privileges and class-wide rewards for those who follow the rules.\u003c/li>\n\u003cli>\u003cstrong>Consequences\u003c/strong>: a hierarchy of four or five steps for breaking a rule within a day or lesson. Typically: warning; a short penalty such as a minute after class; a longer one; contact with parents; referral to a senior colleague. A &#39;severe clause&#39; allows immediate removal for serious behaviour. Each lesson or day starts afresh.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Consequences as choice.\u003c/strong> The teacher frames sanctions as the pupil&#39;s choice: the rule and consequence were known in advance. This is intended to remove emotion and argument from the exchange.\u003c/p>\n\u003cp>\u003cstrong>Techniques.\u003c/strong> Canter popularised several moves now part of general classroom craft:\u003c/p>\n\u003cul>\n\u003cli>the \u003cstrong>broken record\u003c/strong>: calmly repeating the direction rather than being drawn into debate;\u003c/li>\n\u003cli>\u003cstrong>positive repetition\u003c/strong> (later called behavioural narration): after giving a direction, name pupils who are following it before correcting those who are not;\u003c/li>\n\u003cli>specific directions for each activity: what pupils should be doing, at what noise level, with what movement;\u003c/li>\n\u003cli>\u003cstrong>proximity\u003c/strong> and a quiet word at the desk in place of public reprimand.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Later revisions.\u003c/strong> In response to criticism, later editions told teachers to \u003cstrong>teach\u003c/strong> the plan and specific routines explicitly, to keep recognition well ahead of consequences, to build relationships with the hardest pupils through one-to-one conversations and individual plans, and to stop writing names on the board. Education Week quoted Canter in 1990 saying he no longer advocated that practice.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>Assertive Discipline: A Take-Charge Approach for Today&#39;s Educator\u003c/em>, with Marlene Canter (1976).\u003c/li>\n\u003cli>\u003cem>Assertive Discipline: Positive Behavior Management for Today&#39;s Classroom\u003c/em>, with Marlene Canter (revised editions from 1992; a fourth edition was published by Solution Tree around 2010; edition years not verified).\u003c/li>\n\u003cli>\u003cem>Succeeding with Difficult Students\u003c/em>, with Marlene Canter (1993; year not verified).\u003c/li>\n\u003cli>\u003cem>Classroom Management for Academic Success\u003c/em> (2006; year not verified).\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>Few English schools use &#39;Assertive Discipline&#39; by name now, but its structure is everywhere. To use the sound parts well:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Give directions that can be followed.\u003c/strong> Before any activity, specify what to do, how much talk and what movement: &#39;Working on questions 1 to 5, in silence, hands up if you need me.&#39;\u003c/li>\n\u003cli>\u003cstrong>Narrate before you correct.\u003c/strong> &#39;Aisha has started. Table two are all writing.&#39; Then deal privately with those who have not begun.\u003c/li>\n\u003cli>\u003cstrong>Use the assertive register.\u003c/strong> Say what you want as a statement, not a question or plea. Calm voice, name, direction: &#39;Liam, I need you facing the front.&#39;\u003c/li>\n\u003cli>\u003cstrong>Do not argue.\u003c/strong> Repeat the direction once or twice (the broken record), then state the choice and move away.\u003c/li>\n\u003cli>\u003cstrong>Apply the ladder mechanically, not emotionally.\u003c/strong> Same steps for every pupil, in order; warn privately where you can; never skip steps in anger or add extras.\u003c/li>\n\u003cli>\u003cstrong>Keep the ratio positive.\u003c/strong> Canter&#39;s later guidance was that recognition should far outweigh consequences. Make positive contact home routine.\u003c/li>\n\u003cli>\u003cstrong>Fresh start.\u003c/strong> Do not carry yesterday&#39;s tally into today.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>For leaders reviewing a consequence ladder\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Is it short enough to remember and used the same way in every room?\u003c/li>\n\u003cli>Does it include teaching of routines and positive recognition, or only sanctions?\u003c/li>\n\u003cli>What happens for pupils who reach the top repeatedly? A ladder alone will not change them; Canter&#39;s later work said these pupils need individual plans and relationships.\u003c/li>\n\u003cli>Are warnings public (names on boards) or private? Remove public shaming devices.\u003c/li>\n\u003cli>Are reasonable adjustments built in for pupils with SEND, as the Equality Act requires?\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Weak evidence.\u003c/strong> Render, Padilla and Krank (Educational Leadership, 1989) reviewed the research and concluded that the effectiveness claims made for the programme were not supported by the small body of studies available. Canter disputed this, saying critics attended to only parts of the model.\u003c/li>\n\u003cli>\u003cstrong>Obedience, not responsibility.\u003c/strong> Curwin and Mendler, and later Alfie Kohn, argued that the approach produces compliance through rewards and punishments without developing pupils&#39; own judgement or addressing why they misbehave. Rethinking Schools published a similar critique from a classroom teacher&#39;s perspective.\u003c/li>\n\u003cli>\u003cstrong>Public shaming.\u003c/strong> Names and ticks on the board were criticised (Education Week cites Linda Darling-Hammond) as potentially harmful; Canter dropped the practice.\u003c/li>\n\u003cli>\u003cstrong>UK debate.\u003c/strong> British educational psychologists argued both sides in the 1990s: some described it as a dated, behaviourist import, others reported improved on-task behaviour in schools using it (journal exchange in \u003cem>Educational Psychology in Practice\u003c/em>, mid-1990s; not opened for this entry).\u003c/li>\n\u003cli>\u003cstrong>Rigidity and inclusion.\u003c/strong> A fixed hierarchy treats all pupils alike. Critics argue this penalises pupils with additional needs; the model&#39;s defenders say consistency is what makes it fair.\u003c/li>\n\u003cli>\u003cstrong>Legacy.\u003c/strong> Later writers build on or react against it. Bill Rogers keeps the clarity but adds a less intrusive, more conversational repertoire; Paul Dix rejects escalating ladders in favour of scripts and restorative follow-up; Doug Lemov and Tom Bennett retain consequences but place far more weight on taught routines and culture.\u003c/li>\n\u003c/ul>\n","text":"At a glance Assertive Discipline is the source of the rules + recognition + stepped consequences model that most secondary behaviour policies still follow (C1, C2, C3 and so on). Its premise: teachers have a right to teach and pupils a right to learn , and no pupil may be allowed to prevent either. The teacher states expectations clearly, recognises pupils who meet them, and applies a pre-published hierarchy of consequences calmly and consistently. Canter distinguished assertive teachers from non-assertive (passive, pleading) and hostile (angry, sarcastic) ones. Later versions put much more weight on positive recognition, teaching routines and relationships, and dropped public devices such as names on the board. The research base is thin and the approach has been heavily criticised as controlling. Know it because your policy probably descends from it, and so you can spot its weaknesses. Who they are Lee Canter is an American educator and trainer whose background was in social work and child guidance. With Marlene Canter, a former special education teacher, he published Assertive Discipline in 1976 and built a training company around it. Education Week reported that by 1989 some 500,000 teachers had been trained, making it probably the most widely used packaged discipline programme in American schools. It was imported into the UK in the early 1990s through commercial training and was widely adopted in English schools. Canter continued to revise the model over several decades and later worked on real-time classroom coaching (not verified: details of his later roles and organisations). Core ideas Rights. The teacher has the right to set the limits of the classroom, to expect pupils to follow them and to receive backing from school leaders and parents. Pupils have the right to a teacher who sets firm, consistent limits, gives positive encouragement and tells them clearly what is expected. Three response styles. Non-assertive : vague, pleading or inconsistent ('Will you please try to settle down?'); threats that are not followed through. Hostile : shouting, sarcasm, put-downs, sanctions out of proportion. Gets short-term compliance at the cost of relationships. Assertive : states clearly and calmly what is wanted, and backs words with action, whether recognition or consequence. The classroom discipline plan. Three parts, taught to pupils and shared with parents and leaders: Rules : a small number, observable and applying at all times (for example 'Follow directions the first time they are given'). Positive recognition : praise, positive notes and calls home, privileges and class-wide rewards for those who follow the rules. Consequences : a hierarchy of four or five steps for breaking a rule within a day or lesson. Typically: warning; a short penalty such as a minute after class; a longer one; contact with parents; referral to a senior colleague. A 'severe clause' allows immediate removal for serious behaviour. Each lesson or day starts afresh. Consequences as choice. The teacher frames sanctions as the pupil's choice: the rule and consequence were known in advance. This is intended to remove emotion and argument from the exchange. Techniques. Canter popularised several moves now part of general classroom craft: the broken record : calmly repeating the direction rather than being drawn into debate; positive repetition (later called behavioural narration): after giving a direction, name pupils who are following it before correcting those who are not; specific directions for each activity: what pupils should be doing, at what noise level, with what movement; proximity and a quiet word at the desk in place of public reprimand. Later revisions. In response to criticism, later editions told teachers to teach the plan and specific routines explicitly, to keep recognition well ahead of consequences, to build relationships with the hardest pupils through one-to-one conversations and individual plans, and to stop writing names on the board. Education Week quoted Canter in 1990 saying he no longer advocated that practice. Key works Assertive Discipline: A Take-Charge Approach for Today's Educator , with Marlene Canter (1976). Assertive Discipline: Positive Behavior Management for Today's Classroom , with Marlene Canter (revised editions from 1992; a fourth edition was published by Solution Tree around 2010; edition years not verified). Succeeding with Difficult Students , with Marlene Canter (1993; year not verified). Classroom Management for Academic Success (2006; year not verified). Putting it into practice Few English schools use 'Assertive Discipline' by name now, but its structure is everywhere. To use the sound parts well: Give directions that can be followed. Before any activity, specify what to do, how much talk and what movement: 'Working on questions 1 to 5, in silence, hands up if you need me.' Narrate before you correct. 'Aisha has started. Table two are all writing.' Then deal private
