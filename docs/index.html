onable support: free recall and short-answer formats are generally at least as effective as multiple choice; feedback increases the benefit, especially when recall fails; and retrieval combined with spacing is stronger than either alone. In the classroom Starter quiz with a spread of content. Six questions: two from last lesson, two from last unit, two from last year. Pupils answer in silence from memory, then self-mark in a different colour. Keep it to about five to eight minutes including feedback. Everyone retrieves. Mini-whiteboards or written answers, not hands up. One pupil answering aloud means one pupil retrieving. Brain dumps. 'Write everything you remember about the causes of the First World War in four minutes', then compare with the knowledge organiser and add what was missed in another colour. Vary the demand. Move beyond definitions: 'Give two differences between mitosis and meiosis', 'Which of these three quotations best shows Macbeth's guilt, and why?', a labelled diagram from memory, a five-step maths problem from last term. Use the results. If half the class miss a question, reteach it and put it in next week's quiz. A quiz whose results change nothing is a ritual. Aim for high, not perfect, success. If most pupils score under half, the gap since teaching was too long or the first teaching was not secure: reteach rather than re-quiz. Teach pupils to do it themselves. Flashcards used properly (answer before turning, shuffle, separate known from unknown), 'look, cover, write, check', and past questions from memory. Model this explicitly from Year 7; do not assume it by Year 11. For leaders Make retrieval a curriculum decision : departments should specify what knowledge must be retained and when it will be revisited. Otherwise quizzes default to last lesson's trivia. Avoid mandating a format ('five-a-day in every lesson'). The 2021 review suggests format matters less than regular, well-targeted use; PE, art and drama need their own versions. Do not collect quiz scores centrally. Recording turns a low-stakes learning activity into a high-stakes assessment and adds workload. Shared, pre-written quiz banks per unit are the main workload saver. Include study-skills teaching for pupils and information for parents on why self-testing beats re-reading. Cautions and critiques Lab-to-classroom transfer. The EEF review's central caution: effects demonstrated with word lists or short texts over days do not guarantee the same gains from teacher-made quizzes across a GCSE course. Shallow recall. Quizzing isolated facts can crowd out connected explanation. Evidence that retrieval of facts transfers to new, inferential questions is mixed. Lethal mutation. A ten-minute starter, unrelated to the lesson, eating a sixth of curriculum time, with no feedback and no reteaching. Low success demotivates. Pupils who repeatedly fail quizzes, including some with SEND or large knowledge gaps, may gain little without cues, scaffolds or reteaching. Effect-size comparisons across such varied studies have been criticised, a limitation Tes's coverage of the 2021 review also notes. Anxiety. Keep stakes genuinely low; evidence suggests routine low-stakes quizzing tends to reduce test anxiety over time, but public scoring can do the opposite. Go deeper Dunlosky's shorter article for teachers, 'Strengthening the Student Toolbox' ( American Educator , 2013), is the best quick read. RetrievalPractice.org hosts the 2021 review database and free guides. Kate Jones's Retrieval Practice books give many secondary classroom formats. See the entries on low-stakes quizzing, spaced and interleaved practice and desirable difficulties."},{"slug":"robert-and-elizabeth-bjork","title":"Robert and Elizabeth Bjork","category":"thinkers","type":"person","summary":"UCLA cognitive psychologists behind 'desirable difficulties' and the distinction between storage strength and retrieval strength: why spacing, interleaving and testing feel harder but produce more durable learning.","status":"Thinker profile","evidence":"","tags":["desirable difficulties","memory","spacing","interleaving","retrieval practice","learning versus performance"],"checked":"2026-11-12","sources":[{"title":"Desirable Difficulties in Theory and Practice (Bjork and Bjork, Journal of Applied Research in Memory and Cognition, 2020)","publisher":"Bjork Learning and Forgetting Lab, UCLA","year":"2020","url":"https://bjorklab.psych.ucla.edu/wp-content/uploads/sites/13/2021/01/RABjorkELBjorkJARMAC2020ForPostingSingleSpaced.pdf"},{"title":"Psychology professors Robert and Elizabeth Bjork: pioneers in memory and learning research","publisher":"UCLA Division of Life Sciences","year":"2021","url":"https://lifesciences.ucla.edu/2021/07/psychology-professors-robert-and-elizabeth-bjork-pioneers-in-memory-and-learning-research"},{"title":"Meet the Bjorks: the research legacy teachers must know","publisher":"Tes","year":"Not verified","url":"https://www.tes.com/magazine/teaching-learning/general/meet-bjorks-research-legacy-teachers-must-know"},{"title":"Introducing desirable difficulties into practice and instruction (Bjork and Bjork)","publisher":"University of New Hampshire Teaching and Learning Resource Hub (hosted copy)","year":"2023","url":"https://www.unh.edu/teaching-learning-resource-hub/sites/default/files/media/2023-06/itow-introducing-desirable-difficulties-into-practice-and-instruction-bjork-and-bjork.pdf"}],"related":["desirable-difficulties","retrieval-practice","spaced-and-interleaved-practice","cognitive-load-theory","john-sweller"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Performance during a lesson is an unreliable guide to learning. Conditions that produce quick, smooth performance often produce poor long-term retention, and the reverse.\u003c/li>\n\u003cli>&#39;Desirable difficulties&#39; are challenges that slow apparent progress but strengthen memory: spacing, interleaving, retrieval, generation and variation.\u003c/li>\n\u003cli>A difficulty is desirable only if the learner can overcome it. Without the necessary prior knowledge it is just a difficulty.\u003c/li>\n\u003cli>Memories have two strengths: storage strength (how well learned) and retrieval strength (how accessible right now). Some forgetting makes relearning more powerful.\u003c/li>\n\u003cli>Pupils, and teachers, misjudge what works. Rereading and massed practice feel effective because they feel fluent.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Robert A. Bjork is distinguished research professor of psychology at the University of California, Los Angeles (UCLA). Elizabeth Ligon Bjork is professor of psychology at UCLA. They have collaborated for decades and jointly run the Bjork Learning and Forgetting Lab. Both have held senior roles in American psychological science; Robert Bjork is a past president of the Association for Psychological Science and chaired a US National Research Council committee on techniques for enhancing human performance. Their former students and collaborators, such as Nate Kornell, include many of the researchers behind the modern literature on spacing, interleaving and metacognition.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Learning versus performance.\u003c/strong> Learning is a relatively permanent change in knowledge or understanding that supports long-term retention and transfer. Performance is what can be observed during or immediately after instruction. Soderstrom and Robert Bjork&#39;s 2015 review collected evidence from motor and verbal learning that the two can dissociate: substantial learning can occur with no visible improvement, and impressive performance in the lesson can leave little lasting trace. The implication is that &#39;they could all do it by the end of the lesson&#39; proves little.\u003c/p>\n\u003cp>\u003cstrong>The new theory of disuse (1992).\u003c/strong> Each memory has:\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Storage strength\u003c/em>: how thoroughly it is embedded and connected with other knowledge. It accumulates and, in the theory, is not lost.\u003c/li>\n\u003cli>\u003cem>Retrieval strength\u003c/em>: how easily it can be accessed now. It rises with recent study and decays with disuse and interference.\u003c/li>\n\u003c/ul>\n\u003cp>Key predictions: retrieval capacity is limited, storage is not. The lower the current retrieval strength, the bigger the gain in storage strength from a successful retrieval or restudy. So allowing some forgetting, and then retrieving with effort, builds more durable memory than revisiting material while it is still fresh. Forgetting, on this view, is a helpful feature of memory, not just a failure.\u003c/p>\n\u003cp>\u003cstrong>Desirable difficulties.\u003c/strong> Robert Bjork introduced the term in 1994. The main ones:\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Spacing\u003c/em>: distributing study or practice over time instead of massing it.\u003c/li>\n\u003cli>\u003cem>Interleaving\u003c/em>: mixing topics or problem types instead of blocking them. Kornell and Bjork (2008) found that interleaving paintings by different artists improved learning of each artist&#39;s style, even though most participants believed blocking had worked better.\u003c/li>\n\u003cli>\u003cem>Retrieval practice (testing)\u003c/em>: using tests as learning events, not only as assessments.\u003c/li>\n\u003cli>\u003cem>Generation\u003c/em>: producing an answer or solution instead of being shown it. This includes pretesting: attempting questions before being taught can improve later learning of the material even when the attempts are wrong.\u003c/li>\n\u003cli>\u003cem>Varying the conditions of practice\u003c/em>: changing context, format or examples instead of keeping practice constant and predictable.\u003c/li>\n\u003cli>\u003cem>Reducing or delaying feedback\u003c/em> in some circumstances, so that learners do not become dependent on it.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The qualifier.\u003c/strong> The word &#39;desirable&#39; matters. A difficulty helps only when it triggers processing that supports learning and when the learner has the background knowledge to respond successfully. Elizabeth and Robert Bjork have repeatedly stressed that not all difficulties are desirable.\u003c/p>\n\u003cp>\u003cstrong>Metacognitive illusions.\u003c/strong> Learners judge learning by fluency. Rereading notes, highlighting and cramming create a sense of familiarity that is mistaken for knowledge. With Dunlosky and Kornell (2013), Robert Bjork argued that becoming an effective learner means understanding these illusions and choosing harder strategies.\u003c/p>\n\u003cp>\u003cstrong>Elizabeth Bjork&#39;s contributions.\u003c/strong> With Michael Anderson and Robert Bjork she established retrieval-induced forgetting: retrieving some items can reduce access to related, unretrieved items. With Jeri Little and others she showed that well-built multiple-choice questions, with plausible competing options, can strengthen memory for the rejected alternatives as well as the correct answer.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>&#39;A new theory of disuse and an old theory of stimulus fluctuation&#39; (Bjork and Bjork, 1992)\u003c/li>\n\u003cli>&#39;Memory and metamemory considerations in the training of human beings&#39; (R. Bjork, 1994)\u003c/li>\n\u003cli>&#39;Learning concepts and categories: is spacing the &quot;enemy of induction&quot;?&#39; (Kornell and Bjork, 2008)\u003c/li>\n\u003cli>&#39;Making things hard on yourself, but in a good way: creating desirable difficulties to enhance learning&#39; (Bjork and Bjork, 2011)\u003c/li>\n\u003cli>&#39;Self-regulated learning: beliefs, techniques, and illusions&#39; (Bjork, Dunlosky and Kornell, 2013)\u003c/li>\n\u003cli>&#39;Learning versus performance: an integrative review&#39; (Soderstrom and Bjork, 2015)\u003c/li>\n\u003cli>&#39;Desirable difficulties in theory and practice&#39; (Bjork and Bjork, 2020)\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>For a classroom teacher:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Quiz on last week, last month and last term\u003c/strong>, not only last lesson. Expect lower scores and tell pupils why that is useful.\u003c/li>\n\u003cli>\u003cstrong>Mix practice once the basics are secure.\u003c/strong> Block when first teaching a method; then set mixed exercises in which pupils must decide which method applies.\u003c/li>\n\u003cli>\u003cstrong>Leave gaps before returning.\u003c/strong> Revisit a topic after pupils have begun to forget it, and build this into homework and starters.\u003c/li>\n\u003cli>\u003cstrong>Ask before you tell.\u003c/strong> A short pre-question or prediction before an explanation costs little and can prime learning.\u003c/li>\n\u003cli>\u003cstrong>Write multiple-choice questions with plausible distractors\u003c/strong> so that pupils have to think about why each is wrong.\u003c/li>\n\u003cli>\u003cstrong>Teach pupils the science.\u003c/strong> Explain that self-testing and spaced revision feel worse than rereading but work better. Do this explicitly in Years 10 to 13.\u003c/li>\n\u003c/ul>\n\u003cp>For leaders:\u003c/p>\n\u003cul>\n\u003cli>Be cautious about judging learning from a single lesson observation or from pupils&#39; fluency in the lesson. Look at retention over time.\u003c/li>\n\u003cli>Design schemes of work and homework to revisit content at intervals, and assessments to be cumulative.\u003c/li>\n\u003cli>Make sure retrieval practice is low-stakes and does not become a daily ritual of the same easy questions.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Laboratory evidence.\u003c/strong> Much of the research uses university students, word pairs or short texts, and retention intervals of days. Classroom studies exist, particularly in mathematics for interleaving and spacing, but are fewer, and effects in school trials tend to be smaller than in the lab.\u003c/li>\n\u003cli>\u003cstrong>Tension with cognitive load theory.\u003c/strong> John Sweller&#39;s work recommends reducing load for novices; the Bjorks recommend adding certain difficulties. Researchers on both sides have suggested that the two apply to different situations: reduce load when material is complex and new, add difficulty when it is within reach. Where exactly the boundary lies is unsettled.\u003c/li>\n\u003cli>\u003cstrong>Interleaving has limits.\u003c/strong> Reviews (for example Brunmair and Richter, 2019) find that benefits depend on the material: strongest when categories are easily confused, weak or negative for some verbal materials and for learners with low prior knowledge.\u003c/li>\n\u003cli>\u003cstrong>Pretesting and generation with novices.\u003c/strong> Errors generated without enough knowledge may waste time or demotivate; evidence that such errors are harmless comes mostly from settings with prompt feedback.\u003c/li>\n\u003cli>\u003cstrong>Motivation.\u003c/strong> Pupils who experience difficulty as failure may disengage. Teachers need to manage success rates and explain the purpose, a point the Bjorks acknowledge.\u003c/li>\n\u003cli>\u003cstrong>Implementation drift.\u003c/strong> In English schools, &#39;retrieval practice&#39; has sometimes become a compliance routine of factual starter quizzes; this is a criticism of the application, made by writers such as Kate Jones and Tom Sherrington, not of the underlying research.\u003c/li>\n\u003c/ul>\n","text":"At a glance Performance during a lesson is an unreliable guide to learning. Conditions that produce quick, smooth performance often produce poor long-term retention, and the reverse. 'Desirable difficulties' are challenges that slow apparent progress but strengthen memory: spacing, interleaving, retrieval, generation and variation. A difficulty is desirable only if the learner can overcome it. Without the necessary prior knowledge it is just a difficulty. Memories have two strengths: storage strength (how well learned) and retrieval strength (how accessible right now). Some forgetting makes relearning more powerful. Pupils, and teachers, misjudge what works. Rereading and massed practice feel effective because they feel fluent. Who they are Robert A. Bjork is distinguished research professor of psychology at the University of California, Los Angeles (UCLA). Elizabeth Ligon Bjork is professor of psychology at UCLA. They have collaborated for decades and jointly run the Bjork Learning and Forgetting Lab. Both have held senior roles in American psychological science; Robert Bjork is a past president of the Association for Psychological Science and chaired a US National Research Council committee on techniques for enhancing human performance. Their former students and collaborators, such as Nate Kornell, include many of the researchers behind the modern literature on spacing, interleaving and metacognition. Core ideas Learning versus performance. Learning is a relatively permanent change in knowledge or understanding that supports long-term retention and transfer. Performance is what can be observed during or immediately after instruction. Soderstrom and Robert Bjork's 2015 review collected evidence from motor and verbal learning that the two can dissociate: substantial learning can occur with no visible improvement, and impressive performance in the lesson can leave little lasting trace. The implication is that 'they could all do it by the end of the lesson' proves little. The new theory of disuse (1992). Each memory has: Storage strength : how thoroughly it is embedded and connected with other knowledge. It accumulates and, in the theory, is not lost. Retrieval strength : how easily it can be accessed now. It rises with recent study and decays with disuse and interference. Key predictions: retrieval capacity is limited, storage is not. The lower the current retrieval strength, the bigger the gain in storage strength from a successful retrieval or restudy. So allowing some forgetting, and then retrieving with effort, builds more durable memory than revisiting material while it is still fresh. Forgetting, on this view, is a helpful feature of memory, not just a failure. Desirable difficulties. Robert Bjork introduced the term in 1994. The main ones: Spacing : distributing study or practice over time instead of massing it. Interleaving : mixing topics or problem types instead of blocking them. Kornell and Bjork (2008) found that interleaving paintings by different artists improved learning of each artist's style, even though most participants believed blocking had worked better. Retrieval practice (testing) : using tests as learning events, not only as assessments. Generation : producing an answer or solution instead of being shown it. This includes pretesting: attempting questions before being taught can improve later learning of the material even when the attempts are wrong. Varying the conditions of practice : changing context, format or examples instead of keeping practice constant and predictable. Reducing or delaying feedback in some circumstances, so that learners do not become dependent on it. The qualifier. The word 'desirable' matters. A difficulty helps only when it triggers processing that supports learning and when the learner has the background knowledge to respond successfully. Elizabeth and Robert Bjork have repeatedly stressed that not all difficulties are desirable. Metacognitive illusions. Learners judge learning by fluency. Rereading notes, highlighting and cramming create a sense of familiarity that is mistaken for knowledge. With Dunlosky and Kornell (2013), Robert Bjork argued that becoming an effective learner means understanding these illusions and choosing harder strategies. Elizabeth Bjork's contributions. With Michael Anderson and Robert Bjork she established retrieval-induced forgetting: retrieving some items can reduce access to related, unretrieved items. With Jeri Little and others she showed that well-built multiple-choice questions, with plausible competing options, can strengthen memory for the rejected alternatives as well as the correct answer. Key works 'A new theory of disuse and an old theory of stimulus fluctuation' (Bjork and Bjork, 1992) 'Memory and metamemory considerations in the training of human beings' (R. Bjork, 1994) 'Learning concepts and categories: is spacing the \"enemy of induction\"?' (Kornell and Bjork, 2008) 'Making things hard on yourself, but in a good way: creating desirable difficulties to enhance learning' (Bjork and Bjork, 2011) 'Self-regulated learning: beliefs, techniques, and illusions' (Bjork, Dunlosky and Kornell, 2013) 'Learning versus performance: an integrative review' (Soderstrom and Bjork, 2015) 'Desirable difficulties in theory and practice' (Bjork and Bjork, 2020) Putting it into practice For a classroom teacher: Quiz on last week, last month and last term , not only last lesson. Expect lower scores and tell pupils why that is useful. Mix practice once the basics are secure. Block when first teaching a method; then set mixed exercises in which pupils must decide which method applies. Leave gaps before returning. Revisit a topic after pupils have begun to forget it, and build this into homework and starters. Ask before you tell. A short pre-question or prediction before an explanation costs little and can prime learning. Write multiple-choice questions with plausible distractors so that pupils have to think about why each is wrong. Teach pupils the science. Explain that self-testing and spaced revision feel worse than rereading but work better. Do this explicitly in Years 10 to 13. For leaders: Be cautious about judging learning from a single lesson observation or from pupils' fluency in the lesson. Look at retention over time. Design schemes of work and homework to revisit content at intervals, and assessments to be cumulative. Make sure retrieval practice is low-stakes and does not become a daily ritual of the same easy questions. Critiques and debate Laboratory evidence. Much of the research uses university students, word pairs or short texts, and retention intervals of days. Classroom studies exist, particularly in mathematics for interleaving and spacing, but are fewer, and effects in school trials tend to be smaller than in the lab. Tension with cognitive load theory. John Sweller's work recommends reducing load for novices; the Bjorks recommend adding certain difficulties. Researchers on both sides have suggested that the two apply to different situations: reduce load when material is complex and new, add difficulty when it is within reach. Where exactly the boundary lies is unsettled. Interleaving has limits. Reviews (for example Brunmair and Richter, 2019) find that benefits depend on the material: strongest when categories are easily confused, weak or negative for some verbal materials and for learners with low prior knowledge. Pretesting and generation with novices. Errors generated without enough knowledge may waste time or demotivate; evidence that such errors are harmless comes mostly from settings with prompt feedback. Motivation. Pupils who experience difficulty as failure may disengage. Teachers need to manage success rates and explain the purpose, a point the Bjorks acknowledge. Implementation drift. In English schools, 'retrieval practice' has sometimes become a compliance routine of factual starter quizzes; this is a criticism of the application, made by writers such as Kate Jones and Tom Sherrington, not of the underlying research."},{"slug":"rosenshine-principles-of-instruction","title":"Rosenshine's Principles of Instruction","category":"teaching","type":"topic","summary":"Barak Rosenshine's ten research-based principles (2012) for teaching new material: review, small steps, questioning, models, guided practice, checking, high success, scaffolds, independent practice.","status":"Research and theory","evidence":"","tags":["rosenshine","explicit instruction","review","guided practice","questioning"],"checked":"2026-11-12","sources":[{"title":"Principles of Instruction: Research-Based Strategies That All Teachers Should Know (American Educator, Spring 2012, vol. 36 no. 1)","publisher":"American Federation of Teachers","year":"2012","url":"https://www.aft.org/ae/spring2012/rosenshine"},{"title":"Principles of Instruction (article PDF)","publisher":"American Federation of Teachers","year":"2012","url":"https://www.aft.org/sites/default/files/Rosenshine.pdf"},{"title":"Rosenshine's Principles in Action (sample chapter)","publisher":"John Catt Educational (Tom Sherrington)","year":"2019","url":"https://cdn.shopify.com/s/files/1/0256/6592/9250/files/Rosenshine_Principles_Sample_Chapter.pdf?139"},{"title":"Rosenshine's 17 Principles of Effective Instruction","publisher":"Teacher Toolkit","year":"2018","url":"https://www.teachertoolkit.co.uk/2018/10/21/barack-rosenshine/"}],"related":["barak-rosenshine","tom-sherrington","explicit-instruction","retrieval-practice"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Ten principles, published in \u003cem>American Educator\u003c/em> in spring 2012 and adapted from a 2010 pamphlet Rosenshine wrote for the International Academy of Education/UNESCO.\u003c/li>\n\u003cli>They describe how effective teachers introduce and secure \u003cstrong>new material\u003c/strong>: review, present in small steps, question, model, guide practice, check understanding, keep success high, scaffold, set independent practice, review again.\u003c/li>\n\u003cli>They draw on three bodies of research: cognitive science, classroom studies of &#39;master&#39; teachers, and studies of cognitive supports such as scaffolds and models.\u003c/li>\n\u003cli>In England they became very widely used after Tom Sherrington&#39;s 2019 book grouped them into four strands. They sit comfortably with the DfE&#39;s initial teacher training and early career framework.\u003c/li>\n\u003cli>They are a description of instruction, not a lesson plan, a checklist for observers or a full theory of teaching.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>The ten principles are:\u003c/p>\n\u003col>\n\u003cli>Begin the lesson with a short review of previous learning.\u003c/li>\n\u003cli>Present new material in small steps, with practice after each step.\u003c/li>\n\u003cli>Ask a large number of questions and check the responses of all pupils.\u003c/li>\n\u003cli>Provide models (including worked examples and thinking aloud).\u003c/li>\n\u003cli>Guide pupil practice.\u003c/li>\n\u003cli>Check for pupil understanding.\u003c/li>\n\u003cli>Obtain a high success rate.\u003c/li>\n\u003cli>Provide scaffolds for difficult tasks.\u003c/li>\n\u003cli>Require and monitor independent practice.\u003c/li>\n\u003cli>Engage pupils in weekly and monthly review.\u003c/li>\n\u003c/ol>\n\u003cp>The article also lists 17 &#39;instructional procedures&#39;, which is why some summaries refer to 17 principles; they are the same ideas at a finer grain.\u003c/p>\n\u003cp>Much of the classroom evidence comes from &#39;process–product&#39; studies of the 1960s–1980s, which observed teachers whose classes made larger gains on tests and then, in some cases, trained other teachers in those behaviours experimentally. Rosenshine reports, for example, that the more effective teachers spent longer on guided practice and questioning before releasing pupils to work alone, and suggests a success rate of around 80% during practice as a rough optimum: high enough that pupils are not rehearsing errors, low enough that the work is still demanding. The principles align with later findings on retrieval, worked examples and cognitive load, although Rosenshine wrote them as a synthesis rather than a test of those theories.\u003c/p>\n\u003cp>Sherrington&#39;s four strands are a useful way to hold them: \u003cstrong>sequencing concepts and modelling\u003c/strong> (2, 4, 8), \u003cstrong>questioning\u003c/strong> (3, 6), \u003cstrong>reviewing material\u003c/strong> (1, 10) and \u003cstrong>stages of practice\u003c/strong> (5, 7, 9).\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>A Year 8 science lesson on balancing equations might run:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Review (5 minutes).\u003c/strong> Five questions on silent mini-whiteboards: two from last lesson (formulae of common compounds), two from last term, one from last year. Reteach the one most got wrong.\u003c/li>\n\u003cli>\u003cstrong>Small steps.\u003c/strong> Teach &#39;count the atoms on each side&#39; before &#39;add coefficients&#39;. Pupils practise counting on three examples before moving on.\u003c/li>\n\u003cli>\u003cstrong>Model.\u003c/strong> Work one example under the visualiser, narrating decisions (&#39;I never change the small numbers, because that changes the substance&#39;).\u003c/li>\n\u003cli>\u003cstrong>Guided practice.\u003c/strong> A second example with the class supplying each step by cold call; a third on whiteboards, &#39;show me in 3, 2, 1&#39;.\u003c/li>\n\u003cli>\u003cstrong>Check.\u003c/strong> Do not ask &#39;does everyone get it?&#39;. Scan the boards; if fewer than about four in five are correct, re-model rather than moving on.\u003c/li>\n\u003cli>\u003cstrong>Scaffold.\u003c/strong> A tally-table template for those who need it, removed after a few questions.\u003c/li>\n\u003cli>\u003cstrong>Independent practice.\u003c/strong> Ten questions in silence, the first few close to the modelled examples; the teacher circulates and marks a target group.\u003c/li>\n\u003cli>\u003cstrong>Later review.\u003c/strong> The same content reappears in next week&#39;s starter and a half-termly quiz.\u003c/li>\n\u003c/ul>\n\u003cp>Not every lesson contains all ten. A lesson that is mostly extended writing or a practical is still consistent with the principles if the earlier lessons did the modelling and guided practice.\u003c/p>\n\u003ch2>For leaders\u003c/h2>\n\u003cul>\n\u003cli>Use the principles as a \u003cstrong>shared language\u003c/strong> for professional development, not as a lesson observation proforma. Scoring lessons against ten boxes produces performed starters and token questioning.\u003c/li>\n\u003cli>Ask subject leaders to translate each principle into their subject. &#39;Review&#39; in art or PE does not look like a five-question quiz.\u003c/li>\n\u003cli>The highest-leverage strands for most departments are guided practice and checking the whole class before independent work. Target coaching there.\u003c/li>\n\u003cli>Cost is low: the article is free and the main investment is training and coaching time.\u003c/li>\n\u003c/ul>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Age and nature of the evidence.\u003c/strong> Much of it is correlational, American, primary-phase and focused on well-structured content such as arithmetic and reading. Rosenshine himself noted that explicit teaching procedures are most applicable to well-structured knowledge and skills.\u003c/li>\n\u003cli>\u003cstrong>Not a complete account.\u003c/strong> The principles say little about curriculum content, motivation, relationships, behaviour or subject-specific pedagogy. Sherrington and others stress that they should be read alongside a strong curriculum.\u003c/li>\n\u003cli>\u003cstrong>Lethal mutations.\u003c/strong> Common distortions include: a retrieval quiz bolted onto every lesson regardless of content; the &#39;80%&#39; figure treated as a target grade; and whole-school lesson structures that force all ten into every hour.\u003c/li>\n\u003cli>\u003cstrong>Subject fit.\u003c/strong> Teachers of arts, humanities and practical subjects argue that the principles need substantial adaptation where the aim is interpretation, performance or open-ended making.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cul>\n\u003cli>Read the original article: it is short, free and more nuanced than most summaries.\u003c/li>\n\u003cli>Sherrington&#39;s \u003cem>Rosenshine&#39;s Principles in Action\u003c/em> (2019) gives the four-strand version with classroom examples.\u003c/li>\n\u003cli>See the entries on explicit instruction, cognitive load theory and Barak Rosenshine for the wider research base.\u003c/li>\n\u003c/ul>\n","text":"At a glance Ten principles, published in American Educator in spring 2012 and adapted from a 2010 pamphlet Rosenshine wrote for the International Academy of Education/UNESCO. They describe how effective teachers introduce and secure new material : review, present in small steps, question, model, guide practice, check understanding, keep success high, scaffold, set independent practice, review again. They draw on three bodies of research: cognitive science, classroom studies of 'master' teachers, and studies of cognitive supports such as scaffolds and models. In England they became very widely used after Tom Sherrington's 2019 book grouped them into four strands. They sit comfortably with the DfE's initial teacher training and early career framework. They are a description of instruction, not a lesson plan, a checklist for observers or a full theory of teaching. What the evidence says The ten principles are: Begin the lesson with a short review of previous learning. Present new material in small steps, with practice after each step. Ask a large number of questions and check the responses of all pupils. Provide models (including worked examples and thinking aloud). Guide pupil practice. Check for pupil understanding. Obtain a high success rate. Provide scaffolds for difficult tasks. Require and monitor independent practice. Engage pupils in weekly and monthly review. The article also lists 17 'instructional procedures', which is why some summaries refer to 17 principles; they are the same ideas at a finer grain. Much of the classroom evidence comes from 'process–product' studies of the 1960s–1980s, which observed teachers whose classes made larger gains on tests and then, in some cases, trained other teachers in those behaviours experimentally. Rosenshine reports, for example, that the more effective teachers spent longer on guided practice and questioning before releasing pupils to work alone, and suggests a success rate of around 80% during practice as a rough optimum: high enough that pupils are not rehearsing errors, low enough that the work is still demanding. The principles align with later findings on retrieval, worked examples and cognitive load, although Rosenshine wrote them as a synthesis rather than a test of those theories. Sherrington's four strands are a useful way to hold them: sequencing concepts and modelling (2, 4, 8), questioning (3, 6), reviewing material (1, 10) and stages of practice (5, 7, 9). In the classroom A Year 8 science lesson on balancing equations might run: Review (5 minutes). Five questions on silent mini-whiteboards: two from last lesson (formulae of common compounds), two from last term, one from last year. Reteach the one most got wrong. Small steps. Teach 'count the atoms on each side' before 'add coefficients'. Pupils practise counting on three examples before moving on. Model. Work one example under the visualiser, narrating decisions ('I never change the small numbers, because that changes the substance'). Guided practice. A second example with the class supplying each step by cold call; a third on whiteboards, 'show me in 3, 2, 1'. Check. Do not ask 'does everyone get it?'. Scan the boards; if fewer than about four in five are correct, re-model rather than moving on. Scaffold. A tally-table template for those who need it, removed after a few questions. Independent practice. Ten questions in silence, the first few close to the modelled examples; the teacher circulates and marks a target group. Later review. The same content reappears in next week's starter and a half-termly quiz. Not every lesson contains all ten. A lesson that is mostly extended writing or a practical is still consistent with the principles if the earlier lessons did the modelling and guided practice. For leaders Use the principles as a shared language for professional development, not as a lesson observation proforma. Scoring lessons against ten boxes produces performed starters and token questioning. Ask subject leaders to translate each principle into their subject. 'Review' in art or PE does not look like a five-question quiz. The highest-leverage strands for most departments are guided practice and checking the whole class before independent work. Target coaching there. Cost is low: the article is free and the main investment is training and coaching time. Cautions and critiques Age and nature of the evidence. Much of it is correlational, American, primary-phase and focused on well-structured content such as arithmetic and reading. Rosenshine himself noted that explicit teaching procedures are most applicable to well-structured knowledge and skills. Not a complete account. The principles say little about curriculum content, motivation, relationships, behaviour or subject-specific pedagogy. Sherrington and others stress that they should be read alongside a strong curriculum. Lethal mutations. Common distortions include: a retrieval quiz bolted onto every lesson regardless of content; the '80%' figure treated as a target grade; and whole-school lesson structures that force all ten into every hour. Subject fit. Teachers of arts, humanities and practical subjects argue that the principles need substantial adaptation where the aim is interpretation, performance or open-ended making. Go deeper Read the original article: it is short, free and more nuanced than most summaries. Sherrington's Rosenshine's Principles in Action (2019) gives the four-strand version with classroom examples. See the entries on explicit instruction, cognitive load theory and Barak Rosenshine for the wider research base."},{"slug":"safeguarding-records-and-information-sharing","title":"Safeguarding records and information sharing","category":"safeguarding","type":"topic","summary":"How to record concerns, keep and transfer child protection files, and share information lawfully, including the new statutory information sharing duty in force from 30 September 2026.","status":"Professional practice","evidence":"","tags":["record keeping","information sharing","child protection files","data protection","information sharing duty","chronologies"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"Statutory guidance for the information sharing duty: government consultation","publisher":"Department for Education","year":"2026","url":"https://consult.education.gov.uk/mais-strategy-policy-and-programme-unit/statutory-guidance-for-information-sharing-duty/supporting_documents/consultation-document-for-statutory-guidance-on-the-information-sharing-dutypdf"},{"title":"Information to safeguard children must be shared other than in 'extremely limited circumstances' under new duty, says DfE","publisher":"Community Care","year":"2026","url":"https://www.communitycare.co.uk/content/news/information-to-safeguard-children-must-be-shared-other-than-in-extremely-limited-circumstances-under-new-duty-says-dfe"},{"title":"Information sharing duty and consent","publisher":"Somerset Safeguarding Children Partnership","year":"2026","url":"https://somersetsafeguardingchildren.org.uk/info-sharing/"},{"title":"What education providers need to know about the new safeguarding information sharing duty","publisher":"Legal 500","year":"2026","url":"https://www.legal500.com/intelligence/united-kingdom/consumer-protection/what-education-providers-need-to-know-about-the-new-safeguarding-information-sharing-duty"}],"related":["keeping-children-safe-in-education","designated-safeguarding-lead","working-together-to-safeguard-children","child-protection-policy-and-procedures"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Record every concern, discussion, decision and the reason for it, in writing, on the day. KCSIE says this \u003cstrong>should\u003c/strong> happen; reviews of serious cases show why.\u003c/li>\n\u003cli>Data protection law does \u003cstrong>not\u003c/strong> prevent sharing information to keep a child safe. Fear of sharing must not stand in the way of safeguarding.\u003c/li>\n\u003cli>\u003cstrong>New from 30 September 2026:\u003c/strong> a statutory \u003cstrong>information sharing duty\u003c/strong> (section 16LA of the Children Act 2004, inserted by the Children&#39;s Wellbeing and Schools Act 2026) requires specified agencies to share information relevant to safeguarding or promoting a child&#39;s welfare. Schools and colleges are reported to be in scope.\u003c/li>\n\u003cli>New DfE statutory guidance on information sharing was published in September 2026 to accompany the duty. The 2024 non-statutory &#39;Information sharing: advice for practitioners&#39; and its &#39;seven golden rules&#39; remain a useful practical summary. Not verified: whether the 2024 advice has been withdrawn or updated; check GOV.UK.\u003c/li>\n\u003cli>When a pupil moves, the child protection file follows them, separately from the main file, within five days.\u003c/li>\n\u003c/ul>\n\u003ch2>What the evidence says\u003c/h2>\n\u003cp>\u003cstrong>Recording (KCSIE 2026).\u003c/strong> Records should include a clear and comprehensive summary of the concern; details of how it was followed up and resolved; and a note of any action taken, decisions reached and the outcome. Files are kept confidential and secure, separate from the pupil file, and seen only by those who need to.\u003c/p>\n\u003cp>\u003cstrong>Transfer.\u003c/strong> The DSL should transfer the child protection file to the new school or college as soon as possible, within five days for an in-year move or within the first five days of the new term, by secure means with confirmation of receipt. The DSL should also consider sharing key information in advance so support is in place on arrival.\u003c/p>\n\u003cp>\u003cstrong>The information sharing duty (from 30 September 2026).\u003c/strong> As described in the DfE consultation and by legal and partnership briefings:\u003c/p>\n\u003cul>\n\u003cli>it applies between &#39;relevant persons&#39; listed in the legislation, and covers information about the child and about other people connected to them where relevant to the child&#39;s welfare;\u003c/li>\n\u003cli>where the duty applies, consent is not the legal basis and is not required, though being open with families remains good practice unless it would increase risk;\u003c/li>\n\u003cli>absence of a data sharing agreement should not delay sharing;\u003c/li>\n\u003cli>it does not apply where sharing would be more detrimental to the child than not sharing;\u003c/li>\n\u003cli>it ends when the young person turns 18;\u003c/li>\n\u003cli>bodies under the duty must have regard to the statutory guidance.\u003c/li>\n\u003c/ul>\n\u003cp>Not verified: the precise list of education bodies designated in regulations, and the final title of the statutory guidance. Read the GOV.UK document and your local partnership&#39;s briefing.\u003c/p>\n\u003cp>\u003cstrong>Single unique identifier.\u003c/strong> The same Act provides for a consistent identifier for children across services (the NHS number has been piloted). Not verified: that this provision has been commenced or that schools have any current action to take.\u003c/p>\n\u003cp>\u003cstrong>Data protection.\u003c/strong> UK GDPR and the Data Protection Act 2018 permit sharing for safeguarding. Schools usually rely on &#39;public task&#39; or &#39;legal obligation&#39; as the lawful basis, and on the &#39;safeguarding of children and individuals at risk&#39; condition for special category data. Schools may withhold data from a subject access request where the serious harm test is met.\u003c/p>\n\u003cp>\u003cstrong>Other practitioner guidance.\u003c/strong> &#39;What to do if you&#39;re worried a child is being abused: advice for practitioners&#39; (DfE, 2015) remains the short non-statutory guide to recognising and reporting abuse. Not verified: any later revision.\u003c/p>\n\u003ch2>In the classroom\u003c/h2>\n\u003cp>What every member of staff does:\u003c/p>\n\u003cul>\n\u003cli>Write it down the same day in the school&#39;s system: date, time, place, who was present, what you saw or heard, the child&#39;s exact words in quotation marks, what you said, and what you did.\u003c/li>\n\u003cli>Fact first, opinion labelled as opinion. Use a body map for injuries; do not photograph injuries.\u003c/li>\n\u003cli>Record &#39;small&#39; things: hunger, changes in presentation, a remark. Patterns are only visible if someone logs the pieces.\u003c/li>\n\u003cli>Do not keep private notes, and do not share on messaging apps or personal email.\u003c/li>\n\u003cli>Tell the child you will need to pass it on; never promise secrecy.\u003c/li>\n\u003c/ul>\n\u003ch2>For leaders\u003c/h2>\n\u003cp>\u003cstrong>DSLs:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>keep a running \u003cstrong>chronology\u003c/strong> at the front of each file, including attendance, behaviour and health events, and review it before every decision;\u003c/li>\n\u003cli>record decisions \u003cstrong>not\u003c/strong> to refer or share, with reasons;\u003c/li>\n\u003cli>before sharing, ask: is it necessary, proportionate, relevant, accurate, timely and secure? Record what was shared, with whom and why;\u003c/li>\n\u003cli>check that the system&#39;s access permissions match roles, and that leavers lose access;\u003c/li>\n\u003cli>set retention in the records policy (commonly until the child&#39;s 25th birthday; longer for some categories). Since the Independent Inquiry into Child Sexual Abuse, many schools retain records relating to sexual abuse for much longer; take advice from your data protection officer;\u003c/li>\n\u003cli>update privacy notices and the child protection policy to reflect the new duty.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Governors and trustees\u003c/strong> check: an annual audit of file quality; evidence that files were sent and received for leavers and requested for joiners; a data protection impact assessment for the recording system; staff training on the information sharing duty.\u003c/p>\n\u003ch2>Cautions and critiques\u003c/h2>\n\u003cul>\n\u003cli>Common audit failings: undated entries, no outcome recorded, concerns logged under behaviour rather than safeguarding, files not transferred at post-16 transition, and siblings&#39; records not linked.\u003c/li>\n\u003cli>Over-reliance on consent has historically delayed sharing; the new duty is designed to change this. Some home education and privacy groups have criticised the duty&#39;s breadth; schools should still be transparent with families.\u003c/li>\n\u003cli>Electronic systems make logging easy and analysis no easier: someone must read the chronology.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Read the DfE statutory guidance on the information sharing duty and your local safeguarding partnership&#39;s information sharing protocol, which you must follow. This is general information, not legal advice.\u003c/p>\n","text":"At a glance Record every concern, discussion, decision and the reason for it, in writing, on the day. KCSIE says this should happen; reviews of serious cases show why. Data protection law does not prevent sharing information to keep a child safe. Fear of sharing must not stand in the way of safeguarding. New from 30 September 2026: a statutory information sharing duty (section 16LA of the Children Act 2004, inserted by the Children's Wellbeing and Schools Act 2026) requires specified agencies to share information relevant to safeguarding or promoting a child's welfare. Schools and colleges are reported to be in scope. New DfE statutory guidance on information sharing was published in September 2026 to accompany the duty. The 2024 non-statutory 'Information sharing: advice for practitioners' and its 'seven golden rules' remain a useful practical summary. Not verified: whether the 2024 advice has been withdrawn or updated; check GOV.UK. When a pupil moves, the child protection file follows them, separately from the main file, within five days. What the evidence says Recording (KCSIE 2026). Records should include a clear and comprehensive summary of the concern; details of how it was followed up and resolved; and a note of any action taken, decisions reached and the outcome. Files are kept confidential and secure, separate from the pupil file, and seen only by those who need to. Transfer. The DSL should transfer the child protection file to the new school or college as soon as possible, within five days for an in-year move or within the first five days of the new term, by secure means with confirmation of receipt. The DSL should also consider sharing key information in advance so support is in place on arrival. The information sharing duty (from 30 September 2026). As described in the DfE consultation and by legal and partnership briefings: it applies between 'relevant persons' listed in the legislation, and covers information about the child and about other people connected to them where relevant to the child's welfare; where the duty applies, consent is not the legal basis and is not required, though being open with families remains good practice unless it would increase risk; absence of a data sharing agreement should not delay sharing; it does not apply where sharing would be more detrimental to the child than not sharing; it ends when the young person turns 18; bodies under the duty must have regard to the statutory guidance. Not verified: the precise list of education bodies designated in regulations, and the final title of the statutory guidance. Read the GOV.UK document and your local partnership's briefing. Single unique identifier. The same Act provides for a consistent identifier for children across services (the NHS number has been piloted). Not verified: that this provision has been commenced or that schools have any current action to take. Data protection. UK GDPR and the Data Protection Act 2018 permit sharing for safeguarding. Schools usually rely on 'public task' or 'legal obligation' as the lawful basis, and on the 'safeguarding of children and individuals at risk' condition for special category data. Schools may withhold data from a subject access request where the serious harm test is met. Other practitioner guidance. 'What to do if you're worried a child is being abused: advice for practitioners' (DfE, 2015) remains the short non-statutory guide to recognising and reporting abuse. Not verified: any later revision. In the classroom What every member of staff does: Write it down the same day in the school's system: date, time, place, who was present, what you saw or heard, the child's exact words in quotation marks, what you said, and what you did. Fact first, opinion labelled as opinion. Use a body map for injuries; do not photograph injuries. Record 'small' things: hunger, changes in presentation, a remark. Patterns are only visible if someone logs the pieces. Do not keep private notes, and do not share on messaging apps or personal email. Tell the child you will need to pass it on; never promise secrecy. For leaders DSLs: keep a running chronology at the front of each file, including attendance, behaviour and health events, and review it before every decision; record decisions not to refer or share, with reasons; before sharing, ask: is it necessary, proportionate, relevant, accurate, timely and secure? Record what was shared, with whom and why; check that the system's access permissions match roles, and that leavers lose access; set retention in the records policy (commonly until the child's 25th birthday; longer for some categories). Since the Independent Inquiry into Child Sexual Abuse, many schools retain records relating to sexual abuse for much longer; take advice from your data protection officer; update privacy notices and the child protection policy to reflect the new duty. Governors and trustees check: an annual audit of file quality; evidence that files were sent and received for leavers and requested for joiners; a data protection impact assessment for the recording system; staff training on the information sharing duty. Cautions and critiques Common audit failings: undated entries, no outcome recorded, concerns logged under behaviour rather than safeguarding, files not transferred at post-16 transition, and siblings' records not linked. Over-reliance on consent has historically delayed sharing; the new duty is designed to change this. Some home education and privacy groups have criticised the duty's breadth; schools should still be transparent with families. Electronic systems make logging easy and analysis no easier: someone must read the chronology. Go deeper Read the DfE statutory guidance on the information sharing duty and your local safeguarding partnership's information sharing protocol, which you must follow. This is general information, not legal advice."},{"slug":"safer-recruitment-and-single-central-record","title":"Safer recruitment and the single central record","category":"safeguarding","type":"guidance","summary":"Part three of KCSIE: the pre-appointment checks schools must carry out, how to record them on the single central record, and the 2026 change to regulated activity affecting supervised volunteers.","status":"Statutory guidance","evidence":"","tags":["safer recruitment","single central record","dbs","kcsie","volunteers","regulated activity"],"checked":"2026-11-12","sources":[{"title":"Keeping children safe in education 2026","publisher":"Department for Education","year":"2026","url":"https://assets.publishing.service.gov.uk/media/6aba40e0fceb6fb3a650127d/Keeping_children_safe_in_education_2026.pdf"},{"title":"Briefing note: KCSIE 2026 and regulated activity","publisher":"Southwark Council","year":"2026","url":"https://education.southwark.gov.uk/assets/attach/11934/Briefing-Note_-KCISE-2026-and-Regulated-Activity.pdf"},{"title":"Keeping children safe in education (KCSIE) 2026: key changes","publisher":"Farrer & Co","year":"2026","url":"https://www.farrer.co.uk/news-and-insights/keeping-children-safe-in-education-2026-a-practical-guide-for-schools/"},{"title":"Keeping children safe in education (KCSIE) 2026: summary of changes (CASPAR briefing)","publisher":"NSPCC Learning","year":"2026","url":"https://learning.nspcc.org.uk/research-resources/schools/keeping-children-safe-in-education-caspar-briefing"}],"related":["keeping-children-safe-in-education","allegations-and-low-level-concerns"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Part three of KCSIE sets out safer recruitment. Some elements are legal requirements (the checks and the single central record); others are &#39;should&#39; guidance (how you advertise, shortlist and interview).\u003c/li>\n\u003cli>Schools \u003cstrong>must\u003c/strong> keep a \u003cstrong>single central record (SCR)\u003c/strong> of pre-appointment checks for all staff, including supply staff and teacher trainees on salaried routes; academies and independent schools must also record members of the proprietor body.\u003c/li>\n\u003cli>At least one person on every interview panel should have completed safer recruitment training (a legal requirement for maintained schools).\u003c/li>\n\u003cli>\u003cstrong>2026 change:\u003c/strong> the Crime and Policing Act 2026 removes the &#39;supervision&#39; exemption from the definition of regulated activity. Volunteers who teach, train, instruct or supervise children frequently are in regulated activity even when supervised, so barred-list checks apply.\u003c/li>\n\u003cli>The check is only part of the picture: a deterrent culture, scrutiny of employment history and good induction matter as much.\u003c/li>\n\u003c/ul>\n\u003ch2>Status and current version\u003c/h2>\n\u003cp>KCSIE 2026, Part three, in force from 1 September 2026. It applies to all schools and colleges; the underlying legal requirements differ slightly by school type (School Staffing (England) Regulations 2009 for maintained schools; the independent school standards for academies and independent schools).\u003c/p>\n\u003cp>\u003cstrong>What changed in 2026\u003c/strong> (reported by NSPCC, legal and local authority briefings; confirm against the text):\u003c/p>\n\u003cul>\n\u003cli>The definition of \u003cstrong>regulated activity\u003c/strong> is revised to reflect the removal of the supervision exemption. The frequency test remains (commonly summarised as more than three days in a 30-day period, or overnight). The DBS decision flowchart in earlier editions has been removed. Not verified: the exact commencement date of the statutory change; check before changing practice for existing volunteers, and take advice from your HR provider.\u003c/li>\n\u003cli>Candidates should be told that \u003cstrong>online searches\u003c/strong> may be carried out at shortlisting (online searches themselves have been in KCSIE since 2022).\u003c/li>\n\u003cli>Not verified: any other 2026 changes to Part three; see the summary-of-changes annex.\u003c/li>\n\u003c/ul>\n\u003ch2>What schools must do\u003c/h2>\n\u003cp>\u003cstrong>Checks before appointment\u003c/strong> (staff in regulated activity):\u003c/p>\n\u003cul>\n\u003cli>identity;\u003c/li>\n\u003cli>enhanced DBS certificate with children&#39;s barred list information;\u003c/li>\n\u003cli>a separate barred list check if the person starts before the certificate arrives (with supervision);\u003c/li>\n\u003cli>prohibition from teaching check for those doing teaching work;\u003c/li>\n\u003cli>section 128 direction check for management roles in academies and independent schools, and for governors in maintained schools;\u003c/li>\n\u003cli>mental and physical fitness for the role;\u003c/li>\n\u003cli>right to work in the UK;\u003c/li>\n\u003cli>overseas checks where the person has lived or worked outside the UK;\u003c/li>\n\u003cli>professional qualifications where required.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The SCR must\u003c/strong> record, for each person, whether each required check was done and the date it was completed or the certificate obtained. For agency and third-party staff, schools must obtain written confirmation from the employer that checks have been done and check the person&#39;s identity on arrival.\u003c/p>\n\u003cp>\u003cstrong>Schools should\u003c/strong> also: include a safeguarding statement in adverts; use application forms, not CVs alone; require a self-declaration from shortlisted candidates; examine gaps and inconsistencies; obtain references before interview, directly from a senior person at the current employer, and verify them; ask safeguarding questions at interview; consider an online search on shortlisted candidates.\u003c/p>\n\u003cp>\u003cstrong>Governors and volunteers.\u003c/strong> Maintained school governors must have an enhanced DBS check; academy trustees and members need the checks set by the independent school standards. Volunteers need a written risk assessment where no check is legally required; schools may not request barred-list information for someone not in regulated activity.\u003c/p>\n\u003ch2>In practice\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Staff involved in recruitment:\u003c/strong> use the school&#39;s templates; record who checked what and when; never accept open references or references from candidates&#39; hands.\u003c/li>\n\u003cli>\u003cstrong>DSL and HR/business manager:\u003c/strong> audit the SCR termly against the staff list, supply bookings, the governor list and the volunteer list. In autumn 2026, review every volunteer role against the revised regulated activity definition and record the decision.\u003c/li>\n\u003cli>\u003cstrong>Contractors:\u003c/strong> agree checks in the contract; identity is checked on arrival; unchecked contractors are supervised and not left alone with pupils.\u003c/li>\n\u003cli>\u003cstrong>Alternative provision and work experience:\u003c/strong> obtain written confirmation that the provider has completed appropriate checks on its staff.\u003c/li>\n\u003cli>\u003cstrong>Governors and trustees:\u003c/strong> the safeguarding governor should sample the SCR with the business manager at least annually and look at two or three personnel files end to end.\u003c/li>\n\u003c/ul>\n\u003ch2>Common pitfalls\u003c/h2>\n\u003cul>\n\u003cli>Blank cells or &#39;N/A&#39; on the SCR with no explanation; dates of the check confused with dates of the certificate.\u003c/li>\n\u003cli>No section 128 check for governors or senior leaders; no prohibition check for instructors and cover supervisors who teach.\u003c/li>\n\u003cli>Missing overseas checks, or missing evidence of the decision when one could not be obtained.\u003c/li>\n\u003cli>Agency confirmation letters filed but identity not checked on the day.\u003c/li>\n\u003cli>Keeping copies of DBS certificates longer than needed (data protection guidance is no longer than six months).\u003c/li>\n\u003cli>Supervised volunteers still treated as outside regulated activity after the 2026 change.\u003c/li>\n\u003cli>References received after the start date, or not followed up when vague.\u003c/li>\n\u003c/ul>\n\u003ch2>Go deeper\u003c/h2>\n\u003cp>Read Part three of KCSIE 2026 in full with the person who maintains the SCR. This is general information, not legal advice; use your HR or legal adviser for individual cases and follow your local safeguarding partnership&#39;s procedures.\u003c/p>\n","text":"At a glance Part three of KCSIE sets out safer recruitment. Some elements are legal requirements (the checks and the single central record); others are 'should' guidance (how you advertise, shortlist and interview). Schools must keep a single central record (SCR) of pre-appointment checks for all staff, including supply staff and teacher trainees on salaried routes; academies and independent schools must also record members of the proprietor body. At least one person on every interview panel should have completed safer recruitment training (a legal requirement for maintained schools). 2026 change: the Crime and Policing Act 2026 removes the 'supervision' exemption from the definition of regulated activity. Volunteers who teach, train, instruct or supervise children frequently are in regulated activity even when supervised, so barred-list checks apply. The check is only part of the picture: a deterrent culture, scrutiny of employment history and good induction matter as much. Status and current version KCSIE 2026, Part three, in force from 1 September 2026. It applies to all schools and colleges; the underlying legal requirements differ slightly by school type (School Staffing (England) Regulations 2009 for maintained schools; the independent school standards for academies and independent schools). What changed in 2026 (reported by NSPCC, legal and local authority briefings; confirm against the text): The definition of regulated activity is revised to reflect the removal of the supervision exemption. The frequency test remains (commonly summarised as more than three days in a 30-day period, or overnight). The DBS decision flowchart in earlier editions has been removed. Not verified: the exact commencement date of the statutory change; check before changing practice for existing volunteers, and take advice from your HR provider. Candidates should be told that online searches may be carried out at shortlisting (online searches themselves have been in KCSIE since 2022). Not verified: any other 2026 changes to Part three; see the summary-of-changes annex. What schools must do Checks before appointment (staff in regulated activity): identity; enhanced DBS certificate with children's barred list information; a separate barred list check if the person starts before the certificate arrives (with supervision); prohibition from teaching check for those doing teaching work; section 128 direction check for management roles in academies and independent schools, and for governors in maintained schools; mental and physical fitness for the role; right to work in the UK; overseas checks where the person has lived or worked outside the UK; professional qualifications where required. The SCR must record, for each person, whether each required check was done and the date it was completed or the certificate obtained. For agency and third-party staff, schools must obtain written confirmation from the employer that checks have been done and check the person's identity on arrival. Schools should also: include a safeguarding statement in adverts; use application forms, not CVs alone; require a self-declaration from shortlisted candidates; examine gaps and inconsistencies; obtain references before interview, directly from a senior person at the current employer, and verify them; ask safeguarding questions at interview; consider an online search on shortlisted candidates. Governors and volunteers. Maintained school governors must have an enhanced DBS check; academy trustees and members need the checks set by the independent school standards. Volunteers need a written risk assessment where no check is legally required; schools may not request barred-list information for someone not in regulated activity. In practice Staff involved in recruitment: use the school's templates; record who checked what and when; never accept open references or references from candidates' hands. DSL and HR/business manager: audit the SCR termly against the staff list, supply bookings, the governor list and the volunteer list. In autumn 2026, review every volunteer role against the revised regulated activity definition and record the decision. Contractors: agree checks in the contract; identity is checked on arrival; unchecked contractors are supervised and not left alone with pupils. Alternative provision and work experience: obtain written confirmation that the provider has completed appropriate checks on its staff. Governors and trustees: the safeguarding governor should sample the SCR with the business manager at least annually and look at two or three personnel files end to end. Common pitfalls Blank cells or 'N/A' on the SCR with no explanation; dates of the check confused with dates of the certificate. No section 128 check for governors or senior leaders; no prohibition check for instructors and cover supervisors who teach. Missing overseas checks, or missing evidence of the decision when one could not be obtained. Agency confirmation letters filed but identity not checked on the day. Keeping copies of DBS certificates longer than needed (data protection guidance is no longer than six months). Supervised volunteers still treated as outside regulated activity after the 2026 change. References received after the start date, or not followed up when vague. Go deeper Read Part three of KCSIE 2026 in full with the person who maintains the SCR. This is general information, not legal advice; use your HR or legal adviser for individual cases and follow your local safeguarding partnership's procedures."},{"slug":"sam-strickland","title":"Sam Strickland","category":"thinkers","type":"person","summary":"Principal of The Duston School, Northampton, and author of 'The Behaviour Manual' and 'Education Exposed'. A practitioner voice for leader-owned, centralised behaviour systems, explicit routines and teacher-led instruction.","status":"Thinker profile","evidence":"","tags":["behaviour","school leadership","routines","centralised systems","school culture","headship"],"checked":"2026-11-12","sources":[{"title":"Book review: The Behaviour Manual by Sam Strickland","publisher":"Schools Week","year":"2022","url":"https://schoolsweek.co.uk/book-the-behaviour-manual-by-sam-strickland/"},{"title":"The Duston School's Sam Strickland promotes new 'Bible' for teachers","publisher":"Leaders GB","year":"2022","url":"https://leadersgb.co.uk/news/for-those-who-don-t-have-time-as-a-luxury-the-duston-school-s-sam-strickland-promotes-new-bible-for-teachers"},{"title":"They Don't Behave for Me: 50 classroom behaviour scenarios to support teachers (publisher page)","publisher":"John Catt / Hachette Learning","year":"2023","url":"https://www.hachette.co.uk/titles/samuel-strickland/they-don%e2%80%99t-behave-for-me-50-classroom-behaviour-scenarios-to-support-teachers/9781036001421"},{"title":"Education Exposed 2: In pursuit of the halcyon dream (publisher page)","publisher":"John Catt / Hachette Learning","year":"2020","url":"https://hachette.co.uk/titles/samuel-strickland/education-exposed-2-in-pursuit-of-the-halcyon-dream/9781913622169"},{"title":"The Behaviour Manual: An Educator's Guidebook (bookseller listing)","publisher":"Woodslane","year":"2022","url":"https://woodslane.com.au/products/9781915261243"}],"related":["tom-bennett","katharine-birbalsingh","paul-dix"],"html":"\u003ch2>At a glance\u003c/h2>\n\u003cul>\n\u003cli>Strickland writes as a serving head: his books are \u003cstrong>how-to manuals\u003c/strong>, not theory.\u003c/li>\n\u003cli>Central claim: \u003cstrong>behaviour is a leadership responsibility\u003c/strong>. Senior leaders must own the system, be visible and take sanctions off teachers&#39; shoulders.\u003c/li>\n\u003cli>He favours \u003cstrong>centralised systems\u003c/strong> (one set of rules, centrally run detentions, an on-call and removal system) so that teachers can teach.\u003c/li>\n\u003cli>Routines are taught explicitly and rehearsed; expectations are &#39;warm-strict&#39;; small things are attended to.\u003c/li>\n\u003cli>\u003cem>The Behaviour Manual\u003c/em> offers over 100 short strategies organised by role; \u003cem>They Don&#39;t Behave for Me\u003c/em> works through 50 classroom scenarios.\u003c/li>\n\u003cli>His position sits with Tom Bennett&#39;s on the consequence-and-culture side of the behaviour debate.\u003c/li>\n\u003c/ul>\n\u003ch2>Who they are\u003c/h2>\n\u003cp>Sam Strickland is principal of The Duston School, an all-through school in Northampton. He trained as a history teacher and held senior posts, including leading a sixth form and a vice-principal role, before headship (earlier career details not verified against a primary source). Under his leadership the school has been a lead school in the DfE&#39;s Behaviour Hubs programme, supporting other schools on behaviour. He organises researchED Northampton, speaks widely and has written a series of books for John Catt. Current role checked against 2025-26 sources; not verified against the school&#39;s website as of November 2026.\u003c/p>\n\u003ch2>Core ideas\u003c/h2>\n\u003cp>\u003cstrong>Leaders own behaviour.\u003c/strong> Strickland argues that when behaviour is poor, the cause is usually systemic: unclear expectations, inconsistent follow-through and invisible leaders. Teachers should not be left to run private systems or to chase their own detentions. Leaders set the standard, are present on corridors and at the gate, and take responsibility for serious and persistent issues.\u003c/p>\n\u003cp>\u003cstrong>Clarity and simplicity.\u003c/strong> A behaviour policy should be short enough to be known by every pupil, parent and member of staff. Expectations are concrete (what to bring, how to enter, how to sit, how to move around the building), and the response to a breach is the same in every classroom.\u003c/p>\n\u003cp>\u003cstrong>Centralisation.\u003c/strong> One consequence ladder used by all. Detentions set by teachers but run centrally by leaders. A staffed on-call system that responds quickly. A removal room with clear entry and exit expectations. The argument is workload and fairness: consistency is impossible if each teacher must enforce alone.\u003c/p>\n\u003cp>\u003cstrong>Routines and rehearsal.\u003c/strong> Entry and exit routines, transitions, equipment checks, lining up and a common attention signal are taught at the start of the year and re-taught. Staff rehearse them in training. He treats induction of new staff and new pupils as part of the behaviour system.\u003c/p>\n\u003cp>\u003cstrong>Warm-strict.\u003c/strong> High expectations are held together with visible care. Strickland stresses greeting pupils, knowing names, praise and recognition, and talking with pupils after a sanction. He rejects the idea that strict systems and good relationships are opposites.\u003c/p>\n\u003cp>\u003cstrong>Roles at every level.\u003c/strong> \u003cem>The Behaviour Manual\u003c/em> is organised around who does what: senior leaders, middle and pastoral leaders, classroom teachers, tutors, early career teachers and support staff each have a section of one-page strategies. Reviewers describe it as a what-to-do book rather than a why-to-do book.\u003c/p>\n\u003cp>\u003cstrong>Teaching and curriculum.\u003c/strong> The \u003cem>Education Exposed\u003c/em> books set behaviour within a wider model: a knowledge-rich curriculum, teacher-led explicit instruction, limited and purposeful assessment, and reduced marking and data workload. Behaviour is the precondition; curriculum and teaching are the purpose.\u003c/p>\n\u003cp>\u003cstrong>Scenario thinking.\u003c/strong> \u003cem>They Don&#39;t Behave for Me\u003c/em> takes 50 common situations, from low-level chatter to refusal and confrontation, and sets out possible responses, on the principle that teachers handle incidents better when they have thought them through in advance.\u003c/p>\n\u003ch2>Key works\u003c/h2>\n\u003cul>\n\u003cli>\u003cem>Education Exposed: Leading a school in a time of uncertainty\u003c/em> (John Catt; 2019 or 2020, year not verified).\u003c/li>\n\u003cli>\u003cem>Education Exposed 2: In pursuit of the halcyon dream\u003c/em> (John Catt, 2020).\u003c/li>\n\u003cli>\u003cem>The Behaviour Manual: An Educator&#39;s Guidebook\u003c/em> (John Catt, 2022).\u003c/li>\n\u003cli>\u003cem>They Don&#39;t Behave for Me: 50 classroom behaviour scenarios to support teachers\u003c/em> (John Catt, 2023).\u003c/li>\n\u003cli>Not verified: later leadership titles published since 2023.\u003c/li>\n\u003c/ul>\n\u003ch2>Putting it into practice\u003c/h2>\n\u003cp>\u003cstrong>Senior leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Write the non-negotiables on one page. Test whether a Year 7 pupil and a supply teacher could both recite them.\u003c/li>\n\u003cli>Publish a duty map and stick to it: leaders at the gate, in corridors at every changeover, in the canteen. Visibility is the cheapest intervention available.\u003c/li>\n\u003cli>Centralise detentions. Teachers log; leaders run, chase and escalate non-attendance.\u003c/li>\n\u003cli>Staff an on-call rota with a response-time expectation, and review the data weekly: which lessons, which pupils, which times of day.\u003c/li>\n\u003cli>Script the removal process: what the teacher says, where the pupil goes, what work they do, who speaks to them and how they return to the next lesson.\u003c/li>\n\u003cli>Start each term with a re-induction for pupils and a rehearsal session for staff. Give new and supply staff a short briefing before their first lesson.\u003c/li>\n\u003cli>Walk the building asking one question: is the standard the same in every room? Where it is not, coach, do not blame.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Classroom teachers\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Use the school&#39;s routines exactly as written, especially when you would prefer your own; pupils benefit from sameness across the day.\u003c/li>\n\u003cli>Meet pupils at the door, have work ready, and narrate the positive before correcting.\u003c/li>\n\u003cli>Follow the consequence steps in order, calmly and without debate; log accurately so leaders can act.\u003c/li>\n\u003cli>Take one scenario you find hard (a pupil refusing to move seats, for example) and plan your first three sentences.\u003c/li>\n\u003cli>After any removal, have a brief reset conversation before the next lesson.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Middle and pastoral leaders\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Use behaviour data to spot patterns by class, subject and time. Support the teacher first.\u003c/li>\n\u003cli>Hold the line on routines within your team and model them in your own classroom.\u003c/li>\n\u003c/ul>\n\u003ch2>Critiques and debate\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Practitioner evidence.\u003c/strong> Strickland&#39;s authority rests on leading one school&#39;s improvement. Schools Week&#39;s review of \u003cem>The Behaviour Manual\u003c/em> saw that as the book&#39;s selling point, and also noted that it is practical rather than theoretical: it tells readers what to do more than why. Transfer to different contexts is argued, not demonstrated.\u003c/li>\n\u003cli>\u003cstrong>Centralised, consequence-led systems.\u003c/strong> Relational and restorative practitioners (Paul Dix, Mark Finnis) argue that ladders, centralised detentions and removal rooms manage behaviour without changing it, and that the same pupils cycle through. Strickland and others reply that calm classrooms are the foundation for relationships and that most pupils benefit from predictability.\u003c/li>\n\u003cli>\u003cstrong>Inclusion.\u003c/strong> Critics of strict systems argue that they disadvantage pupils with SEND or unmet needs and can raise suspensions. Proponents argue for adjustments within a consistent framework. The DfE&#39;s \u003cem>Behaviour in Schools\u003c/em> guidance expects both clear systems and reasonable adjustments.\u003c/li>\n\u003cli>\u003cstrong>Teacher autonomy.\u003c/strong> Some teachers find highly prescribed routines deskilling. Supporters argue that shared routines free attention for teaching and protect new staff.\u003c/li>\n\u003cli>\u003cstrong>Breadth.\u003c/strong> The books range across behaviour, curriculum, teaching and leadership in short sections; readers wanting depth on any one area will need other sources.\u003c/li>\n\u003c/ul>\n","text":"At a glance Strickland writes as a serving head: his books are how-to manuals , not theory. Central claim: behaviour is a leadership responsibility . Senior leaders must own the system, be visible and take sanctions off teachers' shoulders. He favours centralised systems (one set of rules, centrally run detentions, an on-call and removal system) so that teachers can teach. Routines are taught explicitly and rehearsed; expectations are 'warm-strict'; small things are attended to. The Behaviour Manual offers over 100 short strategies organised by role; They Don't Behave for Me works through 50 classroom scenarios. His position sits with Tom Bennett's on the consequence-and-culture side of the behaviour debate. Who they are Sam Strickland is principal of The Duston School, an all-through school in Northampton. He trained as a history teacher and held senior posts, including leading a sixth form and a vice-principal role, before headship (earlier career details not verified against a primary source). Under his leadership the school has been a lead school in the DfE's Behaviour Hubs programme, supporting other schools on behaviour. He organises researchED Northampton, speaks widely and has written a series of books for John Catt. Current role checked against 2025-26 sources; not verified against the school's website as of November 2026. Core ideas Leaders own behaviour. Strickland argues that when behaviour is poor, the cause is usually systemic: unclear expectations, inconsistent follow-through and invisible leaders. Teachers should not be left to run private systems or to chase their own detentions. Leaders set th
